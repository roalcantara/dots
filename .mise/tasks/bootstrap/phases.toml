# One task per bootstrap phase. Each conf.d hook and the global bootstrap task hand over to one of these; its run
# list is that phase's ordered steps (file tasks).

["bootstrap:hook:post-packages"]
description = "Homebrew, the Brewfile and yabai's scripting addition"
run = [
  { task = "bootstrap:brew:install" },
  { task = "bootstrap:brew:config-link" },
  { task = "bootstrap:brew:bundle" },
  { task = "bootstrap:yabai:scripting-addition" },
]

["bootstrap:hook:pre-dotfiles"]
description = "Move app-written files aside before the dotfiles links"
run = [{ task = "bootstrap:dotfiles:move-aside" }]

["bootstrap:hook:post-dotfiles"]
description = "VS Code Settings Sync, bat's cache and Lig's zsh integration"
run = [
  { task = "bootstrap:vscode:settings-sync" },
  { task = "bootstrap:bat:cache" },
  { task = "bootstrap:lig:zsh" },
]

["bootstrap:hook:post-defaults"]
description = "Activate macOS settings and point SwiftBar at its plugins"
run = [
  { task = "bootstrap:macos:activate" },
  { task = "bootstrap:macos:swiftbar" },
]

["bootstrap:hook:final"]
description = "Git filters and hooks, then the remaining tools (run by the global bootstrap task)"
run = [
  { task = "bootstrap:git:filters" },
  { task = "bootstrap:git:home-config" },
  { task = "bootstrap:zsh:warm-caches" },
  { task = "bootstrap:git:hooks" },
  { task = "bootstrap:dev:python-tools" },
  { task = "bootstrap:gopass:store" },
  { task = "bootstrap:gopass:keyring" },
  { task = "bootstrap:gopass:pass-link" },
  { task = "bootstrap:ssh:keychain" },
  { task = "bootstrap:tiling:checks" },
  { task = "bootstrap:borders:build" },
  { task = "bootstrap:omlx:models" },
  { task = "bootstrap:skills:restore" },
  { task = "bootstrap:nvim:providers" },
  { task = "bootstrap:nvim:plugins" },
  { task = "bootstrap:brew:remind" },
]
