# The Karabiner fn layer: regenerate config/karabiner/karabiner.json and hotkeys.json from src/bindings.ts.
["karabiner:build"]
description = "Generate the Karabiner fn layer (config/karabiner) from src/bindings.ts"
run = [
  "bun install --frozen-lockfile --cwd config/karabiner",
  "bun config/karabiner/src/build.ts",
]
