# Machine setup applied by `mise bootstrap` (assets/specs/mise-bootstrap/design.md §4.2–4.3).

# Folders the shell config and tools expect, plus the XDG user folders the images' structure tests check.
[bootstrap.directories."~/.local/bin"]
[bootstrap.directories."~/.local/state/zim"]
[bootstrap.directories."~/.local/state/nvim"]
mode = "0700"
[bootstrap.directories."~/.local/share/zsh"]
[bootstrap.directories."~/.local/share/npm"]
[bootstrap.directories."~/.local/share/gems"]
[bootstrap.directories."~/.cache/zsh"]
mode = "0700"
[bootstrap.directories."~/.cache/npm"]
[bootstrap.directories."~/.cache/mise"]
# Private (0700), as macOS creates them; bootstrap would otherwise reset them to 0755.
[bootstrap.directories."~/Desktop"]
mode = "0700"
[bootstrap.directories."~/Documents"]
mode = "0700"
[bootstrap.directories."~/Downloads"]
mode = "0700"
[bootstrap.directories."~/Movies"]
mode = "0700"
[bootstrap.directories."~/Music"]
mode = "0700"
[bootstrap.directories."~/Pictures"]
mode = "0700"
[bootstrap.directories."~/Projects"]
[bootstrap.directories."~/Work"]

# Real folders the ~/.ssh and ~/.gnupg links point to; install --secrets fills them.
[bootstrap.directories."~/.config/ssh"]
mode = "0700"

[bootstrap.directories."~/.config/gnupg"]
mode = "0700"

[bootstrap.user]
login_shell = "zsh"

# Runs last on every `mise bootstrap`, so every step checks before acting and only warns on failure.
[tasks.bootstrap]
description = "Repo git filters and hooks, Neovim providers and plugins"
run = '''
#!/usr/bin/env bash
export PATH="$HOME/.local/bin:$PATH"
# brew: packages (hk, sd, the linters) land in the Homebrew prefix, which only an interactive shell puts on PATH.
for b in /opt/homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew; do [ -x "$b" ] && eval "$("$b" shellenv)"; done
desktop=true
case ",${MISE_ENV:-desktop}," in *,desktop,*) ;; *) desktop=false ;; esac
dots="$HOME/.local/share/dots"
nvim_cfg="$HOME/.config/nvim"
warn() { printf 'bootstrap: %s failed, continuing\n' "$1" >&2; }

mise run -C "$dots" setup:git:filters || warn "setup:git:filters"
# Pre-initialize user shell caches (zimfw modules, completions) so login shells start with clean stderr.
zsh -ic 'exit' >/dev/null 2>&1 || true
# Containers: git filters only (cheap); everything below is desktop-only.
$desktop || exit 0
mise run -C "$dots" setup:hooks || warn "setup:hooks"

# Python tools that need 3.13 (no wheels for the newest Python); the Brewfile's uv entries cannot pin it.
for tool in graphifyy code-review-graph; do
  uv tool list 2>/dev/null | grep -q "^$tool " || uv tool install --python 3.13 "$tool" || warn "uv $tool"
done

# gopass store: cloned once the history has restored gopass's age identity. HTTPS through the gh login
# (install runs `gh auth login`): the SSH config names GitHub `Host github`, so git@github.com has no key.
store="$HOME/.local/share/gopass/password-store"
if command -v gopass >/dev/null && [ ! -d "$store/.git" ] && [ -d "$HOME/.config/gopass/age" ]; then
  git -c credential.helper= -c 'credential.https://github.com.helper=!gh auth git-credential' \
    clone https://github.com/roalcantara/pass-store.git "$store" || warn "gopass store clone"
fi

# oMLX models (macOS, once the app is installed by hand): download only the missing ones.
if [ -d /Applications/oMLX.app ] && command -v hf >/dev/null; then
  for model in mlx-community/parakeet-tdt-0.6b-v3 Jundot/gemma-4-E2B-it-oQ4e-mtp \
    mlx-community/Qwen3-4B-Instruct-2507-4bit; do
    dir="$HOME/.omlx/models/$model"
    [ -f "$dir/config.json" ] || hf download "$model" --local-dir "$dir" || warn "oMLX model $model"
  done
fi


# Agent skills from config/agents/skill-lock.json; installs only the missing ones.
mise run -C "$dots" skills:restore || warn "skills:restore"
[ -d "$nvim_cfg" ] || exit 0
if command -v npm >/dev/null && ! npm ls -g neovim >/dev/null 2>&1; then
  npm install -g neovim || warn "npm neovim"
fi
if command -v gem >/dev/null && ! gem list -i neovim >/dev/null 2>&1; then
  gem install neovim || warn "gem neovim"
fi
# restore (not sync) installs the lockfile's versions, so a rerun changes nothing; bounded so a network stall
# cannot hang an unattended run.
if command -v nvim >/dev/null; then
  limit=""
  if command -v timeout >/dev/null; then limit="timeout 600"; elif command -v gtimeout >/dev/null; then limit="gtimeout 600"; fi
  $limit nvim --headless "+Lazy! restore" +qa </dev/null || warn "nvim Lazy restore"
fi
'''

# Linux: apt runs unattended, so dpkg must never ask about a changed config file (it fails without a terminal,
# e.g. on /etc/zsh/zshenv left by the old install). Keep the existing file; take the package's when untouched.
[bootstrap.files."/etc/apt/apt.conf.d/90dots-noninteractive"]
os = "linux"
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0644"
content = '''
Dpkg::Options { "--force-confdef"; "--force-confold"; };
'''

# Linux desktops: Flathub for the system-wide flatpak apps in config/homebrew/Brewfile. Flatpak reads remotes from this
# folder; declared before packages so the remote exists when mise installs flatpak and then the apps.
# The folders do not exist until the flatpak package installs, so they are declared too.
[bootstrap.directories."/etc/flatpak"]
os = "linux"
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.directories."/etc/flatpak/remotes.d"]
os = "linux"
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/flatpak/remotes.d/flathub.flatpakrepo"]
os = "linux"
phase = "pre-packages"
source = "../files/flathub.flatpakrepo"
owner = "root"
group = "root"
mode = "0644"

# Homebrew and every user package (assets/specs/brewfile-packages/design.md §4.3). Runs after the apt
# prerequisites; a failure stops the bootstrap.
[bootstrap.hooks.post-packages]
run = '''
#!/usr/bin/env bash
set -euo pipefail
brew=""
for b in "$(command -v brew || true)" /opt/homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew; do
  [ -n "$b" ] && [ -x "$b" ] && { brew="$b"; break; }
done
if [ -z "$brew" ]; then
  NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  for b in /opt/homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew; do [ -x "$b" ] && brew="$b"; done
fi
eval "$("$brew" shellenv)"
export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_ENV_HINTS=1
profile="${MISE_ENV:-}"
if [ -z "$profile" ]; then
  if [ -r "/proc/$PPID/cmdline" ]; then
    profile="$(tr '\0' '\n' < "/proc/$PPID/cmdline" | sed -n 's/^--env=//p')"
    [ -n "$profile" ] || profile="$(tr '\0' '\n' < "/proc/$PPID/cmdline" | grep -A1 -E '^(-E|--env)$' | tail -1)"
  elif command -v ps >/dev/null; then
    args="$(ps -o args= -p "$PPID" 2>/dev/null || true)"
    profile="$(printf '%s\n' "$args" | grep -oE -- '(-E|--env)[ =][a-zA-Z0-9_-]+' | head -1 | awk '{print $NF}' | tr -d '=')"
  fi
  [ -n "$profile" ] || [ ! -f "$HOME/.local/share/dots/config/mise/miserc.local.toml" ] || \
    profile="$(sed -n 's/.*env = \["\([^"]*\)"\].*/\1/p' "$HOME/.local/share/dots/config/mise/miserc.local.toml")"
fi
HOMEBREW_DOTS_PROFILE="${profile:-desktop}" brew bundle install --no-upgrade \
  --file "$HOME/.local/share/dots/config/homebrew/Brewfile"
if [ "${profile:-desktop}" = "container" ]; then
  brew cleanup --prune=all 2>/dev/null || true
  rm -rf "$HOME/.cache/Homebrew" 2>/dev/null || true
fi
'''
