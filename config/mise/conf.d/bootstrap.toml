# Machine setup applied by `mise bootstrap`.

# Shared bootstrap vars. Hooks receive neither [env] nor MISE_ENV, but they render Tera before they run, and
# `mise_env` holds the environments this run selected (`-E`, MISE_ENV or miserc.local.toml). `dots_profiles`
# forwards only known profile names (desktop, dev, container) as `--profile` flags to `dots setup` (docs/BOOTSTRAP.md).
[vars]
_.file = "{{ mise_config_dir }}/conf.d/vars.yaml"
dots = '{% if vars.dots_dir is defined %}{{ env.HOME }}/{{ vars.dots_dir }}{% endif %}'
dots_profiles = '{% if mise_env is defined %}{% for e in mise_env %}{% if e == "desktop" or e == "dev" or e == "container" %} --profile {{ e }}{% endif %}{% endfor %}{% endif %}'
dots_setup = 'exec mise run dots setup{{ vars.dots_profiles }}'

# Folders the shell config and tools expect, plus the XDG user folders the images' structure tests check.
[bootstrap.directories."~/.local/bin"]
[bootstrap.directories."~/.local/state/zim"]
[bootstrap.directories."~/.local/state/nvim"]
mode = "0700"
[bootstrap.directories."~/.local/share/zsh"]
[bootstrap.directories."~/.local/share/npm"]
[bootstrap.directories."~/.local/share/gems"]
[bootstrap.directories."~/.cache/zsh"]
mode = "0700"
[bootstrap.directories."~/.cache/npm"]
[bootstrap.directories."~/.cache/mise"]
# Private (0700), as macOS creates them; bootstrap would otherwise reset them to 0755.
[bootstrap.directories."~/Desktop"]
mode = "0700"
[bootstrap.directories."~/Documents"]
mode = "0700"
[bootstrap.directories."~/Downloads"]
mode = "0700"
[bootstrap.directories."~/Movies"]
mode = "0700"
[bootstrap.directories."~/Music"]
mode = "0700"
[bootstrap.directories."~/Pictures"]
mode = "0700"
[bootstrap.directories."~/Projects"]
[bootstrap.directories."~/Work"]

# Real folders the ~/.ssh and ~/.gnupg links point to; install --secrets fills them.
[bootstrap.directories."~/.config/ssh"]
mode = "0700"

[bootstrap.directories."~/.config/gnupg"]
mode = "0700"

[bootstrap.user]
# macOS: Homebrew's zsh (the Brewfile installs it before this step). A bare "zsh" resolves PATH first, and during
# install /bin comes before /opt/homebrew/bin, so it picked the system /bin/zsh. Linux: the apt zsh.
login_shell = '{% if os() == "macos" %}/opt/homebrew/bin/zsh{% else %}zsh{% endif %}'

# macOS: gopass checks this GPG Suite preference now and then and warns "Domain 'org.gpgtools.common' not found"
# while it is unset. "NO" (a string, as gopass reads it) also keeps pinentry-mac from saving passphrases in Keychain.
[bootstrap.settings.macos.defaults]
"org.gpgtools.common" = { UseKeychain = "NO" }

# Linux: apt runs unattended, so dpkg must never ask about a changed config file (it fails without a terminal,
# e.g. on /etc/zsh/zshenv left by the old install). Keep the existing file; take the package's when untouched.
[bootstrap.files."/etc/apt/apt.conf.d/90dots-noninteractive"]
os = "linux"
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0644"
content = '''
Dpkg::Options { "--force-confdef"; "--force-confold"; };
'''

# Linux desktops: Flathub for the system-wide flatpak apps in config/homebrew/Brewfile. Flatpak reads remotes from this
# folder; declared before packages so the remote exists when mise installs flatpak and then the apps.
# The folders do not exist until the flatpak package installs, so they are declared too.
[bootstrap.directories."/etc/flatpak"]
os = "linux"
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.directories."/etc/flatpak/remotes.d"]
os = "linux"
phase = "pre-packages"
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/flatpak/remotes.d/flathub.flatpakrepo"]
os = "linux"
phase = "pre-packages"
source = "../files/flathub.flatpakrepo"
owner = "root"
group = "root"
mode = "0644"

# Homebrew and every user package, then yabai's scripting addition.
[bootstrap.hooks.post-packages]
description = "Install Homebrew and every user package, then yabai's scripting addition"
run = "{{ vars.dots_setup }} --no-remind brew yabai"

# A link never replaces a real file, and VS Code (or Settings Sync) and Karabiner-Elements write real ones on first
# launch, so `app-files` moves them aside. It also runs before mise dot apply.
[bootstrap.hooks.pre-dotfiles]
description = "Move app-written copies (VS Code settings, keybindings, snippets; ~/.config/karabiner) aside for the dots links"
run = "{{ vars.dots_setup }} --no-remind app-files"

# Settings Sync would merge the cloud copy back into the linked files, so `vscode` turns it off for settings,
# keybindings and snippets, then `bat` builds bat's theme cache and `lig` caches Lig's zsh integration.
[bootstrap.hooks.post-dotfiles]
description = "Turn off VS Code Settings Sync for settings, keybindings and snippets; set up bat's themes and Lig"
run = "{{ vars.dots_setup }} --no-remind vscode bat lig"

# mise cannot restart apps or write a preference whose value is an absolute path. `macos` points screenshots
# at ~/Pictures/Screenshots, sets the default apps in ~/.config/duti and the Spotlight hotkey without a logout,
# restarts Dock, Finder and the menu bar, then `swiftbar` points SwiftBar at its plugins.
[bootstrap.hooks.post-defaults]
description = "Apply the macOS settings that need $HOME and point SwiftBar at its plugins"
run = "{{ vars.dots_setup }} --no-remind macos swiftbar"

# The final `bootstrap` task, which runs after these hooks, is in tasks.toml.
