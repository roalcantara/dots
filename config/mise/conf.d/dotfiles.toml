# Links into this repo. `install` links ~/.local/share/dots and
# ~/.config/mise itself, because mise needs them before it can read this file.
[dotfiles]
# The list is static: compare it with git ls-files config | cut -d/ -f2 | sort -u when config/ changes.
# One link per top-level entry of config/ (mode symlink: the whole folder or file). symlink-each would link
# every file recursively. Not linked: mise (install), hk (setup:hooks), non-config files,
# delta (its only file, .env, is git-ignored), and folders that are real on the Mac (app settings and keys
# restored from backup).
"~/.config/.env" = { source = "~/.local/share/dots/config/.env", relative = true }
"~/.config/.markdownlint.yml" = { source = "~/.local/share/dots/config/.markdownlint.yml", relative = true }
"~/.config/.profile" = { source = "~/.local/share/dots/config/.profile", relative = true }
"~/.config/age" = { source = "~/.local/share/dots/config/age", relative = true }
"~/.config/atlassian" = { source = "~/.local/share/dots/config/atlassian", relative = true }
"~/.config/bash" = { source = "~/.local/share/dots/config/bash", relative = true }
"~/.config/bat" = { source = "~/.local/share/dots/config/bat", relative = true }
"~/.config/borders" = { source = "~/.local/share/dots/config/borders", relative = true }
"~/.config/bin" = { source = "~/.local/share/dots/config/bin", relative = true }
"~/.config/claude" = { source = "~/.local/share/dots/config/claude", relative = true }
"~/.config/dinky" = { source = "~/.local/share/dots/config/dinky", relative = true }
"~/.config/dprint" = { source = "~/.local/share/dots/config/dprint", relative = true }
"~/.config/duti" = { source = "~/.local/share/dots/config/duti", relative = true }
"~/.config/fabric" = { source = "~/.local/share/dots/config/fabric", relative = true }
"~/.config/gh" = { source = "~/.local/share/dots/config/gh", relative = true }
"~/.config/ghostty" = { source = "~/.local/share/dots/config/ghostty", relative = true }
"~/.config/git" = { source = "~/.local/share/dots/config/git", relative = true }
"~/.config/github" = { source = "~/.local/share/dots/config/github", relative = true }
"~/.config/gopass" = { source = "~/.local/share/dots/config/gopass", relative = true }
"~/.config/gortex" = { source = "~/.local/share/dots/config/gortex", relative = true }
"~/.config/helix" = { source = "~/.local/share/dots/config/helix", relative = true }
"~/.config/homebrew" = { source = "~/.local/share/dots/config/homebrew", relative = true }
"~/.config/karabiner" = { source = "~/.local/share/dots/config/karabiner", relative = true }
"~/.config/kodexb" = { source = "~/.local/share/dots/config/kodexb", relative = true }
"~/.config/kb" = { source = "~/.local/share/dots/config/kodexb", relative = true }                           # alias
"~/.config/npm" = { source = "~/.local/share/dots/config/npm", relative = true }
"~/.config/nvim" = { source = "~/.local/share/dots/config/nvim", relative = true }
"~/.config/posting" = { source = "~/.local/share/dots/config/posting", relative = true }
"~/.config/ripgrep" = { source = "~/.local/share/dots/config/ripgrep", relative = true }
"~/.config/snippets" = { source = "~/.local/share/dots/config/snippets", relative = true }
"~/.config/sops" = { source = "~/.local/share/dots/config/sops", relative = true }
"~/.config/television" = { source = "~/.local/share/dots/config/television", relative = true }
"~/.config/tombi" = { source = "~/.local/share/dots/config/tombi", relative = true }
"~/.config/vscode" = { source = "~/.local/share/dots/config/vscode", relative = true }
"~/.config/wakatime" = { source = "~/.local/share/dots/config/wakatime", relative = true }
"~/.config/yabai" = { source = "~/.local/share/dots/config/yabai", relative = true }
"~/.config/zed" = { source = "~/.local/share/dots/config/zed", relative = true }
"~/.config/zentty" = { source = "~/.local/share/dots/config/zentty", relative = true }
"~/.config/zsh" = { source = "~/.local/share/dots/config/zsh", relative = true }
"~/.config/zsh-patina" = { source = "~/.local/share/dots/config/zsh-patina", relative = true }
"~/.zshenv" = { source = "~/.local/share/dots/config/zsh/.zshenv", relative = true }
"~/.bashrc" = { source = "~/.local/share/dots/config/bash/bashrc", relative = true }
"~/.profile" = { source = "~/.local/share/dots/config/.profile", relative = true }
# Claude Code user settings: runs the Bash tool in bash, not the login zsh (word splitting).
"~/.claude/settings.json" = { source = "~/.local/share/dots/config/claude/settings.json", relative = true }
# Claude Code user agents (config/claude/agents), through the ~/.config/claude link.
"~/.claude/agents" = { source = "~/.config/claude/agents", relative = true }
# ~/.config/ssh and ~/.config/gnupg are real folders: synced encrypted by mise dot history (config.toml). Everything else in ~/.config links into config/; secret files there are SOPS-encrypted (.sops.yaml).
"~/.ssh" = { source = "~/.config/ssh", relative = true }
"~/.gnupg" = { source = "~/.config/gnupg", relative = true }
# Links each executable file of config/bin; this Mac's links are absolute, so relative is left off.
# Keep the exclude list in step when adding non-executables to config/bin.
"~/.local/bin" = { source = "~/.local/share/dots/config/bin", mode = "symlink-each", exclude = [
  ".editorconfig",
  ".vscode",
  "HANDOFF-USAGE-MIGRATION.md",
  "LICENSE",
  "README.md",
  "mise.lock",
  "mise.toml",
  "src",
] }

# The skills CLI's global lock. It reads the first path when
# XDG_STATE_HOME is set and the second otherwise (GUI apps, cron), so both point at one file.
"~/.local/state/skills/.skill-lock.json" = { source = "~/.local/share/dots/config/agents/skill-lock.json", relative = true }
"~/.agents/.skill-lock.json" = { source = "~/.local/share/dots/config/agents/skill-lock.json", relative = true }

# The owner's agent commands.
"~/.agents/commands" = { source = "~/.local/share/dots/config/agents/commands", relative = true }

# VS Code reads its user settings, keybindings and snippets from Application Support on macOS, so link them to
# the repo; the pre-dotfiles hook below clears the way. Linux machines (the Docker images) have no VS Code.
[dotfiles.vscode-settings]
source = "~/.local/share/dots/config/vscode/settings.json"
relative = true
variants = [
  { os = "macos", target = "~/Library/Application Support/Code/User/settings.json" },
]

[dotfiles.vscode-keybindings]
source = "~/.local/share/dots/config/vscode/keybindings.json"
relative = true
variants = [
  { os = "macos", target = "~/Library/Application Support/Code/User/keybindings.json" },
]

[dotfiles.vscode-snippets]
source = "~/.config/snippets"
relative = true
variants = [
  { os = "macos", target = "~/Library/Application Support/Code/User/snippets" },
]

# A link never replaces a real file, and VS Code (or Settings Sync) and Karabiner-Elements write real ones on
# first launch. Move them aside, never delete, so the links apply. Also runs before mise dot apply.
[bootstrap.hooks.pre-dotfiles]
description = "Move app-written copies (VS Code settings, keybindings, snippets; ~/.config/karabiner) aside for the dots links"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ "$(uname)" = Darwin ] || exit 0
user="${DOTS_VSCODE_USER:-$HOME/Library/Application Support/Code/User}"
mkdir -p "$user"
stamp="$(date +%Y%m%d%H%M%S)"
for p in "$user/settings.json" "$user/keybindings.json" "$user/snippets" "$HOME/.config/karabiner"; do
  if [ -e "$p" ] && [ ! -L "$p" ]; then
    mv "$p" "$p.pre-dots-$stamp"
    echo "bootstrap: moved $p to $p.pre-dots-$stamp; dots links it to the repo" >&2
  fi
done
'''

# Settings Sync would merge the cloud copy back into the linked files above. Turn it off for settings,
# keybindings and snippets (the repo is their source) and leave it on for extensions, state and the rest.
# VS Code keeps these choices in its state database, not settings.json; a running VS Code reads them at start.
[bootstrap.hooks.post-dotfiles]
description = "Turn off VS Code Settings Sync for settings, keybindings and snippets"
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ "$(uname)" = Darwin ] || exit 0
command -v sqlite3 >/dev/null || exit 0
db="${DOTS_VSCODE_STATE:-$HOME/Library/Application Support/Code/User/globalStorage/state.vscdb}"
mkdir -p "$(dirname "$db")"
sqlite3 -cmd ".timeout 5000" "$db" "
CREATE TABLE IF NOT EXISTS ItemTable (key TEXT UNIQUE ON CONFLICT REPLACE, value BLOB);
INSERT INTO ItemTable (key, value) VALUES
  ('sync.enable.settings', 'false'), ('sync.enable.keybindings', 'false'), ('sync.enable.snippets', 'false');
" || echo "bootstrap: could not turn off VS Code Settings Sync for settings, keybindings and snippets" >&2
'''
