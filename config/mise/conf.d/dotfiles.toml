# Links into this repo. `install` links ~/.local/share/dots and
# ~/.config/mise itself, because mise needs them before it can read this file.

# The list is static: compare it with git ls-files config | cut -d/ -f2 | sort -u when config/ changes.
# One link per top-level entry of config/ (mode symlink: the whole folder or file). `exclude = ["*", ".*"]`
# keeps the group's symlink-each walk from linking anything not listed under [dotfile_groups.config.entries].
# Not linked: mise (install), hk (setup:hooks), non-config files, delta (its only file, .env, is git-ignored),
# and folders that are real on the Mac (app settings and keys restored from backup).
[dotfile_groups.config]
root = "config"
target = "~/.config"
mode = "symlink-each"
relative = true
exclude = ["*", ".*"]

[dotfile_groups.config.entries]
"~/.config/.markdownlint.yml" = { mode = "symlink" }
"~/.config/.profile" = { mode = "symlink" }
"~/.config/age" = { mode = "symlink" }
"~/.config/atlassian" = { mode = "symlink" }
"~/.config/bash" = { mode = "symlink" }
"~/.config/bat" = { mode = "symlink" }
"~/.config/borders" = { mode = "symlink" }
"~/.config/bin" = { mode = "symlink" }
"~/.config/claude" = { mode = "symlink" }
"~/.config/dinky" = { mode = "symlink" }
"~/.config/dots" = { mode = "symlink" }
"~/.config/dprint" = { mode = "symlink" }
"~/.config/duti" = { mode = "symlink" }
"~/.config/fabric" = { mode = "symlink" }
"~/.config/fnox" = { mode = "symlink" }
"~/.config/gh" = { mode = "symlink" }
"~/.config/ghostty" = { mode = "symlink" }
"~/.config/git" = { mode = "symlink" }
"~/.config/github" = { mode = "symlink" }
"~/.config/gopass" = { mode = "symlink" }
"~/.config/gortex" = { mode = "symlink" }
"~/.config/helix" = { mode = "symlink" }
"~/.config/homebrew" = { mode = "symlink" }
"~/.config/karabiner" = { mode = "symlink" }
"~/.config/kodexb" = { mode = "symlink" }
"~/.config/lig" = { mode = "symlink" }
"~/.config/npm" = { mode = "symlink" }
"~/.config/nvim" = { mode = "symlink" }
"~/.config/posting" = { mode = "symlink" }
"~/.config/ripgrep" = { mode = "symlink" }
"~/.config/snippets" = { mode = "symlink" }
"~/.config/sops" = { mode = "symlink" }
"~/.config/swiftbar" = { mode = "symlink" }
"~/.config/television" = { mode = "symlink" }
"~/.config/theme" = { mode = "symlink" }
"~/.config/tombi" = { mode = "symlink" }
"~/.config/vscode" = { mode = "symlink" }
"~/.config/wakatime" = { mode = "symlink" }
"~/.config/yabai" = { mode = "symlink" }
"~/.config/zed" = { mode = "symlink" }
"~/.config/zentty" = { mode = "symlink" }
"~/.config/zsh" = { mode = "symlink" }
"~/.config/zsh-patina" = { mode = "symlink" }

# Plain [dotfiles] entries outside ~/.config/<same-name>. Relative `source` in [dotfiles] resolves against
# the config file directory (not dotfiles.root), so repo-backed entries keep their explicit path.
[dotfiles]
"~/.config/kb" = { source = "~/.local/share/dots/config/kodexb", relative = true }   # alias
"~/.zshenv" = { source = "~/.local/share/dots/config/zsh/.zshenv", relative = true }
"~/.bashrc" = { source = "~/.local/share/dots/config/bash/bashrc", relative = true }
"~/.profile" = { source = "~/.local/share/dots/config/.profile", relative = true }
# Claude Code user settings: runs the Bash tool in bash, not the login zsh (word splitting).
"~/.claude/settings.json" = { source = "~/.local/share/dots/config/claude/settings.json", relative = true }
# Claude Code user agents (config/claude/agents).
"~/.claude/agents" = { source = "~/.local/share/dots/config/claude/agents", relative = true }
# ~/.config/ssh and ~/.config/gnupg are real folders: synced encrypted by mise dot history (config.toml). Everything else in ~/.config links into config/; secret files there are SOPS-encrypted (.sops.yaml).
"~/.ssh" = { source = "~/.config/ssh", relative = true }
"~/.gnupg" = { source = "~/.config/gnupg", relative = true }
# Links each executable file of config/bin; this Mac's links are absolute, so relative is explicitly false
# (overriding dotfiles.relative_symlinks = true in config.toml).
# Keep the exclude list in step when adding non-executables to config/bin.
"~/.local/bin" = { source = "~/.local/share/dots/config/bin", mode = "symlink-each", relative = false, exclude = [
  ".editorconfig",
  ".vscode",
  "HANDOFF-USAGE-MIGRATION.md",
  "LICENSE",
  "README.md",
  "mise.lock",
  "mise.toml",
  "src",
] }

# The skills CLI's global lock. It reads the first path when
# XDG_STATE_HOME is set and the second otherwise (GUI apps, cron), so both point at one file.
"~/.local/state/skills/.skill-lock.json" = { source = "~/.local/share/dots/config/agents/skill-lock.json", relative = true }
"~/.agents/.skill-lock.json" = { source = "~/.local/share/dots/config/agents/skill-lock.json", relative = true }

# The owner's agent commands. Claude Code reads user commands only from ~/.claude, so link them there too.
# (~/.claude/skills is linked further down, on macOS only.)
"~/.agents/commands" = { source = "~/.local/share/dots/config/agents/commands", relative = true }
"~/.claude/commands" = { source = "~/.local/share/dots/config/agents/commands", relative = true }

# VS Code reads its user settings, keybindings and snippets from Application Support on macOS, so link them to
# the repo; the pre-dotfiles hook below clears the way. Linux machines (the Docker images) have no VS Code.
[dotfiles.vscode-settings]
source = "~/.local/share/dots/config/vscode/settings.json"
relative = true
variants = [
  { os = "macos", target = "~/Library/Application Support/Code/User/settings.json" },
]

[dotfiles.vscode-keybindings]
source = "~/.local/share/dots/config/vscode/keybindings.json"
relative = true
variants = [
  { os = "macos", target = "~/Library/Application Support/Code/User/keybindings.json" },
]

[dotfiles.vscode-snippets]
source = "~/.config/snippets"
relative = true
variants = [
  { os = "macos", target = "~/Library/Application Support/Code/User/snippets" },
]

# Claude Code reads user skills only from ~/.claude/skills; link it to the skills CLI's global folder.
# macOS only: the images carry no skills (the folder is created below, before the dotfiles step).
[dotfiles.claude-skills]
source = "~/.agents/skills"
relative = true
variants = [{ os = "macos", target = "~/.claude/skills" }]

# The source of [dotfiles.claude-skills]: mise refuses a link whose source is missing, and `skills:restore`
# fills ~/.agents/skills only after the dotfiles step, so the files step creates it first.
[bootstrap.directories."~/.agents/skills"]
os = "macos"
