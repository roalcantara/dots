# macOS preferences applied by `mise bootstrap` (ignored on Linux). Tuned for keyboard-driven development, with
# Raycast on Command-Space and yabai (tiling) planned. Guide: docs/MACOS.md. Preview: mise bootstrap macos defaults
# apply --dry-run; drift: mise bootstrap macos defaults status --missing. mise never deletes a preference: to undo
# one, remove it here and `defaults delete` it.

[bootstrap.macos.keyboard]
# Fastest repeat System Settings allows (Apple: 6 and 25); lower values work but feel twitchy. Needs a logout.
key_repeat = 2
initial_key_repeat = 15
# Holding a key repeats it (vim motions) instead of opening the accent menu.
press_and_hold = false
# Autocorrection mangles code, commands and identifiers.
automatic_capitalization = false
automatic_spelling_correction = false

[bootstrap.macos.trackpad]
# Light tap instead of a press.
tap_to_click = true
# Off: on, it moves the three-finger swipe between Spaces to four fingers.
three_finger_drag = false

[bootstrap.macos.dock]
# Dock out of the way, shown at once and quickly when the pointer reaches the edge.
autohide = true
autohide_delay = 0.0
autohide_time_modifier = 0.15
# Only pinned and running apps.
show_recents = false
# A short Dock (it auto-hides; Raycast launches the rest): browser, terminal, editor, AI, chat, settings. Replaces
# Apple's default tiles; Finder, Trash and the Downloads stack stay. Every app must be installed (Brewfile casks).
apps = [
  "/Applications/Google Chrome.app",
  "/Applications/Ghostty.app",
  "/Applications/Visual Studio Code.app",
  "/Applications/Claude.app",
  "/Applications/ChatGPT.app",
  "/Applications/WhatsApp.app",
  "/Applications/Discord.app",
  "/System/Applications/System Settings.app",
]
# Spaces stay in a fixed order (yabai and Space-number shortcuts rely on it).
mru_spaces = false

[bootstrap.macos.finder]
# Dotfiles visible in Finder and file dialogs.
show_all_files = true
show_pathbar = true
show_status_bar = true
# No prompt when renaming an extension.
show_extensions_warning = false
sort_folders_first = true
preferred_view_style = "list"
# New documents save to disk, not iCloud.
save_new_documents_to_cloud = false

# Added to Open at Login; others stay (not exclusive). noTunes closes Apple Music whenever it opens (a Bluetooth
# headset's play key starts it; see docs/MACOS.md); Raycast (launcher), Vorssaint (keep-awake, monitor), Bitwarden
# (passwords) and Google Drive (sync) live in the menu bar.
[bootstrap.macos.login_items]
apps = [
  "/Applications/noTunes.app",
  "/Applications/Raycast.app",
  "/Applications/Vorssaint.app",
  "/Applications/Bitwarden.app",
  "/Applications/Google Drive.app",
]

[bootstrap.macos.defaults.NSGlobalDomain]
# Smart punctuation breaks pasted code and shell commands.
NSAutomaticQuoteSubstitutionEnabled = false
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
# Tab moves focus through every control in dialogs, not just text fields.
AppleKeyboardUIMode = 3
# Natural (Lion-style) scrolling; already Apple's default, stated so it is kept.
"com.apple.swipescrolldirection" = true
# Pointer speeds at the System Settings maximum.
"com.apple.trackpad.scaling" = 3.0
"com.apple.mouse.scaling" = 3.0
# Every file extension shown.
AppleShowAllExtensions = true
# Save and print dialogs open expanded.
NSNavPanelExpandedStateForSaveMode = true
NSNavPanelExpandedStateForSaveMode2 = true
PMPrintingExpandedStateForPrint = true
PMPrintingExpandedStateForPrint2 = true

[bootstrap.macos.defaults."com.apple.AppleMultitouchTrackpad"]
# Light click (System Settings' "Light"): click and force click both at the softest pressure.
FirstClickThreshold = 0
SecondClickThreshold = 0

[bootstrap.macos.defaults."com.apple.driver.AppleBluetoothMultitouch.trackpad"]
# The same light click on a Magic Trackpad (mise's tap_to_click writes both trackpad domains too).
FirstClickThreshold = 0
SecondClickThreshold = 0

[bootstrap.macos.defaults."com.apple.dock"]
# Minimizes with the quicker "scale" effect instead of the genie.
mineffect = "scale"

[bootstrap.macos.defaults."com.apple.spaces"]
# Each display keeps its own Spaces (Apple's default; yabai needs it).
spans-displays = false

[bootstrap.macos.defaults."com.apple.WindowManager"]
# macOS's own tiling and Stage Manager fight yabai.
EnableTilingByEdgeDrag = false
EnableTopTilingByEdgeDrag = false
EnableTilingOptionAccelerator = false
GloballyEnabled = false
# Clicking the wallpaper no longer hides every window.
EnableStandardClickToShowDesktop = false

[bootstrap.macos.defaults."com.apple.finder"]
# Searches the current folder, not the whole Mac.
FXDefaultSearchScope = "SCcf"

[bootstrap.macos.defaults."com.apple.desktopservices"]
# No .DS_Store files on network shares or USB drives.
DSDontWriteNetworkStores = true
DSDontWriteUSBStores = true

[bootstrap.macos.defaults."com.apple.screencapture"]
# Screenshots as PNG without the window shadow. Their folder (declared below) is set by the post-defaults hook:
# mise writes values verbatim, and the path needs $HOME.
type = "png"
disable-shadow = true

[bootstrap.macos.defaults."com.apple.TimeMachine"]
# restic is the backup (docs/REINSTALL.md); no prompt for every new disk.
DoNotOfferNewDisksForBackup = true

# Spotlight on Option-Space, freeing Command-Space for Raycast. Key 64 is "Show Spotlight search"; the parameters are
# the character (32, space), the key code (49) and the modifier (524288, Option). Only key 64 is replaced.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64"]

[bootstrap.macos.defaults_entries.value]
enabled = true

[bootstrap.macos.defaults_entries.value.value]
parameters = [32, 49, 524288]
type = "standard"

# Tap to click at the login window too (the trackpad keys above cover a logged-in session). Stored per machine.
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
host = "current"
value = 1

# Photos (Image Capture) stays closed when a phone or camera connects. Stored per machine.
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.ImageCapture"
key = "disableHotPlug"
host = "current"
value = true

# Touch ID for sudo. sudo_local is the file /etc/pam.d/sudo includes and macOS updates keep (unlike sudo itself).
# Before packages, so the Homebrew install's sudo can use it. Over SSH or with the lid closed, sudo asks for the
# password as before.
[bootstrap.files."/etc/pam.d/sudo_local"]
os = "macos"
phase = "pre-packages"
owner = "root"
group = "wheel"
mode = "0444"
content = """
# sudo_local: managed by dots (config/mise/conf.d/macos.toml); survives macOS updates.
auth       sufficient     pam_tid.so
"""

[bootstrap.directories."~/Pictures/Screenshots"]
os = "macos"

# mise does not restart apps. After the defaults step: point screenshots at ~/Pictures/Screenshots (an absolute path,
# which mise cannot write), set the default apps in ~/.config/duti (LaunchServices applies them a few seconds
# later), apply the Spotlight hotkey without a logout, then restart Dock, Finder and the menu bar so
# the rest shows. Runs on every bootstrap (a brief flicker when nothing changed) and never fails it.
# DOTS_ACTIVATE_SETTINGS only exists for test/integration/bootstrap/macos-defaults.spec.ts.
[bootstrap.hooks.post-defaults]
run = '''
#!/usr/bin/env bash
[ "$(uname)" = Darwin ] || exit 0
defaults write com.apple.screencapture location -string "$HOME/Pictures/Screenshots" >/dev/null 2>&1 || true
duti="$(command -v duti || echo /opt/homebrew/bin/duti)"
dutifile="${XDG_CONFIG_HOME:-$HOME/.config}/duti/defaults.duti"
"$duti" "$dutifile" >/dev/null 2>&1 || true
"${DOTS_ACTIVATE_SETTINGS:-/System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings}" -u >/dev/null 2>&1 || true
killall Dock Finder SystemUIServer >/dev/null 2>&1 || true
'''
