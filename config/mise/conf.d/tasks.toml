# The dots front door: one global task (`mise run dots …`) for setup, backup, and profile management.

[tasks.dots]
description = "Set up this machine, back it up, choose its profile"
usage = '''
cmd "setup" help="Install and configure parts of this machine; no flags means all, in order" {
  flag "--brew"      help="Homebrew, its config link, and every Brewfile package for the profile"
  flag "--yabai"     help="yabai's scripting addition (sudoers rule, boot argument)"
  flag "--app-files" help="Move app-written copies (VS Code, Karabiner) aside before linking"
  flag "--vscode"    help="Turn off VS Code Settings Sync for linked settings, keybindings and snippets"
  flag "--bat"       help="Rebuild bat's theme cache"
  flag "--lig"       help="Cache Lig's zsh integration"
  flag "--macos"     help="Apply macOS settings that need $HOME and restart Dock, Finder and menu bar"
  flag "--swiftbar"  help="Point SwiftBar at its plugins folder"
  flag "--git"       help="Git SOPS filters, ~/.gitconfig check, and hk git hooks"
  flag "--shell"     help="Warm Zsh plugin and completion caches"
  flag "--dev"       help="Install Python 3.13 dev tools (dev profile)"
  flag "--secrets"   help="gopass store, keyring check, pass link, and SSH Keychain"
  flag "--tiling"    help="Tiling checks (SIP, Accessibility, kb-raycast) and JankyBorders build"
  flag "--ai"        help="Download oMLX models"
  flag "--skills"    help="Restore global agent skills (dev profile)"
  flag "--nvim"      help="Neovim providers and plugins"
  flag "--profile <profile>" var=#true env="DOTS_PROFILE" default="desktop" help="Bootstrap profile(s) to apply" {
    choices "desktop" "dev" "container"
  }
  flag "--dry-run"   help="Show the parts and steps that would run without executing them"
}
cmd "backup" help="Back up and restore this machine with restic" {
  arg "<action>" help="Backup action" {
    long_help """
    - init: Create this machine's restic repository on the backup drive
    - backup: Back up the allowlist in config/restic/backup.toml, then restic check
    - snapshots: List this machine's snapshots
    - restore: Restore folders from a snapshot into the home folder
    - forget: Apply the retention policy and prune
    - audit: Read-only report of what a reinstall would lose, written to the backup drive
    """
    choices "init" "backup" "snapshots" "restore" "forget" "audit"
  }
  flag "--include <path>" var=#true help="Folder to restore, relative to the old home (restore; repeatable)"
  flag "--snapshot <id>"            help="Snapshot ID to restore from, default latest (restore)"
  flag "--from-home <path>"         help="Old home folder path in the snapshot (restore)"
  flag "--target <path>"            help="Destination folder for restored files (restore)"
  flag "--dry-run"                  help="Preview restore without writing files (restore)"
  flag "--stdout"                   help="Print the reinstall audit to stdout instead of the backup drive (audit)"
}
cmd "profile" help="Choose this machine's profile and apply it" {
  arg "<profile>" help="desktop (install default) or dev (desktop + dev tools)" {
    choices "desktop" "dev"
  }
}
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

case "${usage_cmd:-}" in
  setup)
    all_parts=(brew yabai app-files vscode bat lig macos swiftbar git shell dev secrets tiling ai skills nvim)
    selected=()
    for part in "${all_parts[@]}"; do
      var="usage_${part//-/_}"
      if [ "${!var:-false}" = "true" ]; then
        selected+=("$part")
      fi
    done
    if [ -z "${selected[*]:-}" ]; then
      selected=("${all_parts[@]}")
    fi
    export DOTS_PROFILE
    DOTS_PROFILE="$(printf '%s' "${usage_profile:-desktop}" | tr ' ' ',')"
    run_flags=()
    if [ "${usage_dry_run:-false}" = "true" ]; then
      run_flags+=(--dry-run)
    fi
    for part in "${selected[@]}"; do
      mise run -C "{{ vars.dots }}" ${run_flags[@]+"${run_flags[@]}"} "dots:setup:$part"
    done
    mise run -C "{{ vars.dots }}" ${run_flags[@]+"${run_flags[@]}"} dots:setup:remind
    ;;
  backup)
    args=("${usage_action:?}")
    if [ -n "${usage_include:-}" ]; then
      eval "includes=($usage_include)"
      for inc in "${includes[@]}"; do
        args+=(--include "$inc")
      done
    fi
    [ -n "${usage_snapshot:-}" ] && args+=(--snapshot "$usage_snapshot")
    [ -n "${usage_from_home:-}" ] && args+=(--from-home "$usage_from_home")
    [ -n "${usage_target:-}" ] && args+=(--target "$usage_target")
    [ "${usage_dry_run:-false}" = "true" ] && args+=(--dry-run)
    [ "${usage_stdout:-false}" = "true" ] && args+=(--stdout)
    if command -v bun > /dev/null 2>&1; then
      exec bun "{{ vars.dots }}/script/backup.ts" "${args[@]}"
    fi
    exec mise x bun@1.3.14 -- bun "{{ vars.dots }}/script/backup.ts" "${args[@]}"
    ;;
  profile)
    case "${usage_profile:?}" in
      desktop) list=desktop ;;
      dev) list=desktop,dev ;;
      *) echo "dots profile: unknown profile: $usage_profile (desktop or dev)" >&2; exit 2 ;;
    esac
    exec mise bootstrap -E "$list" --save-env --yes
    ;;
  *)
    exec mise run dots --help
    ;;
esac
'''
