# The dots front door: one global task (`mise run dots …`) for setup, backup, and profile management.

[tasks.dots]
description = "Set up this machine, back it up, choose its profile"
usage = '''
cmd "setup" help="Install and configure parts of this machine; no parts means all, in order" {
  arg "[part]..." var=#true help="Parts to run, always in the fixed order; Tab lists each part with its help"
  // Tab shows `complete` values with their help; `choices` would show bare names. Names are validated in `run`.
  // One line per part, in run order, with the same help as its hidden dots:setup:<part> task (parts.toml).
  complete "part" descriptions=#true run=#"""
    printf '%s\n' \
      'brew:Homebrew, its config link, and every Brewfile package for the profile' \
      'yabai:yabai'"'"'s scripting addition (sudoers rule, boot argument)' \
      'app-files:Move app-written copies (VS Code, Karabiner) aside before linking' \
      'vscode:Turn off VS Code Settings Sync for linked settings, keybindings and snippets' \
      'bat:Rebuild bat'"'"'s theme cache' \
      'lig:Cache Lig'"'"'s zsh integration' \
      'macos:Apply macOS settings that need the home path and restart Dock, Finder and menu bar' \
      'swiftbar:Point SwiftBar at its plugins folder' \
      'git:Git SOPS filters, ~/.gitconfig check, and hk git hooks' \
      'shell:Warm Zsh plugin and completion caches' \
      'dev:Install Python 3.13 dev tools (dev profile)' \
      'secrets:gopass store, keyring check, pass link, and SSH Keychain' \
      'tiling:Tiling checks (SIP, Accessibility, kb-raycast) and JankyBorders build' \
      'ai:Download oMLX models' \
      'skills:Restore global agent skills (dev profile)' \
      'nvim:Neovim providers and plugins'
    """#
  flag "--profile <profile>" var=#true env="DOTS_PROFILE" help="Bootstrap profile(s) to apply (desktop, dev, container; defaults to mise_env, else desktop)"
  flag "--dry-run"   help="Show the parts and steps that would run without executing them"
  flag "--no-remind" hide=#true help="Skip dots:setup:remind at the end (used by bootstrap hooks)"
}
cmd "backup" help="Back up and restore this machine with restic" {
  arg "<action>" help="Backup action; Tab lists each action with its help"
  // As for setup's parts: `complete` shows each action's help on Tab, `choices` would not. backup.ts rejects an unknown one.
  complete "action" descriptions=#true run=#"""
    printf '%s\n' \
      'init:Create this machine'"'"'s restic repository on the backup drive' \
      'backup:Back up the allowlist in config/restic/backup.toml, then restic check' \
      'snapshots:List this machine'"'"'s snapshots' \
      'restore:Restore folders from a snapshot into the home folder' \
      'forget:Apply the retention policy and prune' \
      'audit:Read-only report of what a reinstall would lose, written to the backup drive'
    """#
  flag "--include <path>" var=#true help="Folder to restore, relative to the old home (restore; repeatable)"
  flag "--snapshot <id>"            help="Snapshot ID to restore from, default latest (restore)"
  flag "--from-home <path>"         help="Old home folder path in the snapshot (restore)"
  flag "--target <path>"            help="Destination folder for restored files (restore)"
  flag "--dry-run"                  help="Preview restore without writing files (restore)"
  flag "--stdout"                   help="Print the reinstall audit to stdout instead of the backup drive (audit)"
}
cmd "profile" help="Choose this machine's profile and apply it" {
  arg "<profile>" help="desktop (install default) or dev (desktop + dev tools)"
  complete "profile" descriptions=#true run=#"""
    printf '%s\n' 'desktop:The install default' 'dev:desktop plus the dev tools'
    """#
}
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

case "${usage_cmd:-}" in
  setup)
    all_parts=(brew yabai app-files vscode bat lig macos swiftbar git shell dev secrets tiling ai skills nvim)
    # usage passes the repeatable [part] as shell-quoted words, so eval only unquotes them.
    eval "wanted=(${usage_part:-})"
    for part in ${wanted[@]+"${wanted[@]}"}; do
      case " ${all_parts[*]} " in
        *" $part "*) ;;
        *)
          printf 'dots setup: unknown part: %s (expected %s)\n' "$part" "${all_parts[*]}" >&2
          exit 2
          ;;
      esac
    done
    selected=()
    for part in "${all_parts[@]}"; do
      case " ${wanted[*]:-} " in
        *" $part "*) selected+=("$part") ;;
      esac
    done
    if [ -z "${selected[*]:-}" ]; then
      selected=("${all_parts[@]}")
    fi
    raw_profile="${usage_profile:-}"
    if [ -z "$raw_profile" ]; then
      raw_profile="{% if mise_env is defined %}{% for e in mise_env %}{% if e == 'desktop' or e == 'dev' or e == 'container' %}{{ e }} {% endif %}{% endfor %}{% endif %}"
    fi
    profiles=()
    IFS=', ' read -r -a raw_items <<< "${raw_profile:-desktop}"
    for item in "${raw_items[@]}"; do
      [ -n "$item" ] || continue
      case "$item" in
        desktop | dev | container) profiles+=("$item") ;;
        *)
          printf 'dots setup: unknown profile: %s (expected desktop, dev, or container)\n' "$item" >&2
          exit 2
          ;;
      esac
    done
    if [ -z "${profiles[*]:-}" ]; then
      profiles=(desktop)
    fi
    export DOTS_PROFILE
    DOTS_PROFILE="$(
      IFS=,
      printf '%s' "${profiles[*]}"
    )"
    run_flags=()
    if [ "${usage_dry_run:-false}" = "true" ]; then
      run_flags+=(--dry-run)
    fi
    for part in "${selected[@]}"; do
      mise run -C "{{ vars.dots }}" ${run_flags[@]+"${run_flags[@]}"} "dots:setup:$part"
    done
    if [ "${usage_no_remind:-false}" != "true" ]; then
      mise run -C "{{ vars.dots }}" ${run_flags[@]+"${run_flags[@]}"} dots:setup:remind
    fi
    ;;
  backup)
    args=("${usage_action:?}") # backup.ts rejects an unknown action with its usage line (exit 2)
    if [ -n "${usage_include:-}" ]; then
      eval "includes=($usage_include)"
      for inc in "${includes[@]}"; do
        args+=(--include "$inc")
      done
    fi
    [ -n "${usage_snapshot:-}" ] && args+=(--snapshot "$usage_snapshot")
    [ -n "${usage_from_home:-}" ] && args+=(--from-home "$usage_from_home")
    [ -n "${usage_target:-}" ] && args+=(--target "$usage_target")
    [ "${usage_dry_run:-false}" = "true" ] && args+=(--dry-run)
    [ "${usage_stdout:-false}" = "true" ] && args+=(--stdout)
    if command -v bun > /dev/null 2>&1; then
      exec bun "{{ vars.dots }}/script/backup.ts" "${args[@]}"
    fi
    exec mise x bun@1.3.14 -- bun "{{ vars.dots }}/script/backup.ts" "${args[@]}"
    ;;
  profile)
    case "${usage_profile:?}" in
      desktop) list=desktop ;;
      dev) list=desktop,dev ;;
      *) echo "dots profile: unknown profile: $usage_profile (desktop or dev)" >&2; exit 2 ;;
    esac
    exec mise bootstrap -E "$list" --save-env --yes
    ;;
  *)
    exec mise run dots --help
    ;;
esac
'''
