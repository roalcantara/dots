# Packages applied by `mise bootstrap` (assets/specs/mise-bootstrap/design.md §4.1).
# Converted from the Brewfile; edit here from now on. mise installs Homebrew bottles and casks itself.

[bootstrap.brew.taps]
"asmvik/formulae" = "https://github.com/asmvik/homebrew-formulae.git"
"can1357/tap" = "https://github.com/can1357/homebrew-tap.git"
"oven-sh/bun" = "https://github.com/oven-sh/homebrew-bun.git"
# "giammarco-ferranti/deja" = "https://github.com/giammarco-ferranti/homebrew-deja.git"

[bootstrap.packages]
