# Linux system packages: what Homebrew needs to install itself, desktop services, and what the Brewfile cannot
# install on Linux (a snap, font casks). Every other package is in config/homebrew/Brewfile.
[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:procps" = "latest"
"apt:curl" = "latest"
"apt:file" = "latest"
"apt:git" = "latest"
"apt:ca-certificates" = "latest"
"apt:zsh" = "latest"
"apt:flatpak" = { env = "desktop" }
"apt:docker.io" = { env = "desktop" }
"flatpak:org.chromium.Chromium" = { env = "desktop" }
"flatpak:com.visualstudio.code" = { env = "desktop" }
"flatpak:com.rtosta.zapzap" = { env = "desktop" }
"flatpak:com.bitwarden.desktop" = { env = "desktop" }

"brew-cask:font-cascadia-code" = { env = "desktop" }
"brew-cask:font-cascadia-code-pl" = { env = "desktop" }
"brew-cask:font-caskaydia-mono-nerd-font" = { env = "desktop" }
"brew-cask:font-fira-code" = { env = "desktop" }
"brew-cask:font-fira-code-nerd-font" = { env = "desktop" }
"brew-cask:font-hack-nerd-font" = { env = "desktop" }
"brew-cask:font-jetbrains-mono-nerd-font" = { env = "desktop" }
