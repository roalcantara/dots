# MISE GLOBAL CONFIG FILE
# https://mise.jdx.dev/configuration.html#global-config-config-mise-config-toml

[settings]
# https://mise.jdx.dev/configuration/settings.html
# tools can read the versions files used by other version managers

# configure `mise install` to always keep the downloaded archive
# always_keep_download = false # deleted after install by default
always_keep_install = false # deleted on failure by default

# Enable color output in the terminal
# https://mise.jdx.dev/configuration/settings.html#color
color = true # set to true to enable color output

# Set the color theme for the terminal output: default |charm | base16 | catppuccin | dracula
# https://mise.jdx.dev/configuration/settings.html#color_theme
color_theme = "dracula"

# set to true to expand environment variables in the shell for example:
#   [env]
#   FOO = "hello"
#   BAR = "$FOO-world"          # "hello-world"
#   BAZ = "${FOO}_suffix"       # "hello_suffix"
#   QUX = "${UNDEF:-fallback}"  # "fallback"
# https://mise.jdx.dev/configuration/settings.html#env_shell_expand
# env_shell_expand = true

# configure how frequently (in minutes) to fetch updated plugin repository changes
# this is updated whenever a new runtime is installed
# (note: this isn't currently implemented but there are plans to add it: https://github.com/jdx/mise/discussions/6735)
# plugin_autoupdate_last_check_duration = "1 week" # set to 0 to disable updates

# config files with these prefixes will be trusted by default
# https://mise.jdx.dev/configuration/settings.html#trusted_config_paths
trusted_config_paths = [
  "~/config",
  "~/config/mise",
  "~/Work/dots/config/mise",
  "~/.local/share/dots",
  "~/.local/share/dots/config",
  "~/.local/share/dots/config/mise",
]

verbose = false      # set to true to see full installation output, see `MISE_VERBOSE`
http_timeout = "30s" # set the timeout for http requests as duration string, see `MISE_HTTP_TIMEOUT`
jobs = 4             # number of plugins or runtimes to install in parallel. The default is `4`.
raw = false          # set to true to directly pipe plugins to stdin/stdout/stderr
yes = false          # set to true to automatically answer yes to all prompts

# Automatically install missing tools when running mise x, mise run, or as part of the 'not found' handler.
# https://mise.jdx.dev/configuration/settings.html#auto_install
auto_install = true

# Automatically install missing tools when running mise x, mise run, or as part of the 'not found' handler.
# https://mise.jdx.dev/configuration/settings.html#not_found_auto_install
not_found_auto_install = true

# Set the package manager for npm: npm | bun | pnpm
# https://mise.jdx.dev/configuration/settings.html#npm_package_manager
# npm.package_manager = "bun"

# paranoid = false       # see MISE_PARANOID
# shorthands_file = '~/.config/mise/shorthands.toml' # path to the shorthands file, see `MISE_SHORTHANDS_FILE`
# disable_default_shorthands = false # disable the default shorthands, see `MISE_DISABLE_DEFAULT_SHORTHANDS`
# disable_tools = ['node']           # disable specific tools, generally used to turn off core tools
# env_file = '.env' # load env vars from a dotenv file, see `MISE_ENV_FILE`

# Enables experimental features
# https://mise.jdx.dev/configuration/settings.html#experimental
experimental = true

# By default, idiomatic version files are disabled
# for example, .nvmrc in the case of node's nvm
# https://mise.jdx.dev/configuration/settings.html#idiomatic_version_file_enable_tools
# https://mise.jdx.dev/configuration.html#idiomatic-version-files
idiomatic_version_file_enable_tools = [
  "go",
  "node",
  "java",
  "python",
  "ruby",
  "yarn",
]

# The Tera template method for defining task arguments is deprecated and will be removed in mise 2026.11.0.
# This disable the two-pass parsing behavior immediately
# https://mise.jdx.dev/configuration/settings.html#task.disable_spec_from_run_scripts
# Instead use https://usage.jdx.dev/spec
task.disable_spec_from_run_scripts = true

# Configure a custom command in your global settings to obtain a GitHub token
# https://mise.jdx.dev/dev-tools/github-tokens.html#credential-command
[settings.rust]
# Pin where rustup and cargo live, matching CARGO_HOME / RUSTUP_HOME in .zshenv: a mise started without that env
# (an IDE, a git hook) would otherwise default to ~/.cargo and ~/.rustup, flip the toolchain link, and reinstall Rust
# on the next run. https://mise.jdx.dev/lang/rust.html#where-rustup-and-cargo-live
cargo_home = "~/.local/share/cargo"
rustup_home = "~/.local/share/rustup"

[settings.github]
credential_command = "gh auth token"

[tools]
usage = "latest"
hk = "latest"
fnox = "latest"
# needed to python/uv/pipx dependencies
uv = "latest"
# needed to go dependencies
go = "latest"
# From the Brewfile's `go` and `uv` lines (cmd/go and cmd/gofmt come with Go itself).
"go:mvdan.cc/gofumpt" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:github.com/brutski/go-code-graph/cmd/import-neo4j" = "latest"
"go:github.com/brutski/go-code-graph/cmd/mcp-server" = "latest"
"go:github.com/brutski/go-code-graph/cmd/analyze" = "latest"
"go:github.com/brutski/go-code-graph/cmd/server" = "latest"
"pipx:debugpy" = "latest"
"pipx:graphifyy" = "latest"
"pipx:code-review-graph" = "latest"

[tasks]
[tasks.up]
description = "Bump BREW dependencies"
confirm = { message = "Bump all brew dependencies?", default = "yes" }
quiet = true
tools = { gum = "latest" }
run = '''
  #!/usr/bin/env bash
  gum log --time Datetime --level warn --prefix 'BREW' "brew bundle upgrade --upgrade --zap --force --force-cleanup --verbose"
  echo "" && brew bundle upgrade --upgrade --zap --force --force-cleanup 2> /dev/null

  echo "" && gum log --time Datetime --level warn --prefix 'BREW' "brew autoremove && brew update --auto-update --force --verbose"
  echo "" && brew autoremove && brew update --auto-update --force --verbose 2> /dev/null

  echo "" && gum log --time Datetime --level warn --prefix 'BREW' "brew upgrade --greedy --greedy-latest --greedy-auto-updates --yes --force"
  echo "" && brew upgrade --greedy --greedy-latest --greedy-auto-updates --yes --force 2> /dev/null

  echo "" && gum log --time Datetime --level warn --prefix 'BREW' "brew upgrade --greedy --greedy-latest --greedy-auto-updates --force --yes --cask"
  echo "" && brew upgrade --greedy --greedy-latest --greedy-auto-updates --force --yes --cask 2> /dev/null

  echo "" && gum log --time Datetime --level warn --prefix 'BREW' "brew cleanup --prune=all && brew doctor"
  echo "" && brew cleanup --prune=all && brew doctor
'''
[tasks.backup]
description = "Backup important files"
quiet = true
tools = { rsync = "latest" }
run = '''
  #!/usr/bin/env bash
  # rsync -av --progress ~/important_files/ ~/backup/

  # Dry run: the same exclusions run through zip -sf (list only, nothing written)
  # give 44,677 files totalling 8.95 GB. All of the critical files above are included
  # (including 16,634 .git files), and nothing from the excluded folders appears.
  # HeroWarsFanKit is 7.4 GB of that 8.95 GB. It's your own media, so I kept it.
  # If you can get it again from its source, adding 'Work/mydemon/inspiration/HeroWarsFanKit/*'
  # to the -x list brings the archive to about 1.5 GB.
  cd ~ && zip -r -y /Volumes/meex900/bak/Work-2026-10-28.zip Work \
    -n .wav:.mp3:.mp4:.mov:.png:.jpg:.jpeg:.webp:.zip:.gz:.bin \
    -x '*/.git/*' '*/.git' '*.git/*' '*.pack' '*.idx' \
      'Work/bun/kb/*' 'Work/mydemon/inspiration/HeroWarsFanKit/*' \
      '*/target/*' '*/node_modules/*' \
      'Work/mydemon/mydemon/build/*' 'Work/mydemon/mydemon/app/build/*' \
      'Work/mydemon/mydemon/.claude/worktrees/*/build/*' 'Work/mydemon/mydemon/.claude/worktrees/*/app/build/*' \
      '*/.gradle/*' '*/.cache/*' '*/.code-review-graph/*' '*/graphify-out/*' '*/.gortex/*' '*/.fallow/*' '*/.ruby-lsp/*' \
      '*/dist/*' '*/tmp/*' '*.log' '*.zwc' '*/.zcompdump' '*/.DS_Store' \
    && unzip -tq /Volumes/meex900/bak/Work-2026-10-28.zip

  # find selects the files and pipes the list to zip -@.
  # That's what skips symlinks everywhere, not just at the top level.
  # The dated name avoids the existing bak/config.zip and bak/config/.
  cd ~ && find .config -mindepth 1 \( -type l \
      -o -path .config/raycast/extensions -o -path .config/raycast/node-compile-cache \
      -o -path .config/.rz/repos -o -path .config/.rz/bin -o -path .config/gcloud/virtenv \
      -o -path .config/.fallow -o -path .config/opencode/node_modules -o -path .config/wakatime/.wakatime \
      -o -name '*.log' -o -name .DS_Store -o -name '*.zwc' -o -name '.zcompdump*' \) -prune \
    -o -type f -print \
    | zip -q /Volumes/meex900/bak/config-2026-10-28.zip -@ \
    && unzip -tq /Volumes/meex900/bak/config-2026-10-28.zip

  # Quit every omp session first. Its databases were written to a few minutes ago,
  # and copying a SQLite database while it's in use can produce a broken copy.
  cd ~ && find .omp -mindepth 1 \( -type l -o -type s \
      -o -path .omp/cache -o -path .omp/puppeteer -o -path .omp/natives -o -path .omp/logs \
      -o -path .omp/run -o -path .omp/ssh-control -o -path .omp/.fallow \
      -o -path .omp/agent/cache -o -path .omp/plugins/cache \
      -o -name '*.lock' -o -name .DS_Store -o -name gpu_cache.json \) -prune \
    -o -type f -print \
    | zip -q /Volumes/meex900/bak/omp-2026-10-28.zip -@ \
    && unzip -tq /Volumes/meex900/bak/omp-2026-10-28.zip

  # Encrypt the omp archive using age for secure storage.
  age -p -o omp-2026-10-28.zip.age omp-2026-10-28.zip
'''

[tasks."fix:skills"]
description = "Find the highest-install skill record for each folder or a file list"
quiet = true
tools = { bun = "latest" }
run = '''
  #!/usr/bin/env bun
  import fs from "fs";

  const args = process.argv.slice(2);
  const sourceArg = (() => {
    for (let i = 0; i < args.length; i++) {
      const arg = args[i];
      if (arg === "--from" || arg === "--file") {
        return args[i + 1] ?? "";
      }
      const equalsMatch = arg.match(/^(?:--from|--file)=(.+)$/);
      if (equalsMatch) {
        return equalsMatch[1];
      }
    }
    return "";
  })();

  const skillsDir = `${process.env.HOME}/.agents/skills`;
  const normalizeFolderName = (rawLine) => {
    const line = String(rawLine ?? "").replace(/\u001b\[[0-9;]*m/g, "").trim();
    if (!line || line.startsWith("#")) return null;

    if (line.startsWith("No install records found for ")) {
      return line.replace(/^No install records found for /, "").trim();
    }

    if (line.startsWith("Processing skill folder: ")) {
      return line.replace(/^Processing skill folder:\s*/, "").trim();
    }

    return line.replace(/^['\"]|['\"]$/g, "").trim() || null;
  };

  const parseCount = (countText) => {
    const match = String(countText).match(/^([0-9]+(?:\.\d+)?)([KMB]?)$/);
    if (!match) return Number.NaN;

    const [, amountText, suffix = ""] = match;
    const amount = Number.parseFloat(amountText);
    const multiplier = { K: 1000, M: 1000000, B: 1000000000 };
    return amount * (multiplier[suffix] ?? 1);
  };

  const collectFolders = () => {
    if (sourceArg) {
      const sourcePath = sourceArg.trim();
      if (!fs.existsSync(sourcePath)) {
        throw new Error(`Source file not found: ${sourcePath}`);
      }

      const lines = fs.readFileSync(sourcePath, "utf8").split(/\r?\n/);
      return [...new Set(lines.map(normalizeFolderName).filter(Boolean))];
    }

    return fs.readdirSync(skillsDir)
      .filter((name) => fs.statSync(`${skillsDir}/${name}`).isDirectory())
      .sort();
  };

  const skillFolders = collectFolders();
  const csvRows = [];

  console.log(`Processing ${skillFolders.length} skill folders`);

  for (const folder of skillFolders) {
    console.log(`Processing skill folder: ${folder}`);

    const proc = Bun.spawnSync({
      cmd: ["/opt/homebrew/bin/skills", "find", folder],
      stdout: "pipe",
      stderr: "pipe",
    });

    const rawOutput = proc.stdout ? new TextDecoder().decode(proc.stdout) : "";
    const skillOutput = rawOutput.replace(/\u001b\[[0-9;]*m/g, "").trim();

    if (!skillOutput || !/install(?:s)?/i.test(skillOutput)) {
      console.log(`No install records found for ${folder}`);
      continue;
    }

    const lines = skillOutput
      .split(/\r?\n/)
      .map((line) => line.trim())
      .filter(Boolean);

    const records = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const match = line.match(/^(.+?)\s+([0-9]+(?:\.\d+)?(?:[KMB])?)\s+install(?:s)?$/);
      if (!match) continue;

      const nextLine = lines[i + 1] ?? "";
      const url = nextLine.replace(/^└\s*/, "").trim();
      if (!url) continue;

      const [, skillName, countText] = match;
      const count = parseCount(countText);
      if (!Number.isFinite(count)) continue;

      records.push({ skillName, count, url });
    }

    if (records.length === 0) {
      console.log(`No install records found for ${folder}`);
      continue;
    }

    const winner = records.reduce((best, current) => (current.count > best.count ? current : best));
    const row = `${folder}, ${winner.skillName}, ${winner.url}`;
    csvRows.push(row);
    console.log(row);
  }

  const outputCsv = `${process.env.HOME}/Work/dots/script/skills.csv`;
  fs.writeFileSync(outputCsv, `${csvRows.join("\n")}\n`, "utf8");
  console.log(`Wrote ${csvRows.length} rows to ${outputCsv}`);
'''

