toml-version = "v1.1.0"

[files]
include = ["**/*.toml"]
exclude = ["**/node_modules/**/*.toml", "**/dist/**/*.toml"]

[format.rules]
array-bracket-space-width = 0
array-comma-space-width = 1
date-time-delimiter = "T"
indent-style = "space"
indent-sub-tables = true
indent-table-key-value-pairs = false
indent-width = 2
inline-table-brace-space-width = 1
inline-table-comma-space-width = 1
key-value-equals-sign-alignment = true
key-value-equals-sign-space-width = 1
line-ending = "lf"
line-width = 120
string-quote-style = "single"
trailing-comment-alignment = false
trailing-comment-space-width = 2

[lint.rules]
dotted-keys-out-of-order = "warn"
key-empty = "warn"
tables-out-of-order = "warn"

[lsp]
# Enable or disable LSP features. See the documentation for more details:
# https://tombi-toml.github.io/tombi/docs/language-serve
code-action.enabled = true
completion.enabled = true
diagnostic.enabled = true
document-link.enabled = true
formatting.enabled = true
goto-declaration.enabled = true
goto-definition.enabled = true
goto-type-definition.enabled = true

# Display executable types as hover information
# https://tombi-toml.github.io/tombi/docs/language-server/hover
hover.enabled = true

# Real-time error detection and linting feedback in your editor through Tombi's Language Server.
# https://tombi-toml.github.io/tombi/docs/language-server/diagnostics
workspace-diagnostic.enabled = true

[schema]
enabled = true
strict = true
catalog = {
  paths = [
    "tombi://schemastore.org/api/json/catalog.json",
    "tombi://tombi-toml.github.io/tombi/schema/catalog.json"
  ],
}

# Root Schema (exclude config/tombi to avoid self-validation issues)
[[schemas]]
path = "https://tombi-toml.github.io/tombi/schema/catalog.json"
include = [
  "config/nvim/**/*.toml",
  "config/snippets/**/*.toml",
  "**/pyproject.toml",
  "**/Cargo.toml"
]
