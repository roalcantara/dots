# zsh-patina's colours for this theme. config/zsh-patina/config.toml loads it through
# `theme = "file:$DOTS_THEME_DIR/zsh-patina.toml"`, so switching themes needs `zsh-patina restart`
# (a new shell does it when config/dots/config.toml changes). zsh-patina ships no Dracula, so this maps the scopes its built-in themes use
# (themes/tokyonight.toml) onto the Dracula palette (https://draculatheme.com/spec, MIT).

"comment" = "#6272A4"
"string" = "#F1FA8C"
"keyword.operator.regexp" = "#F1FA8C"
"constant.character.escape" = "#FF79C6"
"constant.numeric.integer.decimal.file-descriptor" = "#BD93F9"
"variable.parameter" = "#FFB86C"
"variable.other" = "#BD93F9"
"punctuation.definition.variable" = "#BD93F9"
"variable.function" = "#50FA7B"
"variable.language.tilde" = "#BD93F9"
"keyword" = "#FF79C6"
"storage" = "#FF79C6"
"support" = "#8BE9FD"
"entity.name.function" = "#50FA7B"
"punctuation.section" = "#FF79C6"

# history expansions
"meta.group.expansion.history" = "#FFB86C"

# reset command substitutions to terminal defaults
"meta.group.expansion.command.parens" = {}

# dynamic items
"dynamic.callable" = "#50FA7B"
"dynamic.callable.missing" = "#FF5555"
"dynamic.path" = { underline = true }
