[metadata]
name = "recent-files"
description = "List recently modified files (via git or filesystem)"
requirements = ["git", "bat"]

[source]
command = [
  "git diff --name-only HEAD~10 HEAD 2>/dev/null || find . -type f -mtime -7 -not -path '*/.*' 2>/dev/null | head -100",
  "find . -type f -mmin -60 -not -path '*/.*' 2>/dev/null | head -100",
]

[preview]
command = "bat -n --color=always '{}'"
env = { BAT_THEME = "Dracula" }

[keybindings]
enter = "actions:edit"
ctrl-v = "actions:code"
ctrl-i = "actions:insiders"
ctrl-e = "actions:cursor"

[actions.edit]
description = "Open the selected file in $EDITOR"
command = "${EDITOR:-nvim} '{}'"
shell = "zsh"
mode = "execute"

[actions.code]
description = "Edit on VSCode"
command = "code '{}'"
shell = "zsh"
mode = "execute"

[actions.insiders]
description = "Edit on Insiders"
command = "code-insiders '{}'"
shell = "zsh"
mode = "execute"

[actions.cursor]
description = "Edit on Cursor"
command = "cursor '{}'"
shell = "zsh"
mode = "execute"
