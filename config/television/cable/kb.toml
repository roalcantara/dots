########################################################################
# Television | https://alexpasmantier.github.io/television
# A fast, portable and hackable fuzzy finder for the terminal in RUST
########################################################################
# 📺 CHANNNELS: TOML configuration file that tells tv
#             ➡ What to search (the source command)
#             ➡ How to preview results (optional)
#             ➡ Custom keybindings and actions (optional)
# https://alexpasmantier.github.io/television/getting-started
########################################################################
# DEFAULT CHANNELS -----------------------------------------------------
# tv files         # Browse files (default)
# tv text          # Search file contents with ripgrep
# tv git-repos     # Find git repositories
# tv env           # Search environment variables
########################################################################

# CUSTOM CHANNEL for kb sources --------------------------------------
# https://youtu.be/wwJA9mDqIVc

[metadata]
name = "kb"
description = "A channel to select kb sources"
requirements = ["fd", "rg", "bat"]

[source]
command = [
  "rg . --glob '*.yaml' --glob '*.yml' --glob-case-insensitive --no-heading --line-number --colors 'match:fg:white' --colors 'path:fg:blue' --color=always ~/Work/knowledge",
  "rg . --glob '*.yaml' --glob '*.yml' --glob-case-insensitive --no-heading --line-number --hidden --colors 'match:fg:white' --colors 'path:fg:blue' --color=always ~/Work/knowledge"
]
ansi = true
output = "{strip_ansi|split:\\::..2}"

[preview]
command = "bat -n --color=always '{strip_ansi|split:\\::0}'"
env = { BAT_THEME = "ansi" }
offset = '{strip_ansi|split:\::1}'

[keybindings]
enter = "actions:edit"
ctrl-up = "actions:goto_parent_dir"
ctrl-v = "actions:code"
ctrl-i = "actions:insiders"
ctrl-e = "actions:cursor"

[actions.edit]
description = "Open the selected file in $EDITOR"
command = "${EDITOR:-nvim} '{}'"
shell = "zsh"
mode = "execute"

[actions.code]
description = "Edit on VSCode"
command = "code '{}'"
shell = "zsh"
mode = "execute"

[actions.insiders]
description = "Edit on Insiders"
command = "code-insiders '{}'"
shell = "zsh"
mode = "execute"

[actions.cursor]
description = "Edit on Cursor"
command = "cursor '{}'"
shell = "zsh"
mode = "execute"

[actions.goto_parent_dir]
description = "Re-opens tv in the parent directory"
command = "tv files .."
mode = "execute"

[ui.preview_panel]
hidden = false
