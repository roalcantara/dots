#:schema ./backup.schema.json
# Backup policy for script/backup.ts (mise run backup, backup:restore, …).
# Every key, default and reason: docs/REINSTALL.md, "The manifest".

[repository]
root = "/Volumes/backups"                          # DOTS_BACKUP_ROOT overrides
path = "machines/{host}/restic"                    # {host}: scutil --get LocalHostName, or DOTS_BACKUP_HOST
password_command = "gopass show -o backups/restic" # skipped when a RESTIC_PASSWORD* variable is set

[backup]
# An allowlist: only files with no other source (git remote, dots, Homebrew, iCloud, app sync).
# Everything else in ~ (~/.local, ~/Library, Downloads, media, tool folders) is rebuilt or disposable.
paths = [
  "~/Documents",
  "~/Desktop",
  "~/Private",
  "~/Work",      # repos without a remote, uncommitted and unpushed work, non-git projects
]
tags = ["{host}"] # backup.ts also adds home:<home>, which restore reads
exclude_caches = true # also skip any folder holding a CACHEDIR.TAG

[retention]
daily = 7
weekly = 4
monthly = 12

[[exclude]]
pattern = "~/Work/mydemon/inspiration"
why = "Reference images (7 GiB); not worth keeping (owner, 2026-11-06)"

[[exclude]]
pattern = "**/node_modules"
why = "JavaScript dependencies; the package manager reinstalls them"

[[exclude]]
pattern = "**/target"
why = "Rust and Maven build output"

[[exclude]]
pattern = "**/.gradle"
why = "Gradle caches"

[[exclude]]
pattern = "**/.venv"
why = "Python virtual environments; recreated from lock files"

[[exclude]]
pattern = "**/__pycache__"
why = "Python bytecode"

[[exclude]]
pattern = "**/.DS_Store"
why = "Finder metadata"
