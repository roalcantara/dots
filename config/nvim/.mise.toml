[tools]

[env]
LUA_PATH = "./lua/?.lua;./lua/?/init.lua;;"

[tasks]
# Direct Docker commands for the multi-stage build
[tasks."build:busted"]
run = "docker build -f tools/Dockerfile --target busted -t nvim:busted ."

[tasks."build:selene"]
run = "docker build -f tools/Dockerfile --target selene -t nvim:selene ."

[tasks."build:shell"]
run = "docker build -f tools/Dockerfile --target tools -t nvim:shell ."

# Run commands with built images
[tasks."run:busted"]
run = "docker run --rm -v $(pwd)/specs:/app/spec -v $(pwd)/lua:/app/src nvim:busted --helper spec/tools/spec_helper.lua --output=utfTerminal spec/"

[tasks."run:selene"]
run = "docker run --rm -v $(pwd)/lua:/app/lua nvim:selene /app/lua"

[tasks."run:shell"]
run = "docker run --rm -it -v $(pwd)/specs:/app/spec -v $(pwd)/lua:/app/lua nvim:shell"

# New multi-stage Docker commands
[tasks."up:test"]
run = "docker-compose -f tools/docker-compose.yml run --build --rm test"

[tasks."up:lint"]
run = "docker-compose -f tools/docker-compose.yml run --build --rm lint"

[tasks."up:shell"]
run = "docker-compose -f tools/docker-compose.yml run --build --rm shell"
