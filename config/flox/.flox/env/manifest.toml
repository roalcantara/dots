schema-version = "1.11.0"

## Include ----------------------------------------------------------
## other environments to merge with the current manifest in order to
## compose them into a single environment
## https://flox.dev/docs/man/manifest.toml/#include
## ------------------------------------------------------------------
[include]
environments = [
  #  { dir = ".config/flox/envs/cockpit" }
  { remote = "roalcantara/cockpit" },
]

## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## https://flox.dev/docs/man/manifest.toml/#install
## -------------------------------------------------------------------
[install]

### VERSION CONTROL SYSTEMS & RELATED

# Distributed revision control system
# https://git-scm.com
git.pkg-path = "git"

# Cross-platform Git credential storage for multiple hosting providers
# https://aka.ms/gcm
git-credential-manager.pkg-path = "git-credential-manager"

# GitHub command-line tool
# https://cli.github.com
gh.pkg-path = "gh"

# Git extension for versioning large files
# https://git-lfs.com
git-lfs.pkg-path = "git-lfs"

# Small git utilities
# https://github.com/tj/git-extras
git-extras.pkg-path = "git-extras"

# Bitbucket Enterprise CLI
# https://bb-cli.github.io
bitbucket-cli.pkg-path = "bitbucket-cli"

### SHELL

# A shell and a CLI interpreter for shell scripts
# https://zsh.org
zsh.pkg-path = "zsh"

### SECURITY, ENCRYPTION & SECRETS

# Slightly more awesome Standard Unix Password Manager for Teams
# https://www.gopass.pw/
gopass.pkg-path = "gopass"

# Pinentry for GPG on Mac
# https://github.com/GPGTools/pinentry
pinentry_mac.pkg-path = "pinentry_mac"
pinentry_mac.systems = ["aarch64-darwin"]

### PROGRAMS & APPLICATIONS

# The open source AI coding agent
# https://opencode.ai

# A post-modern text editor
# https://helix-editor.com
helix.pkg-path = "helix"

### PROGRAMMING LANGUAGES

# General-purpose lang & toolchain for robust, optimal & reusable software
# https://ziglang.org
zig.pkg-path = "zig"

# An opinionated language server for Ruby
# https://shopify.github.io/ruby-lsp
ruby-lsp.pkg-path = "rubyPackages_3_3.ruby-lsp"

# Extremely fast Python package and project manager (RUST)
# https://docs.astral.sh/uv
uv.pkg-path = "uv"

# Interpreter for the PostScript® language and PDF files.
# It consists of a PostScript interpreter layer and a graphics library.
# https://ghostscript.com
ghostscript.pkg-path = "ghostscript"

### DATABASES

# Turso is an in-process SQL database, compatible with SQLite
# https://turso.tech
turso-cli.pkg-path = "turso-cli"

### CLI & UTILITIES

# Internet file retriever
# https://www.gnu.org/software/wget
wget.pkg-path = "wget"

# Power of curl, ease of use of httpie
# https://rs.github.io/curlie
curlie.pkg-path = "curlie"

# CLI tools & an API to manipulate phylogenetic trees
# https://github.com/evolbioinfo/gotree

# Terminal JSON viewer & processor (GO)
# https://fx.wtf
fx.pkg-path = "fx"
fx.pkg-group = "fx"

# Render LaTeX math expressions
# https://tectonic-typesetting.github.io/en-US/
tectonic.pkg-path = "tectonic"

# Render Mermaid diagrams
# https://github.com/mermaid-js/mermaid-cli
mermaid-cli.pkg-path = "mermaid-cli"
jq.pkg-path = "jq"
act.pkg-path = "act"
shellspec.pkg-path = "shellspec"
hyperfine.pkg-path = "hyperfine"
hadolint.pkg-path = "hadolint"
television.pkg-path = "television"
d2.pkg-path = "d2"
pup.pkg-path = "pup"
usage.pkg-path = "usage"

## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## https://flox.dev/docs/man/manifest.toml/#vars
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"

## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## https://flox.dev/docs/man/manifest.toml/#hook
## -------------------------------------------------------------------
[hook]
on-activate = '''
  FLOX_ZSH="$FLOX_ENV/bin/zsh"
  TARGET_ZSH="/usr/local/bin/zsh"
 
  if [[ "$(uname)" = "Darwin" ]]; then
    CURRENT_SHELL="$(dscl . -read "/Users/$USER" UserShell 2>/dev/null | awk '{print $2}')"
  else
    CURRENT_SHELL="$(getent passwd "$USER" 2>/dev/null | cut -d: -f7)"
  fi

  if [ "$CURRENT_SHELL" != "$TARGET_ZSH" ]; then
    echo "CURRENT_SHELL:'$CURRENT_SHELL'; TARGET:'$TARGET_ZSH'; FLOX:'$FLOX_ZSH'"
    # Create a symlink to the FLOX's zsh binary in the environment if it doesn't already exist or points to a different location
    if [ "$(readlink "$TARGET_ZSH")" != "$FLOX_ZSH" ]; then
      if ln -sF "$FLOX_ZSH" "$TARGET_ZSH" 2>/dev/null || \
        sudo ln -sF "$FLOX_ZSH" "$TARGET_ZSH" 2>/dev/null; then
          echo "'$TARGET_ZSH' symlinked to '$FLOX_ZSH' ✔"
      else
        echo "Creating symlink '$TARGET_ZSH → $FLOX_ZSH' failed. Please try manually."
      fi
    fi

    if ! grep -qxF "$TARGET_ZSH" /etc/shells 2>/dev/null; then
      if echo "$TARGET_ZSH" | tee -a /etc/shells >/dev/null 2>&1 || \
          echo "$TARGET_ZSH" | sudo tee -a /etc/shells >/dev/null 2>&1; then
            echo "'$TARGET_ZSH' added to /etc/shells ✔"
      else
        echo "Could not add '$TARGET_ZSH' to /etc/shells. Please try manually."
      fi
    fi

    # Change the user's login shell to the FLOX's zsh
    if chsh -s "$TARGET_ZSH" "$USER" 2>/dev/null || \
      usermod -s "$TARGET_ZSH" "$USER" 2>/dev/null || \
        sed -i "s|^\($USER:.*:\)[^:]*$|\1$TARGET_ZSH|" /etc/passwd; then
          echo "'$TARGET_ZSH' set as the login shell for '$USER' ✔"
    else
      echo "Could not set login shell for '$USER'. Please try manually."
    fi
  fi
'''
# on-activate = '''
#   # -> Set variables, create files and directories
#   # -> Perform initialization steps, e.g. create a python venv
#   # -> Useful environment variables:
#   #      - FLOX_ENV_PROJECT=/home/user/example
#   #      - FLOX_ENV=/home/user/example/.flox/run
#   #      - FLOX_ENV_CACHE=/home/user/example/.flox/cache
# '''


