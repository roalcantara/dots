[tools]
gum = "latest"

[tasks."brew:setup"]
description = "Install Homebrew if it is not already available"
run = '''
#!/usr/bin/env bash
set -euo pipefail

HOMEBREW_URL="https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh"
if command -v brew >/dev/null 2>&1; then
  echo "Homebrew is already installed"
  exit 0
fi

NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL "${HOMEBREW_URL}")"
if command -v brew >/dev/null 2>&1; then
  echo "Homebrew installed successfully"
else
  echo "Homebrew installation failed" >&2
  exit 1
fi
'''

[tasks."brew:load"]
quiet = true
silent = true
description = "Load the Homebrew environment into the current shell session"
run = '''
#!/usr/bin/env bash
set -euo pipefail

if ! command -v brew >/dev/null 2>&1; then
  echo "Homebrew is not installed; run 'mise -C config/homebrew run brew:setup' first" >&2
  exit 1
fi

# shellcheck disable=SC1090
eval "$(brew shellenv)"
'''

[tasks.bundle]
quiet = true
dir = "{{cwd}}"
description = "Homebrew bundle manager"
depends = ["brew:load"]
usage = '''
flag "-f --file <path>" help="Path to the Brewfile" default="{{env.HOME}}/.config/homebrew/Brewfile" env="HOMEBREW_BUNDLE_FILE" global=#true
flag "--debug" help="Display any debugging information" global=#true
flag "--verbose" help="Make some output more verbose" default=#true global=#true
flag "--quiet" help="Make some output more quiet" global=#true

cmd "list" help="List all dependencies present in the Brewfile" {
  arg "[command]" help="brew bundle list" default="list" hide=#true
  flag "--formulae" help="Affects Homebrew formula dependencies"
  flag "--cask" help="Affects Homebrew cask dependencies"
  flag "--tap" help="Affects Homebrew tap dependencies"
  flag "--vscode" help="Affects VSCode extensions"
  flag "--go" help="Affects Go packages"
  flag "--cargo" help="Affects Cargo packages"
  flag "--uv" help="Affects uv tools"
  flag "--krew" help="Affects Krew plugins"
  flag "--npm" help="Affects npm packages"
  flag "--flatpak" help="Affects Flatpak packages"  
  flag "--mas" help="Affects Mac App Store dependencies"
  flag "--install" help="Run install before listing dependencies"
  flag "--all" help="Affects all dependencies"
}

cmd "install" help="Install and upgrade (by default) all dependencies from the Brewfile" {
  arg "[command]" help="brew bundle install" default="install" hide=#true
  flag "--force" help="Run with --force/--overwrite"
  flag "--no-upgrade" help="Do not run brew upgrade on outdated dependencies. Note they may still be upgraded"
  flag "--upgrade" help="Run brew upgrade on outdated dependencies, even if $HOMEBREW_BUNDLE_NO_UPGRADE is set"
  flag "--upgrade-formulae" help="Run brew upgrade on any of these comma-separated formulae, even if $HOMEBREW_BUNDLE_NO_UPGRADE is set"
  flag "--force-cleanup" help="Perform cleanup after installing dependencies without asking. Enabled by default if $HOMEBREW_BUNDLE_FORCE_INSTALL_CLEANUP is set and --global is passed."   
}

cmd "check" help="Check local install state against the Brewfile" {
  arg "[command]" help="brew bundle check" default="check" hide=#true
  flag "--install" help="Run install before checking dependencies."
  flag "--no-upgrade" help="Do not run brew upgrade on outdated dependencies. Note they may still be upgraded"
}

cmd "update" help="Update and check local install state against the Brewfile" {
  arg "[command]" help="brew bundle check" default="check" hide=#true
  flag "--install" help="Run install before checking dependencies." default=#true
  flag "--no-upgrade" help="Do not run brew upgrade on outdated dependencies. Note they may still be upgraded"
}

cmd "cleanup" help="Clean up Homebrew, prune old packages, and run doctor" {
  arg "[command]" help="brew bundle cleanup" default="cleanup" hide=#true
  flag "--formulae" negate="--no-formulae" help="Affects Homebrew formula dependencies"
  flag "--cask" negate="--no-cask" help="Affects Homebrew cask dependencies"
  flag "--tap" negate="--no-tap" help="Affects Homebrew tap dependencies"
  flag "--vscode" negate="--no-vscode" help="Affects VSCode extensions"
  flag "--go" negate="--no-go" help="Affects Go packages"
  flag "--cargo" negate="--no-cargo" help="Affects Cargo packages"
  flag "--uv" negate="--no-uv" help="Affects uv tools"
  flag "--krew" negate="--no-krew" help="Affects Krew plugins"
  flag "--npm" negate="--no-npm" help="Affects npm packages"
  flag "--flatpak" negate="--no-flatpak" help="Affects Flatpak packages"  
  flag "--mas" negate="--no-mas" help="Affects Mac App Store dependencies"
  flag "--install" help="Run install before cleaning up dependencies."
  flag "--force" help="Actually perform cleanup operations and reset Homebrew's global trust store to the Brewfile values."
  flag "--all" help="Clean up all supported dependencies."
}

cmd "add" help="Add a dependency to the Brewfile" {
  arg "[command]" help="brew bundle add name [...]" default="add" hide=#true
  arg "<scope>" help="Type of dependency" {
    choices "formulae" "cask" "tap" "uv" "go" "cargo" "npm" "krew" "vscode" "flatpak"
  }
  arg "<name>" help="Name of the dependency"
}

cmd "remove" help="Remove entries that match name from your Brewfile" {
  arg "[command]" help="brew bundle remove name [...]" default="remove" hide=#true
  arg "<scope>" help="Type of dependency" {
    choices "formulae" "cask" "tap" "uv" "go" "cargo" "npm" "krew" "vscode" "flatpak" "mas"
  }
  arg "<name>" help="Name of the dependency"
  flag "--install" help="Run install before removing entries."  
}

cmd "dump" help="Write all installed casks/formulae/images/taps into a Brewfile" {
  arg "[command]" help="brew bundle dump" default="dump" hide=#true
  flag "--formulae" negate="--no-formulae" help="Affects Homebrew formula dependencies"
  flag "--cask" negate="--no-cask" help="Affects Homebrew cask dependencies"
  flag "--tap" negate="--no-tap" help="Affects Homebrew tap dependencies"
  flag "--vscode" negate="--no-vscode" help="Affects VSCode extensions"
  flag "--go" negate="--no-go" help="Affects Go packages"
  flag "--cargo" negate="--no-cargo" help="Affects Cargo packages"
  flag "--uv" negate="--no-uv" help="Affects uv tools"
  flag "--krew" negate="--no-krew" help="Affects Krew plugins"
  flag "--npm" negate="--no-npm" help="Affects npm packages"
  flag "--flatpak" negate="--no-flatpak" help="Affects Flatpak packages"  
  flag "--mas" negate="--no-mas" help="Affects Mac App Store dependencies"
  flag "--install" help="Run install before dumping dependencies."  
  flag "--force" help="Overwrite an existing Brewfile."
}
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail
BREW_FILE="${usage_file:-Brewfile}"

[[ -n "$BREW_FILE" ]] && opts+=(--file="$BREW_FILE")
opts=($usage_command)
[[ -n "${usage_name:-}" ]] && opts+=("${usage_name:-}")

[[ -n "${usage_scope:-}" ]] && opts+=("--${usage_scope:-}")
[[ "${usage_formula:-false}" == "true" ]] && opts+=(--formulae)
[[ "${usage_cask:-false}" == "true" ]] && opts+=(--cask)
[[ "${usage_tap:-false}" == "true" ]] && opts+=(--tap)
[[ "${usage_mas:-false}" == "true" ]] && opts+=(--mas)
[[ "${usage_vscode:-false}" == "true" ]] && opts+=(--vscode)
[[ "${usage_go:-false}" == "true" ]] && opts+=(--go)
[[ "${usage_cargo:-false}" == "true" ]] && opts+=(--cargo)
[[ "${usage_uv:-false}" == "true" ]] && opts+=(--uv)
[[ "${usage_flatpak:-false}" == "true" ]] && opts+=(--flatpak)
[[ "${usage_krew:-false}" == "true" ]] && opts+=(--krew)
[[ "${usage_npm:-false}" == "true" ]] && opts+=(--npm)

[[ "${usage_no-upgrade:-false}" == "true" ]] && opts+=(--no-upgrade)
[[ "${usage_upgrade:-false}" == "true" ]] && opts+=(--upgrade)
[[ "${usage_upgrade-formulae:-false}" == "true" ]] && opts+=(--upgrade-formulae)
[[ "${usage_force-cleanup:-false}" == "true" ]] && opts+=(--force-cleanup)

[[ "${usage_force:-false}" == "true" ]] && opts+=(--force)
[[ "${usage_install:-false}" == "true" ]] && opts+=(--install)
[[ "${usage_all:-false}" == "true" ]] && opts+=(--all)
[[ "${usage_debug:-false}" == "true" ]] && opts+=(--debug)
[[ "${usage_verbose:-false}" == "true" ]] && opts+=(--verbose)
[[ "${usage_quiet:-false}" == "true" ]] && opts+=(--quiet)
gum log --time Datetime --level info "brew bundle ${opts[*]}"
brew bundle "${opts[@]}"
'''