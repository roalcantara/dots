      - md: |
          Full Stack Engineer
          Submitted resume
          Amicus · Malmö, Skåne County, Sweden · Posted on Feb 28, 2024

          ## Job Description

          Full Stack Engineer - React/Node - Malmo - Up to 60,000 SEK per month

          We're currently working alongside a software business based in Malmo as they look to expand their engineering team with the addition of a Senior Full Stack Engineer.

          Their product is used by marketing departments all across the world to help them automate their campaigns and analyse results to ensure future campaigns are as fruitful as possible. They're a true tech business at heart, and are always looking to implement new technologies when needed.

          The business have 40 people in total, with 18 of those being software engineers. They're growing rapidly at the moment, with the goal of becoming 30 in the engineering team by the end of this year. With that in mind, there are plenty of opportunities to progress into leadership roles in the near future!

          The business are based in Malmo and are looking for someone to come onsite a few days a week, to work closely with the other engineers who are all based locally.

          ### The role

          We're looking for a Senior Engineer here, or maybe someone who's early on in their journey as a Lead Developer. The goal is that within the next 18 months - two years, you'll step into a Tech Lead role. That means you'll need a few years of experience under your belt, and you should be comfortable working both within a team and as an individual contributor when needed.
          This is a true full stack role, so experience across the TypeScript ecosystem is a requirement. You should have worked with React, Node & AWS for a few years!
          The business are expanding into the US at the moment, meaning there will be a number of new products to build from scratch and plenty of client requested features along the way!

          ### The process

          - Video interview with CTO
          - Short coding assignment done from home
          - Final meeting to go through technical challenge & meet the team
          - On offer is up to 60,000 SEK per month, along with a benefits package including pension, health insurance etc.

          Would you be interested in discussing this role with me?
      - md: |
          ## Message

          Dear Jamie Crowley,

          I hope this message finds you well. I am writing to express my interest in the Senior Full Stack Engineer position at Amicus in Malmö, as advertised. With a solid background in full-stack development, including extensive experience with React/Angular, Node.js, Rails, and AWS, I am excited about the opportunity to contribute to your team's success.

          My career has been marked by a commitment to excellence, innovation, and continuous learning, aligning closely with your goal of expanding the engineering team and driving technological advancements. The prospect of working on products that significantly enhance marketing campaign automation and analysis is particularly appealing to me. I am intrigued by the potential for growth within your organization and the opportunity to progress into a leadership role.

          I am currently based in Brazil, but I am very interested in relocating to Malmö and appreciate the blend of onsite and remote working arrangements you offer. My experience in developing robust and highly-scalable software solutions and my proactive approach to embracing new technologies make me confident in my ability to make a significant contribution to your team.

          I look forward to the possibility of discussing this exciting opportunity with you further. I am available for a video interview at your earliest convenience and eager to participate in your hiring process.

          Thank you for considering my application. I am keen on the prospect of joining your team and contributing to the innovative work being done at Amicus.

          Best regards,
