      ### Autenticação e Autorização

      Implemente autenticação e autorização robustas. JWT (JSON Web Tokens) é uma abordagem popular para gerenciar autenticações de usuários em APIs RESTful.

      > npm install jsonwebtoken

      ```js
      const jwt = require('jsonwebtoken');

      const authenticateToken = (req, res, next) => {
        const token = req.headers['authorization'];
        if (token == null) return res.sendStatus(401);

        jwt.verify(token, process.env.ACCESS_TOKEN_SECRET, (err, user) => {
          if (err) return res.sendStatus(403);
          req.user = user;
          next();
        });
      };
      ```
  Cluster Module | Node.js:
    desc: Aproveite ao máximo os sistemas multi-core
    tags:
      - avn
      - cluster
      - node
    notes: |
      ## Cluster Module

      Aproveite ao máximo os sistemas multi-core com o módulo de cluster do Node.js.

      ```js
      const cluster = require('cluster');
      const http = require('http');
      const numCPUs = require('os').cpus().length;

      if (cluster.isMaster) {
        console.log(`Master ${process.pid} is running`);

        // Fork workers
        for (let i = 0; i < numCPUs; i++) {
          cluster.fork();
        }

        cluster.on('exit', (worker, code, signal) => {
          console.log(`Worker ${worker.process.pid} died`);
        });
      } else {
        http.createServer((req, res) => {
          res.writeHead(200);
          res.end('hello world\n');
        }).listen(8000);

        console.log(`Worker ${process.pid} started`);
      }
      ```
