          ### Back End Developer

          Job Title: Backend Engineer (PHP, Python, Golang)
          Location: Lisbon, Portugal

          Company Overview:
          We are a leading Marketing Automation company dedicated to empowering businesses with innovative solutions to streamline their marketing processes and drive growth. With a focus on cutting-edge technology and a commitment to excellence, we are seeking a talented Backend Engineer to join our dynamic team in Lisbon.

          Job Description:
          As a Backend Engineer, you will play a key role in developing and maintaining our core marketing automation platform. You will work closely with our cross-functional teams to design and implement scalable, reliable, and high-performance backend systems using PHP, Python, and Golang. This is an exciting opportunity to contribute to the success of a large-scale marketing automation platform and make a significant impact on our business and customers.

          Responsibilities:
          Design, develop, and maintain backend services and APIs for our marketing automation platform using PHP, Python, and Golang.
          Collaborate with frontend engineers, product managers, and other stakeholders to define requirements and deliver high-quality features and enhancements.
          Optimize system performance, scalability, and reliability through code refactoring, optimization, and architecture improvements.
          Implement best practices for code quality, testing, security, and documentation to ensure the stability and maintainability of our systems.
          Participate in code reviews, design discussions, and technical planning sessions to drive continuous improvement and innovation.
          Stay up-to-date on emerging technologies, industry trends, and best practices to inform technical decisions and drive innovation in our products.

          Requirements:
          Bachelor's degree in Computer Science, Engineering, or related field.
          3+ years of experience in backend development, with a focus on PHP, Python, and Golang.
          Strong proficiency in PHP, with experience using frameworks such as Laravel or Symfony.
          Solid understanding of Python and Golang, with hands-on experience building backend services and APIs.
          Experience with relational and non-relational databases such as MySQL, PostgreSQL, MongoDB, or Redis.
          Knowledge of software development best practices, design patterns, and principles.
          Strong problem-solving skills and attention to detail, with the ability to troubleshoot and debug complex systems.
          Excellent communication and collaboration skills, with the ability to work effectively in a cross-functional team environment.
          Fluency in English (both written and spoken)

          Benefits:
          Competitive salary up to €70,000 per year, commensurate with experience.
          Health insurance coverage and other benefits.
          Flexible work schedule and remote work options.
          Opportunities for professional development and career growth.
          Dynamic and collaborative work environment with a diverse team of talented professionals.
          Chance to make a meaningful impact and contribute to the success of a leading Marketing Automation company.
      - md: |

