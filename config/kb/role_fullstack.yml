    notes: |
      ## React Router

      > React Router é uma biblioteca fundamental para adicionar rotas em suas aplicações React, permitindo a navegação entre diferentes componentes sem recarregar a página

      ### Installation

      > npm install react-router-dom

      ### Usage

      ```jsx
      import ReactDOM from 'react-dom';
      import { BrowserRouter as Router, Route, Switch, Link } from 'react-router-dom';

      // Componentes para as nossas páginas
      function Home() {
        return <h2>Home Page</h2>;
      }

      function About() {
        return <h2>About Page</h2>;
      }

      function Users() {
        return <h2>Users Page</h2>;
      }

      function App() {
        return (
          <Router>
            <div>
              <nav>
                <ul>
                  <li>
                    <Link to="/">Home</Link>
                  </li>
                  <li>
                    <Link to="/about">Sobre</Link>
                  </li>
                  <li>
                    <Link to="/users">Usuários</Link>
                  </li>
                </ul>
              </nav>

              {/* Um <Switch> olha por seus filhos <Route>s e renderiza o primeiro que corresponde à URL atual. */}
              <Switch>
                <Route path="/about">
                  <About />
                </Route>
                <Route path="/users">
                  <Users />
                </Route>
                <Route path="/">
                  <Home />
                </Route>
              </Switch>
            </div>
          </Router>
        );
      }

      // Renderizando o componente App no elemento root
      ReactDOM.render(<App />, document.getElementById('root'));
      ```
  Middlewares | Express.js:
    desc: Funções que têm acesso ao objeto de solicitação (request), ao objeto de resposta (response) e à próxima função de middleware no ciclo solicitação-resposta da aplicação.
    tags:
      - avn
      - express
      - node
    notes: |
      ## Installation
      > npm install express

      ## Middlewares

      > Funções que têm acesso ao objeto de solicitação (request), ao objeto de resposta (response) e à próxima função de middleware no ciclo solicitação-resposta da aplicação.
      > São usados para executar qualquer código, fazer mudanças nos objetos de solicitação e resposta, finalizar o ciclo de solicitação-resposta, ou chamar a próxima função de middleware

      ### Exemplo Básico com 3 middlewares principais

      ```js
      const express = require('express');
      const app = express();
      const PORT = 3000;

      // Middleware para log das requisições
      // Registra no console cada solicitação recebida pelo servidor.
      app.use((req, res, next) => {
        console.log(`${req.method} ${req.url}`);
        next(); // Passa o controle para o próximo middleware
      });

      // Middleware para autenticação simples
      // Verifica se a solicitação inclui um cabeçalho de autorização específico.
      // Se não incluir, ou se o token for inválido, a solicitação é interrompida com uma resposta de erro 401.
      const authMiddleware = (req, res, next) => {
        const authHeader = req.headers['authorization'];
        if (authHeader && authHeader === 'Bearer token123') {
          next(); // Usuário autenticado, passa para o próximo middleware
        } else {
          res.status(401).send('Acesso negado. Token de autenticação inválido.');
        }
      };

      // Usando o middleware de autenticação em uma rota específica
      app.get('/protected', authMiddleware, (req, res) => {
        res.send('Você acessou uma área protegida!');
      });

      // Rota não protegida
      app.get('/', (req, res) => {
        res.send('Página Inicial. Acesso não restrito.');
      });

      // Middleware para tratamento de erros
      // Captura qualquer erro que ocorra durante o processamento da solicitação e envia uma resposta de erro genérica.
      app.use((err, req, res, next) => {
        console.error(err.stack);
        res.status(500).send('Algo deu errado!');
      });

      app.listen(PORT, () => {
        console.log(`Servidor rodando na porta ${PORT}`);
      });
      ```
