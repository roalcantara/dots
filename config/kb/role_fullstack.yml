  useReducer | React.js:
    desc: Gerencie estados complexos em componentes React
    tags:
      - avn
      - hooks
      - react
    notes: |
      ## useReducer

      > Permite gerenciar estados complexos em componentes React

      ```jsx
      import React, { useReducer } from 'react';

      const initialState = { count: 0 };

      function reducer(state, action) {
        switch (action.type) {
          case 'increment':
            return { count: state.count + 1 };
          case 'decrement':
            return { count: state.count - 1 };
          default:
            throw new Error();
        }
      }

      function Counter() {
        const [state, dispatch] = useReducer(reducer, initialState);

        return (
          <>
            Count: {state.count}
            <button onClick={() => dispatch({ type: 'increment' })}>+</button>
            <button onClick={() => dispatch({ type: 'decrement' })}>-</button>
          </>
        );
      }
      ```
  useRef | React.js:
    desc: Acesse o nó DOM de um componente React
    tags:
      - avn
      - hooks
      - react
    notes: |
      ## useRef

      > Permite acessar o nó DOM de um componente React

      ```jsx
      import React, { useRef } from 'react';

      function TextInputWithFocusButton() {
        const inputEl = useRef(null);
        const onButtonClick = () => {
          // `current` aponta para o nó DOM de input
          inputEl.current.focus();
        };

        return (
          <>
            <input ref={inputEl} type="text" />
            <button onClick={onButtonClick}>Focus no input</button>
          </>
        );
      }
      ```
  useMemo | React.js:
    desc: Memorize valores computados em componentes React
    tags:
      - avn
      - hooks
      - react
    notes: |
      ## useMemo

      > Permite memorizar valores computados em componentes React

      ```jsx
      import React, { useMemo } from 'react';

      function computeExpensiveValue(a, b) {
        // Simula um cálculo caro
        return a + b;
      }

      function MyComponent({ a, b }) {
        const value = useMemo(() => computeExpensiveValue(a, b), [a, b]);
        return <p>{value}</p>;
      }
      ```
  useCallback | React.js:
    desc: Memorize funções em componentes React
    tags:
      - avn
      - hooks
      - react
    notes: |
      ## useCallback

      > Permite memorizar funções em componentes React

      ```jsx
      import React, { useState, useCallback } from 'react';

      function MyComponent() {
        const [count, setCount] = useState(0);
        const increment = useCallback(() => setCount(count + 1), [count]);

        return (
          <>
            Count: {count}
            <button onClick={increment}>Incrementar</button>
          </>
        );
      }
      ```
  useImperativeHandle | React.js:
    desc: Personalize o valor retornado por um componente React
    tags:
      - avn
      - hooks
      - react
    notes: |
      ## useImperativeHandle

      > Permite personalizar o valor retornado por um componente React

      ```jsx
      import React, { useRef, useImperativeHandle } from 'react';

      function FancyInput(props, ref) {
        const inputRef = useRef();
        useImperativeHandle(ref, () => ({
          focus: () => {
            inputRef.current.focus();
          },
        }));

        return <input ref={inputRef} />;
      }

      FancyInput = React.forwardRef(FancyInput);
      ```
