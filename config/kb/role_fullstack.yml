  useState | React.js:
    desc: Adicione o estado React a componentes funcionais
    tags:
      - avn
      - hooks
      - react
    notes: |
      ## useState

      > Permite adicionar o estado React a componentes funcionais

      ```jsx
      import React, { useState } from 'react';

      function Counter() {
        // Declara uma nova variável de estado, chamada "count"
        const [count, setCount] = useState(0);

        return (
          <div>
            <p>Você clicou {count} vezes</p>
            <button onClick={() => setCount(count + 1)}>
              Clique aqui
            </button>
          </div>
        );
      }
      ```
  useEffect | React.js:
    desc: Execute efeitos colaterais em componentes funcionais
    tags:
      - avn
      - hooks
      - react
    notes: |
      ## useEffect

      > Permite executar efeitos colaterais em componentes funcionais

      ```jsx
      import React, { useState, useEffect } from 'react';

      function Example() {
        const [count, setCount] = useState(0);

        // Similar a componentDidMount e componentDidUpdate:
        useEffect(() => {
          // Atualiza o título do documento usando a API do navegador
          document.title = `Você clicou ${count} vezes`;
        });

        return (
          <div>
            <p>Você clicou {count} vezes</p>
            <button onClick={() => setCount(count + 1)}>
              Clique aqui
            </button>
          </div>
        );
      }
      ```
