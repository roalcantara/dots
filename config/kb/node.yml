  # biome | Format, lint, and more in a fraction of a second
  # https://biomejs.dev
  npm install --save-dev --save-exact @biomejs/biome:
    desc: Install Biome
    tags: [format, biome]
    links: [https://biomejs.dev/guides/getting-started, https://biomejs.dev/blog/biome-v2]
    notes:
      - json: | #jsonc
          // biome.jsonc
          {
            "$schema": "https://biomejs.dev/schemas/2.0.5/schema.json",
            "formatter": {
              "enabled": false
            },
            "linter": {
              "enabled": false
            },
            "assist": {
              "enabled": false
            }
          }
  biome init:
    desc: Create a configuration file
    tags: [format, biome]
    links:
      - Getting Started: https://biomejs.dev/guides/getting-started
      - Prettier/ESLint to Biome - The Lightning-Fast Rust-Based Tool: https://youtu.be/KI7mbm-BxqA
  biome lint <DIRECTORY_OR_FILE_NAME>:
    desc: Lint all files in a directory
    tags: [format, biome]
    links:
      - Getting Started: https://biomejs.dev/guides/getting-started
      - Prettier/ESLint to Biome - The Lightning-Fast Rust-Based Tool: https://youtu.be/KI7mbm-BxqA
  biome check --apply <DIRECTORY_OR_FILE_NAME>:
    desc: Format, lint and organize imports | Runs multiple tools at once
    tags: [format, biome]
    links:
      - Getting Started: https://biomejs.dev/guides/getting-started
      - Prettier/ESLint to Biome - The Lightning-Fast Rust-Based Tool: https://youtu.be/KI7mbm-BxqA
  biome format ~/path/to/file.json --write --files-max-size=1000000000:
    desc: Format a file, writing the result back to the file, with a maximum file size of 1GB
    tags: [format, biome]
    links:
      - Getting Started: https://biomejs.dev/guides/getting-started
      - Prettier/ESLint to Biome - The Lightning-Fast Rust-Based Tool: https://youtu.be/KI7mbm-BxqA
  biome format <DIRECTORY_OR_FILE_NAME> --write --files-max-size=1000000000:
    desc: Format all files in a directory
    tags: [format, biome]
    links:
      - Getting Started: https://biomejs.dev/guides/getting-started
      - Prettier/ESLint to Biome - The Lightning-Fast Rust-Based Tool: https://youtu.be/KI7mbm-BxqA
  npm install --save-dev --save-exact @biomejs/biome && npx @biomejs/biome migrate eslint --write --include-inspired:
    desc: Migrate from ESLint to Biome. It overwrites your initial Biome configuration.
    tags: [format, biome]
    links: [https://biomejs.dev/guides/migrate-eslint-prettier/#migrate-from-eslint, https://biomejs.dev/guides/integrate-in-vcs, https://biomejs.dev/linter]
    notes:
      - json: | #jsonc
          // biome.jsonc
          {
            "linter": {
              "enabled": true,
              "rules": {
                "recommended": true
              }
            }
          }
  npm install --save-dev --save-exact @biomejs/biome && npx @biomejs/biome migrate prettier --write:
