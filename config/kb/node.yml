bookmarks:
  https://nodejs.org:
    desc: Node.js® is a JavaScript runtime built on Chrome's V8 JavaScript engine
    tags: [node]
    links: [https://nodejs.org/en/download]
    notes:
      - sh: | #shell
          #! /bin/bash
          # Download and install nvm:
          curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash

          # in lieu of restarting the shell
          \. "$HOME/.nvm/nvm.sh"

          # Download and install Node.js:
          nvm install 22

          # Verify the Node.js version:
          node -v # Should print "v22.18.0".
          nvm current # Should print "v22.18.0".

          # Verify npm version:
          npm -v # Should print "10.9.3".
      - dockerfile: | #dockerfile
          FROM node:22
          WORKDIR /app
          COPY package*.json ./
          RUN npm install
          COPY . .
          CMD ["npm", "start"]
  https://nodejs.org/en/download:
    desc: Download Node.js® LTS | JavaScript runtime built on Chrome's V8 JavaScript engine
    tags: [node]
  https://npmjs.com:
    desc: The package manager for JavaScript
    tags: [node, npm]
  https://yarnpkg.com:
    desc: Fast, reliable, and secure dependency management
    tags: [node, yarn]
  https://pnpm.io:
    desc: Fast, disk space efficient package manager
    tags: [node, pnpm]
    links: [https://pnpm.io/motivation,https://pnpm.io/catalogs,https://pnpm.io/pnpm-cli]
  https://pnpm.io/catalogs:
    desc: Catalogs are a workspace feature for defining dependency version ranges as reusable constants. Constants defined in catalogs can later be referenced in package.json files.
    tags: [node, pnpm]
    links: [https://youtu.be/PuRUk4mV2jc]

commands:
  # npm | The package manager for JavaScript
  # https://npmjs.com
  rm -rf node_modules package-lock.json && npm i:
    desc: Remove node_modules and package-lock.json and install
    tags: [npm]
  npm config edit:
    desc: Opens the config file in an editor
    tags: [npm, config]
  npm config edit --global:
    desc: Opens the global config file in an editor
    tags: [npm, config]
  npm config ls -l:
    desc: List set of configuration parameters that are internal to npm, and are defaults if nothing else is specified
    tags: [npm, config]
  npm ls --parseable --long --loglevel info:
    desc: List all parseable dependencies [INFO]
    tags: [npm, config]
  npm ls --global --parseable --long --loglevel info:
    desc: List all global parseable dependencies [INFO]
    tags: [npm, config]
  npm config list --json:
    desc: List all config settings [JSON]
    tags: [npm, config]
  npm prefix -g:
    desc: Print the local prefix to standard output
    tags: [npm, config]
  npm config get prefix:
    desc: Get npm prefix
    tags: [npm, config]
  npm config set prefix <PATH=/usr/local>:
    desc: Set npm prefix
    tags: [npm, config]
  npm prefix:
    desc: Print the local prefix to standard output. This is the closest parent directory to contain a package.json file or node_modules directory
    tags: [npm, config]
  npm --global list --long --loglevel info:
    desc: List all global dependencies [INFO]
    tags: [npm, packages]
  npm list --long --loglevel info:
    desc: List all local dependencies. This is the closest parent directory to contain a package.json file or node_modules directory [INFO]
    tags: [npm, packages]
  npm config set init-author-name'Rogério R. Alcântara' && npm config set init-author-email'rogerio.alcantara@gmail.com' && npm config set init-author-url'http://github.com/roalcantara' && npm config set init-license'MIT':
    desc: Sets Default npm init Properties
    tags: [npm, config]
  npm outdated:
    desc: List outdated packages
    tags: [npm]
  npm update:
    desc: Bump (or install) packages from package.json
    tags: [npm]
  # npm/typescript
  npm init -y && npm install --save-dev webpack webpack-cli copy-webpack-plugin typescript ts-loader @types/chrome && npx tsc --init:
    desc: Initialize Chrome extension project
    tags: [npm, chrome]
  npm i typescript tslib ts-node ts-node-dev tsconfig-paths @types/node @tsconfig/recommended -D && npx tsc --init:
    desc: Add and initialize TS
    tags: [npm, packages]
  npx tsc --init:
    desc: Initialize TS
    tags: [npm, ts]
  # npm/eslint|jest
  npm i -D @types/jest eslint-plugin-jest eslint-plugin-jest-formatting jest ts-jest && npx ts-jest config:init:
    desc: Add jest
    tags: [npm, packages]
  npm i -D @typescript-eslint/eslint-plugin @typescript-eslint/parser eslint eslint-config-airbnb-typescript eslint-config-prettier eslint-plugin-eslint-comments eslint-plugin-html eslint-plugin-import eslint-plugin-no-loops eslint-plugin-node eslint-plugin-prettier eslint-plugin-promise:
    desc: Add eslint deps
    tags: [npm, packages]
  npx install-peerdeps -D eslint-config-airbnb:
    desc: Install peer dependencies for eslint-config-airbnb
    tags: [npm, eslint]
  # npm/utilities
  npm install -g npm-check-updates && ncu -u:
    desc: Update packages to a new major version
    tags: [npm]
  npm i cheerio htmlparser2 && npm i @types/cheerio @types/htmlparser2 -D:
    desc: Add cheerio
    tags: [npm, packages]
  npm install -g remark-reference-links remark-cli:
    desc: Install remark cli
    tags: [remark, markdown]
  npx remark <PATH> --use remark-reference-links --output:
    desc: Transform all the inline links in <PATH> to numerically-ascending reference-style links
    tags: [remark, markdown]
  npx -p @storybook/cli sb init:
    desc: Add Storybook to project's root
    tags: [npm, storybook, init]
  npm i -D p5 @types/p5 p5-server:
    desc: Add p5 packages
    tags: [p5]
  npx http-server dist/apps/<NAME>:
    desc: Run app <NAME> locally from the dist folder (via http-server)
    tags: [http-server]
  npx npkill --sort size:
    desc: Finds
    tags: [npm, npkill]
  npx npkill -D:
    desc: Removes old node_modules folders
    tags: [npm, npkill]
  npx @backstage/create-app@latest:
    desc: Create a new directory with a Backstage app inside. The wizard will ask you for the name of the app. This name will be created as sub directory in your current working directory.
    tags: [backstage, devops]
    links: [https://backstage.io/docs/getting-started]
  npm install cosmiconfig:
    desc: Find and load configuration from a package.json property, rc file, TypeScript module, and more!
    tags: [npm, package, cosmiconfig]
    links:
      - npm: https://npmjs.com/package/cosmiconfig
      - github: https://github.com/cosmiconfig/cosmiconfig
      - install-mongodb-on-os-x: https://mongodb.com/docs/manual/tutorial/install-mongodb-on-os-x
    notes:
      - md: |
