commands:
  curl -fsSL https://bun.com/install | bash:
    desc: Install Bun using curl
    tags: [bun]
    links: [https://bun.com/docs/installation]
  brew install oven-sh/bun/bun:
    desc: Bun is a fast, modern JavaScript runtime with a focus on developer experience.
    tags: [bun]
    links: [https://bun.com/docs/installation#package-managers]
  docker run --rm --init --ulimit memlock=-1:-1 oven/bun:
    desc: Run Bun in a Docker container
    tags: [bun]
    links: [https://bun.com/docs/installation#docker]

  bun create hono myapp:
    desc: Hono is a lightweight ultrafast web framework designed for the edge.
    tags: [bun, hono]
    links:
      - https://hono.dev/docs/getting-started/bun
      - https://bun.sh/guides/ecosystem/hono
      - https://hono.dev/docs/getting-started/basic
    notes:
      - sh: | #shell
          #! /bin/bash
          # Use create-hono to get started with one of Hono's project templates.
          bun create hono@latest my-app # Select bun when prompted for a template
          cd my-app
          bun install
          bun run dev
          open http://localhost:3000
      - ts: | #typescript
          // index.ts
          import { Hono } from "hono";
          const app = new Hono();

          app.get("/", c => c.text("Hono!"));

          export default app;

  bun init --yes bun-demo:
    desc: Initialize a new bun project
    tags: [bun]
    links: [https://bun.com/docs/runtime/templating/init#examples]

  bun init --yes --minimal bun-minimal-demo:
    desc: Initialize a new minimal bun project
    tags: [bun]
    links: [https://bun.com/docs/runtime/templating/init#examples]

  bun init --yes --react bun-react-demo:
    desc: Initialize a new baseline React App
    tags: [bun, react]
    links: [https://bun.com/docs/runtime/templating/init#examples]

  bun init --yes --react=tailwind bun-react-tailwind-demo:
    desc: Initialize a new React App with Tailwind
    tags: [bun, react, tailwindcss]
    links: [https://bun.com/docs/runtime/templating/init#examples, https://tailwindcss.com]

  bun init --yes --react=shadcn bun-react-shadcn-demo:
    desc: Initialize a new React App and @shadcn/ui
    tags: [bun, react, shadcn]
    links: [https://bun.com/docs/runtime/templating/init#examples, https://ui.shadcn.com]

  echo "console.log('Hello')" | bun run -:
    desc: Read JavaScript, TypeScript, TSX, or JSX from stdin and execute it without writing to a temporary file first
    tags: [bun]
    links: [https://bun.com/docs/runtime#bun-run-to-pipe-code-from-stdin]

cheats:
  Bun Quickstart:
    desc: Use Bun.serve to start a high-performance HTTP server
    tags: [bun]
    links: [https://bun.com/docs/quickstart, https://bun.com/docs/runtime/http/server#basic-setup, https://bun.com/docs/runtime/debugger]
    notes:
      - sh: | #shell
          # 1. Initialize a new react project with bun
          bun init --yes --react bun-react-demo
      - ts: | #typescript
          // index.ts
          const server = Bun.serve({
            // port: 8080, // defaults to $BUN_PORT, $PORT, $NODE_PORT otherwise 3000
            // hostname: "mydomain.com", // defaults to "0.0.0.0"
            // development: true, // activate development mode
            // `routes` requires Bun v1.2.3+
            routes: {
              // Static routes
              "/api/status": new Response("OK"),

              // Dynamic routes
              "/users/:id": req => {
                return new Response(`Hello User ${req.params.id}!`);
              },

              // Return a Promise<Response> from a route handler
              "/api/version": () => {
                return new Promise(resolve => {
                  setTimeout(async () => {
                    const [version] = await sql`SELECT version()`;
                    resolve(Response.json(version));
                  }, 100);
                });
              },

              // Per-HTTP method handlers
              "/api/posts": {
                GET: () => new Response("List posts"),

                // Use async/await in route handlers to return a Promise<Response>
                POST: async req => {
                  const body = await req.json();
                  return Response.json({ created: true, ...body });
                },
              },

              // Wildcard route for all routes that start with "/api/" and aren't otherwise matched
              "/api/*": Response.json({ message: "Not found" }, { status: 404 }),

              // Redirect from /blog/hello to /blog/hello/world
              "/blog/hello": Response.redirect("/blog/hello/world"),

              // Serve a file by buffering it in memory
              "/favicon.ico": new Response(await Bun.file("./favicon.ico").bytes(), {
                headers: {
                  "Content-Type": "image/x-icon",
                },
              }),
            },

            // (optional) fallback for unmatched routes:
            // Required if Bun's version < 1.2.3
            fetch(req) {
              return new Response("Not Found", { status: 404 });
            },
          });

          console.log(`Server running at ${server.url}`);
  Deploy a Hono app to AWS Lambda:
    desc: Deploy a Hono app to AWS Lambda.
    tags: [bun, hono]
    links:
      - https://hono.dev/docs/getting-started/aws-lambda
      - https://github.com/hono-dev/hono/tree/main/examples/aws-lambda
    notes:
      - md: | #markdown
          ## AWS Lambda

          AWS Lambda is a serverless platform by Amazon Web Services.
          You can run your code in response to events and automatically manages the underlying compute resources for you.

          > Hono works on AWS Lambda with the Node.js 18+ environment.
      - md: | #markdown
          ## 1. SETUP

          When creating the application on AWS Lambda, CDK is useful to setup the functions such as IAM Role, API Gateway, and others.

          Initialize your project with the cdk CLI.

          ```sh
          mkdir my-app
          cd my-app
          cdk init app -l typescript
          bun add hono
          mkdir lambda
          touch lambda/index.ts
          ```
      - md: | #markdown
          ## 2. HELLO WORLD

          ```tsh
          // lambda/index.ts
          import { Hono } from 'hono'
          import { handle } from 'hono/aws-lambda'

          const app = new Hono()

          app.get('/', (c) => c.text('Hello Hono!'))

          export const handler = handle(app)
          ```
      - md: | #markdown
          ## 3. DEPLOY

          ```sh
          // lib/cdk-stack.ts
          import * as cdk from 'aws-cdk-lib'
          import { Construct } from 'constructs'
          import * as lambda from 'aws-cdk-lib/aws-lambda'
          import * as apigw from 'aws-cdk-lib/aws-apigateway'
          import { NodejsFunction } from 'aws-cdk-lib/aws-lambda-nodejs'

          export class MyAppStack extends cdk.Stack {
            constructor(scope: Construct, id: string, props?: cdk.StackProps) {
              super(scope, id, props)

              const fn = new NodejsFunction(this, 'lambda', {
                entry: 'lambda/index.ts',
                handler: 'handler',
                runtime: lambda.Runtime.NODEJS_20_X,
              })
              fn.addFunctionUrl({
                authType: lambda.FunctionUrlAuthType.NONE,
              })
              new apigw.LambdaRestApi(this, 'myapi', {
                handler: fn,
              })
            }
          }
          ```

          Finally, run the command to deploy:

          ```sh
          cdk deploy
          ```
  Bun's SQL client:
    desc: Use Bun.SQL to connect to MySQL/MariaDB, SQLite, and PostgreSQL
    tags: [bun, sql]
    links: [https://bun.com/docs/runtime/sql, https://bun.com/blog/bun-v1.2.21#bun-sql-unified-sql-client]
    notes:
      - ts: | #typescript
          // index.ts
          // The same database library just works for the three most popular SQL databases, with zero dependencies.
          import { SQL } from "bun";

          // Connect to a MySQL or MariaDB database
          const sql = new SQL({
            adapter: "mysql",
            hostname: "127.0.0.1",
            username: "user",
            password: "password",
            database: "buns_burgers",
          });

          // Run a query
          const users = await sql`SELECT * FROM users;`.all();
          console.log(users);

          // or via url
          const mysql = new SQL("mysql://user:password@127.0.0.1:3306/buns_burgers");

          // Run a query
          const users = await mysql`SELECT * FROM users;`;
          console.log(users);
  Bun's SQLite support in Bun.SQL:
    desc: Bun's built-in SQLite in-memory or file-based database support
    tags: [bun, sql]
    links: [https://bun.com/blog/bun-v1.2.21#sqlite-in-bun-sql]
    notes:
      - ts: | #typescript
          // index.ts
          // https://bun.com/blog/bun-v1.2.21
          import { SQL } from "bun";

          // Create an in-memory SQLite database
          // It can be an in-memory database by passing ":memory:"
          // or a file-based database by providing a path like sqlite://path/to/db.sqlite.
          const db = new SQL(":memory:");

          // Create a table
          await db`CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT)`;

          // Insert multiple users
          const names = ["Alice", "Bob"];
          await db`INSERT INTO users (name) VALUES ${SQL.values(
            names.map((name) => [name]),
          )}`;

          // Query the users
          const users = await db`SELECT * FROM users ORDER BY name ASC`;
          console.log(users);
          // => [ { id: 1, name: 'Alice' }, { id: 2, name: 'Bob' } ]
  Bun.SQL - PostgreSQL:
    desc: PostgreSQL support in Bun.SQL - unified API with tagged templates, transactions, prepared statements, connection pooling, and TLS
    tags: [bun, sql, postgres]
    links: [https://bun.com/docs/runtime/sql#postgresql, https://bun.com/docs/runtime/sql#postgresql-auto-detection]
    notes:
      - ts: | #typescript
          // Features: Connection pooling (automatic)
          // Features: Prepared statements (automatic)
          // Features: BigInt support
          // Features: SASL Auth (SCRAM-SHA-256, MD5, Clear Text)
          // Features: TLS support
          // Features: Binary protocol support

          // index.ts
          import { sql, SQL } from "bun";

          // Default PostgreSQL connection (uses DATABASE_URL or postgres:// protocol)
          const users = await sql`
            SELECT * FROM users
            WHERE active = ${true}
            LIMIT ${10}
          `;

          // Explicit PostgreSQL connection
          const pg = new SQL("postgres://user:pass@localhost:5432/mydb");
          const pg2 = new SQL("postgresql://user:pass@localhost:5432/mydb");

          // Using options object
          const pg3 = new SQL({
            adapter: "postgresql",
            hostname: "localhost",
            port: 5432,
            database: "myapp",
            username: "dbuser",
            password: "secretpass",
          });

          // Features: Tagged templates (SQL injection protection)
          const user = await pg`SELECT * FROM users WHERE id = ${userId}`;

          // Features: Transactions
          await pg.begin(async tx => {
            await tx`INSERT INTO users (name) VALUES (${"Alice"})`;
            await tx`UPDATE accounts SET balance = balance - 100 WHERE user_id = ${userId}`;
          });

          // Features: Bulk inserts
          const newUsers = [
            { name: "Alice", email: "alice@example.com" },
            { name: "Bob", email: "bob@example.com" },
          ];
          await pg`INSERT INTO users ${pg(newUsers)}`;

          // Features: RETURNING clause (PostgreSQL-specific)
          const [newUser] = await pg`
            INSERT INTO users (name, email) 
            VALUES (${name}, ${email})
            RETURNING *
          `;
      - sh: | #shell
          # DATABASE ENVIRONMENT VARIABLES
          # PostgreSQL Auto-Detection | PostgreSQL is the default for connection strings that don't match MySQL or SQLite patterns:

          # PostgreSQL is detected for these patterns
          DATABASE_URL="postgres://user:pass@localhost:5432/mydb" bun run app.js
          DATABASE_URL="postgresql://user:pass@localhost:5432/mydb" bun run app.js

          # Or any URL that doesn't match MySQL or SQLite patterns
          DATABASE_URL="localhost:5432/mydb" bun run app.js
  Bun.SQL - MySQL:
    desc: MySQL/MariaDB support in Bun.SQL - unified API with tagged templates, transactions, prepared statements, connection pooling, utf8mb4 charset, and stored procedures
    tags: [bun, sql, mysql, mariadb]
    links: [https://bun.com/docs/runtime/sql#mysql, https://bun.com/docs/runtime/sql#mysql-auto-detection]
    notes:
      - ts: | #typescript
          // index.ts
          import { SQL } from "bun";

          // MySQL connection via URL
          const mysql = new SQL("mysql://user:password@localhost:3306/database");
          const mysql2 = new SQL("mysql2://user:password@localhost:3306/database");

          // Using options object
          const mysql3 = new SQL({
            adapter: "mysql",
            hostname: "localhost",
            port: 3306,
            database: "myapp",
            username: "dbuser",
            password: "secretpass",
          });

          // Features: Tagged templates (SQL injection protection)
          const users = await mysql`SELECT * FROM users WHERE id = ${userId}`;

          // Features: Transactions
          await mysql.begin(async tx => {
            await tx`INSERT INTO users (name) VALUES (${"Alice"})`;
            await tx`UPDATE accounts SET balance = balance - 100 WHERE user_id = ${userId}`;
          });

          // Features: Bulk inserts
          const newUsers = [
            { name: "Alice", email: "alice@example.com" },
            { name: "Bob", email: "bob@example.com" },
          ];
          await mysql`INSERT INTO users ${mysql(newUsers)}`;

          // Features: Get insert ID (MySQL-specific)
          const result = await mysql`INSERT INTO users (name) VALUES (${"Alice"})`;
          console.log(result.lastInsertRowid); // LAST_INSERT_ID()

          // Features: Affected rows
          const updated = await mysql`UPDATE users SET active = ${false} WHERE age < ${18}`;
          console.log(updated.affectedRows);

          // Features: Stored procedures with multiple result sets
          const results = await mysql`CALL GetUserStats(${userId}, @total_orders)`;
          const outParam = await mysql`SELECT @total_orders as total`;

          // Features: MySQL-specific functions
          const now = await mysql`SELECT NOW() as current_time`;
          const uuid = await mysql`SELECT UUID() as id`;

          // Features: Character set (utf8mb4 by default - full Unicode support)
          // Features: Prepared statements (automatic with statement caching)
          // Features: Binary protocol (better performance)
          // Features: Multiple result sets support
          // Features: Authentication plugins (mysql_native_password, caching_sha2_password, sha256_password)
          // Features: SSL/TLS connections
          // Features: Query pipelining
          // Features: Connection attributes (client info for monitoring)

          // Note: MySQL doesn't support RETURNING clause
          // Use result.lastInsertRowid or separate SELECT instead
      - sh: | #shell
          # DATABASE ENVIRONMENT VARIABLES
          # MySQL Auto-Detection | MySQL is automatically selected when the connection string matches these patterns

          // These all use MySQL automatically (no adapter needed)
          const sql1 = new SQL("mysql://user:pass@localhost/mydb");
          const sql2 = new SQL("mysql2://user:pass@localhost:3306/mydb");

          // Works with DATABASE_URL environment variable
          DATABASE_URL="mysql://user:pass@localhost/mydb" bun run app.js
          DATABASE_URL="mysql2://user:pass@localhost:3306/mydb" bun run app.js
  Bun.SQL - SQLite:
    desc: SQLite support in Bun.SQL - unified API with tagged templates, transactions, in-memory or file-based databases, and strict mode
    tags: [bun, sql, sqlite]
    links: [https://bun.com/docs/runtime/sql#sqlite, https://bun.com/docs/runtime/sql#sqlite-auto-detection]
    notes:
      - ts: | #typescript
          // index.ts
          import { SQL } from "bun";

          // In-memory database
          const memory = new SQL(":memory:");
          const memory2 = new SQL("sqlite://:memory:");

          // File-based database
          const db = new SQL("sqlite://myapp.db");
          const db2 = new SQL("file://path/to/database.db");

          // Using options object
          const db3 = new SQL({
            adapter: "sqlite",
            filename: "./data/app.db",
            readonly: false,    // Open in read-only mode
            create: true,       // Create database if it doesn't exist
            readwrite: true,    // Open for reading and writing
            strict: true,       // Enable strict mode
            safeIntegers: false, // Use JavaScript numbers for integers
          });

          // For simple filenames, specify adapter explicitly
          const db4 = new SQL("myapp.db", { adapter: "sqlite" });

          // Features: Tagged templates (SQL injection protection)
          const users = await db`SELECT * FROM users WHERE id = ${userId}`;

          // Features: Transactions
          await db.begin(async tx => {
            await tx`INSERT INTO users (name) VALUES (${"Alice"})`;
            await tx`UPDATE accounts SET balance = balance - 100 WHERE user_id = ${userId}`;
          });

          // Features: Bulk inserts with SQL.values()
          const names = ["Alice", "Bob"];
          await db`INSERT INTO users (name) VALUES ${SQL.values(
            names.map((name) => [name]),
          )}`;

          // Features: Query parameters in URL
          // ?mode=ro  → readonly: true
          // ?mode=rw  → readonly: false, create: false
          // ?mode=rwc → readonly: false, create: true (default)
          const readOnly = new SQL("sqlite://data.db?mode=ro");

          // Features: Relative and absolute paths
          const relative = new SQL("sqlite://./local.db");
          const absolute = new SQL("sqlite:///absolute/path.db");

          // Features: Unix socket connections (via file://)
          // Features: Strict mode (type checking)
          // Features: Safe integers option
      - sh: | #shell
          # DATABASE ENVIRONMENT VARIABLES
          # SQLite Auto-Detection | SQLite is automatically selected when the connection string matches these patterns

          // These all use SQLite automatically (no adapter needed)
          const sql1 = new SQL(":memory:");
          const sql2 = new SQL("sqlite://app.db");
          const sql3 = new SQL("file://./database.db");

          // Works with DATABASE_URL environment variable
          DATABASE_URL=":memory:" bun run app.js
          DATABASE_URL="sqlite://path/to/myapp.db" bun run app.js
          DATABASE_URL="file://path/to/db.sqlite" bun run app.js
  Bun.secrets - native secrets manager for CLI tools:
    desc: Bun.secrets securely stores and retrieves credentials using the operating system's native credential storage - Keychain Services on macOS, libsecret (GNOME Keyring, KWallet) on Linux, and the Windows Credential Manager.
    tags: [bun, secrets]
    links: [https://bun.com/docs/runtime/secrets, https://bun.com/blog/bun-v1.2.21#bun-secrets-native-secrets-manager-for-cli-tools]
    notes:
      - ts: | #typescript
          // index.ts
          // Store a GitHub token securely
          await Bun.secrets.set({
            service: "my-cli-tool",
            name: "github-token",
            value: "ghp_xxxxxxxxxxxxxxxxxxxx",
          });

          // Update to new password
          await Bun.secrets.set({
            service: "my-cli-tool",
            name: "github-token",
            value: "new-ghp_xxxxxxxxxxxxxxxxxxxx",
          });          

          // Retrieve it when needed
          const token = await Bun.secrets.get({
            service: "my-cli-tool",
            name: "github-token",
          });

          // Or delete it later
          await Bun.secrets.delete({
            service: "my-cli-tool",
            name: "github-token",
          });
  Bun's native YAML support:
    desc: Import YAML files as you would a JavaScript module. Bun will parse the file and export its contents as the default export
    tags: [bun, yaml]
    links: [https://bun.com/docs/runtime/yaml, https://bun.com/blog/bun-v1.2.21#native-yaml-support]
    notes:
      - yaml: | #yaml
          # bun.yaml
          bun: 'BUN!'
          bunny: { 'bunny': 'BUNNY!' }
          BuN:
            - javascript runtime
            - package manager
            - test runner
            - and a BUNdler, all-in-one
          BUN:
            '8un': !!str |
              bun
              bun!
      - ts: | #typescript
          // index.ts
          import bun from './bun.yaml'

          // parse YAML strings at runtime
          const BuN = Bun.YAML.parse(`
            bun: "bun"
          `)

          console.log(bun)
          console.log(BuN.bun)
