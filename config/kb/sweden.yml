  Grupp 1, Första konjugationen (42 %):
    desc: Group 1, First Conjugation (42%)
    tags:
      - sv
      - grammar
      - verbs
    notes:
      - md: |

          ## Group 1, First Conjugation (42%)

          - **Group 1 verbs** are the most common in Swedish, making up 42% of all verbs.
          - They are characterized by the infinitive form ending in -a.
          - The present tense conjugation for these verbs is regular and follows a pattern.
          - Examples of Group 1 verbs include "att prata" (to talk), "att dansa" (to dance), and "att sjunga" (to sing).

          ## Conjugation Pattern

          - **Present Tense:** __(add `-r` to the stem of the verb)__
            - **Jag pratar** (I talk)
            - **Du pratar** (You talk)
            - **Han/Hon/De pratar** (He/She/They talk)
            - **Vi pratar** (We talk)
            - **Ni pratar** (You talk)
            - **De pratar** (They talk)

          - **Past Tense:** __(add `-de`` to the stem of the verb)__
            - **Jag pratade** (I talked)
            - **Du pratade** (You talked)
            - **Han/Hon/De pratade** (He/She/They talked)
            - **Vi pratade** (We talked)
            - **Ni pratade** (You talked)
            - **De pratade** (They talked)

          - **Future Tense:** __(add `kommer att` before the verb)__
            - **Jag kommer att prata** (I will talk)
            - **Du kommer att prata** (You will talk)
            - **Han/Hon/De kommer att prata** (He/She/They will talk)
            - **Vi kommer att prata** (We will talk)
            - **Ni kommer att prata** (You will talk)
            - **De kommer att prata** (They will talk)

          ## Summary

          - **Group 1 verbs** are the most common in Swedish, making up 42% of all verbs.
          - They are characterized by the infinitive form ending in -a.
          - The present tense conjugation for these verbs is regular and follows a pattern.
          - Examples of Group 1 verbs include "att prata" (to talk), "att dansa" (to dance), and "att sjunga" (to sing).
