  sin, sitt, sina (his, her, its):
    desc: Indicate possession or ownership (his, her, its).
    tags:
      - sv
      - grammar
      - pronouns
    notes:
      - md: |
          ## Possessive Pronouns

          Indicate possession or ownership of something by a singular informal "he," "she," or "it."

          ### Sin (singular / common): "his", "her", "its"

          | Swedish             | English             |
          | ------------------- | ------------------- |
          | Han tvättar sin bil | He washes his car   |
          | Hon älskar sin hund | She loves her dog   |
          | Det är sin bok      | It is its book      |

          ### Sitt (singular / neuter): "his", "her", "its"

          | Swedish               | English             |
          | --------------------- | ------------------- |
          | Han tvättar sitt hus  | He washes his house |
          | Hon älskar sitt barn  | She loves her child |
          | Det är sitt bord      | It is its table     |

          ### Sina (plural): "his", "her", "its"

          | Swedish                | English             |
          | ---------------------- | ------------------- |
          | Han tvättar sina bilar | He washes his cars |
          | Hon älskar sina hundar | She loves her dogs |
          | Det är sina böcker     | It is its books    |
