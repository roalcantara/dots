  Swedish Genders (En and Ett) Key differences from Portuguese Genders:
    tags:
      - sv
    desc: Swedish nouns are classified into two grammatical genders, "en" (common) and "ett" (neuter), which are distinct from the masculine and feminine genders in Brazilian Portuguese and do not correlate with biological or social gender
    notes:
      - md: |
          ## Explanation of `"En"` and `"Ett"`

          `"En"` and `"Ett"` are indefinite articles in Swedish, corresponding to "a/an" in English.

          They are used to indicate the grammatical gender of nouns in Swedish, which is divided into two categories: common gender (en) and neuter gender (ett).

          ### Using "En" and "Ett" for English-Speaking Brazilians

          For Brazilian Portuguese speakers who are fluent in English, understanding `"En"` and `"Ett"` can be akin to understanding how `"a"` and `"an"` are used in English.

          While `"a"` and `"an"` in English are chosen based on the following sound, in Swedish, `"en"` and `"ett"` are selected based on the grammatical gender of the noun.

          To use them correctly, it's important to memorize the gender of each noun as you learn it.

          For example, `"en bok"` (a book) and `"ett hus"` (a house).

          There are patterns, such as many nouns ending in -a typically being common gender (en), but there are also exceptions.

          ### Learning Strategy

          - The best way to become familiar with `"en"` and `"ett"` is through practice and exposure. This might involve reading, speaking, or listening exercises in Swedish.
          - Don't worry too much about mistakes in the beginning. Gender usage will become more natural with practice.
          - Using textbooks, language apps, or courses can provide structured exercises to master the use of `"en"` and `"ett"`.
      - md: |
          In Swedish, the concept of grammatical gender is represented by the articles `"en"` (common gender) and `"ett"` (neuter gender).

          These articles are not related to biological or social gender (male or female) but are purely grammatical classifications.

          ## Swedish Genders ("En" and "Ett"):

          In Swedish, nouns are divided into two grammatical genders: common (en) and neuter (ett).
          The choice between `"en"` and `"ett"` depends on the grammatical gender of the noun.

          For example, `"en bok"` (a book) uses `"en"` because `"bok"` (book) is a common gender noun, and `"ett hus"` (a house) uses `"ett"` since `"hus"` (house) is a neuter gender noun.
          This classification is a grammatical feature and does not imply masculinity or femininity.

          ## Brazilian Portuguese Genders:

          In Brazilian Portuguese, nouns are classified as masculine or feminine.

          This gender classification often influences the form of adjectives and articles used with the nouns.
          For example, `"o livro"` (the book, masculine) and `"a casa"` (the house, feminine).
          The gender in Portuguese is often indicated by the ending of the word (like `"-o"` for masculine and `"-a"` for feminine) and affects the agreement in the sentence.

          ## Summary

          While Brazilian Portuguese uses gender to differentiate between masculine and feminine nouns, affecting other parts of speech in agreement, Swedish uses grammatical gender as a classification system for its nouns, and this system does not correlate with biological or social gender.

          Instead, it's a part of the language's structure and influences which article (`"en"` or `"ett"`) is used with each noun.
      - md: |
          ## Rules

          - En (Comum)
            - Regra Básica: Usado para a maioria dos substantivos. Substantivos terminados em -a geralmente são comuns.
            - Exemplos:
              - `en hund` - um cachorro
              - `en flicka` - uma menina
            - Notas: A maioria dos substantivos em sueco usa `"en"`. Há exceções para esta regra.

          - Ett (Neutro)
            - Regra Básica: Comum para palavras de uma sílaba e muitos substantivos que se referem a coisas sem vida.
            - Exemplos:
              - `ett hus` - uma casa
              - `ett bord` - uma mesa
            - Notas: Há exceções, tanto para palavras de uma sílaba quanto para substantivos que se referem a coisas sem vida.
      - md: |
          ## Examples

          | Sueco (Substantivo) | Português (Tradução) | Gênero (En/Ett) |
          |---------------------|----------------------|-----------------|
          | en bok              | um livro             | En              |
          | ett hus             | uma casa             | Ett             |
          | en bil              | um carro             | En              |
          | ett träd            | uma árvore           | Ett             |
