  ibland eller alltid:
    desc: Sometimes or Always
    tags:
      - sv
    notes:
      - md: |
          ## Explanation

          - **Ibland:** Sometimes
          - **Alltid:** Always

          ## Usage

          - **Ibland:** Used to indicate that something happens occasionally or at irregular intervals.
            - Example: "Jag går ibland till gymmet" (I sometimes go to the gym)
          - **Alltid:** Used to indicate that something happens without exception or regularly.
            - Example: "Jag alltid äter frukost" (I always eat breakfast)

          ## Summary

          - **Ibland:** Sometimes
          - **Alltid:** Always
  Best cities for tech job opportunities:
    desc: There are several places where you might find good opportunities, especially given the increasing trend of remote work and tech companies expanding their presence beyond major cities.
    notes:
      - md: |

          There are several places where you might find good opportunities, especially given the increasing trend of remote work and tech companies expanding their presence beyond major cities.

          ## Stockholm

          | Weather | Population |
          |---------|------------|
          | 1°C - 20°C | 975,904 |

          - Capital of Sweden and the largest city in the country
          - Home to several tech companies and startups, like Spotify, Klarna, & King
          - Vibrant tech scene and is known for its high quality of life

          ## Gothenburg

          | Weather | Population |
          |---------|------------|
          | 2°C - 20°C | 590,580 |

          - Second-largest city and has a growing tech industry.
          - It is home to companies such as Volvo and Ericsson, and has a strong focus on sustainability and innovation.

          ## Malmö

          | Weather | Population |
          |---------|------------|
          | 2°C - 20°C | 316,588 |

          - A city in southern Sweden that has seen significant growth in its tech sector.
          - It is home to several startups and has a strong focus on sustainability and green technology.

          ## Uppsala

          | Weather | Population |
          |---------|------------|
          | 1°C - 20°C | 233,839 |

          - While not exactly countryside, Uppsala is smaller and quieter compared to Stockholm but still hosts a range of tech companies and startups.
          - Its proximity to Stockholm also makes it an attractive location for companies looking to expand outside the capital.

          ## Linköping

          | Weather | Population |
          |---------|------------|
          | 1°C - 20°C | 158,841 |

          - Linköping is known for its strong tech industry, strong focus on software and IT, thanks to its technical university and the presence of several tech companies.

          ## Norrköping

          | Weather | Population |
          |---------|------------|
          | 1°C - 20°C | 137,326 |

          - This city is emerging as a tech hub, with a growing number of tech companies and startups.

          ## Västerås

          | Weather | Population |
          |---------|------------|
          | 1°C - 20°C | 150,000 |

          - Known for its engineering and technology focus, home to several tech companies and has a robust job market for software developers.
          - It offers a balance between city and countryside living.

          ## Lund

          | Weather | Population |
          |---------|------------|
          | 2°C - 20°C | 91,940 |

          - While it's more of a university town, it is known for its high-tech industry and research-driven companies.
          - It's smaller and quieter than major cities but has a vibrant tech scene.

          ## Karlstad

          | Weather | Population |
          |---------|------------|
          | 1°C - 20°C | 61,685 |

          - This city is emerging as a tech hub, with several IT companies based there.
          - It's located in a scenic region and offers a more relaxed lifestyle compared to the big cities.
