  har (ingen | inget | inga):
    desc: har (ingen | inget | inga) is used to express negation, specifically when talking about not having something or someone.
    tags:
      - sv
      - grammar
    notes:
      - md: |
          The choice between "ingen," "inget," and "inga" depends on the gender (common or neuter) and number (singular or plural) of the noun they negate.

          ## Usage

          ### Ingen
          Used before singular common gender (en-words) nouns to mean "no" or "not any."

          Example: `"Jag har ingen bil."` (I have no car.)

          ### Inget
          Used before singular neuter gender (ett-words) nouns to mean "no" or "not any."
          Example: "Jag har inget hus." (I have no house.)

          ### Inga
          Used before plural nouns, regardless of their gender, to mean "no" or "not any."
          Example: "Jag har inga pengar." (I have no money.)

          It's worth noting that "har" is the present tense form of "to have" in English.

          The negation (ingen/inget/inga) directly follows "har" to negate the possession of the noun that follows.

          Unlike "nej," which is used to directly negate or answer questions, "ingen," "inget," and "inga" are used to specify what it is that one does not have.
