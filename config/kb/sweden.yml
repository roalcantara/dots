      - md: |
          # Forming Questions in Swedish

          - Questions are formed by changing the word order or by adding a question word at the beginning of the sentence.

          - The word order in questions is often subject-verb-object (SVO)

          Here are some common question words in Swedish

          - **Vad:** What
          - **Var:** Where
          - **Vem:** Who
          - **Hur:** How
          - **Varför:** Why
          - **När:** When
          - **Vilken:** Which
          - **Vilka:** Which
          - **Vilket:** Which

