  AWS CLI v2 - TL; DR:
    desc: Quick Reference, Configuration and Best Practices
    tags:
      - aws
      - cli
    links:
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-quickstart.html
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-profiles.html
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-role.html
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-sourcing-external.html
    notes:
      - md: |
          ## OVERVIEW

          - **PURPOSES**
            - Allows managing AWS services directly from the terminal.
            - Providing full programmatic access to all AWS APIs.

          - **USAGES**:
            - Automate infrastructure tasks (creating/managing EC2, S3, Lambda, etc.)
            - Deploy applications via CloudFormation/SAM
            - Script batch operations
            - Integrate with CI/CD pipelines
            - And interact with AWS during local development

          - **KEY FEATURES**:
            - Multiple credential profiles for different AWS accounts/roles
            - Environment-based configuration
            - Support for temporary STS credentials
            - Cross-account role assumption
            - LocalStack integration for local testing
            - And output formatting (JSON, table, text) for easy parsing in scripts.

          ## 0. QUICK SUMMARY

          | **PROFILE TYPE**     | **USE CASE**                | **CREDENTIALS**          | **DURATION**   | **SECURITY** |
          | -------------------- | --------------------------- | ------------------------ | -------------- | ------------ |
          | Default              | Fallback, rarely used       | Long-term                | ∞              | ⚠️ Low        |
          | Environment-specific | Dev/Staging/Prod separation | Long-term                | ∞              | ✅ Medium     |
          | Role-based           | Admin/Read-only/Deploy      | Long-term or assumed     | ∞ or temporary | ✅ High       |
          | SSO                  | Team/Organization users     | Temporary (auto-rotated) | ~1h            | ✅✅ Highest   |
          | Cross-account        | Multi-account access        | Assumed from source      | Temporary      | ✅ High       |
          | LocalStack           | Local development           | Test credentials         | ∞              | N/A          |

          ## 1. INSTALLATION

          ```bash
          ### Homebrew
          brew install awscli
          aws --version

          ### Flox (Recommended for Cross-Platform)
          flox search awscli
          flox install awscli

          ### Direct Download to macOS
          curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg"
          sudo installer -pkg AWSCLIV2.pkg -target /

          ### Direct Download to Linux
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip && sudo ./aws/install
          ```

          ## 2. CREDENTIALS & AUTHENTICATION

          ### CONCEPTS

          > 💡 Three Ways to Provide Credentials (Priority Order)

          1. **ENVIRONMENT VARIABLES** (highest priority)

            ```bash
            # allows to quickly set credentials for one-off or CI/CD use
            export AWS_ACCESS_KEY_ID="AKIAIOSFODNN7EXAMPLE"
            export AWS_SECRET_ACCESS_KEY="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
            export AWS_SESSION_TOKEN="optional-token-for-temporary"  # Optional
            export AWS_DEFAULT_REGION="us-east-1"
            export AWS_PROFILE=production  # Set default profile
            ```

          2. **NAMED PROFILES** (in `~/.aws/credentials` and `~/.aws/config`)

            ```bash
            # allows to switch between multiple accounts/roles
            aws s3 ls --profile production
            export AWS_PROFILE=production  # Set default profile
            ```

          3. **EC2 INSTANCE ROLE / ECS TASK ROLE** (in AWS)

            - Best practice for workloads running on AWS
            - Automatic credential provider on instances
            - No credentials stored locally

          ### CREDENTIAL TYPES

          1. **IAM Users:**

            - **PURPOSE:** Long-term credentials for programmatic access
            - **GOOD FOR:** Cross-account access, scheduled jobs
            - **WARNING:** Use ONLY for CI/CD or non-interactive services
            - **CHARACTERISTICS:**
              - Access Key ID + Secret Access Key
              - Never rotate automatically

          2. **Security Token Service (STS):**

            - **PURPOSE:** Temporary credentials, short-term credentials for temporary access
            - **GOOD FOR:** Human CLI use, temporary access, assumed roles
            - **CHARACTERISTICS:**
              - Access Key + Secret Key + Session Token
              - Expire after set time (default 1 hour, max 12 hours)

          3. **IAM Roles:**

            - **PURPOSE**: Assign permissions to AWS resources without long-term credentials
            - **GOOD FOR:** EC2, Lambda, ECS tasks
            - **BEST PRACTICES:** for AWS-running workloads
            - **CHARACTERISTICS:**
              - Credentials automatically rotated
              - No credentials to manage locally

          ## 3. CREDENTIALS FILES

          1. **STRUCTURE**

              ```tree
              ~/.aws/
              ├── credentials         # Access keys (NEVER commit to git)
              ├── config              # Region, output format, profile settings
              ├── .aws_cache/         # Token cache for temporary creds
              └── sso/                # SSO session cache
              ```

          2. **~/.aws/credentials**

            > 💡 Used to authenticate requests.

            - **PURPOSE:** LONG FORM (Recommended Pattern)
            - **GOOD FOR:** IAM User access keys for multiple accounts
            - **PROFILES:**
              - A profile is a named set of credentials.
                - Contains `aws_access_key_id` and `aws_secret_access_key`.
                - It is used to authenticate AWS CLI and SDK requests in a specific profile. EX:
                  - A profile `[production]` contains credentials for the production AWS account.
                  - A profile `[development]` contains credentials for the development AWS account.
            - **DEFAULT PROFILE:**
              - Contains default access keys.
              - Fallback profile used when no `--profile` is specified.
            - **CROSS-ACCOUNT ROLES:**
              - Profiles can also define roles to assume using `role_arn` and `source_profile`.
              - Allows access to resources in another AWS account.
            - **MFA SUPPORT:**
              - Profiles can include `mfa_serial` to require MFA for access.
            - **COMMON USAGES EXAMPLES:**
              - Use `aws configure --profile development` to set up credentials for the development profile.
              - Run `aws s3 ls --profile production` to list S3 buckets in the production account.
              - Run `aws sts assume-role --role-arn arn:aws:iam::123456789012:role/RoleName --profile development` to assume a role in another account.
            - **EXAMPLE:**

                  ```ini
                  # Default profile (used if no --profile specified)
                  [default]
                  aws_access_key_id = AKIA...
                  aws_secret_access_key = wJalr...

                  # Production account
                  [production]
                  aws_access_key_id = AKIA...
                  aws_secret_access_key = wJalr...

                  # Development account
                  [development]
                  aws_access_key_id = AKIA...
                  aws_secret_access_key = wJalr...

                  # Cross-account role assumption (uses credentials from another profile)
                  [cross-account-admin]
                  role_arn = arn:aws:iam::123456789012:role/CrossAccountAdminRole
                  source_profile = production
                  external_id = optional-external-id

                  # MFA-protected profile
                  [mfa-profile]
                  aws_access_key_id = AKIA...
                  aws_secret_access_key = wJalr...
                  # MFA serial number below
                  ```

          3. **~/.aws/config**

            > 💡 Used to configure REGION & FORMAT SETTINGS.

            - **PURPOSE:** LONG FORM (Recommended Pattern)
            - **GOOD FOR:** Setting region, output format, and profile-specific settings
            - **PROFILES:**
              - It also uses profiles; Each profile is a named set of credentials.
                  - Contains `region`, `output`, and other settings.
                  - Allowed outputs are `json`, `table`, or `text`.
                  - It is used to configure AWS CLI and SDK requests in a specific profile. EX:
                    - A profile `[profile production]` contains region/output for the production AWS account.
                    - A profile `[profile development]` contains region/output for the development AWS account.
            - **DEFAULT PROFILE:**
              - Contains default access keys.
              - Fallback profile used when no `--profile` is specified.
            - **COMMON USAGES EXAMPLES:**
              - Use `aws configure set region us-east-1 --profile production` to set the region for the production profile.
              - Use `aws configure set output json --profile development` to set the output format for the development profile.
              - Run `aws s3 ls --profile production` to list S3 buckets in the production account.
            - **EXAMPLE:**

                ```ini
                # Default profile config
                [default]
                region = us-east-1
                output = json

                # Production profile
                [profile production]
                region = us-east-1
                output = json
                # Optional: use session token from STS
                # sso_start_url = https://my-sso-portal.awsapps.com/start
                # sso_region = us-east-1
                # sso_account_id = 123456789012
                # sso_role_name = ProductionAdmin

                # Development profile
                [profile development]
                region = us-west-2
                output = table  # Easier to read in CLI

                # Cross-account profile
                [profile cross-account-admin]
                role_arn = arn:aws:iam::123456789012:role/AdminRole
                source_profile = production
                mfa_serial = arn:aws:iam::987654321098:mfa/your-user

                # LocalStack (development/testing)
                [profile localstack]
                region = us-east-1
                endpoint_url = http://localhost:4566
                output = json
                ```

          ## 4. PROFILE ORGANIZATION STRATEGY

          1. By Environment

              > 💡 Separate profiles for different environments (dev, staging, prod).
              >
              > **GOOD FOR:** Allows easy switching and isolation of credentials.

              ```ini
              [default]
              # Rarely used, safe defaults

              [development]
              region = us-west-2
              aws_access_key_id = ...

              [staging]
              region = us-east-1
              aws_access_key_id = ...

              [production]
              region = us-east-1
              aws_access_key_id = ...
              ```

          2. By Account & Role

              > 💡 Separate profiles for different AWS accounts and roles.
              >
              > **GOOD FOR:** Managing cross-account access and role-based permissions.

              ```ini
              [org-dev]
              aws_access_key_id = ...

              [org-prod]
              aws_access_key_id = ...

              [org-prod-admin]
              role_arn = arn:aws:iam::ACCOUNT_ID:role/AdminRole
              source_profile = org-prod
              ```

          3. By Workload Type

              > 💡 Separate profiles for different workloads (e.g., Lambda deployment, local development, CI/CD).
              >
              > **GOOD FOR:** Isolating credentials based on usage context.

              ```ini
              [lambda-deploy]
              # Service-specific credentials with minimal permissions

              [localstack-dev]
              endpoint_url = http://localhost:4566

              [ci-cd]
              # IAM user with only necessary permissions
              ```

          4. Naming Convention Best Practice

              > 💡 Use clear, consistent naming conventions for profiles
              >
              > **GOOD FOR:** Easy identification and management of profiles by environment and role.
              >
              > **EXAMPLE:** `<environment>-<role>`
              >
              > - consorciei-dev
              > - consorciei-prod-admin
              > - consorciei-prod-readonly
              > - localstack-testing

          ## 5. COMMON COMMANDS & USE CASES

          1. List Available Profiles

              ```bash
              grep '\[profile' ~/.aws/config | sed 's/\[profile \(.*\)\]/\1/'
              ```

          2. Use Specific Profile

              ```bash
              # One-off command with profile
              aws s3 ls --profile production

              # Set profile for session
              export AWS_PROFILE=production
              aws ec2 describe-instances

              # Unset
              unset AWS_PROFILE
              ```

          3. Check Current Credentials

              ```bash
              # Shows which profile/identity is active
              aws sts get-caller-identity --profile production

              # Output:
              # {
              #     "UserId": "AIDAI...",
              #     "Account": "123456789012",
              #     "Arn": "arn:aws:iam::123456789012:user/your-user"
              # }
              ```

          4. Get Temporary STS Credentials

              ```bash
              # Useful for Docker, CI/CD, temporary access
              aws sts assume-role \
                --role-arn arn:aws:iam::ACCOUNT:role/RoleName \
                --role-session-name my-session \
                --profile source-profile

              # With MFA
              aws sts get-session-token \
                --serial-number arn:aws:iam::123456789012:mfa/your-user \
                --token-code 123456 \
                --duration-seconds 3600 \
                --profile default
              ```

          5. Assume Cross-Account Role

              ```bash
              # ~/.aws/config already has this set up? Just use:
              aws s3 ls --profile cross-account-admin

              # Or manually:
              aws sts assume-role \
                --role-arn arn:aws:iam::ANOTHER_ACCOUNT:role/RoleName \
                --role-session-name cross-account-session \
                --profile production
              ```

          6. Common Service Operations

              ```bash
              # S3
              aws s3 ls --profile production
              aws s3 cp file.txt s3://bucket/path/ --profile production

              # Lambda
              aws lambda list-functions --profile production

              # CloudFormation / SAM
              aws cloudformation describe-stacks --profile production
              sam deploy --profile production

              # LocalStack (development)
              aws s3 ls --profile localstack
              aws dynamodb list-tables --profile localstack
              ```

          ## 6. SECURITY BEST PRACTICES

          1. ✅ DO's

              - Store `~/.aws/credentials` file with **restricted permissions**

                  ```bash
                  chmod 600 ~/.aws/credentials
                  ```

              - Use **environment variables for CI/CD** (not files in git)

                  ```bash
                  # GitHub Actions, GitLab CI, etc - use secrets, not commits
                  export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
                  ```

              - Use **temporary credentials (STS)** whenever possible

                  ```bash
                  aws sts get-session-token  # Good for humans
                  ```

              - Use **SSO** for human users (AWS SSO or third-party)

                  ```bash
                  aws sso login --profile production
                  ```

              - Use **MFA** for production profiles

                  ```ini
                  [profile production]
                  mfa_serial = arn:aws:iam::123456789012:mfa/your-user
                  ```

              - Use **IAM Roles for EC2/Lambda/ECS** (no credentials needed)

              - Use **principle of least privilege** - assign minimal IAM permissions per profile/role

              - Exclude credentials from git

                  ```bash
                  # .gitignore
                  .aws/credentials
                  .aws/config  # if sensitive
                  ~/.aws/**
                  ```

          2. ❌ DON'Ts

            - Commit credentials to git (ever)
            - Use root AWS account for daily work
            - Share long-term credentials between team members (use roles instead)
            - Store credentials in environment without expiration
            - Use `[default]` for sensitive operations (make it a fallback)
            - Leave `region` unspecified (always be explicit)

          ## 7. ENCRYPTION & SECRET MANAGEMENT

          1. Encrypt Credentials with SOPS + AGE

              ```bash
              # Install sops and age
              brew install sops age

              # Generate age key
              age-keygen -o ~/.age/key.txt

              # Encrypt ~/.aws/credentials
              sops -e -i --age $(cat ~/.age/key.txt | grep "# public key:" | cut -d' ' -f4) ~/.aws/credentials

              # Git pre-commit hook to auto-encrypt
              # (see: https://github.com/mozilla/sops)
              ```

          2. Using Encrypted Files in CI/CD

              ```bash
              # Decrypt before use
              export SOPS_AGE_KEY_FILE=~/.age/key.txt

              sops -d ~/.aws/credentials > /tmp/credentials
              export AWS_SHARED_CREDENTIALS_FILE=/tmp/credentials
              ```

          ## 8. DOCKER & CONTAINER BEST PRACTICES

          1. Pass Credentials to Container

              ```dockerfile
              # NOT recommended - don't hard-code
              # ENV AWS_ACCESS_KEY_ID=...

              # GOOD - mount credentials file
              # docker run -v ~/.aws/credentials:/root/.aws/credentials:ro
              ```

          2. Docker Run with AWS Credentials

              ```bash
              docker run \
                -v ~/.aws/credentials:/root/.aws/credentials:ro \
                -v ~/.aws/config:/root/.aws/config:ro \
                -e AWS_PROFILE=production \
                my-aws-app:latest

              # Or mount and reference config
              docker run \
                -v ~/.aws:/home/appuser/.aws:ro \
                -e AWS_PROFILE=localstack \
                my-app:latest
              ```

          3. Docker Compose mount volumes

              ```yaml
              services:
                app:
                  image: my-app:latest
                  volumes:
                    - ~/.aws/credentials:/home/appuser/.aws/credentials:ro
                    - ~/.aws/config:/home/appuser/.aws/config:ro
                  environment:
                    AWS_PROFILE: production
                    AWS_REGION: us-east-1
                  networks:
                    - local
              ```

          4. LocalStack Development set environments

              ```yaml
              services:
                localstack:
                  image: localstack/localstack
                  ports:
                    - "4566:4566"  # LocalStack API
                  environment:
                    SERVICES: s3,lambda,dynamodb,sqs

                app:
                  image: my-app:latest
                  environment:
                    AWS_ENDPOINT_URL: http://localstack:4566
                    AWS_PROFILE: localstack
                  depends_on:
                    - localstack
              ```

          ## 9. TROUBLESHOOTING

          1. When `"Unable to locate credentials"`

              ```bash
              # Check environment variables
              echo $AWS_ACCESS_KEY_ID
              echo $AWS_SECRET_ACCESS_KEY

              # Check credentials file exists and is readable
              ls -la ~/.aws/credentials

              # Check profile exists
              grep "\[production\]" ~/.aws/credentials
              ```

          2. When `"The request must contain the parameter Authorization"`

              ```bash
              # Credentials exist but are incorrect - verify:
              aws sts get-caller-identity --profile production
              # Should return Account ID, User ARN

              # If it fails, recheck credentials
              ```

          3. When `"Profile not found"`

              ```bash
              # Check config file
              cat ~/.aws/config | grep "profile production"

              # Syntax issue? Config must have "profile" prefix
              # [profile production]  <- CORRECT
              # [production]          <- WRONG (only in credentials)
              ```

          4. When `"Wrong region being used"`

              ```bash
              # Check order of precedence:
              echo $AWS_DEFAULT_REGION
              echo $AWS_REGION
              grep "region" ~/.aws/config

              # Explicit override
              aws s3 ls --region us-west-2
              ```

          ## 10. QUICK REFERENCE

            ```bash
            # Configuration
            aws configure                                     # Interactive setup
            aws configure --profile production                # Setup specific profile
            aws configure list                                # Show current config
            aws configure list --profile production           # Show profile config

            # Identity & Account Info
            aws sts get-caller-identity                       # Current user/role
            aws iam get-user                                  # Current IAM user info
            aws iam list-access-keys --profile production     # List access keys

            # Credentials
            aws sts get-session-token --duration-seconds 3600
            aws sts assume-role --role-arn arn:... --role-session-name session-name

            # Profile Management
            grep '\[profile' ~/.aws/config | sed 's/.*\[\(.*\)\].*/\1/'
            export AWS_PROFILE=production
            unset AWS_PROFILE

            # Environment Variable Override
            AWS_PROFILE=prod AWS_REGION=us-west-2 aws s3 ls

            # LocalStack (Local Testing)
            aws s3 ls --endpoint-url http://localhost:4566 --profile localstack
            ```
