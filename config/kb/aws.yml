commands:
  cat ~/.aws/config:
    desc: Used by the AWS command-line interface (CLI) to store configuration settings for AWS profiles
    tags:
      - aws
      - config
      - profile
  cat ~/.aws/credentials:
    desc: Used by the AWS Command Line Interface (CLI) and SDKs to store the access key and secret access key for authenticating AWS API requests.
    tags:
      - aws
      - config
      - profile
  aws configure list:
    desc: List the current configuration values for AWS CLI
    tags:
      - aws
      - config
      - profile
  aws configure --profile <profile_name>:
    desc: Configure the AWS CLI with a named profile
    tags:
      - aws
      - config
      - profile
  aws configure list-profiles:
    desc: List the available profiles configured in the AWS CLI. It requires ACCESS_KEY_ID, SECRET_ACCESS_KEY and REGION
    tags:
      - aws
      - config
      - profile
  aws iam list-policies:
    desc: List all IAM policies in the current account
    tags:
      - aws
      - iam
      - policies
  aws iam list-policies --output yaml:
    desc: List all IAM policies in the current account in YAML format
    tags:
      - aws
      - iam
      - policies
  aws lambda list-functions --output yaml:
    desc: List all Lambda functions in the current account in YAML format
    tags:
      - aws
      - aws_lambda
      - functions
  aws secretsmanager list-secrets:
    desc: List all secrets in the current account
    tags:
      - aws
      - secrets
  aws secretsmanager list-secrets --max-results 10:
    desc: List the first 10 secrets in the current account
    tags:
      - aws
      - secrets
  aws secretsmanager list-secrets --filters Key=tag-key,Values=example-key:
    desc: List all secrets in the current account that have a tag with the key 'example-key'
    tags:
      - aws
      - secrets
  aws secretsmanager list-secrets --query "SecretList[*].Name":
    desc: List the names of all secrets in the current account
    tags:
      - aws
      - secrets

  # AWS CLOUDFORMATION
  aws cloudformation create-stack --stack-name my-stack --template-body file://template.yaml --parameters ParameterKey=Param1,ParameterValue=Value1:
    desc: Create a CloudFormation stack named 'my-stack' with the specified template and parameters
    tags: [aws, cloudformation]
  aws cloudformation list-stacks:
    desc: List all CloudFormation stacks in the current account
    tags: [aws, cloudformation]
  aws cloudformation update-stack --stack-name my-stack --template-body file://template.yaml --parameters ParameterKey=Param1,ParameterValue=Value1:
    desc: Update the CloudFormation stack named 'my-stack' with a new template and parameters
    tags: [aws, cloudformation]
  aws cloudformation describe-stacks --stack-name my-stack:
    desc: Describe the CloudFormation stack named 'my-stack'
    tags: [aws, cloudformation]
  aws cloudformation describe-stacks --stack-name my-lambda-stack --query 'Stacks[0].Outputs':
    desc: Describe the outputs of the CloudFormation stack named 'my-lambda-stack'
    tags: [aws, cloudformation]
  aws cloudformation cancel-update-stack --stack-name my-lambda-stack:
    desc: Cancel an ongoing update for the CloudFormation stack named 'my-lambda-stack'
    tags: [aws, cloudformation]
  aws cloudformation delete-stack --stack-name my-stack:
    desc: Delete the CloudFormation stack named 'my-stack'
    tags: [aws, cloudformation]

  # AWS S3
  aws s3 mb s3://my-deployment-bucket:
    desc: Create a new S3 bucket named 'my-deployment-bucket'
    tags: [aws, s3]

  # AWS SAM
  brew tap aws/tap && brew install aws-sam-cli:
    desc: Install AWS SAM CLI using Homebrew
    tags: [aws, sam, serverless]
    notes:
      - md: | #markdown
          | **COMMAND**           | **WHAT IT DOES**                  |
          | --------------------- | --------------------------------- |
          | `sam init`            | Create new SAM project            |
          | `sam validate`        | Check template syntax             |
          | `sam build`           | Build & package code              |
          | `sam local start-api` | Test HTTP locally                 |
          | `sam local invoke`    | Test function directly            |
          | `sam deploy --guided` | Deploy (first time, saves config) |
          | `sam deploy`          | Deploy (quick, uses saved config) |
          | `sam logs`            | View Lambda logs                  |
          | `sam delete`          | Delete everything                 |
      - yaml: | #yaml
          # template.yaml - Common Structure
          AWSTemplateFormatVersion: '2010-09-09'
          Transform: AWS::Serverless-2010-05-13

          Description: My Lambda Application

          Globals:
            Function:
              Runtime: nodejs20.x
              Timeout: 30
              MemorySize: 256
              Environment:
                Variables:
                  ENVIRONMENT: dev

          Parameters:
            Environment:
              Type: String
              Default: dev
              AllowedValues: [dev, staging, prod]

          Resources:
            MyLambdaFunction:
              Type: AWS::Serverless::Function
              Properties:
                FunctionName: !Sub 'my-function-${Environment}'
                CodeUri: src/
                Handler: handlers/index.handler
                Runtime: nodejs20.x
                Timeout: 30
                MemorySize: 256
                Environment:
                  Variables:
                    LOG_LEVEL: info
                Events:
                  ApiEvent:
                    Type: Api
                    Properties:
                      RestApiId: !Ref MyApi
                      Path: /hello
                      Method: GET
                  ScheduledEvent:
                    Type: Schedule
                    Properties:
                      Schedule: 'rate(5 minutes)'

            MyApi:
              Type: AWS::Serverless::Api
              Properties:
                StageName: !Ref Environment
                Auth:
                  DefaultAuthorizer: MyCognitoAuth
                Cors:
                  AllowMethods: "'GET,POST,PUT,DELETE'"
                  AllowHeaders: "'Content-Type'"
                  AllowOrigin: "'*'"

          Outputs:
            ApiEndpoint:
              Description: API Gateway endpoint
              Value: !Sub 'https://${MyApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
            FunctionArn:
              Description: Lambda function ARN
              Value: !GetAtt MyLambdaFunction.Arn
      - toml: | #toml
          # Created by: sam deploy --guided

          version = 0.1

          [default]
          [default.deploy]
          [default.deploy.parameters]
          stack_name = "my-lambda-stack"
          s3_bucket = "my-deployment-bucket"
          s3_prefix = "lambda/my-app"
          region = "us-east-1"
          confirm_changeset = true
          capabilities = "CAPABILITY_IAM"
          parameter_overrides = "Environment=dev"

          [prod]
          [prod.deploy]
          [prod.deploy.parameters]
          stack_name = "my-lambda-stack-prod"
          s3_bucket = "my-deployment-bucket"
          s3_prefix = "lambda/my-app-prod"
          region = "us-east-1"
          parameter_overrides = "Environment=prod"
      - yaml: | #yaml
          name: Deploy Lambda
          on:
            push:
              branches: [main]
          jobs:
            deploy:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v3
                - uses: aws-actions/configure-aws-credentials@v2
                  with:
                    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                    aws-region: us-east-1

                - name: Build
                  run: sam build

                - name: Deploy
                  run: sam deploy --no-confirm-changeset
  flox install aws-sam-cli:
    desc: Install AWS SAM CLI using Flox
    tags: [aws, sam, serverless]
  aws sts get-caller-identity:
    desc: Verify AWS credentials by retrieving the caller identity
    tags: [aws, sam, serverless]
    notes:
      - sh: | #shell
          #!/bin/bash

          # ============================================
          # INSTALLATION
          # ============================================

          # Via Homebrew
          brew tap aws/tap && brew install aws-sam-cli

          # Configure AWS credentials
          aws configure

          # For LocalStack (local development)
          export AWS_ACCESS_KEY_ID="test"
          export AWS_SECRET_ACCESS_KEY="test"
          export AWS_ENDPOINT_URL="http://localhost:4566"
  sam init:
    desc: Initialize a new AWS SAM project
    tags: [aws, sam, serverless]
  sam init --runtime nodejs20.x --name my-lambda-app:
    desc: Create a new AWS SAM project with Node.js 20.x runtime
    tags: [aws, sam, serverless]
  sam init --runtime python3.14 --dependency-manager pip --app-template hello-world --name aws-powertools-demo:
    desc: Initialize a new AWS SAM project with Python 3.14 runtime and pip dependency manager
    tags: [aws, sam, serverless]
  sam build:
    desc: Build the AWS SAM project
    tags: [aws, sam, serverless]
  sam build --cached:
    desc: Use cached dependencies
    tags: [aws, sam, serverless]
  sam build --parallel:
    desc: Parallel build (faster)
    tags: [aws, sam, serverless]
  sam build --use-container:
    desc: Build in Docker (for exact environment)
    tags: [aws, sam, serverless]
  sam local generate-event dynamodb put-record:
    desc: Generate a DynamoDB put-record event for local testing
    tags: [aws, sam, serverless]
  sam local start-api:
    desc: Start a local API Gateway to test Lambda functions locally with hot-reloading
    tags: [aws, sam, serverless]
    notes:
      - sh: | #shell
          #!/bin/bash

          sam build
          sam local start-api
          curl http://localhost:3000/hello
  sam local start-api --env-vars env.json:
    desc: Start a local API Gateway to test Lambda functions locally with hot-reloading overriding environment variables defined in your templates
    tags: [aws, sam, serverless]
    links:
      - https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-using-start-api.html
      - https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-cli-command-reference-sam-local-start-api.html
    notes:
      - jsonc: | #jsonc
          // env.json        
          // Use Parameters to override environment variables globally to all resources
          {
              "Parameters": {
                  "TABLE_NAME": "localtable",
                  "BUCKET_NAME": "amzn-s3-demo-bucket",
                  "STAGE": "dev"
              }
          }
      - jsonc: | #jsonc
          // env.json
          // Use objects for each resource to override environment variables per function
          {
              "MyFunction1": {
                  "TABLE_NAME": "localtable",
                  "BUCKET_NAME": "amzn-s3-demo-bucket",
              },
              "MyFunction2": {
                  "TABLE_NAME": "localtable",
                  "STAGE": "dev"
              }
          }
      - sh: | #shell
          #!/bin/bash

          sam build
          sam local start-api --env-vars env.json
          curl http://localhost:3000/hello
  sam local start-api --port 8080:
    desc: Start a local API Gateway on port 8080 to test Lambda functions locally
    tags: [aws, sam, serverless]
  sam local start-lambda:
    desc: Builds Lambda functions in a local Docker container and outputs the local address to your HTTP server endpoint
    tags: [aws, sam, serverless]
    links:
      - https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-local-start-lambda.html
      - https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-cli-command-reference-sam-local-start-lambda.html
    notes:
      - sh: | #shell
          #!/bin/bash

          sam build
          sam local start-lambda
          aws lambda invoke --function-name "HelloWorldFunction" --endpoint-url "http://127.0.0.1:3001" --no-verify-ssl out.txt
  sam local invoke --event events/event.json:
    desc: Invoke the Lambda function 'MyFunction' locally with a test event
    tags: [aws, sam, serverless]
  sam local invoke HelloWorldFunction --event '{"key":"value"}':
    desc: Invoke the Lambda function 'HelloWorldFunction' locally with a JSON payload
    tags: [aws, sam, serverless]
  sam local invoke --debug:
    desc: Invoke the Lambda function 'MyFunction' locally with debug output
    tags: [aws, sam, serverless]
  sam validate --template template.yaml:
    desc: Validate the AWS SAM template file 'template.yaml'
    tags: [aws, sam, serverless]
  sam package --template-file template.yaml --s3-bucket my-bucket --output-template-file packaged.yaml:
    desc: Package the AWS SAM application and upload artifacts to the specified S3 bucket
    tags: [aws, sam, serverless]
  sam package --template-file template.yaml --s3-bucket my-deployment-bucket --s3-prefix "lambda/auth-service" --output-template-file packaged.yaml:
    desc: Package the AWS SAM application with a specific S3 prefix (to organize files) for the Lambda function artifacts
    tags: [aws, sam, serverless]
  sam deploy --guided:
    desc: Deploy the AWS SAM application with guided prompts and save settings to samconfig.toml
    tags: [aws, sam, serverless]
  sam deploy:
    desc: Deploy the AWS SAM application using settings to samconfig.toml
    tags: [aws, sam, serverless]
  sam deploy --config-env prod:
    desc: Deploy the AWS SAM application using the 'prod' environment settings from samconfig.toml
    tags: [aws, sam, serverless]
  sam deploy --no-confirm-changeset:
    desc: Deploy the AWS SAM application without confirmation prompts
    tags: [aws, sam, serverless]
  sam deploy --config-env prod --no-confirm-changeset:
    desc: Deploy the AWS SAM application using the 'prod' environment settings from samconfig.toml without confirmation prompts
    tags: [aws, sam, serverless]
  sam deploy --parameter-overrides ParameterKey=Environment,ParameterValue=production:
    desc: Deploy the AWS SAM application with parameter overrides (e.g., setting Environment to production)
    tags: [aws, sam, serverless]
  sam logs -n MyFunction --stack-name my-stack --tail:
    desc: View real-time logs for the Lambda function 'MyFunction' in the stack 'my-stack'
    tags: [aws, sam, serverless]
  sam logs -n HelloWorldFunction --stack-name my-lambda-stack --start-time 10m ago:
    desc: View logs for the Lambda function 'HelloWorldFunction' in the stack 'my-lambda-stack' starting from 10 minutes ago
    tags: [aws, sam, serverless]
  sam logs --filter "ERROR":
    desc: View logs for the Lambda function 'MyFunction' filtered by the keyword "ERROR"
    tags: [aws, sam, serverless]
  sam delete --stack-name my-stack:
    desc: Delete the AWS SAM application stack 'my-stack'
    tags: [aws, sam, serverless]

  # LocalStack
  brew install localstack/tap/localstack-cli:
    desc: Install the LocalStack CLI using Homebrew
    tags:
      - aws
      - localstack
  localstack start:
    desc: Start the LocalStack services
    tags:
      - aws
      - localstack

  # LocalStack Useful Endpoints
  # https://docs.localstack.cloud/aws/integrations/aws-native-tools/aws-cli/
  curlie 'http://localhost.localstack.cloud:4566/_localstack/init' | jq:
    desc: Initialize LocalStack services (or curl -s 'http://localhost:4566/_localstack/init' | jq)
    tags: [aws, sam, serverless, localstack]
    links: [https://docs.localstack.cloud/aws/capabilities/config/initialization-hooks/#status-endpoint]
  curlie 'http://localhost.localstack.cloud:4566/_localstack/init/ready' | jq:
    desc: Check if LocalStack services are ready (or curl -s 'http://localhost:4566/_localstack/init/ready' | jq)
    tags: [aws, sam, serverless, localstack]
    links: [https://docs.localstack.cloud/aws/capabilities/config/initialization-hooks/#querying-stages]
  curlie 'http://localhost.localstack.cloud:4566/_localstack/init/ready' | jq .completed:
    desc: check whether a given stage has been completed (or curl -s 'http://localhost:4566/_localstack/init/ready' | jq .completed)
    tags: [aws, sam, serverless, localstack]
    links: [https://docs.localstack.cloud/aws/capabilities/config/initialization-hooks/#querying-stages]
  curlie 'http://localhost.localstack.cloud:4566/_localstack/health' | jq:
    desc: Check the health status of LocalStack services (or curl 'http://localhost:4566/_localstack/health' | jq)
    tags: [aws, sam, serverless, localstack]
    links: [https://youtu.be/DFS3CnB-Z0k]
  curlie 'http://localhost.localstack.cloud:4566/_localstack/diagnose':
    desc: Diagnose LocalStack issues and get a report (or curl 'http://localhost:4566/_localstack/diagnose')
    tags: [aws, sam, serverless, localstack]
    links: [https://youtu.be/DFS3CnB-Z0k]
  curlie 'http://localhost.localstack.cloud:4566/_aws/lambda/runtimes?filter=supported':
    desc: List supported Lambda runtimes in LocalStack (or curl 'http://localhost:4566/_aws/lambda/runtimes?filter=supported')
    tags: [aws, sam, serverless, localstack]
    links: [https://youtu.be/DFS3CnB-Z0k]
  curlie 'http://localhost.localstack.cloud:4566/_aws/sqs/messages':
    desc: List SQS queue messages without side effects in LocalStack (or curl 'http://localhost:4566/_aws/sqs/messages')
    tags: [aws, sam, serverless, localstack]
    links: [https://youtu.be/DFS3CnB-Z0k]

  # LocalStack & AWS-CLI/Lambda
  aws --profile localstack lambda list-functions:
