cheats:
  AWS SAM CLI - Initialize, Build, and Test a Serverless Application:
    desc: A step-by-step guide to initialize, build, and test a serverless application using the AWS SAM CLI.
    tags:
      - aws
      - sam
      - serverless
      - cli
    links:
      - https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-init.html
      - https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-getting-started-hello-world.html
      - https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-test-and-debug.html
    notes:
      - sh: |
          #!/bin/bash

          # ============================================
          # INSTALLATION
          # ============================================

          # Via Homebrew
          brew tap aws/tap && brew install aws-sam-cli

          # Via Flox
          flox install aws-sam-cli

          # Verify
          sam --version


          # ============================================
          # ONE-TIME SETUP
          # ============================================

          # Configure AWS credentials
          aws configure

          # For LocalStack (local development)
          export AWS_ACCESS_KEY_ID="test"
          export AWS_SECRET_ACCESS_KEY="test"
          export AWS_ENDPOINT_URL="http://localhost:4566"

          # Verify credentials work
          aws sts get-caller-identity


          # ============================================
          # COMMON WORKFLOWS
          # ============================================

          # 1. CREATE NEW PROJECT
          sam init --runtime nodejs20.x --name my-lambda-app

          # 2. BUILD
          sam build

          # 3. TEST LOCALLY (HTTP)
          sam local start-api
          # Then: curl http://localhost:3000/hello

          # 4. TEST LOCALLY (Invoke function directly)
          sam local invoke MyFunction -e events/event.json

          # 5. DEPLOY (First time - interactive)
          sam deploy --guided
          # Saves settings to samconfig.toml

          # 6. DEPLOY (Subsequent times - quick)
          sam deploy

          # 7. VIEW LOGS (real-time)
          sam logs -n MyFunction --stack-name my-stack --tail

          # 8. UPDATE CODE AND REDEPLOY
          # 1. Edit code
          # 2. sam build
          # 3. sam deploy

          # 9. DELETE EVERYTHING
          sam delete --stack-name my-stack


          # ============================================
          # DEPLOY TO LOCALSTACK (Local AWS)
          # ============================================

          sam build

          sam deploy \
            --stack-name my-stack-local \
            --endpoint-url http://localhost:4566 \
            --region us-east-1 \
            --no-confirm-changeset


          # ============================================
          # VALIDATE & PACKAGE
          # ============================================

          # Check if template is valid
          sam validate --template template.yaml

          # Package to S3 (if manual deployment)
          sam package \
            --template-file template.yaml \
            --s3-bucket my-bucket \
            --output-template-file packaged.yaml


          # ============================================
          # USEFUL FLAGS
          # ============================================

          sam local invoke --debug              # Debug mode
          sam local start-api --port 8080       # Custom port
          sam deploy --no-confirm-changeset     # Skip confirmation
          sam logs --tail                        # Follow logs
          sam logs --filter "ERROR"              # Filter logs


          # ============================================
          # REAL-WORLD WORKFLOW
          # ============================================

          # 1. Create
          sam init --runtime nodejs20.x --name flux-auth

          # 2. Code (edit src/handlers/index.ts)
          vim src/handlers/index.ts

          # 3. Test locally
          sam build
          sam local start-api
          # Test in another terminal: curl http://localhost:3000/hello

          # 4. Deploy to AWS
          sam deploy --guided

          # 5. Monitor
          sam logs -n MyFunction --stack-name my-stack --tail

          # 6. Update? Go to step 2, then: sam build && sam deploy


          # ============================================
          # DAILY ONE-LINERS
          # ============================================

          sam build                                    # Build only
          sam local start-api                          # Test HTTP locally
          sam local invoke MyFunction                  # Test function directly
          sam deploy                                   # Deploy (uses samconfig.toml)
          sam logs -n MyFunction --tail                # Watch logs
          sam delete --stack-name my-stack             # Clean up
          ```

          ---

          ## 📋 Template Structure (What SAM Expects)
          ```
          project/
          ├── template.yaml              # ← SAM configuration (required)
          ├── samconfig.toml             # ← Settings (auto-created)
          ├── src/
          │   └── handlers/
          │       └── index.ts           # Lambda code
          ├── tests/
          │   └── unit.spec.ts
          └── package.json
  AWS CLI v1 > OVERVIEW:
    desc: Quick Reference, Configuration and Best Practices (v1 LocalStack-Compatible)
    tags:
      - aws
      - cli
      - v1
      - localstack
    links:
      - https://docs.localstack.cloud/aws/integrations/aws-native-tools/aws-cli/
      - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-quickstart.html
      - https://docs.aws.amazon.com/cli/latest/reference/
    notes:
      - md: |
          ## OVERVIEW

          - **WHY v1?** AWS CLI v2 is NOT supported by LocalStack. Use v1 for local development with LocalStack.

          - **PURPOSES**
            - Manage AWS services directly from terminal (or LocalStack locally)
            - Full programmatic access to AWS APIs
            - Automate infrastructure and deployment workflows

          - **KEY USAGES**:
            - Automate infrastructure tasks (EC2, S3, Lambda, etc.)
            - Deploy applications via CloudFormation/SAM
            - Script batch operations and automation
            - LocalStack integration for local/testing environments
            - CI/CD pipeline integration

          - **KEY FEATURES**:
            - Multiple credential profiles for different AWS accounts/roles
            - Environment-based configuration
            - Temporary STS credentials support
            - Cross-account role assumption
            - LocalStack endpoint override for local testing
            - Output formatting (JSON, table, text) for scripting
  AWS CLI v1 > INSTALLATION:
    desc: Install AWS CLI v1 (LocalStack-compatible)
    tags:
      - aws
      - cli
      - v1
      - install
    notes:
      - md: |
          ## INSTALLATION

          ### ⚠️ Use v1 (Not v2) for LocalStack

          ```bash
          ### Python PIP (Recommended for v1)
          # Install pip first (macOS)
          python3 -m pip install --user awscli

          # Or via Homebrew (older v1 version)
          brew install awscli@1  # Or 'aws-cli' if v1

          ### Verify Installation
          aws --version
          # Should show: aws-cli/1.x.x Python/3.x ...

          ### Flox (Recommended for Cross-Platform)
          # In your flox.nix or environment
          packages = [ "awscli" ];  # Flox provides v1 by default

          ### Virtual Environment (Best Practice)
          python3 -m venv aws-cli-env
          source aws-cli-env/bin/activate
          pip install awscli
          ```

          > ⚠️ **IMPORTANT:** AWS CLI v2 is NOT supported by LocalStack. Ensure you're using v1.x.x
  AWS CLI v1 > CREDENTIAL RESOLUTION PRECEDENCE:
    desc: Order of credential resolution (explicit precedence)
    tags:
      - aws
      - cli
      - credentials
      - precedence
    notes:
      - md: |
          ## CREDENTIAL RESOLUTION PRECEDENCE

          > 💡 AWS CLI checks credentials in this exact order. First match wins.

          1. **ENVIRONMENT VARIABLES** (highest priority)
             - `AWS_ACCESS_KEY_ID` + `AWS_SECRET_ACCESS_KEY` + `AWS_SESSION_TOKEN`
             - Used immediately, ignoring all other sources

          2. **AWS_SHARED_CREDENTIALS_FILE** (custom location)
             - `export AWS_SHARED_CREDENTIALS_FILE=/path/to/credentials`
             - Overrides default `~/.aws/credentials`

          3. **DEFAULT PROFILE** from `~/.aws/credentials`
             - `[default]` section if no `--profile` or `AWS_PROFILE` specified

          4. **NAMED PROFILE** from `~/.aws/credentials` + `~/.aws/config`
             - Specified via `--profile` flag or `AWS_PROFILE` env var

          5. **IAM ROLES** (EC2/ECS/Lambda)
             - Auto-detected if running on AWS infrastructure
             - No credentials needed locally

          ### Decision Tree: Which Authentication Method?

          ```
          Are you a human developer?
          ├─ YES: Prefer AWS SSO (aws sso login) or temporary tokens
          └─ NO: Is code running on AWS (EC2/Lambda/ECS)?
             ├─ YES: Use IAM roles (no credentials needed)
             └─ NO: Is it CI/CD pipeline?
                ├─ YES: Use environment variables or aws-vault
                └─ NO: Use named profiles (~/.aws/credentials)
          ```
  AWS CLI v1 > CREDENTIALS > AUTHENTICATION CONCEPTS:
    desc: Three main ways to authenticate with AWS CLI v1
    tags:
      - aws
      - cli
      - credentials
      - auth
    notes:
      - md: |
          ## CREDENTIALS & AUTHENTICATION

          ### 1. ENVIRONMENT VARIABLES (Highest Priority)

          ```bash
          export AWS_ACCESS_KEY_ID="AKIAIOSFODNN7EXAMPLE"
          export AWS_SECRET_ACCESS_KEY="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          export AWS_SESSION_TOKEN="optional-token"  # For temporary credentials
          export AWS_DEFAULT_REGION="us-east-1"
          export AWS_PROFILE=production  # Override default profile
          export AWS_OUTPUT=json  # Override output format
          ```

          **GOOD FOR:** CI/CD, Docker, temporary access, one-off commands

          ### 2. AWS_SHARED_CREDENTIALS_FILE (Custom Credentials Location)

          ```bash
          # Use non-standard credentials file location
          export AWS_SHARED_CREDENTIALS_FILE=/path/to/custom/credentials
          export AWS_CONFIG_FILE=/path/to/custom/config

          # Now AWS CLI reads from these files instead of ~/.aws/
          aws s3 ls --profile production
          ```

          **GOOD FOR:** Multiple AWS accounts, isolated environments, testing

          ### 3. NAMED PROFILES (`~/.aws/credentials` + `~/.aws/config`)

          ```bash
          # Switch between profiles easily
          aws s3 ls --profile production
          aws s3 ls --profile development

          # Set default for session
          export AWS_PROFILE=production
          aws ec2 describe-instances  # Uses production profile

          # Unset
          unset AWS_PROFILE
          ```

          **GOOD FOR:** Local development, multiple account management

          ### 4. EC2 INSTANCE ROLE / ECS TASK ROLE (Best for AWS Workloads)

          - Automatic credential provider on AWS infrastructure
          - Credentials automatically rotated
          - No credentials stored locally
          - **BEST PRACTICE** for Lambda, ECS, EC2 tasks
  AWS CLI v1 > CREDENTIAL TYPES:
    desc: Types of AWS credentials and their use cases
    tags:
      - aws
      - cli
      - credentials
      - type
    notes:
      - md: |
          ## CREDENTIAL TYPES

          ### 1. IAM USER CREDENTIALS (Long-term)

          - **TYPE:** Access Key ID + Secret Access Key
          - **DURATION:** Infinite (never expire)
          - **ROTATION:** Manual
          - **GOOD FOR:** CI/CD, scheduled jobs, service accounts
          - **WARNING:** ⚠️ Use ONLY for non-interactive/automated services
          - **SECURITY:** ⚠️ Medium (requires key rotation discipline)

          ```ini
          [cicd-user]
          aws_access_key_id = AKIA...
          aws_secret_access_key = wJalr...
          ```

          ### 2. SECURITY TOKEN SERVICE (STS) - Temporary Credentials

          - **TYPE:** Access Key + Secret Key + Session Token
          - **DURATION:** Default 1 hour, max 12 hours
          - **ROTATION:** Automatic expiration
          - **GOOD FOR:** Human CLI use, temporary access, role assumption
          - **SECURITY:** ✅ High (automatic expiration)

          ```bash
          aws sts get-session-token \
            --serial-number arn:aws:iam::123456789012:mfa/user \
            --token-code 123456 \
            --duration-seconds 3600
          ```

          ### 3. IAM ROLES (Best Practice for AWS Workloads)

          - **TYPE:** No credentials file needed
          - **DURATION:** Auto-rotated
          - **ROTATION:** Automatic by AWS
          - **GOOD FOR:** EC2, Lambda, ECS tasks
          - **SECURITY:** ✅✅ Highest (automatic management)

          ```bash
          # Running on EC2 instance - credentials automatic
          aws s3 ls  # Just works!
          ```
  AWS CLI v1 > CREDENTIALS FILES:
    desc: Detailed explanation of ~/.aws/credentials and ~/.aws/config files
    tags:
      - aws
      - cli
      - credentials
      - file
    notes:
      - md: |
          ## CREDENTIALS FILES STRUCTURE

          ```tree
          ~/.aws/
          ├── credentials         # ⚠️ SENSITIVE - Access keys (NEVER commit to git)
          ├── config              # Region, output format, profile settings
          ├── .aws_cache/         # Token cache for temporary credentials
          └── sso/                # AWS SSO session cache
          ```

          ### ~/.aws/credentials - AUTHENTICATION

          > **PURPOSE:** Store long-term and temporary credentials

          ```ini
          # Default profile (fallback if no --profile specified)
          [default]
          aws_access_key_id = AKIA...
          aws_secret_access_key = wJalr...

          # Production account
          [production]
          aws_access_key_id = AKIA...
          aws_secret_access_key = wJalr...

          # Development account
          [development]
          aws_access_key_id = AKIA...
          aws_secret_access_key = wJalr...

          # Cross-account role assumption
          [cross-account-admin]
          role_arn = arn:aws:iam::123456789012:role/CrossAccountAdminRole
          source_profile = production
          external_id = optional-external-id

          # MFA-protected profile
          [mfa-profile]
          aws_access_key_id = AKIA...
          aws_secret_access_key = wJalr...
          mfa_serial = arn:aws:iam::123456789012:mfa/your-user
          ```

          ### ~/.aws/config - CONFIGURATION

          > **PURPOSE:** Store region, output format, and profile-specific settings

          ```ini
          # Default profile
          [default]
          region = us-east-1
          output = json

          # Production profile (note: "profile" prefix required here)
          [profile production]
          region = us-east-1
          output = json

          # Development profile
          [profile development]
          region = us-west-2
          output = table

          # Cross-account profile with MFA
          [profile cross-account-admin]
          role_arn = arn:aws:iam::123456789012:role/AdminRole
          source_profile = production
          mfa_serial = arn:aws:iam::987654321098:mfa/your-user

          # LocalStack (local development/testing)
          [profile localstack]
          region = us-east-1
          output = json
          ```

          > ⚠️ **KEY DIFFERENCE:** In `config`, profiles use `[profile name]` syntax. In `credentials`, use `[name]` only.
  AWS CLI v1 > PROFILE ORGANIZATION STRATEGIES:
    desc: Best practices for organizing AWS CLI credential profiles
    tags:
      - aws
      - cli
      - organization
      - profile
    notes:
      - md: |
          ## PROFILE ORGANIZATION STRATEGIES

          ### 1. By Environment

          > **GOOD FOR:** Separating dev, staging, production credentials

          ```ini
          [development]
          region = us-west-2
          aws_access_key_id = ...

          [staging]
          region = us-east-1
          aws_access_key_id = ...

          [production]
          region = us-east-1
          aws_access_key_id = ...
          ```

          ### 2. By Account & Role

          > **GOOD FOR:** Multi-account and cross-account access management

          ```ini
          [org-dev]
          aws_access_key_id = ...

          [org-prod]
          aws_access_key_id = ...

          [org-prod-admin]
          role_arn = arn:aws:iam::ACCOUNT_ID:role/AdminRole
          source_profile = org-prod
          ```

          ### 3. By Workload Type

          > **GOOD FOR:** Isolating credentials by context (Lambda, CI/CD, LocalStack)

          ```ini
          [lambda-deploy]
          aws_access_key_id = ...

          [localstack-dev]
          # No real credentials needed for LocalStack

          [cicd]
          aws_access_key_id = ...
          ```

          ### 4. Naming Convention (Recommended)

          > **FORMAT:** `<org>-<environment>-<role>`

          ```
          consorciei-dev
          consorciei-dev-readonly
          consorciei-prod
          consorciei-prod-admin
          consorciei-prod-readonly
          localstack-testing
          ci-cd-deploy
          ```

          ### 5. Consorciei Migration Example

          > Tailored to your Nx monorepo migration project

          ```ini
          [consorciei-dev]
          region = us-east-1
          aws_access_key_id = ...

          [consorciei-staging]
          region = us-east-1
          aws_access_key_id = ...

          [consorciei-prod]
          region = us-east-1
          aws_access_key_id = ...

          [consorciei-prod-admin]
          role_arn = arn:aws:iam::PROD_ACCOUNT:role/AdminRole
          source_profile = consorciei-prod
          mfa_serial = arn:aws:iam::PROD_ACCOUNT:mfa/your-user

          [localstack-migration-test]
          region = us-east-1
          endpoint_url = http://localhost:4566
          ```
  AWS CLI v1 > COMMON COMMANDS & USE CASES:
    desc: Common AWS CLI v1 commands and practical use cases
    tags:
      - aws
      - cli
      - cmd
      - examples
    notes:
      - md: |
          ## COMMON COMMANDS & USE CASES

          ### List Available Profiles

          ```bash
          grep '\[profile' ~/.aws/config | sed 's/\[profile \(.*\)\]/\1/'
          # Or for credentials file:
          grep '^\[' ~/.aws/credentials | tr -d '[]'
          ```

          ### Use Specific Profile

          ```bash
          # One-off command
          aws s3 ls --profile production

          # Set for entire session
          export AWS_PROFILE=production
          aws ec2 describe-instances
          unset AWS_PROFILE

          # Environment variable override
          AWS_PROFILE=staging AWS_REGION=us-west-2 aws s3 ls
          ```

          ### Check Current Identity

          ```bash
          # See who/what you're authenticated as
          aws sts get-caller-identity --profile production

          # Output:
          # {
          #     "UserId": "AIDAI...",
          #     "Account": "123456789012",
          #     "Arn": "arn:aws:iam::123456789012:user/your-user"
          # }
          ```

          ### Get Temporary STS Credentials

          ```bash
          # Without MFA
          aws sts get-session-token \
            --duration-seconds 3600 \
            --profile default

          # With MFA
          aws sts get-session-token \
            --serial-number arn:aws:iam::123456789012:mfa/your-user \
            --token-code 123456 \
            --duration-seconds 3600 \
            --profile default
          ```

          ### Assume Cross-Account Role

          ```bash
          # Simple (if configured in ~/.aws/config)
          aws s3 ls --profile cross-account-admin

          # Manual
          aws sts assume-role \
            --role-arn arn:aws:iam::ANOTHER_ACCOUNT:role/RoleName \
            --role-session-name cross-account-session \
            --profile production
          ```

          ### Output Filtering with --query (Practical Examples)

          ```bash
          # Get only instance IDs
          aws ec2 describe-instances \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text

          # Get S3 bucket names only
          aws s3api list-buckets \
            --query 'Buckets[].Name' \
            --output text

          # Filter by tag (e.g., Environment=production)
          aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=production" \
            --query 'Reservations[].Instances[].{ID:InstanceId,Type:InstanceType}' \
            --output table

          # Get Lambda function ARNs
          aws lambda list-functions \
            --query 'Functions[].FunctionArn' \
            --output text
          ```

          ### Common Service Operations

          ```bash
          # S3
          aws s3 ls --profile production
          aws s3 cp file.txt s3://bucket/path/ --profile production

          # Lambda
          aws lambda list-functions --profile production
          aws lambda invoke --function-name my-func /tmp/output.json

          # CloudFormation / SAM
          aws cloudformation describe-stacks --profile production
          sam deploy --profile production

          # LocalStack (development)
          aws s3 ls --profile localstack
          aws dynamodb list-tables --profile localstack
          ```

          ### Configuration Info

          ```bash
          aws configure list                           # Show current config
          aws configure list --profile production      # Show specific profile
          aws configure get region --profile production # Get specific value
          ```
  AWS CLI v1 > ALTERNATIVE TOOLS:
    desc: aws-vault for enhanced credential management
    tags:
      - aws
      - aws_vault
      - cli
      - tool
    notes:
      - md: |
          ## ALTERNATIVE TOOLS FOR CREDENTIAL MANAGEMENT

          ### aws-vault (Recommended for Enhanced Security)

          > Encrypts credentials and keeps them in memory (not disk), with MFA support

          ```bash
          # Install
          brew install aws-vault

          # Add credentials (encrypted storage)
          aws-vault add production

          # Execute command with profile (MFA prompted if configured)
          aws-vault exec production -- aws s3 ls

          # Use for Docker
          aws-vault exec production -- docker run \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            my-app:latest

          # List stored profiles
          aws-vault list

          # Manage profiles
          aws-vault rm production  # Remove
          aws-vault login production  # Open AWS console
          ```

          **ADVANTAGES:**
          - Credentials encrypted at rest
          - Keeps credentials in memory, not files
          - Built-in MFA support
          - Session token management
          - AWS console login support

          **WHEN TO USE:**
          - Local development with multiple profiles
          - High-security environments
          - MFA requirement workflows
  AWS CLI v1 > SECURITY BEST PRACTICES:
    desc: Security best practices for AWS CLI credentials
    tags:
      - aws
      - bp
      - cli
      - security
    notes:
      - md: |
          ## SECURITY BEST PRACTICES

          ### ✅ DO's

          - **Restrict credentials file permissions**

              ```bash
              chmod 600 ~/.aws/credentials
              chmod 644 ~/.aws/config
              ```

          - **Use environment variables in CI/CD** (never commit credentials)

              ```bash
              # GitHub Actions / GitLab CI - use secrets
              export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
              export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
              ```

          - **Use temporary credentials (STS)** whenever possible

              ```bash
              aws sts get-session-token  # Better than static keys
              ```

          - **Use aws-vault** for local credential storage

              ```bash
              aws-vault add production  # Encrypts credentials
              aws-vault exec production -- aws s3 ls
              ```

          - **Enable MFA for production profiles**

              ```ini
              [profile production]
              mfa_serial = arn:aws:iam::123456789012:mfa/your-user
              ```

          - **Use IAM Roles for EC2/Lambda/ECS** (no credentials needed)

          - **Follow principle of least privilege**
            - Create IAM policies with minimal required permissions
            - One profile per role (readonly, deploy, admin)

          - **Exclude credentials from git**

              ```bash
              # .gitignore
              .aws/credentials
              .aws/config  # if sensitive
              ~/.aws/**
              .env
              *.key
              ```

          - **Rotate long-term credentials regularly**
            - Set calendar reminders for quarterly rotation
            - Use STS tokens for preference

          ### ❌ DON'Ts

          - Commit credentials to git (ever)
          - Use root AWS account for daily work
          - Share credentials between team members (use roles instead)
          - Store credentials in plaintext environment files
          - Use `[default]` for sensitive operations
          - Leave region unspecified (always explicit)
          - Hard-code credentials in application code
          - Use IAM user credentials for services (use roles)
          - Store credentials in Docker images
  AWS CLI v1 > ENCRYPTION & SECRET MANAGEMENT:
    desc: Encrypt and manage AWS credentials securely with SOPS + AGE
    tags:
      - aws
      - cli
      - encryption
      - sops
      - age
    notes:
      - md: |
          ## ENCRYPTION & SECRET MANAGEMENT

          ### SOPS + AGE (Recommended Approach)

          ```bash
          # Install sops and age
          brew install sops age

          # Generate age key
          age-keygen -o ~/.age/key.txt

          # Encrypt credentials file
          SOPS_AGE_RECIPIENTS=$(cat ~/.age/key.txt | grep "# public key:" | cut -d' ' -f4)
          sops -e -i --age $SOPS_AGE_RECIPIENTS ~/.aws/credentials

          # Git-safe: pre-commit hook to auto-encrypt
          # Create .git/hooks/pre-commit to encrypt on every commit
          ```

          ### Using Encrypted Credentials in Scripts

          ```bash
          # Decrypt and use temporarily
          export SOPS_AGE_KEY_FILE=~/.age/key.txt
          export AWS_SHARED_CREDENTIALS_FILE=$(mktemp)

          sops -d ~/.aws/credentials > $AWS_SHARED_CREDENTIALS_FILE
          aws s3 ls --profile production
          rm $AWS_SHARED_CREDENTIALS_FILE
          ```

          ### Using in Docker

          ```bash
          docker run \
            -v ~/.age/key.txt:/root/.age/key.txt:ro \
            -e SOPS_AGE_KEY_FILE=/root/.age/key.txt \
            my-app:latest

          # Inside container: decrypt at startup
          sops -d ~/.aws/credentials > /tmp/credentials
          export AWS_SHARED_CREDENTIALS_FILE=/tmp/credentials
          ```

          ### CI/CD Integration

          ```bash
          # GitHub Actions
          - name: Decrypt AWS credentials
            env:
              SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
            run: |
              sops -d .aws/credentials > /tmp/credentials
              export AWS_SHARED_CREDENTIALS_FILE=/tmp/credentials
          ```
  AWS CLI v1 > DOCKER & LOCALSTACK:
    desc: Using AWS CLI v1 with Docker and LocalStack
    tags:
      - aws
      - cli
      - docker
      - localstack
    notes:
      - md: |
          ## DOCKER & LOCALSTACK INTEGRATION

          ### Pass AWS Credentials to Docker

          ```bash
          # Mount credentials file (read-only)
          docker run \
            -v ~/.aws/credentials:/root/.aws/credentials:ro \
            -v ~/.aws/config:/root/.aws/config:ro \
            -e AWS_PROFILE=production \
            my-aws-app:latest

          # Or mount entire ~/.aws directory
          docker run \
            -v ~/.aws:/home/appuser/.aws:ro \
            -e AWS_PROFILE=production \
            my-app:latest
          ```

          ### Docker Compose with AWS Credentials

          ```yaml
          version: '3.8'
          services:
            app:
              image: my-app:latest
              volumes:
                - ~/.aws/credentials:/home/appuser/.aws/credentials:ro
                - ~/.aws/config:/home/appuser/.aws/config:ro
              environment:
                AWS_PROFILE: production
                AWS_REGION: us-east-1
              networks:
                - local

          networks:
            local:
              driver: bridge
          ```

          ### LocalStack Development (v1-Compatible!)

          > ⚠️ **IMPORTANT:** AWS CLI v2 NOT supported. Use v1 above.

          ```yaml
          version: '3.8'
          services:
            localstack:
              image: localstack/localstack:latest
              ports:
                - "4566:4566"  # LocalStack API gateway
              environment:
                SERVICES: s3,lambda,dynamodb,sqs,cloudformation
                DEBUG: 1
                DATA_DIR: /tmp/localstack/data
              volumes:
                - "${TMPDIR}:/tmp/localstack"
                - /var/run/docker.sock:/var/run/docker.sock

            app:
              image: my-app:latest
              depends_on:
                - localstack
              environment:
                AWS_ENDPOINT_URL: http://localstack:4566
                AWS_ENDPOINT_URL_S3: http://localstack:4566
                AWS_ACCESS_KEY_ID: test
                AWS_SECRET_ACCESS_KEY: test
                AWS_DEFAULT_REGION: us-east-1
              volumes:
                - ~/.aws/config:/home/appuser/.aws/config:ro

          networks:
            default:
              name: localstack-net
          ```

          ### AWS CLI v1 with LocalStack Commands

          ```bash
          # List S3 buckets in LocalStack
          aws s3 ls --profile localstack

          # Create DynamoDB table in LocalStack
          aws dynamodb create-table \
            --table-name my-table \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --profile localstack

          # Lambda operations
          aws lambda list-functions --profile localstack

          # CloudFormation / SAM deploy to LocalStack
          sam deploy \
            --profile localstack \
            --s3-bucket localstack-bucket \
            --parameter-overrides ParameterKey=Value
          ```

          ### LocalStack Profile Configuration

          ```ini
          # ~/.aws/config
          [profile localstack]
          region = us-east-1
          output = json
          endpoint_url = http://localhost:4566

          # ~/.aws/credentials
          [localstack]
          aws_access_key_id = test
          aws_secret_access_key = test
          ```
  AWS CLI v1 > MFA TROUBLESHOOTING:
    desc: Troubleshooting MFA with AWS CLI v1
    tags:
      - aws
      - cli
      - mfa
      - troubleshooting
    notes:
      - md: |
          ## MFA TROUBLESHOOTING

          ### "InvalidIdentity.MalformedId: The provided MFA serial is invalid"

          ```bash
          # ❌ WRONG - User ARN format
          mfa_serial = arn:aws:iam::123456789012:user/my-user

          # ✅ CORRECT - MFA device ARN format
          mfa_serial = arn:aws:iam::123456789012:mfa/my-user
          ```

          Check `~/.aws/config`:

          ```ini
          [profile production]
          mfa_serial = arn:aws:iam::123456789012:mfa/my-user  # Note: /mfa/ not /user/
          ```

          ### "AccessDenied when using MFA"

          ```bash
          # Token code expired (AWS tokens valid for ~30 seconds)
          # Solution: Get fresh code from authenticator, try again

          # MFA device not registered
          aws iam list-mfa-devices
          # If empty, register device: AWS Console → IAM → Users → Security credentials

          # Credentials expired while MFA dialog pending
          # Solution: Get new temporary credentials with correct token
          ```

          ### "MFA device is not registered for this user"

          ```bash
          # Register MFA in AWS Console, then:
          aws iam list-mfa-devices --profile production

          # Should show your registered device(s)
          # {
          #   "MFADevices": [
          #     {
          #       "UserName": "my-user",
          #       "SerialNumber": "arn:aws:iam::123456789012:mfa/my-user",
          #       "EnableDate": "2024-01-01T..."
          #     }
          #   ]
          # }
          ```

          ### "Token code is invalid"

          ```bash
          # Time sync issue
          # Authenticator time must match device time
          # Check: AWS → IAM → Users → Console sign-in → Enable MFA

          # Code already used
          # Each code valid once; wait 30 seconds for next code
          ```

          ### Get Session Token with MFA

          ```bash
          # Terminal 1: Get session token
          aws sts get-session-token \
            --serial-number arn:aws:iam::123456789012:mfa/my-user \
            --token-code 123456 \
            --duration-seconds 3600 \
            --profile production

          # Output contains temporary credentials
          # {
          #   "Credentials": {
          #     "AccessKeyId": "ASIA...",
          #     "SecretAccessKey": "...",
          #     "SessionToken": "...",
          #     "Expiration": "2024-01-01T..."
          #   }
          # }

          # Use these in environment:
          export AWS_ACCESS_KEY_ID=ASIA...
          export AWS_SECRET_ACCESS_KEY=...
          export AWS_SESSION_TOKEN=...
          ```
  AWS CLI v1 > TROUBLESHOOTING:
    desc: Common issues and solutions for AWS CLI v1
    tags:
      - aws
      - cli
      - troubleshooting
      - debug
    notes:
      - md: |
          ## TROUBLESHOOTING

          ### "Unable to locate credentials"

          ```bash
          # Check environment variables
          echo $AWS_ACCESS_KEY_ID
          echo $AWS_SECRET_ACCESS_KEY

          # Check credentials file exists
          ls -la ~/.aws/credentials

          # Check profile exists
          grep "\[production\]" ~/.aws/credentials

          # Check custom credentials file location
          echo $AWS_SHARED_CREDENTIALS_FILE

          # Verify precedence (env vars override everything)
          unset AWS_ACCESS_KEY_ID
          unset AWS_SECRET_ACCESS_KEY
          ```

          ### "The request must contain the parameter Authorization"

          ```bash
          # Credentials exist but invalid/expired
          aws sts get-caller-identity --profile production

          # If fails, credentials are wrong
          # Solution: Regenerate access keys in AWS Console IAM → Users

          # For MFA: Need to get temporary session token first
          aws sts get-session-token --serial-number ... --token-code ...
          ```

          ### "Profile not found" or "Profile does not exist"

          ```bash
          # Config file syntax check
          cat ~/.aws/config | grep "profile production"

          # ❌ WRONG - config file
          [production]

          # ✅ CORRECT - config file
          [profile production]

          # Credentials file (no "profile" prefix)
          grep "\[production\]" ~/.aws/credentials
          ```

          ### "Wrong region being used"

          ```bash
          # Check precedence
          echo $AWS_DEFAULT_REGION
          echo $AWS_REGION

          # Check config file
          grep "region" ~/.aws/config

          # Override explicitly
          aws s3 ls --region us-west-2 --profile production

          # Or set environment variable
          export AWS_DEFAULT_REGION=us-west-2
          ```

          ### "NoCredentialsError with LocalStack"

          ```bash
          # LocalStack requires credentials (even if dummy)
          # Check profile
          aws s3 ls --profile localstack

          # Ensure profile exists
          grep "\[localstack\]" ~/.aws/credentials
          grep "\[profile localstack\]" ~/.aws/config

          # Dummy credentials for LocalStack
          [localstack]
          aws_access_key_id = test
          aws_secret_access_key = test
          ```

          ### "Connection refused to LocalStack"

          ```bash
          # LocalStack not running
          docker ps | grep localstack

          # Start LocalStack
          docker-compose up localstack

          # Check endpoint URL in profile
          grep "endpoint_url" ~/.aws/config

          # Should be: endpoint_url = http://localhost:4566
          ```

          ### Enable Debug Logging

          ```bash
          # See detailed request/response info
          aws s3 ls --debug --profile production

          # Redirect to file for analysis
          aws s3 ls --debug --profile production 2> debug.log
          ```
