              ```

          3. By Workload Type

              > 💡 Separate profiles for different workloads (e.g., Lambda deployment, local development, CI/CD).
              >
              > **GOOD FOR:** Isolating credentials based on usage context.

              ```ini
              [lambda-deploy]
              # Service-specific credentials with minimal permissions

              [localstack-dev]
              endpoint_url = http://localhost:4566

              [ci-cd]
              # IAM user with only necessary permissions
              ```

          4. Naming Convention Best Practice

              > 💡 Use clear, consistent naming conventions for profiles
              >
              > **GOOD FOR:** Easy identification and management of profiles by environment and role.
              >
              > **EXAMPLE:** `<environment>-<role>`
              >
              > - consorciei-dev
              > - consorciei-prod-admin
              > - consorciei-prod-readonly
              > - localstack-testing
  AWS CLI v2 > CREDENTIALS > COMMON COMMANDS & USE CASES:
    desc: Common AWS CLI commands for managing credentials and profiles
    tags:
      - aws
      - cli
    notes:
      - md: |
          ## COMMON COMMANDS & USE CASES

          1. List Available Profiles

              ```bash
              grep '\[profile' ~/.aws/config | sed 's/\[profile \(.*\)\]/\1/'
              ```

          2. Use Specific Profile

              ```bash
              # One-off command with profile
              aws s3 ls --profile production

              # Set profile for session
              export AWS_PROFILE=production
              aws ec2 describe-instances

              # Unset
              unset AWS_PROFILE
              ```

          3. Check Current Credentials

              ```bash
              # Shows which profile/identity is active
              aws sts get-caller-identity --profile production

              # Output:
              # {
              #     "UserId": "AIDAI...",
              #     "Account": "123456789012",
              #     "Arn": "arn:aws:iam::123456789012:user/your-user"
              # }
              ```

          4. Get Temporary STS Credentials

              ```bash
              # Useful for Docker, CI/CD, temporary access
              aws sts assume-role \
                --role-arn arn:aws:iam::ACCOUNT:role/RoleName \
                --role-session-name my-session \
                --profile source-profile

              # With MFA
              aws sts get-session-token \
                --serial-number arn:aws:iam::123456789012:mfa/your-user \
                --token-code 123456 \
                --duration-seconds 3600 \
                --profile default
              ```

          5. Assume Cross-Account Role

              ```bash
              # ~/.aws/config already has this set up? Just use:
              aws s3 ls --profile cross-account-admin

              # Or manually:
              aws sts assume-role \
                --role-arn arn:aws:iam::ANOTHER_ACCOUNT:role/RoleName \
                --role-session-name cross-account-session \
                --profile production
              ```

          6. Common Service Operations

              ```bash
              # S3
              aws s3 ls --profile production
              aws s3 cp file.txt s3://bucket/path/ --profile production

              # Lambda
              aws lambda list-functions --profile production

              # CloudFormation / SAM
              aws cloudformation describe-stacks --profile production
              sam deploy --profile production

              # LocalStack (development)
              aws s3 ls --profile localstack
              aws dynamodb list-tables --profile localstack
              ```
  AWS CLI v2 > CREDENTIALS > SECURITY BEST PRACTICES:
    desc: Best practices for securing AWS CLI credentials
    tags:
      - aws
      - cli
    notes:
      - md: |
          ## SECURITY BEST PRACTICES

          1. ✅ DO's

              - Store `~/.aws/credentials` file with **restricted permissions**

                  ```bash
                  chmod 600 ~/.aws/credentials
                  ```

              - Use **environment variables for CI/CD** (not files in git)

                  ```bash
                  # GitHub Actions, GitLab CI, etc - use secrets, not commits
                  export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
                  ```

              - Use **temporary credentials (STS)** whenever possible

                  ```bash
                  aws sts get-session-token  # Good for humans
                  ```

              - Use **SSO** for human users (AWS SSO or third-party)

                  ```bash
                  aws sso login --profile production
                  ```

              - Use **MFA** for production profiles

                  ```ini
                  [profile production]
                  mfa_serial = arn:aws:iam::123456789012:mfa/your-user
                  ```

              - Use **IAM Roles for EC2/Lambda/ECS** (no credentials needed)

              - Use **principle of least privilege** - assign minimal IAM permissions per profile/role

              - Exclude credentials from git

                  ```bash
                  # .gitignore
                  .aws/credentials
                  .aws/config  # if sensitive
                  ~/.aws/**
                  ```

          2. ❌ DON'Ts

            - Commit credentials to git (ever)
            - Use root AWS account for daily work
            - Share long-term credentials between team members (use roles instead)
            - Store credentials in environment without expiration
            - Use `[default]` for sensitive operations (make it a fallback)
            - Leave `region` unspecified (always be explicit)
  AWS CLI v2 > CREDENTIALS > ENCRYPTION & SECRET MANAGEMENT:
    desc: Best practices for encrypting and managing AWS CLI credentials
    tags:
      - aws
      - cli
    notes:
      - md: |
          ## ENCRYPTION & SECRET MANAGEMENT

          1. Encrypt Credentials with SOPS + AGE

              ```bash
              # Install sops and age
              brew install sops age

              # Generate age key
              age-keygen -o ~/.age/key.txt

              # Encrypt ~/.aws/credentials
              sops -e -i --age $(cat ~/.age/key.txt | grep "# public key:" | cut -d' ' -f4) ~/.aws/credentials

              # Git pre-commit hook to auto-encrypt
              # (see: https://github.com/mozilla/sops)
              ```

          2. Using Encrypted Files in CI/CD

              ```bash
              # Decrypt before use
              export SOPS_AGE_KEY_FILE=~/.age/key.txt

              sops -d ~/.aws/credentials > /tmp/credentials
              export AWS_SHARED_CREDENTIALS_FILE=/tmp/credentials
              ```
  AWS CLI v2 > BEST PRACTICES for DOCKER CONTAINER:
    desc: Best practices for using AWS CLI credentials in containers
    tags:
      - aws
      - cli
    notes:
      - md: |
          ## DOCKER & CONTAINER BEST PRACTICES

          1. Pass Credentials to Container

              ```dockerfile
              # NOT recommended - don't hard-code
              # ENV AWS_ACCESS_KEY_ID=...

              # GOOD - mount credentials file
              # docker run -v ~/.aws/credentials:/root/.aws/credentials:ro
              ```

          2. Docker Run with AWS Credentials

              ```bash
              docker run \
                -v ~/.aws/credentials:/root/.aws/credentials:ro \
                -v ~/.aws/config:/root/.aws/config:ro \
                -e AWS_PROFILE=production \
                my-aws-app:latest

              # Or mount and reference config
              docker run \
                -v ~/.aws:/home/appuser/.aws:ro \
                -e AWS_PROFILE=localstack \
                my-app:latest
              ```

          3. Docker Compose mount volumes

              ```yaml
              services:
                app:
                  image: my-app:latest
                  volumes:
                    - ~/.aws/credentials:/home/appuser/.aws/credentials:ro
                    - ~/.aws/config:/home/appuser/.aws/config:ro
                  environment:
                    AWS_PROFILE: production
                    AWS_REGION: us-east-1
                  networks:
                    - local
              ```

          4. LocalStack Development set environments

              ```yaml
              services:
                localstack:
                  image: localstack/localstack
                  ports:
                    - "4566:4566"  # LocalStack API
                  environment:
                    SERVICES: s3,lambda,dynamodb,sqs

                app:
                  image: my-app:latest
                  environment:
                    AWS_ENDPOINT_URL: http://localstack:4566
                    AWS_PROFILE: localstack
                  depends_on:
                    - localstack
              ```
  AWS CLI v2 > TROUBLESHOOTING:
    desc: Common issues and how to resolve them
    tags:
      - aws
      - cli
    notes:
      - md: |
          ## TROUBLESHOOTING

          1. When `"Unable to locate credentials"`

              ```bash
              # Check environment variables
              echo $AWS_ACCESS_KEY_ID
              echo $AWS_SECRET_ACCESS_KEY

              # Check credentials file exists and is readable
              ls -la ~/.aws/credentials

              # Check profile exists
              grep "\[production\]" ~/.aws/credentials
              ```

          2. When `"The request must contain the parameter Authorization"`

              ```bash
              # Credentials exist but are incorrect - verify:
              aws sts get-caller-identity --profile production
              # Should return Account ID, User ARN

              # If it fails, recheck credentials
              ```

          3. When `"Profile not found"`

              ```bash
              # Check config file
              cat ~/.aws/config | grep "profile production"

              # Syntax issue? Config must have "profile" prefix
              # [profile production]  <- CORRECT
              # [production]          <- WRONG (only in credentials)
              ```

          4. When `"Wrong region being used"`

              ```bash
              # Check order of precedence:
              echo $AWS_DEFAULT_REGION
              echo $AWS_REGION
              grep "region" ~/.aws/config

              # Explicit override
              aws s3 ls --region us-west-2
              ```
  AWS CLI v2 > QUICK REFERENCE:
    desc: Quick Reference, Configuration and Best Practices in a nutshell
    tags:
      - aws
      - cli
    notes:
      - md: |
          ## QUICK REFERENCE

            ```bash
            # Configuration
            aws configure                                     # Interactive setup
            aws configure --profile production                # Setup specific profile
            aws configure list                                # Show current config
            aws configure list --profile production           # Show profile config

            # Identity & Account Info
            aws sts get-caller-identity                       # Current user/role
            aws iam get-user                                  # Current IAM user info
            aws iam list-access-keys --profile production     # List access keys

            # Credentials
            aws sts get-session-token --duration-seconds 3600
            aws sts assume-role --role-arn arn:... --role-session-name session-name

            # Profile Management
            grep '\[profile' ~/.aws/config | sed 's/.*\[\(.*\)\].*/\1/'
            export AWS_PROFILE=production
            unset AWS_PROFILE

            # Environment Variable Override
            AWS_PROFILE=prod AWS_REGION=us-west-2 aws s3 ls

            # LocalStack (Local Testing)
            aws s3 ls --endpoint-url http://localhost:4566 --profile localstack
            ```
