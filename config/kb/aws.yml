  Sample Project - Amazon Cloudfront distribution in front of Amazon S3 and an Amazon API Gateway REST API to AWS Lambda to Amazon DynamoDB:
    desc: This pattern creates an Amazon Cloudfront distribution in front of Amazon S3 and an Amazon API Gateway REST API which invokes an AWS Lambda function to store data in an Amazon DynamoDB table.
    tags:
      - aws
      - serverless
    links:
      - https://serverlessland.com/patterns/cloudfront-apigw-rest-api-lambda-dynamodb-sam
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-rest-api.html
      - https://github.com/aws-samples/serverless-patterns/tree/main/cloudfront-apigw-rest-api-lambda-dynamodb-sam
    notes:
      - md: |
          ## OVERVIEW

          - This sample project creates a simple webform application using Amazon Cloudfront in front of Amazon S3 and Amazon API Gateway REST API.
          - The Amazon API Gateway REST API invokes an AWS Lambda function which stores the webform data in an Amazon DynamoDB table.
          - This pattern uses AWS WAF to secure the CloudFront distribution and AWS Secrets Manager to store a validation string to validate API requests flow through Amazon Cloudfront.
          - AWS X-Ray is also enabled to allow for distributed tracing.
      - yml: |
          AWSTemplateFormatVersion: '2010-09-09'
          Transform: AWS::Serverless-2016-10-31
          Description: Serverless Webform Sample (uksb-1tthgi812) (tag:cloudfront-apigw-rest-api-lambda-dynamodb-sam)

          Parameters:
            HTTPGetFloodRateParam:
              Description: "A Rate-Based Rule looking for a maximum rate of a single IP address can perform HTTP Get requests in 5 minutes"
              Type: Number
              Default: 10000
              MinValue: 100
              MaxValue: 20000000
            HTTPPostFloodRateParam:
              Description: "A Rate-Based Rule looking for a maximum rate of a single IP address can perform HTTP Post requests in 5 minutes"
              Type: Number
              Default: 1000
              MinValue: 100
              MaxValue: 20000000

          Resources:
            API:
              Type: AWS::Serverless::Api
              Properties:
                StageName: dev
                EndpointConfiguration: REGIONAL
                TracingEnabled: true

            SubmitFunction:
              Type: AWS::Serverless::Function
              Properties:
                CodeUri: src/function.js
                Description: "Stores sample webform data in DynamoDB."
                Handler: function.handler
                PackageType: "Zip"
                Tracing: Active
                Runtime: "nodejs22.x"
                Environment:
                  Variables:
                    DatabaseTable: !Ref DynamoDBTable
                Policies:
                  - DynamoDBWritePolicy:
                      TableName: !Ref DynamoDBTable
                Events:
                  ApiEvents:
                    Type: Api
                    Properties:
                      Path: /submit
                      Method: POST
                      RestApiId: !Ref API

            DynamoDBTable:
              Type: AWS::Serverless::SimpleTable
              Properties:
                PrimaryKey:
                  Name: EmailAddress
                  Type: String

            OriginVerifyHeader:
              Type: AWS::SecretsManager::Secret
              Properties:
                GenerateSecretString:
                  SecretStringTemplate: !Sub '{"HEADERVALUE": "RandomHeader"}'
                  GenerateStringKey: "HEADERVALUE"
                  ExcludePunctuation: true

            CloudFront:
              Type: AWS::CloudFront::Distribution
              Properties:
                DistributionConfig:
                  DefaultCacheBehavior:
                    Compress: true
                    ForwardedValues:
                      QueryString: false
                    TargetOriginId: s3
                    ViewerProtocolPolicy: redirect-to-https
                  DefaultRootObject: index.html
                  Enabled: true
                  HttpVersion: http2
                  WebACLId: !GetAtt CloudFrontWebACL.Arn
                  Origins:
                    - Id: s3
                      DomainName: !Join [ "", [ !Ref S3Bucket, ".s3.${AWS::URLSuffix}" ] ]
                      S3OriginConfig:
                        OriginAccessIdentity:
                          !Join [ "", [ "origin-access-identity/cloudfront/", !Ref CloudFrontOriginAccessIdentity ] ]
                    - Id: api
                      DomainName: !Sub "${API}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
                      OriginPath: /dev
                      OriginCustomHeaders:
                        - HeaderName: "X-Origin-Verify"
                          HeaderValue: !Join ['', ['{{resolve:secretsmanager:', !Ref OriginVerifyHeader, ':SecretString:HEADERVALUE}}' ]]
                      CustomOriginConfig:
                        HTTPSPort: 443
                        OriginProtocolPolicy: https-only
                        OriginSSLProtocols:
                          - TLSv1.2
                  CacheBehaviors:
                    - AllowedMethods:
                        - GET
                        - HEAD
                        - OPTIONS
                        - PUT
                        - POST
                        - PATCH
                        - DELETE
                      CachedMethods:
                        - HEAD
                        - GET
                        - OPTIONS
                      Compress: false
                      PathPattern: /submit
                      TargetOriginId: api
                      CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
                      ViewerProtocolPolicy: redirect-to-https


            CloudFrontOriginAccessIdentity:
              Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
              Properties:
                CloudFrontOriginAccessIdentityConfig:
                  Comment: !Sub 'CloudFront OAI for serverless webform sample'

            S3Bucket:
              Type: AWS::S3::Bucket
              DeletionPolicy: Retain
              Properties:
                BucketEncryption:
                  ServerSideEncryptionConfiguration:
                    -
                      ServerSideEncryptionByDefault:
                        SSEAlgorithm: AES256

            BucketPolicy:
              Type: AWS::S3::BucketPolicy
              Properties:
                Bucket: !Ref S3Bucket
                PolicyDocument:
                  Statement:
                    -
                      Action:
                        - s3:GetObject
                      Effect: Allow
                      Resource: !Join [ "", [ "arn:aws:s3:::", !Ref S3Bucket, "/*" ] ]
                      Principal:
                        CanonicalUser: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId

            CloudFrontWebACL:
              Type: AWS::WAFv2::WebACL
              Properties:
                DefaultAction:
                  Allow: {}
                Scope: CLOUDFRONT
                VisibilityConfig:
                  SampledRequestsEnabled: True
                  CloudWatchMetricsEnabled: True
                  MetricName: WebformAPIWAFMetric
                Rules:
                  - Name: HTTPGetFloodPProtection
                    Priority: 0
                    Action:
                      Block: {}
                    VisibilityConfig:
                      SampledRequestsEnabled: true
                      CloudWatchMetricsEnabled: true
                      MetricName: RateBased
                    Statement:
                      RateBasedStatement:
                        Limit: !Ref HTTPGetFloodRateParam
                        AggregateKeyType: IP
                        ScopeDownStatement:
                          ByteMatchStatement:
                            SearchString: get
                            FieldToMatch:
                              Method: {}
                            TextTransformations:
                            - Priority: 0
                              Type: LOWERCASE
                            PositionalConstraint: EXACTLY
                  - Name: HTTPPostFloodPProtection
                    Priority: 1
                    Action:
                      Block: {}
                    VisibilityConfig:
                      SampledRequestsEnabled: true
                      CloudWatchMetricsEnabled: true
                      MetricName: test
                    Statement:
                      RateBasedStatement:
                        Limit: !Ref HTTPPostFloodRateParam
                        AggregateKeyType: IP
                        ScopeDownStatement:
                          AndStatement:
                            Statements:
                            - ByteMatchStatement:
                                SearchString: submit
                                FieldToMatch:
                                  UriPath: {}
                                TextTransformations:
                                - Priority: 0
                                  Type: LOWERCASE
                                - Priority: 1
                                  Type: URL_DECODE
                                PositionalConstraint: CONTAINS
                            - ByteMatchStatement:
                                SearchString: post
                                FieldToMatch:
                                  Method: {}
                                TextTransformations:
                                - Priority: 0
                                  Type: LOWERCASE
                                PositionalConstraint: EXACTLY
                  - Name: AWS-AWSManagedRulesAmazonIpReputationList
                    Priority: 2
                    OverrideAction:
                      Count: {}
                    VisibilityConfig:
                      SampledRequestsEnabled: true
                      CloudWatchMetricsEnabled: true
                      MetricName: MetricForAMRIPRepList
                    Statement:
                      ManagedRuleGroupStatement:
                        VendorName: AWS
                        Name: AWSManagedRulesAmazonIpReputationList
                  - Name: AWS-AWSManagedRulesAnonymousIpList
                    Priority: 3
                    OverrideAction:
                      Count: {}
                    VisibilityConfig:
                      SampledRequestsEnabled: true
                      CloudWatchMetricsEnabled: true
                      MetricName: MetricForAMRAnonIpList
                    Statement:
                      ManagedRuleGroupStatement:
                        VendorName: AWS
                        Name: AWSManagedRulesAnonymousIpList
                  - Name: AWS-AWSManagedRulesCommonRuleSet
                    Priority: 4
                    OverrideAction:
                      None: {}
                    VisibilityConfig:
                      SampledRequestsEnabled: true
                      CloudWatchMetricsEnabled: true
                      MetricName: MetricForAMRCRS
                    Statement:
                      ManagedRuleGroupStatement:
                        VendorName: AWS
                        Name: AWSManagedRulesCommonRuleSet
                  - Name: AWS-AWSManagedRulesKnownBadInputsRuleSet
                    Priority: 5
                    OverrideAction:
                      None: {}
                    VisibilityConfig:
                      SampledRequestsEnabled: true
                      CloudWatchMetricsEnabled: true
                      MetricName: MetricForAMRKnownBadInputs
                    Statement:
                      ManagedRuleGroupStatement:
                        VendorName: AWS
                        Name: AWSManagedRulesKnownBadInputsRuleSet
                  - Name: AWS-AWSManagedRulesBotControl
                    Priority: 6
                    OverrideAction:
                      None: {}
                    VisibilityConfig:
                      SampledRequestsEnabled: true
                      CloudWatchMetricsEnabled: true
                      MetricName: MetricForAMRBotControl
                    Statement:
                      ManagedRuleGroupStatement:
                        VendorName: AWS
                        Name: AWSManagedRulesBotControlRuleSet

            APIWebACL:
              Type: AWS::WAFv2::WebACL
              Properties:
                DefaultAction:
                  Block: {}
                Scope: REGIONAL
                VisibilityConfig:
                  SampledRequestsEnabled: True
                  CloudWatchMetricsEnabled: True
                  MetricName: WebformAPIWAFMetric
                Rules:
                  - Name: X-Origin-Verify-Header
                    Priority: 0
                    Action:
                        Allow: {}
                    VisibilityConfig:
                      SampledRequestsEnabled: true
                      CloudWatchMetricsEnabled: true
                      MetricName: X-Origin-Verify-Header
                    Statement:
                      OrStatement:
                        Statements:
                        - ByteMatchStatement:
                            FieldToMatch:
                              SingleHeader:
                                Name: "X-Origin-Verify"
                            PositionalConstraint: EXACTLY
                            SearchString: !Join ['', ['{{resolve:secretsmanager:', !Ref OriginVerifyHeader, ':SecretString:HEADERVALUE}}' ]]
                            TextTransformations:
                              - Priority: 0
                                Type: NONE
                        - ByteMatchStatement:
                            FieldToMatch:
                              SingleHeader:
                                Name: "X-Origin-Verify"
                            PositionalConstraint: EXACTLY
                            SearchString: !Join ['', ['{{resolve:secretsmanager:', !Ref OriginVerifyHeader, ':SecretString:HEADERVALUE}}' ]]
                            TextTransformations:
                              - Priority: 0
                                Type: NONE
            APIWAFAssociation:
              Type: AWS::WAFv2::WebACLAssociation
              Properties:
                ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/restapis/${API}/stages/dev
                WebACLArn: !GetAtt  APIWebACL.Arn
              DependsOn: APIdevStage

          Outputs:
            CloudfrontDomain:
              Value: !GetAtt CloudFront.DomainName
              Export:
                Name: WebformCloudfrontDomain
            S3BucketName:
              Value: !Ref S3Bucket
              Export:
                Name: WebformS3Bucket
      - sh: |
          #!/bin/bash

          # 1. Create a new directory, navigate to that directory in a terminal and clone the GitHub repository:
          git clone https://github.com/aws-samples/serverless-patterns

          # 2. Change directory to the pattern directory:
          cd serverless-patterns/cloudfront-apigw-rest-api-lambda-dynamodb-sam

          # 3. From the command line, use AWS SAM to deploy the AWS resources for the workflow as specified in the template.yaml file:
          sam deploy --guided
          # => Enter a stack name
          # => Enter the desired AWS Region
          # => Allow SAM CLI to create IAM roles with the required permissions.
          # => Respond 'y' to all prompts
          # => Accept all other defaults
          # =>
          # =>  Stack Name [sam-app]: cloudfront-apigw-rest-api-lambda-dynamodb-sam
          # =>  AWS Region [us-east-1]:
          # =>  Parameter HTTPGetFloodRateParam [10000]:
          # =>  Parameter HTTPPostFloodRateParam [1000]:
          # =>  #Shows you resources changes to be deployed and require a 'Y' to initiate deploy
          # =>  Confirm changes before deploy [y/N]:
          # =>  #SAM needs permission to be able to create roles to connect to the resources in your template
          # =>  Allow SAM CLI IAM role creation [Y/n]:
          # =>  SubmitFunction may not have authorization defined, Is this okay? [y/N]: y
          # =>  Save arguments to configuration file [Y/n]:
          # =>  SAM configuration file [samconfig.toml]:
          # =>  SAM configuration environment [default]:

          # 4. Note the outputs from the SAM deployment process. These contain the resource names and/or ARNs which are used for testing.

          # 5. Deploy the frontend web interface via the provided deploy_frontend.sh script.
          ./deploy_frontend.sh
  Sample Project - Multi-Tenant Serverless API using Amazon API Gateway, AWS Lambda, and Amazon DynamoDB:
    desc: Requests are authorized using API keys mapped to tenants in DynamoDB. Access to data is restricted using dynamic IAM policies based on the tenant ID.
    tags:
      - aws
      - serverless
    links:
      - https://serverlessland.com/patterns/serverless-multi-tenant-api
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-use-lambda-authorizer.html
      - https://docs.aws.amazon.com/apigateway/latest/developerguide/call-api-with-api-gateway-lambda-authorization.html
      - https://github.com/aws-samples/serverless-patterns/tree/main/serverless-multi-tenant-api
    notes:
      - md: |
          ## Multi-Tenant Serverless API

          This project demonstrates a pattern for building a multi-tenant serverless API using API Gateway, Lambda, and DynamoDB, with tenant based access control. Requests are authorized using API keys mapped to tenants in DynamoDB. Access to data is restricted using dynamic IAM policies based on the tenant ID. This is not a production ready implementation of a multi-tenant API and only serves as a demo to illustrate the pattern.

          ### Architecture

          The project contains the following resources:

          - API Gateway REST API
          - Lambda authorizer  - Looks up the tenant ID from the API key and generates IAM policies
          - Lambda GET function - Retrieves items by ID after validating the tenant ID
          - Lambda POST function - Adds new items after validating the tenant ID
          - DynamoDB tables - Stores tenant data isolated by partition keys with the tenant ID

          The Lambda functions assume IAM roles with temporary credentials to access the tenant's data partition.
      - yml: |
          AWSTemplateFormatVersion: 2010-09-09

          Description: >-
            serverless-multi-tenant-api

          Transform:
          - AWS::Serverless-2016-10-31

          Resources:
            MyApi:
              Type: AWS::Serverless::Api
              Properties:
                StageName: Prod
                ApiKeySourceType : HEADER
                Auth:
                  ApiKeyRequired: true # sets for all methods
                  DefaultAuthorizer: MyLambdaRequestAuthorizer
                  Authorizers:
                    MyLambdaRequestAuthorizer:
                      FunctionPayloadType: REQUEST
                      FunctionArn: !GetAtt authFunction.Arn
                      Identity:
                          ReauthorizeEvery: 0
                          Headers:
                            - x-api-key

            # Create Usage Plan
            UsagePlan:
              Type: AWS::ApiGateway::UsagePlan
              Properties:
                ApiStages:
                  - ApiId: !Ref MyApi
                    Stage: !Ref MyApi.Stage
                Description: Usage plan for API Gateway

            # Create API Key
            TestApiKey:
              Type: AWS::ApiGateway::ApiKey
              Properties:
                Enabled: true
                StageKeys:
                  - RestApiId: !Ref MyApi
                    StageName: !Ref MyApi.Stage

            UsagePlanKey:
              Type: AWS::ApiGateway::UsagePlanKey
              Properties:
                KeyId: !Ref TestApiKey
                KeyType: API_KEY
                UsagePlanId: !Ref UsagePlan

            AuthorizerExecutionRole:
              Type: AWS::IAM::Role
              Properties:
                Path: '/'
                AssumeRolePolicyDocument:
                  Version: 2012-10-17
                  Statement:
                    - Effect: Allow
                      Principal:
                        Service:
                          - lambda.amazonaws.com
                      Action:
                        - sts:AssumeRole
                ManagedPolicyArns:
                  - arn:aws:iam::aws:policy/CloudWatchLambdaInsightsExecutionRolePolicy
                  - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                Policies:
                  - PolicyName: authorizer-execution-policy
                    PolicyDocument:
                      Version: 2012-10-17
                      Statement:
                        - Effect: Allow
                          Action:
                            - dynamodb:GetItem
                          Resource:
                            - !GetAtt ConfigTable.Arn

            AuthorizerAccessRole:
              Type: AWS::IAM::Role
              DependsOn: AuthorizerExecutionRole
              Properties:
                Path: '/'
                AssumeRolePolicyDocument:
                  Version: 2012-10-17
                  Statement:
                    - Effect: Allow
                      Principal:
                        AWS:
                          - !GetAtt 'AuthorizerExecutionRole.Arn'
                      Action:
                        - sts:AssumeRole
                Policies:
                  - PolicyName: authorizer-access-role-policy
                    PolicyDocument:
                      Version: 2012-10-17
                      Statement:
                        - Effect: Allow
                          Action:
                            - dynamodb:GetItem
                            - dynamodb:PutItem
                          Resource:
                            - !GetAtt ItemTable.Arn

            # This is a Lambda function config associated with the source code: auth.js
            authFunction:
              Type: AWS::Serverless::Function
              Properties:
                Role: !GetAtt AuthorizerExecutionRole.Arn
                Handler: src/handlers/auth.authHandler
                Runtime: nodejs20.x
                Architectures:
                  - x86_64
                MemorySize: 128
                Timeout: 5
                Environment:
                  Variables:
                    # Make table name accessible as environment variable from function code during execution
                    CONFIG_TABLE: !Ref ConfigTable
                    ITEM_TABLE_ARN: !GetAtt ItemTable.Arn
                    AUTHORIZER_ACCESS_ROLE_ARN: !GetAtt AuthorizerAccessRole.Arn

            # This is a Lambda function config associated with the source code: get-by-id.js
            getByIdFunction:
              Type: AWS::Serverless::Function
              Properties:
                Handler: src/handlers/get-by-id.getByIdHandler
                Runtime: nodejs20.x
                Architectures:
                  - x86_64
                MemorySize: 128
                Timeout: 5
                Description: A simple example includes a HTTP get method to get one item by id from a DynamoDB table.
                Environment:
                  Variables:
                    # Make table name accessible as environment variable from function code during execution
                    ITEM_TABLE: !Ref ItemTable
                Events:
                  Api:
                    Type: Api
                    Properties:
                      RestApiId: !Ref MyApi
                      Auth:
                        ApiKeyRequired: true
                      Path: /{id}
                      Method: GET

            # This is a Lambda function config associated with the source code: put-item.js
            putItemFunction:
              Type: AWS::Serverless::Function
              Properties:
                Handler: src/handlers/put-item.putItemHandler
                Runtime: nodejs20.x
                Architectures:
                  - x86_64
                MemorySize: 128
                Timeout: 5
                Description: A simple example includes a HTTP post method to add one item to a DynamoDB table.
                Environment:
                  Variables:
                    # Make table name accessible as environment variable from function code during execution
                    ITEM_TABLE: !Ref ItemTable
                Events:
                  Api:
                    Type: Api
                    Properties:
                      RestApiId: !Ref MyApi
                      Auth:
                        ApiKeyRequired: true
                      Path: /
                      Method: POST

            # DynamoDB table to store item: {id: <ID>, name: <NAME>}
            ItemTable:
              Type: AWS::Serverless::SimpleTable
              Properties:
                PrimaryKey:
                  Name: PK
                  Type: String

            # DynamoDB table to store config: {id: <ID>}
            ConfigTable:
              Type: AWS::Serverless::SimpleTable
              Properties:
                PrimaryKey:
                  Name: PK
                  Type: String

          Outputs:
            WebEndpoint:
              Description: "API Gateway endpoint URL for Prod stage"
              Value: !Sub "https://${MyApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/"
            TestApiKeyOutput:
              Description: "API Key"
              Value: !Ref TestApiKey
            DynamoDBTableName:
              Description: "DynamoDB Table Name"
              Value: !Ref ConfigTable
      - md: |
          ## Setup

          1. Create a new directory, navigate to that directory in a terminal and clone the GitHub repository:
              ```
              git clone https://github.com/aws-samples/serverless-patterns
              ```
          2. Change directory to the pattern directory:
              ```
              cd serverless-patterns/serverless-multi-tenant-api
              ```
          3. From the command line, use AWS SAM to deploy the AWS resources for the workflow as specified in the template.yaml file:

              ```
              npm install
              sam build
              sam deploy --guided
              ```

          This will build and deploy the Lambda functions, API Gateway API, and DynamoDB tables.
          The API endpoint will be output after deployment. You can test the endpoint with valid API keys and tenant IDs stored in DynamoDB.

          Steps to set up a tenant in the ConfigTable DynamoDB table with the generated API Key:

          1. Get the DynamoDB table name and API key value using the stack name you created :
                aws cloudformation describe-stacks --stack-name `your-stack-name` \
                    --query 'Stacks[0].Outputs[?OutputKey==`DynamoDBTableName`].OutputValue' \
                    --output text

          2. Get the API key name
              aws cloudformation describe-stacks --stack-name `your-stack-name` \
                    --query 'Stacks[0].Outputs[?OutputKey==`TestApiKeyOutput`].OutputValue' \
                    --output text

          3. Use the API key output from above step to get the API key value :
              aws apigateway get-api-key --api-key `your-api-key-id` --include-value --query "value" --output text


          4. Run the following command to put the sample tenant TENANT1 in DynamoDB table :
              aws dynamodb put-item \
                  --table-name `your-dynamodb-table` \
                  --item ' {
                          "PK": {
                            "S": "`<your-api-key-value>`"
                          },
                          "TENANT_ID": {
                            "S": "TENANT1"
                          }
                        }' \
                    --return-consumed-capacity TOTAL

          ## Testing Locally

          To test locally, run:

          ```
          sam local start-api
          ```

          This will spin up a local API Gateway instance on port 3000. You can test routes by passing x-api-key headers mapped to tenants in your local DynamoDB tables.

          Or test using curl:

          1. POST - post item (id and name)
            `curl -X POST -H "x-api-key: <the value of your api key>"  -d '{"id":"id1","name":"name1"}' <your WebEndpoint>`
            A successful POST request returns the following response:
              `{"id":"id1","name":"name1"}`

          2. GET - get item by id
            `curl -X GET  -H "x-api-key: <the value of your api key>" <your WebEndpoint>/id1`
            A successful GET request returns the value of `id` saved earlier by the same tenant:
              `{"id":"id1","name":"name1"}`

          ## Implementation Details

          Key files and components:

          - template.yaml - Defines the API, Lambda functions, DynamoDB tables
          - auth.js - Authorizer function to lookup tenant ID and create IAM policy
          - get-by-id.js - GET function to retrieve items by ID
          - put-item.js - POST function to add new items
          - DynamoDB tables - Config and items tables to store tenants and data

          The authorizer function demonstrates how to implement granular access control per tenant for a multi-tenant architecture on AWS.

          ## Cleanup

          To delete the sample application:

          ```
          sam delete
          ```
