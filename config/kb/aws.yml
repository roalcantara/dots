          sam deploy --profile production

          # LOCALSTACK (v1-COMPATIBLE)
          aws s3 ls --profile localstack
          aws dynamodb list-tables --profile localstack
          aws lambda list-functions --profile localstack
          aws s3 ls --endpoint-url http://localhost:4566 --profile localstack

          # OUTPUT FILTERING & FORMATTING
          aws ec2 describe-instances --query 'Reservations[].Instances[].InstanceId' --output text
          aws s3api list-buckets --query 'Buckets[].Name' --output text
          aws lambda list-functions --query 'Functions[].{Name:FunctionName,Runtime:Runtime}' --output table

          # DEBUG
          aws s3 ls --debug --profile production
          aws sts get-caller-identity --debug
