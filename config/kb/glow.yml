commands:
  brew install glow:
    desc: Install glow using HomeBrew on macOS
    tags: [glow, markdown]
    links:
      - https://github.com/charmbracelet/glow

  glow README.md:
    desc: Render a markdown file in the terminal with default settings
    tags: [glow, markdown]

  glow -p README.md:
    desc: Enter pager mode (allows scrolling)
    tags: [glow, markdown]

    echo "# Hello World" | glow -:
      desc: View markdown from stdin
      tags: [glow, markdown]

    glow .:
      desc: View all markdown files in current directory
      tags: [glow, markdown]

  glow -s dark README.md:
    desc: Use dark style theme for rendering
    tags: [glow, markdown]
    notes:
      - sh: |
          # List available styles
          glow -s list

          # Use specific style
          glow -s dark README.md

          # Use custom style file
          glow -s mystyle.json README.md

  glow -w 80 README.md:
    desc: Set custom width for rendering
    tags: [glow, markdown]

  glow -h 40 README.md:
    desc: Set custom height
    tags: [glow, markdown]

  glow -w 80 -h 40 README.md:
    desc: Set Both width and height
    tags: [glow, markdown]

  glow -m README.md:
    desc: Enable mouse support in pager mode
    tags: [glow, markdown]

  GLOW_STYLE=dark glow README.md:
    desc: Set style using environment variable
    tags: [glow, markdown]
    notes:
      - sh: |
          # Set default style
          export GLOW_STYLE=dark

          # Set default width
          export GLOW_WIDTH=80

          # Set default pager
          export GLOW_PAGER=true

  glow serve:
    desc: Start a local markdown server to browse and preview markdown files
    tags: [glow, markdown]
    notes:
      - md: |
          ## Server Mode Features
      - sh: |
          # Start server with default settings
          glow serve

          # Custom port and host
          glow serve -p 8080 -h localhost

          # Allow external connections
          glow serve -h 0.0.0.0
      - md: |
          ## Security Note
          When using `serve` mode, be cautious with external connections as it exposes your markdown files to the network.

  glow config:
    desc: Show glow configuration file location and create if it doesn't exist
    tags: [glow, markdown]
    notes:
      - sh: |
          # ~/.config/glow/glow.yml
          style: "dark"
          # or "light", "dracula", etc.
          pager: true
          mouse: true
          width: 80

  glow stash add README.md:
    desc: Add markdown file to stash for quick access
    tags: [glow, markdown]
    notes:
      - md: |
          ## Stash Features
      - sh: |
          # Add file to stash
          glow stash add README.md

          # List stashed files
          glow stash list

          # View stashed file
          glow stash show README.md

          # Remove from stash
          glow stash rm README.md

  glow -s list:
    desc: List all available built-in styles
    tags: [glow, markdown]

  glow --style [style-name]:
    desc: Apply a specific built-in style
    tags: [glow, markdown]
    notes:
      - md: |
          ## Using Built-in Styles
      - sh: |
          # Use dark theme
          glow --style dark README.md

          # Use light theme
          glow --style light README.md

          # Use dracula theme
          glow --style dracula README.md

          # Use doom theme (great for code blocks)
          glow --style doom README.md

  cat ~/.config/glow/glow.yml:
    desc: Default Glow configuration
    tags: [glow, markdown]
    notes:
      - yaml: |
          # ~/.config/glow/glow.yml
          style:
            document:
              block-quote: italic #706c8c
              code: "#f0f0f0"
              code-block: "#f0f0f0"
              heading: "#c792ea bold"
              h1: "#c792ea bold"
              h2: "#c792ea bold"
              h3: "#c792ea bold"
              h4: "#c792ea bold"
              h5: "#c792ea italic"
              h6: "#c792ea italic"
              list: "#89ddff"
              strikethrough: crossed-out
              text: "#959dcb"
              underline: underline
            block-quote:
              border: "#706c8c"
              text: "#959dcb"
            code-block:
              text: "#89ddff"
              background: "#292d3e"
            table:
              text: "#89ddff"
              border: "#706c8c"

  glow -s custom-style.json README.md:
    desc: Use a custom JSON style files for more portable styling
    tags: [glow, markdown]
    notes:
      - jsonc: |
          // custom-style.json
          {
            "document": {
              "block-quote": "italic #706c8c",
              "code": "#f0f0f0",
              "code-block": "#f0f0f0",
              "heading": "#c792ea bold",
              "list": "#89ddff",
              "text": "#959dcb"
            },
            "block-quote": {
              "border": "#706c8c",
              "text": "#959dcb"
            },
            "code-block": {
              "text": "#89ddff",
              "background": "#292d3e"
            }
          }

  GLOW_STYLE=dracula glow README.md:
    desc: Set style using environment variable
    tags: [glow, markdown]
    notes:
      - sh: |
          # Test different styles quickly using environment variable
          GLOW_STYLE=dark glow README.md
          GLOW_STYLE=light glow README.md
          GLOW_STYLE=dracula glow README.md

  echo "# Header\n\`\`\`python\nprint('hello')\n\`\`\`\n> Quote" | glow -s dracula -:
    desc: Preview markdown from stdin with a specific style
    tags: [glow, markdown]

  echo "| Header | Value |\n|--------|--------|\n| Test | Data |" | glow -s dracula -:
    desc: Preview markdown table from stdin with a specific style
    tags: [glow, markdown]

  glow -w 80 --style dracula README.md:
    desc: Combine styling with width formatting
    tags: [glow, markdown]

  GLOW_STYLE_DOCUMENT_H1="red bold" GLOW_STYLE_DOCUMENT_H2="blue italic" GLOW_STYLE_DOCUMENT_H3="green underline" glow README.md:
    desc: Use environment variables to style H1, H2 and H3 with color and attributes
    tags: [glow, markdown]

  GLOW_STYLE_DOCUMENT_TEXT="blue" GLOW_STYLE_DOCUMENT_CODE="#FF5F87" glow README.md:
    desc: Combine text and code styling
    tags: [glow, markdown]

cheaats:
  glow | Style Best Practices:
    desc: Style Best Practices | Glow
    tags: [glow, markdown]
    notes:
      - md: |
          ## Style Best Practices

          1. Test your styles with different types of content:
             - Headers of all levels
             - Code blocks with syntax highlighting
             - Tables
             - Lists (nested)
             - Blockquotes

          2. Consider terminal compatibility:
             - Not all terminals support all colors
             - Some attributes might not work everywhere
             - Test in both light and dark terminal themes

  GLOW_STYLE_DOCUMENT_LIST="yellow":
    desc: Style list elements
    tags: [glow, markdown]
    notes:
      - sh: |
          # Style lists
          GLOW_STYLE_DOCUMENT_LIST="yellow" glow README.md

          # Style lists and list markers differently
          GLOW_STYLE_DOCUMENT_LIST="yellow" \
          GLOW_STYLE_DOCUMENT_LIST_MARKER="red bold" \
          glow README.md

  GLOW_STYLE_CODE_BLOCK_BACKGROUND="#2E3440":
    desc: Style code block backgrounds and text
    tags: [glow, markdown]
    notes:
      - sh: |
          # Style code block background
          GLOW_STYLE_CODE_BLOCK_BACKGROUND="#2E3440" \
          GLOW_STYLE_CODE_BLOCK_TEXT="#88C0D0" \
          glow README.md

          # Full code block styling
          GLOW_STYLE_CODE_BLOCK_BACKGROUND="#2E3440" \
          GLOW_STYLE_CODE_BLOCK_TEXT="#88C0D0" \
          GLOW_STYLE_CODE_BLOCK_MARGIN="2" \
          GLOW_STYLE_CODE_BLOCK_PADDING="1" \
          glow README.md

  GLOW_STYLE_TABLE_TEXT="cyan":
    desc: Style tables with colors and borders
    tags: [glow, markdown]
    notes:
      - sh: |
          # Basic table styling
          GLOW_STYLE_TABLE_TEXT="cyan" \
          GLOW_STYLE_TABLE_BORDER="blue" \
          glow README.md

          # Advanced table styling
          GLOW_STYLE_TABLE_TEXT="cyan" \
          GLOW_STYLE_TABLE_BORDER="blue" \
          GLOW_STYLE_TABLE_HEADER="yellow bold" \
          GLOW_STYLE_TABLE_MARGIN="1" \
          glow README.md

  "GLOW_STYLE_BLOCK_QUOTE_TEXT='italic #706c8c'":
    desc: Style blockquotes with text and borders
    tags: [glow, markdown]
    notes:
      - sh: |
          # Style blockquotes
          GLOW_STYLE_BLOCK_QUOTE_TEXT="italic #706c8c" \
          GLOW_STYLE_BLOCK_QUOTE_BORDER="#706c8c" \
          glow README.md

          # With padding and margin
          GLOW_STYLE_BLOCK_QUOTE_TEXT="italic #706c8c" \
          GLOW_STYLE_BLOCK_QUOTE_BORDER="#706c8c" \
          GLOW_STYLE_BLOCK_QUOTE_MARGIN="1" \
          GLOW_STYLE_BLOCK_QUOTE_PADDING="1" \
          glow README.md

  GLOW_STYLE_DOCUMENT_LINK="blue underline":
    desc: Style links with colors and attributes
    tags: [glow, markdown]
    notes:
      - md: |
          ## Comprehensive Example
          Here's how to combine multiple styles:
      - sh: |
          # Full document styling using environment variables
          GLOW_STYLE_DOCUMENT_TEXT="#959dcb" \
          GLOW_STYLE_DOCUMENT_H1="#c792ea bold" \
          GLOW_STYLE_DOCUMENT_H2="#c792ea" \
          GLOW_STYLE_DOCUMENT_CODE="#f0f0f0" \
          GLOW_STYLE_DOCUMENT_LIST="#89ddff" \
          GLOW_STYLE_DOCUMENT_LINK="blue underline" \
          GLOW_STYLE_CODE_BLOCK_BACKGROUND="#292d3e" \
          GLOW_STYLE_CODE_BLOCK_TEXT="#89ddff" \
          GLOW_STYLE_BLOCK_QUOTE_TEXT="#959dcb italic" \
          GLOW_STYLE_BLOCK_QUOTE_BORDER="#706c8c" \
          GLOW_STYLE_TABLE_BORDER="#706c8c" \
          GLOW_STYLE_TABLE_TEXT="#89ddff" \
          glow README.md

  GLOW_STYLE_ALL:
    desc: Set global style attributes
    tags: [glow, markdown]
    notes:
      - md: |
          ## Available Style Attributes

          Colors can be specified as:
          - Hex codes: `#FF5F87`
          - Named colors: `red`, `blue`, `green`, etc.
          - RGB values: `rgb(255,95,135)`

          Text attributes can be:
          - `bold`
          - `italic`
          - `underline`
          - `crossed-out`
          - `blink`

          Multiple attributes can be combined:
          `"blue bold italic"`
      - sh: |
          # Test different color formats
          GLOW_STYLE_DOCUMENT_H1="#FF5F87 bold" glow README.md
          GLOW_STYLE_DOCUMENT_H1="rgb(255,95,135) bold" glow README.md
          GLOW_STYLE_DOCUMENT_H1="red bold" glow README.md
