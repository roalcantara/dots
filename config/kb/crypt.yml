  https://gopass.pw:
    desc: Gopass - The Standard Unix Password Manager
    tags: [gopass, password-manager]
    links: [https://gopass.pw, https://github.com/gopasspw/gopass, https://domaindrivenarchitecture.org/posts/2020-01-29-GopassQuickRef, https://codelinter.com/blog/post/managing-secrets-with-gopass-age]
    notes:
      - md: | #markdown
          Gopass is a modern, open-source password manager that provides a secure and user-friendly way to manage your passwords.

          1. Install Gopass

            ```bash
            brew install gopass
            ```

          2. Generate a new key pair

            ```bash
            age-keygen -o ~/.config/age/key.txt
            # => PUBLIC KEY: age1PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP
            # => SECRET KEY: AGE-SECRET-KEY-1SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS
            ```

          3. Add AGE SECRET and PUBLIC KEYS as AGE identity to the Gopass store

            ```bash
            gopass age identities add AGE-SECRET-KEY-1SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS age1PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP
            ```

          4. Add AGE PUBLIC KEY as recipient to the Gopass store

            ```bash
            gopass recipients add age1PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP
            # If there are existing encrypted secrets, this will re-encrypt them.
            ```

          5. Setup Gopass with Age backend

            ```bash
            gopass setup --crypto age --storage gitfs
            ```

          6. Adjust the defaault template

            1. Edit the default template

              ```bash
              gopass templates edit
              ```

            2. Add the following to the template

              ```yaml
                {{ .Content }}
                ---
                comment: "{{ .Name }}"
                url: http://{{ .Name }}
                username: rogerio.alcantara@gmail.com
                password-change-url: https://{{ .Name }}/.well-known/change-password
                # This is an example of the available template operations
                # Predefined variables:
                # - .Content: The secret payload, usually a generated password
                # - .Name: The name of this secret
                # - .Path: The path to this secret
                # - .Dir: The dir of this secret
                #
                # Available Template functions:
                # - md5sum: e.g. {{ .Content | md5sum }}
                # - sha1sum: e.g. {{ .Content | sha1sum }}
                # - blake3 e.g. {{ .Content | blake3 }}
                # - md5crypt: e.g. {{ .Content | md5crypt }}
                # - ssha: e.g. {{ .Content | ssha }}
                # - ssha256: e.g. {{ .Content | ssha256 }}
                # - ssha512: e.g. {{ .Content | ssha512 }}
                # - get "key": e.g. {{ get "path/to/some/other/secret" | md5sum }}
              ```

          7. Add the create template for `tokens`:

            1. Run the command

              ```bash
              vi ~/.local/share/gopass/password-store/.gopass/create/2-token.yml
              ```

            2. Add the following to the template

              ```yaml
                ---
                priority: 2
                name: Token
                prefix: tokens
                name_from:
                  - org
                welcome: "🧪 Creating Token"
                attributes:
                  - name: org
                    type: string
                    prompt: Organization
                    min: 1
                  - name: token
                    type: password
                    prompt: Token
                  - name: comment
                    type: string
                    prompt: Comments
                  - url: string
                    type: string
                    prompt: Source
              ```

            3. Sync the changes

              ```bash
                gopass fsck
                # if it fails, run:
                gopass sync
                # if it fails, run:
                cd ~/.local/share/gopass/password-store/
                git push
              ```

          8. Add the create template for `aws`:

            1. Run the command

              ```bash
              vi ~/.local/share/gopass/password-store/.gopass/create/3-aws.yml
              ```

            2. Add the following to the template

              ```yaml
                ---
                priority: 3
                name: AWS
                prefix: aws
                name_from:
                  - org
                  - user
                welcome: "🧪 Creating AWS credentials"
                # https://github.com/gopasspw/gopass/blob/master/docs/commands/create.md?plain=1
                attributes:
                  - name: org
                    type: string
                    prompt: Organization
                    min: 1
                  - name: user
                    type: string
                    prompt: User
                    min: 1
                  - name: password
                    type: password # hide input
                    prompt: Password
                    always_prompt: true # do not offer password generation, always ask
                    charset: abcdefghijklmnop # generate password with this charset
                  - name: comment
                    type: string
                    prompt: Comments
              ```

            3. Sync the changes

              ```bash
                gopass fsck
                # if it fails, run:
                gopass sync
                # if it fails, run:
                cd ~/.local/share/gopass/password-store/
                git push
              ```
cheats:
  What is symmetric cryptography and how does it differ from asymmetric cryptography?:
    desc: While asymmetric cryptography eliminates the key sharing problem, symmetric algorithms offer compact key sizes (128-256 bits), high performance, and quantum resistance
    tags: [crypt, best-practices]
    links: [https://blog.gitguardian.com/symmetric-cryptography-key-management]
    notes:
      - md: | #markdown
          ### What is symmetric cryptography and how does it differ from asymmetric cryptography?

          - **Symmetric cryptography** (or **secret key cryptography**):
            - Uses a single shared key between all parties for encryption and decryption.
            - This is like sending mail in a locked box where both sender and recipient need identical copies of the key.

          - **Asymmetric cryptography**:
            - Uses key pairs consisting of a public key (freely shareable) and a private key (kept secret)
            - Resembling wax-sealing envelopes where only you need the seal while anyone can verify it.

          ### Summary

          - While asymmetric cryptography eliminates the key sharing problem, symmetric algorithms offer compact key sizes (128-256 bits), high performance, and quantum resistance.
  What are the three main use cases for symmetric cryptography in practice?:
    desc: Ephemeral Session Keys, Self-Use Keys, and Pre-Shared Keys (PSKs)
    tags: [crypt, best-practices]
    links: [https://blog.gitguardian.com/symmetric-cryptography-key-management]
    notes:
      - md: | #markdown
          ### What are the three main use cases for symmetric cryptography in practice?

          The three essential use cases are:

          1. **Ephemeral Session Keys**:
            - Temporary keys used in protocols like TLS that are automatically exchanged, used, and destroyed (like in HTTPS connections);

          2. **Self-Use Keys**:
            - Keys used by applications to protect their own data, such as JWT signing keys or Laravel's APP\_KEY for internal encryption; and

          3. **Pre-Shared Keys (PSKs)**:
            - Keys manually distributed between parties before communication, typically used in hardware-constrained environments like smart card systems where dynamic key exchange is impractical.
  What is the biggest security risk when working with session keys?:
    desc: Accidentally logging session keys, which enables "store now, decrypt later" attacks
    tags: [crypt, best-practices]
    links: [https://blog.gitguardian.com/symmetric-cryptography-key-management]
    notes:
      - md: | #markdown
          ### What is the biggest security risk when working with session keys?

          - The primary risk is **accidentally logging session keys**, which enables `"store now, decrypt later"` attacks
            - Where adversaries capture encrypted traffic and decrypt it later using leaked keys.

          - Applications should **never log session keys** in debug output or application logs.
            - When using proven cryptographic libraries and protocols like TLS, the protocol handles key generation, exchange, rotation, and destruction automatically.
            - So developers mainly need to ensure keys aren't inadvertently exposed through logging mechanisms.
  What is the ephemeral key strategy for self-use keys?:
    desc: Generating symmetric keys dynamically at application startup; This provides the best security posture by ensuring keys never exist in persistent form
    tags: [crypt, best-practices]
    links: [https://blog.gitguardian.com/symmetric-cryptography-key-management]
    notes:
      - md: | #markdown
          ### What is the ephemeral key strategy for self-use keys?

          - **The ephemeral key strategy involves:**
            1. Generating symmetric keys dynamically at application startup rather than storing them persistently
            2. Keys are created fresh each time the application starts and only exist in memory during runtime
            3. When the application stops or restarts, keys are discarded and regenerated

          - **Summary:**
            - This approach provides the best security posture by ensuring keys never exist in persistent form
            - It reduces the risk of exposure through system compromise, debug logs, or misconfiguration.
  How can applications implement graceful key rotation without breaking functionality?:
    desc: Limiting fallback keys to a low number, time-bounding their usage, and cleaning all keys when compromise is suspected
    tags: [crypt, best-practices]
    links: [https://blog.gitguardian.com/symmetric-cryptography-key-management]
    notes:
      - md: | #markdown
          ### How can applications implement graceful key rotation without breaking functionality?

          - Applications can use a fallback mechanism that accepts older keys for verification while using new keys for fresh data protection.
            - Django's `SECRET_KEY_FALLBACKS` is a good example:
              - The main `SECRET_KEY` signs new data, while `SECRET_KEY_FALLBACKS` contains rotated keys used only for verification.
              - This ensures continuity (preventing user session invalidation) while enabling frequent rotation.

          ### Key Points

          - Limiting fallback keys to a low number
          - Time-bounding their usage
          - Cleaning all keys when compromise is suspected
  When should pre-shared keys (PSKs) be used and what are their security requirements?:
    desc: Use pre-shared keys only as a last resort with enhanced security measures due to rotation limitations
    tags: [crypt, best-practices]
    links: [https://blog.gitguardian.com/symmetric-cryptography-key-management]
    notes:
      - md: | #markdown
          ### When should pre-shared keys (PSKs) be used and what are their security requirements?

          - **Last Resort Usage:**
            - PSKs should only be used as a last resort in disconnected infrastructure
            - Or when parties lack computational power for asymmetric algorithms (like RFID smart cards)

          - **Enhanced Security Requirements:**
            - They require enhanced security measures
              - Secure storage using Hardware Security Modules (HSMs)
              - Strong cryptographically secure key generation with high entropy
              - Future-proof algorithms like AES-256 for encryption and HMAC-SHA-512 for authentication

          - **Rotation Challenge:**
            - PSKs are typically long-lived and cannot be rotated due to connectivity limitations
  What are the universal best practices for symmetric key management?:
    desc: Secure symmetric key management through proper generation, isolation, rotation, storage, and detection
    tags: [crypt, best-practices]
    links: [https://blog.gitguardian.com/symmetric-cryptography-key-management]
    notes:
      - md: | #markdown
          ### What are the universal best practices for symmetric key management?

          - **Use Secure Cryptographically Secure Key Generation:**
            - Like Linux's `/dev/urandom`

          - **Use Single Purpose Keys _(one key per function)_:**
            - Prevents complex side effects

          - **Aggressive Key Rotation _(as often as possible)_:**
            - Machines handle new secrets easily

          - **Use Secure Storage Solutions _(rather than plain files)_:**
            - Like secret vaults, cloud key management services, HSMs

          - **Comprehensive Secret Detection _(with entropy-based analysis)_:**
            - Symmetric keys don't follow recognizable patterns like API keys
  Transparently encrypt files within a git repository using transcrypt:
    desc: Transparently encrypt files within a git repository
    tags: [git, secrets]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - md: | #markdown
          ## Features
          - Actually encrypts files in the repository
          - Uses OpenSSL to encrypt/decrypt files
          - Files remain encrypted in the repository but are automatically decrypted when checked out
          - Allows selective encryption of specific files
          - Best for: Storing sensitive files that need to be in version control
      - sh: | #shell
          #!/bin/bash

          # Install transcrypt
          brew install transcrypt
      - sh: | #shell
          #!/bin/bash

          ## QUICKSTART

          # 1. Initialize an Unconfigured Repository
          cd /tmp/demo && git init && transcrypt

          # 2. Designate a File to be Encrypted
          $ transcrypt --add sensitive_file
          $ git add .gitattributes sensitive_file
          $ git commit -m 'Add encrypted version of a sensitive file'

          # Encrypt GH_TOKEN and other credentials
          transcrypt -p 'your-password'

          # Encrypt a file
          transcrypt --add-config config/secrets.yml

          # Add to .gitattributes
          .config/credentials filter=crypt diff=crypt

          # Configure which files to encrypt
          echo "private-config.conf filter=crypt diff=crypt" >> .gitattributes
          echo ".env filter=crypt diff=crypt" >> .gitattributes

      - sh: | #shell
          #!/bin/bash

          # Install transcrypt
          brew install transcrypt

          # Initialize in your repository
          cd ~/.dots

          # Encrypt GH_TOKEN and other credentials
          transcrypt -c aes-256-cbc -p 'your-password'

          # Encrypt a file
          transcrypt --add-config config/secrets.yml

          # Add to .gitattributes
          .config/credentials filter=crypt diff=crypt

          # Configure which files to encrypt
          echo "private-config.conf filter=crypt diff=crypt" >> .gitattributes
          echo ".env filter=crypt diff=crypt" >> .gitattributes
      - sh: | #shell
          #!/bin/bash

          ## CONTEXTS
          ## =====================================================================
          ## Context names let you encrypt some files with different passwords for
          ## a different audience, such as super-users. The 'default' context
          ## applies unless you set a context name. Add a context by
          ## reinitialising transcrypt with a context name then add a pattern with
          ## crypt-<CONTEXTNAME> attributes to .gitattributes.
          ## =====================================================================
          ##
          ## To encrypt a file _top-secret in a "super" context
          ##

          # 0. Initialize an Unconfigured Repository
          $ git init
          $ transcrypt

          # 1. Initialise a new "super" context, and set a different password
          $ transcrypt --context=super

          # 2. Add a pattern to .gitattributes with "crypt-super" values
          $ transcrypt --context=super --add=top-secret

          # 3. Add and commit your top-secret and .gitattribute files
          $ git add .gitattributes top-secret
          $ git commit -m "Add top secret file for super-users only"

          # 4. Listing the Currently Encrypted Files
          $ transcrypt --list

          # 5. List all contexts
          $ transcrypt --list-contexts

          # 6. Display the cipher and password for the "super" context
          $ transcrypt --context=super --display
  # SOPS/AGE
  Using SOPS/AGE to encrypt sensitive data in YAML files and store them in git:
    desc: Using SOPS/AGE to encrypt sensitive data in YAML files and store them in git
    tags: [sops, age, encryption, git]
    links: [https://github.com/getsops/sops, https://github.com/FiloSottile/age, https://youtu.be/wqD7k5iNvqs]
    notes:
      - md: | #markdown
          # ONE SENTENCE SUMMARY:
          AGI and SOPS tools enable secure encryption of sensitive values in YAML files for safe storage in Git repositories.

          # MAIN POINTS:
          1. AGI encrypts files to binary format using public/private key pairs but results in non-human-readable files.
          2. SOPS works with AGI to selectively encrypt only values in files while keeping keys readable.
          3. A SOPS configuration file defines encryption rules based on file paths and which keys should be encrypted.
          4. Encrypted YAML files maintain their structure and readability while securing sensitive information.
          5. Naming conventions help prevent accidentally committing unencrypted secrets to Git repositories.
          6. Creating automation scripts simplifies batch encryption/decryption of multiple secret files.
          7. The presenter adds .secret.yaml files to .gitignore while only committing encrypted .secret.sops.yaml versions.
          8. SOPS is not idempotent, so re-encrypting the same file creates different encrypted outputs.
          9. Automation scripts compare file contents before encrypting to avoid unnecessary Git changes.
          10. Taskfile integration allows running encryption/decryption scripts from anywhere in the repository.

          # TAKEAWAYS:
          1. Use AGI and SOPS together to securely store infrastructure-as-code secrets in Git repositories.
          2. Establish consistent naming conventions to differentiate between encrypted and unencrypted files.
          3. Add plain secret files to .gitignore to prevent accidentally committing sensitive information.
          4. Automate secret management with scripts that handle batch encryption and decryption.
          5. SOPS provides a better alternative to external secret stores when simplicity is preferred.
      - sh: | #shell
          #!/usr/bin/env bash
          # Setup and Using Gopass with Age on macOS - TL;DR Tutorial
          # Run each section step by step, don't execute the whole script at once!

          set -e

          echo "🔐 Gopass + Age Setup Tutorial for macOS"
          echo "========================================"
          echo ""
          echo "⚠️  Run each section manually, don't execute this entire script!"
          echo ""

          # ==============================================================================
          # SECTION 1: INSTALLATION
          # ==============================================================================

          echo "📦 1. Install dependencies"
          # Install Homebrew if not already installed
          # /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

          # Install gopass (password manager)
          brew install gopass

          # Install age (encryption tool)
          brew install age

          # Install GitHub CLI (optional, for remote storage)
          brew install gh

          # Verify installations
          gopass version
          age --version
          gh --version

          # ==============================================================================
          # SECTION 2: GENERATE AGE KEY PAIR
          # ==============================================================================

          echo "🔑 2. Generate Age encryption keys"

          # Generate a new Age key pair
          age-keygen -o ~/.config/age/key.txt

          # Show your public key (save this somewhere safe!)
          echo "Your Age public key:"
          age-keygen -y ~/.config/age/key.txt

          # Set proper permissions
          chmod 600 ~/.config/age/key.txt

          # ==============================================================================
          # SECTION 3: SETUP GITHUB REPOSITORY (OPTIONAL)
          # ==============================================================================

          echo "🐙 3. Setup remote Git repository"

          # Authenticate with GitHub
          gh auth login

          # Create a private repository for your password store
          gh repo create pass-store --description="Personal password store" --private

          # Clone the repository
          git clone git@github.com:$(gh api user --jq .login)/password-store.git ~/.local/share/gopass/stores/root

          # Alternative: Initialize local git repo only
          # git init ~/.local/share/gopass/stores/root

          # ==============================================================================
          # SECTION 4: INITIALIZE GOPASS WITH AGE
          # ==============================================================================

          echo "⚡ 4. Initialize gopass with Age backend"

          # Initialize gopass with Age (not GPG)
          gopass setup --crypto age --storage gitfs

          # When prompted:
          # - Enter your Age public key (from step 2)
          # - Set store location: ~/.local/share/gopass/stores/root
          # - Choose a name for your store: "root" (default)

          # Alternative manual setup:
          # gopass init --crypto age --storage gitfs $(age-keygen -y ~/.config/age/key.txt)

          # ==============================================================================
          # SECTION 5: CONFIGURE GOPASS
          # ==============================================================================

          echo "⚙️  5. Configure gopass settings"

          # Set your git identity
          gopass config core.git.user.name "Your Name"
          gopass config core.git.user.email "your.email@example.com"

          # Configure useful settings
          gopass config core.showsafecontent true  # Show safe content without prompting
          gopass config core.autoclip true         # Auto-copy to clipboard
          gopass config core.cliptimeout 45        # Clipboard timeout in seconds

          # Show current configuration
          gopass config

          # ==============================================================================
          # SECTION 6: BASIC USAGE EXAMPLES
          # ==============================================================================

          echo "📝 6. Basic usage examples"

          # Generate and store a new password
          gopass generate websites/github.com/username 20

          # Insert a password manually
          gopass insert websites/twitter.com/username
          # (you'll be prompted to enter the password)

          # Insert multiline secrets (like SSH keys, API tokens)
          gopass insert -m servers/production/ssh-key

          # Store structured data
          gopass insert websites/example.com/account <<EOF
          password: super-secret-password
          username: your-username
          email: your.email@example.com
          2fa-backup-codes: 
            - 123456
            - 789012
          url: https://example.com
          notes: Created on $(date)
          EOF

          # ==============================================================================
          # SECTION 7: RETRIEVE AND MANAGE PASSWORDS
          # ==============================================================================

          echo "🔍 7. Retrieve and manage passwords"

          # List all passwords
          gopass list
          gopass ls  # short form

          # Show a password (copies to clipboard)
          gopass show websites/github.com/username
          gopass websites/github.com/username  # short form

          # Show password without copying to clipboard
          gopass show -c websites/github.com/username

          # Show only the password (first line)
          gopass show -o websites/github.com/username

          # Edit a password entry
          gopass edit websites/github.com/username

          # ==============================================================================
          # SECTION 8: SEARCH AND ORGANIZE
          # ==============================================================================

          echo "🔎 8. Search and organize passwords"

          # Search for passwords
          gopass search github
          gopass find twitter

          # Create folders/organize
          gopass generate work/gitlab.com/username 20
          gopass generate personal/facebook.com/username 20

          # Move/rename entries
          gopass move old/path new/path
          gopass mv websites/old-site.com websites/new-site.com

          # Copy entries
          gopass copy source/path destination/path

          # Delete entries
          gopass delete websites/unused-site.com
          gopass rm websites/unused-site.com  # short form

          # ==============================================================================
          # SECTION 9: SYNC WITH REMOTE REPOSITORY
          # ==============================================================================

          echo "🔄 9. Sync with remote repository"

          # Add remote origin (if not done during setup)
          cd ~/.local/share/gopass/stores/root
          git remote add origin git@github.com:yourusername/password-store.git

          # Push to remote
          gopass git push origin main

          # Pull from remote
          gopass git pull origin main

          # Sync (pull + push)
          gopass sync

          # ==============================================================================
          # SECTION 10: ADVANCED AGE FEATURES
          # ==============================================================================

          echo "🚀 10. Advanced Age integration"

          # Export Age private key to gopass (for other tools like SOPS)
          age-keygen -y ~/.config/age/key.txt | gopass insert -m age/public-key
          cat ~/.config/age/key.txt | gopass insert -m age/private-key

          # Use gopass-stored Age key with SOPS
          export SOPS_AGE_KEY="$(gopass show age/private-key)"
          # Now you can use SOPS with the same Age key

          # Create a script to decrypt files using gopass-stored Age key
          cat > ~/.local/bin/sops-decrypt << 'EOF'
          #!/bin/bash
          export SOPS_AGE_KEY="$(gopass show age/private-key)"
          sops -d "$@"
          EOF
          chmod +x ~/.local/bin/sops-decrypt

          # ==============================================================================
          # SECTION 11: BACKUP AND RECOVERY
          # ==============================================================================

          echo "💾 11. Backup and recovery"

          # Backup your Age private key (CRITICAL!)
          cp ~/.config/age/key.txt ~/Desktop/age-key-backup.txt
          echo "⚠️  Store this backup in a secure location!"

          # Export all passwords (using our export script)
          # ./gopass-export.sh --format yaml ~/Desktop/gopass-backup.yaml

          # Backup gopass config
          cp ~/.config/gopass/config.yml ~/Desktop/gopass-config-backup.yml

          # Recovery process (on new machine):
          # 1. Install gopass and age
          # 2. Restore Age private key to ~/.config/age/key.txt
          # 3. Clone password store repository
          # 4. Initialize gopass: gopass setup --crypto age --storage git

          # ==============================================================================
          # SECTION 12: USEFUL ALIASES AND HELPERS
          # ==============================================================================

          echo "⚡ 12. Useful shell aliases"

          # Add these to your ~/.zshrc or ~/.bashrc
          cat >> ~/.zshrc << 'EOF'

          # Gopass aliases
          alias gp='gopass'
          alias gpl='gopass list'
          alias gps='gopass search'
          alias gpg='gopass generate'
          alias gpc='gopass show -c'  # show without clipboard
          alias gpe='gopass edit'

          # Quick password generation
          alias genpw='gopass generate -n'  # generate without storing

          # Sync shortcut
          alias gpsync='gopass sync'

          # Age + SOPS integration
          alias sops-decrypt='SOPS_AGE_KEY="$(gopass show age/private-key)" sops -d'
          alias sops-encrypt='SOPS_AGE_KEY="$(gopass show age/private-key)" sops -e'

          EOF

          # ==============================================================================
          # SECTION 13: SECURITY BEST PRACTICES
          # ==============================================================================

          echo "🛡️  13. Security best practices"

          # Set secure file permissions
          chmod 700 ~/.config/gopass
          chmod 700 ~/.local/share/gopass
          chmod 600 ~/.config/age/key.txt

          # Regularly backup your Age private key
          # Store backup in multiple secure locations (encrypted USB, secure cloud storage)

          # Use strong master passwords for your system
          # Enable full disk encryption (FileVault on macOS)

          # Regularly update gopass and age
          brew upgrade gopass age

          # Enable git commit signing (optional)
          gopass config core.git.sign true

          # ==============================================================================
          # SECTION 14: TROUBLESHOOTING
          # ==============================================================================

          echo "🔧 14. Common troubleshooting"

          # Check gopass configuration
          gopass config

          # Verify Age key is working
          echo "test" | age -r $(age-keygen -y ~/.config/age/key.txt) | age -d -i ~/.config/age/key.txt

          # Reset clipboard if stuck
          pbcopy < /dev/null

          # Check git status in store
          gopass git status

          # Repair git repository if corrupted
          cd ~/.local/share/gopass/stores/root
          git fsck

          # Re-initialize store if needed (CAREFUL - this will reset everything!)
          # gopass init --crypto age $(age-keygen -y ~/.config/age/key.txt)

          echo ""
          echo "✅ Setup complete! Your gopass + age password manager is ready."
          echo ""
          echo "📚 Quick reference:"
          echo "   gopass generate site.com/user 20    # Generate new password"
          echo "   gopass show site.com/user           # Show password"
          echo "   gopass list                         # List all passwords"
          echo "   gopass search term                  # Search passwords"
          echo "   gopass sync                         # Sync with remote"
          echo ""
          echo "🔐 Remember to backup your Age private key: ~/.config/age/key.txt"

commands:
  ## GIT transcrypt
  ## https://github.com/elasticdog/transcrypt
  transcrypt -c aes-256-cbc -p 'password':
    desc: Initialize transcrypt in a repository with AES-256-CBC cipher
    tags: [init, setup, encryption]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt -c aes-256-ctr -p 'password':
    desc: Initialize transcrypt in a repository with AES-256-CTR cipher
    tags: [init, setup, encryption]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --list-ciphers:
    desc: Display available ciphers for transcrypt
    tags: [info, list, ciphers]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --display:
    desc: Show current repository's settings and files under encryption
    tags: [config, status, info]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --add-config path/to/file:
    desc: Add new file to be encrypted without re-encrypting existing files
    tags: [config, files, manage]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: | #shell
          # Add multiple files
          transcrypt --add-config file1 file2
  transcrypt --flush-credentials:
    desc: Remove locally cached encryption credentials
    tags: [security, credentials, cleanup]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --rekey:
    desc: Re-encrypt all encrypted files with a new password
    tags: [security, password, update]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: | #shell
          # First flush old credentials
          transcrypt --flush-credentials

          # Then rekey with new password
          transcrypt --rekey
  transcrypt --import path/to/keyfile:
    desc: Import encryption configuration from a file
    tags: [config, import, setup]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --export-gpg recipient@example.com:
    desc: Export credentials encrypted with GPG for secure sharing
    tags: [security, sharing, export]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --uninstall:
    desc: Remove transcrypt configuration from repository
    tags: [cleanup, remove, config]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: | #shell
          # Decrypt files first
          transcrypt --flush-credentials
          transcrypt --uninstall
  transcrypt --show-raw file:
    desc: Display raw encrypted contents of a file
    tags: [debug, inspect, content]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --verify:
    desc: Verify repository configuration and file consistency
    tags: [verify, check, status]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: | #shell
          # Check specific files
          transcrypt --verify path/to/file
  # SOPS
  brew install sops:
    desc: Install SOPS
    tags: [sops, install]
  brew install age:
    desc: Install AGE
    tags: [age, install]
  sops -e -i config.yml:
    desc: Encrypt a file
    tags: [sops, encrypt]
  sops -d config.yml:
    desc: Decrypt a file
    tags: [sops, decrypt]
  sops --encrypt --in-place --age-recipient <recipient-id> <file>:
    desc: Encrypt a file with AGE
    tags: [age, encrypt]
  sops --decrypt --in-place <file>:
    desc: Decrypt a file with AGE
    tags: [age, decrypt]
