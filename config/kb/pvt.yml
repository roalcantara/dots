      - md: | #markdown
          1.	Sobre o papel e expectativas
            - Qual o principal desafio técnico que o time enfrenta hoje em Node.js?
            - O papel envolve apenas desenvolvimento ou também participação em decisões de arquitetura e DevOps?
            - Qual a expectativa em relação à liderança técnica (mentoria, code review, definição de padrões)?

          2.	Sobre a stack e infraestrutura
            - Quais serviços AWS são mais críticos no dia a dia (uso intenso de Lambda, SQS, DynamoDB, etc.)?
            - O time já usa Terraform ou há abertura para outras ferramentas de IaC (Ansible, Pulumi, CDK)?

          3.	Sobre o time e cultura
            - Como está estruturado o time de back-end? Há squads multidisciplinares?
            - Como funcionam os rituais de agilidade e a comunicação entre equipes?

          4.	Sobre crescimento
            - Há oportunidades de atuação cross (ex.: arquitetura, DevOps, observabilidade)?
            - Como é feita a avaliação de performance para o bônus semestral?
      - md: | #markdown
          | Service | Purpose | Typical Use Cases | Node.js SDK Integration | Interview-Style Questions |
          | AWS Lambda | Run code without managing servers (serverless compute). | REST APIs, cron jobs, event triggers (e.g., S3 upload → process file), lightweight backends. | @aws-sdk/client-lambda or via API Gateway → Lambda handler. Functions are written in Node.js. | - How do you optimize cold starts in Node.js Lambdas?  - What are best practices for packaging dependencies? |
          | AWS SQS | Reliable message queue for async processing and decoupling. | Order processing, job scheduling, retry queues, buffering bursts of traffic. | @aws-sdk/client-sqs: sendMessage, receiveMessage, deleteMessage. Often consumed by Lambda. | - How would you design a system to process millions of jobs per day with guaranteed delivery?  - Difference between Standard and FIFO queues? |
          | AWS SNS | Pub/Sub messaging to multiple subscribers. | Notifications, fan-out events (e.g., one event triggers Lambda + email + SQS), system alerts. | @aws-sdk/client-sns: publish to a topic; subscribe consumers (SQS, Lambda, HTTP endpoints). | - When would you choose SNS vs. SQS?  - How would you prevent duplicate deliveries in SNS? |
          | AWS DynamoDB | NoSQL key-value and document database, fully managed and scalable. | User profiles, session storage, shopping carts, IoT data, event logs. | @aws-sdk/lib-dynamodb: putItem, getItem, query, scan. Works well with Lambda (low latency). | - How do you model one-to-many relationships in DynamoDB?  - Difference between query and scan?  - How to handle hot partitions? |
      - md: | #markdown
          ### AWS Lambda

          **How do you optimize cold starts in Node.js Lambdas?**
            - Use smaller package size, keep functions warm (provisioned concurrency), avoid heavy init code, use newer runtimes (Node 18+).
            - What are best practices for packaging dependencies?
            - Bundle only what’s needed, use Layers for shared libs, avoid large modules, tree-shake when possible.

          ### AWS SQS

          **How would you design a system to process millions of jobs per day with guaranteed delivery?**
            - Use SQS Standard (scale) or FIFO (ordering), auto-scaling consumers (Lambda or ECS), Dead Letter Queues (DLQ) for failures, visibility timeout tuning.
            - Difference between Standard and FIFO queues?
            - Standard = nearly unlimited throughput, at-least-once delivery, possible duplicates.
            - FIFO = exactly-once delivery, strict ordering, lower throughput.

          ### AWS SNS

          **When would you choose SNS vs. SQS?**
            - SNS = broadcast (1 message → many subscribers).
            - SQS = point-to-point queue (1 message → 1 consumer).
            - Often combined: SNS → SQS fan-out.

          **How would you prevent duplicate deliveries in SNS?**
            - Use message attributes for deduplication, idempotency checks on consumers, or pair SNS with SQS FIFO.

          ### AWS DynamoDB

          **How do you model one-to-many relationships in DynamoDB?**
            - Use partition key + sort key (e.g., UserId as PK, OrderId as SK), or single-table design with item types.

          **Difference between query and scan?**
            - query = efficient, uses keys and indexes.
            - scan = full table read (slow, costly).

          **How to handle hot partitions?**

            - Distribute keys better (e.g., add random suffix/shard ID), use write sharding, or increase WCU/RCU with auto-scaling.
