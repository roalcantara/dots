  TLDR:
    desc: TLDR Template
    tags: [pvt, jobs]
    notes:
      - md: | #markdown
          # TL;DR BEST PRACTICES

          ## OVERVIEW

          1. **GOALS**

            - To answer the user's immediate questions:
                1. `"What is this?"`
                2. `"How do I use it?"`
                3. `"What's next?"`

          2. **GUIDELINES**

              - Concise and to the point
              - Easy to understand
              - Easy to use
              - Easy to remember
              - Easy to implement
              - Easy to test

          3. **PRINCIPLES**

              - Lead with the outcome/benefit
              - Use active voice and imperative mood
              - Include concrete examples over abstract explanations
              - Keep each section to 3-4 items max
              - Use consistent formatting (commands in code blocks, emphasis in bold)
              - Always include a `"quick win"` - something users can try immediately

          ## TEMPLATES

          1. **DESIGN PATTERNS** _(100-150 words)_

            1. **One-line description** (what it does)
            2. **Problem** (why you need it)
            3. **Solution** (how it works)
            4. **When to use** (specific scenarios)
            5. **Related patterns** (brief comparisons)
            6. **Code example** (concrete implementation)

          2. **TOOLS** _(50-100 words)_

            1. Simple Commands

                - **Tool Name | Category**: One-line description of what it does
                - **Common Use Cases**:
                  - **Scenario 1**: `specific command`
                  - **Scenario 2**: `specific command`
                - **Essential Commands**:

                    ```bash
                    command --flag value          # Description
                    command subcommand           # Description
                    command --help              # Get help
                    ```

            2. Tools with Subcommands

                - **Tool Name | Category**: One-line description
                - **Core Commands**:

                    ```bash
                    tool init                   # Initialize
                    tool add <item>             # Add item
                    tool list                   # List items
                    tool remove <item>          # Remove item
                    ```

                - **Common Workflows**:
                  1. Setup: `tool init && tool config set key value`
                  2. Daily use `tool add item && tool sync`

                - **Pro Tips**:
                  - Use `tool --help` for any command
                  - Config stored in `~/.tool/config`

          3. **CONCEPTS** _(100-150 words)_

            - **Concept Name | Category**: What it is in one sentence
            - **Problem**:
              - What problem does this solve?
              - 1-2 sentences
            - **How It Works**:
              - Brief explanation of the mechanism
              - 2-3 sentences
            - **When to Use**:
              - Scenario 1
              - Scenario 2
              - Scenario 3
            - **Trade-offs**:
              - **Pros**:
                - Benefit 1
                - Benefit 2
              - **Cons**:
                - Drawback 1
                - Drawback 2
            - **Alternatives**:
              - **Alternative 1**:
                - When to use instead
              - **Alternative 2**:
                - When to use instead
            - **Code Example**: _(if applicable)_

                ```typescript
                const example = "concrete implementation";
                ```

          4. **HOW-TO** _(75-125 words)_

            - **End goal**:
              - In one sentence
            - **Prerequisites**:
              - Requirement 1
              - Requirement 2
            - **Steps**:
              1. Step 1
              2. Step 2
              3. Step 3
            - **Result**:
              - What you should see/get
            - **Next Steps**:
              - Related concepts to explore
            - **References**:
              - Link to advanced tutorial
