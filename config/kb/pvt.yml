    desc: Job Experience
    tags: [pvt, jobs]
    notes:
      - md: | #markdown
          **PCI DSS Compliance:**

          **Arquitetura Segura:**
          - Segmentação de rede isolando ambientes que processam dados de cartão (CDE - Cardholder Data Environment)
          - Implementação de DMZ para APIs públicas, com WAF para filtrar requisições maliciosas
          - Microserviços stateless para reduzir superfície de ataque

          **Proteção de Dados:**
          - Tokenização de dados de cartão usando vaults externos (nunca armazenamos PANs)
          - Criptografia AES-256 para dados em trânsito e em repouso
          - Hashing irreversível (bcrypt) para dados de autenticação
          - Key rotation automática usando Cloud KMS

          **Controles de Acesso:**
          - Princípio do menor privilégio com RBAC
          - MFA obrigatória para acessos administrativos
          - Logs de auditoria imutáveis com retenção de 1 ano
          - Review trimestral de acessos e permissões

          **LGPD Compliance:**

          **Governança de Dados:**
          - Mapeamento completo do fluxo de dados pessoais (data flow mapping)
          - Implementação de Privacy by Design desde o desenvolvimento
          - DPO envolvido em todas as decisões arquiteturais

          **Direitos dos Titulares:**
          - APIs para portabilidade de dados (JSON estruturado)
          - Processo automatizado de exclusão de dados (right to erasure)
          - Consentimento granular com opt-in explícito
          - Logs de consentimento com timestamp e versioning

          **Técnicas de Proteção:**
          - Pseudonimização para análises de dados
          - Minimização: coleta apenas dados estritamente necessários
          - Anonimização para dados de analytics (k-anonymity)
          - Data retention policies automatizadas

          **Monitoramento e Auditoria:**
          - SIEM para detecção de anomalias em tempo real
          - Vulnerability scanning automatizado
          - Penetration testing semestral
          - Compliance dashboards para stakeholders
