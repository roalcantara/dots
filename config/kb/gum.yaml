commands:
  gum input --placeholder "What's your name?":
    desc: Create a simple text input prompt
    tags:
      - gum
      - input
      - interactive
  gum input --password --placeholder "Enter password":
    desc: Create a password input that masks the characters
    tags:
      - gum
      - input
      - security
  gum write --placeholder "Enter description":
    desc: Create a multi-line text input area
    tags:
      - gum
      - input
      - multiline
    notes:
      - sh: |
          # With character limit
          gum write --char-limit 500

          # With specific dimensions
          gum write --width 50 --height 10
  gum choose "option1" "option2" "option3":
    desc: Create a single-choice selection menu
    tags:
      - gum
      - choose
      - menu
    notes:
      - sh: |
          # Multiple selection
          gum choose --multiple "opt1" "opt2" "opt3"

          # With selection limit
          gum choose --multiple --limit 2 "opt1" "opt2" "opt3"
  gum style --foreground 212 "Colored text":
    desc: Style text with colors and formatting
    tags:
      - text-formatting
      - color-coding
      - styles
    notes:
      - sh: |
          # Combined styles
          gum style --foreground 212 --background 198 --bold "Text"

          # With border
          gum style --border double --margin "1" "Text"
  gum style --foreground 212 --border-foreground 212 --border double --align center --width 50 --margin "1 2" --padding "2 2" --margin "1 2" --padding "2 4" 'Bubble Gum (1¢)' 'So sweet and so fresh!':
    desc: Style text with colors, formatting and borders
    tags:
      - border
      - format
      - gum
      - style
    notes:
      - sh: |
          # With border
          gum style --border double --margin "1" "Text"
  gum spin --spinner dot --title "Loading...":
    desc: Display a loading spinner with custom message
    tags:
      - gum
      - spinner
      - loading
    notes:
      - sh: |
          # With timeout
          gum spin --timeout 3s -- long_command

          # Custom spinner type
          gum spin --spinner points -- sleep 5
  gum confirm "Are you sure?":
    desc: Create a yes/no confirmation prompt
    tags:
      - gum
      - confirm
      - interactive
    notes:
      - sh: |
          # Custom buttons
          gum confirm "Proceed?" --affirmative "YES" --negative "NO"

          # Default selection
          gum confirm "Continue?" --default=false
  gum file .:
    desc: Interactive file selection from current directory
    tags:
      - gum
      - file
      - selection
    notes:
      - sh: |
          # Directory selection
          gum file --directory .

          # With file type filter
          gum file --glob "*.yaml"
  gum format -t progress:
    desc: Create a progress bar display
    tags:
      - gum
      - progress
      - ui
    notes:
      - sh: |
          # Simple progress simulation
          for i in $(seq 0 10); do
            echo $i
            sleep 0.1
          done | gum format -t progress
  gum table:
    desc: Display data in table format
    tags:
      - gum
      - table
      - display
    notes:
      - sh: |
          # CSV input
          echo "Name,Age\nJohn,30" | gum table

          # Custom separator
          echo "ID|Status" | gum table --separator "|"
  gum table create interactive and formatted tables in the terminal:
    desc: Create interactive and formatted tables in the terminal
    tags:
      - cli
      - display
      - format
      - gum
      - table
    notes:
      - sh: |
          # Basic CSV data with headers
          echo "ID,Name,Status,LastSeen
          1,Backend API,Running,2024-03-15
          2,Frontend App,Failing,2024-03-14
          3,Database,Running,2024-03-15" | gum table
      - md: |
          ## Output examples would look like:

          | ID | Name         | Status  | LastSeen   |
          |----|--------------|---------|------------|
          | 1  | Backend API  | Running | 2024-03-15 |
          | 2  | Frontend App | Failing | 2024-03-14 |
          | 3  | Database     | Running | 2024-03-15 |
      - sh: |
          # Custom bordered table with specific separator and width
          echo "Service | Status | Memory | CPU
          API | ✅ | 256MB | 45%
          Worker | ⚠️ | 512MB | 78%
          Cache | ✅ | 128MB | 23%" | \
          gum table \
            --separator "|" \
            --width 50 \
            --border double
      - md: |
          ### Custom bordered table

          ╔═══════════╦══════════╦══════════╦═══════╗
          ║ Service   ║ Status   ║ Memory   ║ CPU   ║
          ╠═══════════╬══════════╬══════════╬═══════╣
          ║ API      ║ ✅       ║ 256MB    ║ 45%   ║
          ║ Worker   ║ ⚠️       ║ 512MB    ║ 78%   ║
          ║ Cache    ║ ✅       ║ 128MB    ║ 23%   ║
          ╚═══════════╩══════════╩══════════╩═══════╝
      - sh: |
          # Combining with other commands for system monitoring
          ps aux | \
            awk 'NR<2{print $1,$2,$3,$4,$11;next}{print $1,$2,$3,$4,$11}' | \
            tr ' ' ',' | \
            gum table --width 80 --separator ","

          # Using with JSON data via jq
          echo '{"services": [
            {"name": "auth", "status": "up", "latency": "45ms"},
            {"name": "api", "status": "up", "latency": "62ms"},
            {"name": "db", "status": "down", "latency": "---"}
          ]}' | \
          jq -r '.services[] | [.name, .status, .latency] | @csv' | \
          gum table --separator "," --width 40
      - md: |
          ### JSON data converted to table

          | name | status | latency |
          |------|--------|---------|
          | auth | up     | 45ms    |
          | api  | up     | 62ms    |
          | db   | down   | ---     |
  gum filter:
    desc: Interactive text filtering and selection
    tags:
      - gum
      - filter
      - search
    notes:
      - sh: |
          # Filter git branches
          git branch | gum filter

          # Filter with limit
          cat items.txt | gum filter --limit 3
  gum join:
    desc: Join text horizontally or vertically
    tags:
      - gum
      - join
      - layout
    notes:
      - sh: |
          # Horizontal join
          gum join "Left" "Right"

          # Vertical join
          gum join --vertical "Top" "Bottom"
    links:
      - https://github.com/charmbracelet/gum
