  https://github.com/coder/aicommit:
    desc: AI Commit | A tool that writes your git commit messages for you with AI
    tags: [ai, tools, git]
    notes:
      - md: | #markdown
          ## About

          aicommit will read the COMMITS.md file in the root of the repository to determine the style guide.
          It is optional, but if it exists, it will be followed even if the rules there diverge from the norm.
          If there is no repo style guide, aicommit will look for a user style guide in ~/COMMITS.md.
