cheats:
  Brief, high-level explanation of the main LLM/AI concepts:
    desc: good for interviews or quick intros
    tags:
      - ai
      - tool
    notes:
      - md: |
          ### LLM / AI Main Concepts

          > LLMs are AI models trained on huge text datasets that learn language patterns, enabling them to understand prompts and generate coherent, context-aware responses

          - **AI (Artificial Intelligence):** The broad field of making machines perform tasks that usually require human intelligence (reasoning, learning, perception).
          - **Machine Learning (ML):** A subset of AI where systems learn patterns from data instead of being explicitly programmed.
          - **Neural Networks:** Algorithms inspired by the brain, built from layers of interconnected nodes that process information.
          - **Deep Learning:** Using large, multi-layer neural networks to model complex patterns (e.g., image recognition, language understanding).
          - **LLMs (Large Language Models):** A type of deep learning model trained on massive amounts of text to understand and generate human-like language (e.g., GPT, LLaMA).
          - **Training:** The process of feeding data into a model so it adjusts weights (parameters) to learn patterns.
          - **Inference:** When a trained model makes predictions or generates outputs based on new input.
          - **Tokens:** The chunks of text (words or subwords) an LLM reads and generates.
          - **Prompting:** Giving instructions or context to an LLM to guide its output.
          - **Fine-tuning / RAG:** Ways to specialize LLMs: fine-tuning = retrain with specific data, RAG (Retrieval-Augmented Generation) = combine LLMs with external knowledge sources.
