  https://opencode.ai:
    desc: AI-powered coding agent built for the terminal
    tags:
      - ai
      - code
      - tool
    links:
      - Docs: https://opencode.ai/docs
      - GitHub: https://github.com/opencodeai/opencode
      - Overview: https://youtu.be/2JQcUW6FrQw
      - OpenCode + Neovim: https://youtu.be/3szpSiGjBkQ
      - Models.dev: https://models.dev
      - Setup OpenCode in 5 minutes: https://youtu.be/KWo3lo5VipI
    notes:
      - md: |
          ## AI-powered coding agent built for the terminal

          ### Features

          - **Native TUI**: A responsive, native, themeable terminal UI.
          - **LSP enabled**: Automatically loads the right LSPs for the LLM.
          - **Multi-session**: Start multiple agents in parallel on the same project.
          - **Shareable links**: Share a link to any sessions for reference or to debug.
          - **Claude Pro**: Log in with Anthropic to use your Claude Pro or Max account.
          - **Use any model**: Supports 75+ LLM providers through Models.dev, including local models.
      - jsonc: |
          // ~/.config/opencode/opencode.jsonc
          // Opencode | Global configuration
          // https://opencode.ai/docs/config/#global
          {
            "$schema": "https://opencode.ai/config.json",
            // https://opencode.ai/docs/themes/
            "theme": "tokyonight",
            "autoupdate": true
          }
      - sh: |
          #!/bin/bash

          # Install OpenCode
          $ brew install sst/tap/opencode

          # Add initial configuration
          $ mkdir -p ~/.config/opencode
          $ vi ~/.config/opencode/opencode.jsonc

          # Add the token for your(s) provider(s)
          $ opencode auth login

          # Run OpenCode
          $ opencode

          # 1. Type a command
          $ create a new bun project using Hono and provide a hello world endpoint
          # 💡 if it hangs, CTROL+C and try again
          # 💡 In another terminal, run curl http://localhost:3000

          # 2. Type other command
          $ init a git repo, add .gitignore and create initial commit following the conventional commit specification

          # 3. Add a new feature
          $ add another enpopint, called books, that should return some sample book data
          # 💡 In another terminal, run curl http://localhost:3000/books

          # AGENTS: Specialized AI assistants that can be configured for specific tasks and workflows
          # https://opencode.ai/docs/agents

          # Create new agents execute
          $ opencode agent create

          # 💡 Some common use cases for different agents
          # Build agent: Full development work with all tools enabled
          # Plan agent: Analysis and planning without making changes
          # Review agent: Code review with read-only access plus documentation tools
          # Debug agent: Focused on investigation with bash and read tools enabled
          # Docs agent: Documentation writing with file operations but no system commands
          # More: https://opencode.ai/docs/agents/#examples
