commands:
  # MVD (Markdown Viewer)
  # https://github.com/axiros/terminal-markdown-viewer

  pip install mdv:
    desc: Install terminal-markdown-viewer using pip
    tags: [mdv, markdown]
    links:
      - https://github.com/axiros/terminal-markdown-viewer

  mdv -A README.md:
    desc: Disable file-wide layout (useful for small files)
    tags: [mdv, markdown]

  mdv -i README.md:
    desc: Interactive mode (allows scrolling)
    tags: [mdv, markdown]

  mdv README.md:
    desc: View a markdown file with default theme
    tags: [mdv, markdown]

  mdv -c monokai README.md:
    desc: Use a specific code block theme
    tags: [mdv, markdown]

  mdv --list-code-themes:
    desc: List available code block themes
    tags: [mdv, markdown]

  echo "# Hello World" | mdv -:
    desc: Display markdown from stdin
    tags: [mdv, markdown]

  mdv -x 2 README.md:
    desc: Set tab width (default is 4)
    tags: [mdv, markdown]

  mdv --header-nesting=0 README.md:
    desc: Hide header tags
    tags: [mdv, markdown]

  mdv -t 785.3224 README.md:
    desc: 'View markdown file with a popular theme. AVAILABLE: 784.0134, 785.3184, 785.3224, 956.1146'
    tags: [mdv, markdown]

  mdv --list-themes:
    desc: Display available themes
    tags: [mdv, markdown]

  mdv -c monokai -w 100 -n README.md:
    desc: View markdown with monokai code highlighting, custom width, and line numbers
    tags: [mdv, markdown]

  mdv -w 100 README.md:
    desc: Set custom width (default is your terminal width)
    tags: [mdv, markdown]

  mdv -n README.md:
    desc: Display line numbers
    tags: [mdv, markdown]

  echo "# Test" | mdv -:
    desc: Preview markdown from stdin
    tags: [mdv, markdown]

  watch -n 1 mdv README.md:
    desc: Live preview of markdown file, updates every second
    tags: [mdv, markdown]
