          ### Practical Comparison

          #### Using sqlite3 CLI

          ```sh
          $ sqlite3 moviedb.sqlite

          SQLite version 3.43.0
          sqlite> .tables
          movies  cast  crew

          sqlite> SELECT title FROM movies LIMIT 3;
          Inception
          The Dark Knight
          Interstellar

          sqlite> .exit
          ```

          #### Using libsql CLI

          ```sh
          $ libsql moviedb.sqlite

          libSQL version 0.2.1 (based on SQLite 3.43.0)
          libsql> .tables
          movies  cast  crew

          libsql> SELECT title FROM movies LIMIT 3;
          Inception
          The Dark Knight
          Interstellar

          # Same commands, same experience
          libsql> .exit
          ```
