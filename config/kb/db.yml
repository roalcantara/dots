    notes:
      - md: | #markdown
          ## Graph

          > Fraud detection, social networking, recommendation engines

          ### Use Cases
          Ideal for applications requiring complex relationships and traversals.

          ### Data Structure
          Stores data in nodes and edges, with nodes representing entities and edges representing relationships between nodes.

          ### Schema
          Schema-less, allowing for varied and dynamic data structures within documents. Easier to evolve with changing data requirements.

          ### Query Language
          Uses JSON-based query languages or JavaScript-like syntax, depending on the specific database.

          ### Scaling
          Often designed for horizontal scaling (distribution across multiple servers).

          ### Relationships
          Relationships are not as inherent. Often uses embedded documents and arrays to represent relationships.

          ### ACID Properties
          May prioritize performance and scalability over strict adherence to ACID properties, though some modern document databases also support ACID transactions.

          ### Examples
            - Amazon Neptune
            - Neo4j
            - Amazon DynamoDB
            - Amazon ElastiCache
            - Redis
            - Memcached
