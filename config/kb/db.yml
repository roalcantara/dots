  sqlite3 demo.sqlite "VACUUM;":
    desc: Creating database file with VACUUM - repacking it into a minimal amount of disk space
    tags: [db, sqlite]
    links: [https://sqlite.org]
    notes:
      - md: | #markdown
          ### What is VACUUM?

          `VACUUM` is a SQLite command that rebuilds the database file, repacking it into a minimal amount of disk space.

          ### What VACUUM Does?

          1. **Defragments the database** - Removes fragmented free space
          2. **Reclaims unused space** - Shrinks the file size after deletions
          3. **Rebuilds the entire database** - Creates a fresh, optimized copy
          4. **Reorders data** - Reorganizes tables for better performance

          ### When is VACUUM Useful?

          ```sql
          -- After deleting lots of data
          DELETE FROM large_table WHERE condition;
          VACUUM;  -- Reclaim the freed space

          -- Database file is 100MB but only has 20MB of actual data
          VACUUM;  -- Shrinks file from 100MB to ~20MB

          -- Database has become fragmented over time
          VACUUM;  -- Defragments and optimizes
          ```

          ### Why We Use It to Create Empty Database?

          When run `sqlite3 demo.sqlite "VACUUM;"`:

          1. Creates a valid SQLite database file (if it doesn't exist)
          2. Initializes the proper SQLite file header
          3. Compacts it to minimal size (since it's empty)

          ```sh
          # What happens:
          sqlite3 new.db "VACUUM;"

          # Creates a valid, minimal SQLite file:
          # - Proper SQLite header (100 bytes)
          # - Database schema page
          # - Properly formatted and ready to use
          ```

          ### Performance Considerations

          ```sh
          -- VACUUM can be slow on large databases
          -- It creates a complete copy of the database

          -- On a 1GB database:
          VACUUM;  -- Might take 10-30 seconds

          -- On a 10GB database:
          VACUUM;  -- Might take several minutes

          -- Requires 2x the disk space temporarily
          -- (original + copy during rebuild)
          ```

          ### When to VACUUM?

          ```sql
          -- ✅ After bulk deletes
          DELETE FROM logs WHERE created_at < '2020-01-01';
          VACUUM;

          -- ✅ During maintenance windows
          -- Schedule weekly VACUUM on production databases

          -- ✅ After schema changes
          ALTER TABLE users ADD COLUMN new_field TEXT;
          VACUUM;
          ```

          ### When NOT to VACUUM?

          ```sql
          -- ❌ On every DELETE (too expensive)
          DELETE FROM items WHERE id = 1;
          VACUUM;  -- Don't do this!

          -- ❌ On active production databases during peak hours
          -- Wait for low-traffic period

          -- ❌ If disk space is limited
          -- VACUUM needs temporary space equal to DB size
          ````

