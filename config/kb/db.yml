  https://turso.tech/libsql:
    desc: libsql | SQLite-compatible modern fork
    tags: [db, libsql, sqlite]
    notes:
      - md: | #markdown
          ## What is libsql?

          libsql is a modern, SQLite-compatible database engine designed for high performance, scalability, and ease of use. It is built as a fork of SQLite with enhancements to support distributed and cloud-native applications.

          ## Key Features

          - **SQLite Compatibility**: libsql maintains compatibility with SQLite, allowing you to use existing SQLite tools and libraries.
          - **High Performance**: Optimized for speed and efficiency, making it suitable for high-throughput applications.
          - **Scalability**: Designed to scale horizontally across multiple nodes, making it ideal for distributed systems.
          - **Cloud-Native**: Built with cloud environments in mind, supporting modern deployment practices.

          ### Feature Comparison

          | **Feature**           | **sqlite3**                | **libsql**                 |
          |-----------------------|----------------------------|----------------------------|
          | Base                  | Original SQLite            | Fork of SQLite             |
          | Compatibility         | 100% SQLite                | 99%+ SQLite compatible     |
          | Extensions            | Standard SQLite            | + libSQL extensions        |
          | WASM Functions        | ❌ No                       | ✅ Yes                     |
          | Vector Search         | ❌ No                       | ✅ Yes (via extension)     |
          | Randomized ROWID      | ❌ No                       | ✅ Yes                     |
          | CLI Experience        | Traditional                | Same + new features        |
          | File Format           | SQLite format              | Compatible SQLite format   |

          ## Getting Started

          To get started with libsql, you can follow these steps:

          1. **Install libsql**: You can install libsql using package managers or by building from source. For example, using Homebrew:
             ```sh
             brew tap tursodatabase/tap
             brew install libsql
             ```

          2. **Create a Database**: You can create a new database using the `libsql` command-line tool:
             ```sh
             libsql mydatabase.db
             ```

          3. **Use libsql in Your Application**: You can connect to libsql using standard SQLite libraries in your programming language of choice.

          ## Example Usage

          Here is a simple example of how to use libsql in a Node.js application:

          ```javascript
          const sqlite3 = require('sqlite3').verbose();
          const db = new sqlite3.Database('mydatabase.db');

          db.serialize(() => {
            db.run("CREATE TABLE user (id INT, name TEXT)");

            const stmt = db.prepare("INSERT INTO user VALUES (?, ?)");
            stmt.run(1, "Alice");
            stmt.run(2, "Bob");
            stmt.finalize();

            db.each("SELECT id, name FROM user", (err, row) => {
              console.log(row.id + ": " + row.name);
            });
          });

          db.close();
          ```
