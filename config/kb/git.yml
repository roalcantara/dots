cheats:
  Conventional Commits:
    desc: Conventional Commits
    tags: [git, commits]
    links: [https://conventionalcommits.org, https://jorisroovers.com/gitlint, https://pre-commit.com]
    notes:
      - md: | #markdown
          ### Commit Message Format

          The commit message should be structured as follows:

          ```
          <type>[optional scope]: <description>

          [optional body]

          [optional footer]
          ```

          ### Commit Message Components

          1. **Type**: The type of change being made. It can be one of the following:
            - **feat**: A new feature
            - **fix**: A bug fix
            - **docs**: Documentation changes
            - **style**: Changes that do not affect the meaning of the code (white-space, formatting, etc.)
            - **refactor**: Code changes that neither fix a bug nor add a feature
            - **test**: Adding missing tests or correcting existing tests
            - **chore**: Changes

          2. **Scope**: The scope of the change. It can be anything specifying the place of the commit change.
          3. **Description**: A short description of the change.
          4. **Body**: A more detailed description of the change.
          5. **Footer**: Additional information about the change, such as breaking changes or issues fixed.
  Conventional Commits Examples:
    desc: Conventional Commits Examples
    tags: [git, commits]
    links: [https://conventionalcommits.org, https://jorisroovers.com/gitlint, https://pre-commit.com]
    notes:
      - md: | #markdown
          ## Examples

          ### Commit message with description and breaking change footer

          ```plaintext
          feat: Allow provided config object to extend other configs

          BREAKING CHANGE: `extends` key in config file is now used for extending other config files
          ```

          ---

          ### Commit message with `!` to draw attention to breaking change

          ```plaintext
          feat!: Send an email to the customer when a product is shipped
          ```

          ---

          ### Commit message with scope and `!` to draw attention to breaking change

          ```plaintext
          feat(api)!: Send an email to the customer when a product is shipped
          ```

          ---

          ### Commit message with both `!` and breaking change footer

          ```plaintext
          chore!: Drop support for Node 6

          BREAKING CHANGE: use JavaScript features not available in Node 6.
          ```

          ---

          ### Commit message with multi-paragraph body and multiple footers

          ```plaintext
          fix: Prevent racing of requests

          Introduce a request id and a reference to latest request. Dismiss incoming responses other than from latest request.

          Remove timeouts which were used to mitigate the racing issue but are obsolete now.

          Reviewed-by: Z
          Refs: #123
          ```
