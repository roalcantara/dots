commands:
  ## Git is your code time machine. It tracks every change, enables team collaboration without
  ## conflicts, and lets you undo mistakes. These commands help manage source code versions like a professional developer.

  ## BASIC COMMANDS
  git init:
    desc: Initializes a new Git repository in the current directory.
    tags: [git]
  git clone https://github.com/user/repo.git:
    desc: Copies a remote repository to the local machine.
    tags: [git]
  git status:
    desc: Displays the state of the working directory and staging area.
    tags: [git]
  git add file.txt:
    desc: Adds changes to the staging area.
    tags: [git]
  git log:
    desc: Shows the commit history.
    tags: [git]
  git show <commit-hash>:
    desc: Displays detailed information about a specific commit.
    tags: [git]
  git diff:
    desc: Shows changes between commits, the working directory, and the staging area.
    tags: [git]
  git pull --rebase --autostash:
    desc: Pull changes from the remote repository, rebase the current branch on top of the upstream branch, and automatically stash any local changes before the rebase.
    tags: [git]

  # CONFIGURING GIT
  git config --global user.name "Your Name":
    desc: Configures user settings, such as name and email.
    tags: [git]
  git config --list | grep delta:
    desc: List delta config
    tags: [git]
  git config --global commit.verbose true:
    desc: Show diff in commit message
    tags: [git]
  git config pull.rebase true && git config rebase.autoStash true:
    desc: Configure Git to use rebase when pulling and automatically stash changes before rebase instead of using `git pull --rebase --autostash` (current Git repository)
    tags: [git]
    links: [https://git-scm.com/docs/git-pull#git-pull---autostash, https://cscheng.info/2017/01/26/git-tip-autostash-with-git-pull-rebase.html]
  git config --global pull.rebase true && git config --global rebase.autoStash true:
    desc: Configure Git to use rebase when pulling and automatically stash changes before rebase instead of using `git pull --rebase --autostash` (globally for every Git repository)
    tags: [git]
    links: [https://git-scm.com/docs/git-pull#git-pull---autostash, https://cscheng.info/2017/01/26/git-tip-autostash-with-git-pull-rebase.html]
  git config --global init.defaultBranch main:
    desc: Set the default branch name to use when creating new repositories
    tags: [git]

  # GPG SETTINGS
  git config --global --unset gpg.format:
    desc: Unset gpg.format so the default format of openpgp will be used
    tags: [git]
    links: [https://docs.github.com/en/authentication/managing-commit-signature-verification/telling-git-about-your-signing-key]
  git config --global user.signingkey 3AA5C34371567BD2:
    desc: Configure Git to set GPG Primary Key ID that matches your committer identity and your verified email address associated with your account on GitHub.com.
    tags: [git]
    links: [https://docs.github.com/en/authentication/managing-commit-signature-verification/telling-git-about-your-signing-key]
  git config --global user.signingkey 4BB6D45482678BE3!:
    desc: Configure Git to set GPG Subkey Key ID append an exclamation mark ! to the key. Sometimes is necessary to escape it with a back slash \!. It must match your committer identity and your verified email address associated with your account on GitHub.com.
    tags: [git]
    links: [https://docs.github.com/en/authentication/managing-commit-signature-verification/telling-git-about-your-signing-key]
  git config --global commit.gpgsign true && git config --global tag.gpgSign true:
    desc: Configure Git to sign all commits and tags by default
    tags: [git]
    links: [https://docs.github.com/en/authentication/managing-commit-signature-verification/telling-git-about-your-signing-key]
  git config --global gpg.format ssh:
    desc: Configure Git to use SSH to sign commits and tags
    tags: [git]
    links: [https://docs.github.com/en/authentication/managing-commit-signature-verification/telling-git-about-your-signing-key]
  git config --global user.signingkey ~/.ssh/id_ed25519_github.pub:
    desc: Configure Git to set SSH Public Key to sign commits and tags
    tags: [git]
    links: [https://docs.github.com/en/authentication/managing-commit-signature-verification/telling-git-about-your-signing-key]

  # GIT CREDENTIAL-HELPERS
  git credential-osxkeychain:
    desc: Use OS X Keychain
    tags: [git, macos]
  git credential-osxkeychain erase:
    desc: Erase credentials from OS X Keychain
    tags: [git, macos]
  git credential-osxkeychain store:
    desc: Store credentials in OS X Keychain
    tags: [git, macos]
  echo "protocol=https\nhost=github.com\nusername=your_username\npassword=your_token" | git credential-osxkeychain store:
    desc: Store credentials in OS X Keychain manually
    tags: [git, macos]
  git config --local credential.helper osxkeychain:
    desc: Use OS X local Keychain
    tags: [git, macos]
  git config --local credential.helper osxkeychain store:
    desc: Store credentials locally in OS X Keychain
    tags: [git, macos]
  git config --global credential.helper osxkeychain:
    desc: Use OS X global Keychain
    tags: [git, macos]
  git config --global credential.helper osxkeychain store:
    desc: Store credentials globally in OS X Keychain
    tags: [git, macos]

  # COMMITTING CHANGES
  git commit -m "Initial commit":
    desc: Records changes to the repository.
    tags: [git]
  git commit --verbose --amend --no-verify --no-edit:
    desc: Amend last commit
    tags: [git]
  git commit --verbose --amend --no-verify:
    desc: Amend last commit
    tags: [git]
  git commit --verbose --amend --no-edit:
    desc: Amend last commit
    tags: [git]
  git commit -m "Initial commit" && git remote add origin git@github.com:roalcantara/foo.git && git branch -M main && git push -u origin main:
    desc: Create a new repository on GitHub and push an initial commit
    tags: [git]

  # RESETTING CHANGES
  git reset HEAD file.txt:
    desc: Unstages changes or resets commits.
    tags: [git]
  git reset 'HEAD^' -- package.json:
    desc: Remove package.json from last commit
    tags: [git]
  git reset 'HEAD^' -- package.json && git commit --amend --no-edit:
    desc: Remove package.json from last commit and amend
    tags: [git]

  ## BRANCHING AND MERGING
  git branch feature-branch:
    desc: Lists branches or creates a new branch.
    tags: [git]
  git branch -M <main> && git push -u origin <main>:
    desc: Add and push to branch <main>
    tags: [git]
  git checkout feature-branch:
    desc: Switches between branches or restores files.
    tags: [git]
  git checkout $(git main-branch):
    desc: Checkout main branch
    tags: [git]
  git checkout -b <branch>:
    desc: Create a new branch <branch>
    tags: [git]
  git switch feature-branch:
    desc: Switches branches (modern alternative to git checkout).
    tags: [git]
  git cherry-pick <commit-hash>:
    desc: Applies specific commits from one branch to another.
    tags: [git]

  ## REMOTE REPOSITORIES
  git remote -vvv:
    desc: Lists remote repositories and their URLs.
    tags: [git]
  git remote add origin <origin> && git branch -M main && git push -u origin main:
    desc: Add remote <origin> and push to branch main
    tags: [git]
  git fetch --all:
    desc: Retrieves updates for all branches and tags from all remotes configured in your local repository, including those that have been deleted.
    notes: |
      The git fetch --all command is used to fetch updates from all configured remote repositories.

      ### Behavior

        •	When you run git fetch --all, Git retrieves updates for all branches and tags from all remotes configured in your local repository.

        •	It does not delete local branches that no longer exist on the remote; it only brings the latest updates to your local repository.

        •	This is useful in projects with multiple remotes, as it fetches information from all of them at once.
    tags: [git]
  git fetch --all && git remote prune origin:
    desc: Fetch all and prune origin
    tags: [git]
  git fetch --all && git remote prune origin && git checkout $(git main-branch):
    desc: Fetch all and prune origin
    tags: [git]
  git fetch --prune:
    desc: Fetch updates from all remotes and remove any remote-tracking references that no longer exist on the remote.
    notes: |
      The git fetch --prune command is used to fetch updates from all configured remote repositories and remove any remote-tracking references that no longer exist on the remote.

      ### Behavior

        •	When you run git fetch --prune, Git retrieves updates for all branches and tags from all remotes configured in your local repository.

        •	It also removes any remote-tracking references that no longer exist on the remote, keeping your local repository in sync with the remote.

        •	This is useful when you want to clean up your local repository and remove references to branches that have been deleted on the remote.
    tags: [git]
  "git fetch --prune && git branch -vv | grep ': gone]' | awk '{print $1}' | xargs git branch -D":
    desc: Remove local branches that no longer exist in the remote repository
    tags: [git]
  git merge feature-branch:
    desc: Combines changes from one branch into another.
    tags: [git]
  git rebase main:
    desc: Moves or combines commits from one branch onto another.
    tags: [git]
  git rebase -i --root:
    desc: Rebase from root
    tags: [git]
  git push -v --set-upstream origin "$(git current-branch)":
    desc: Push current branch
    tags: [git]
  git push --tags:
    desc: Push tags
    tags: [git]

  # SUBMODULES
  git submodule add <URL> <PATH>:
    desc: Add a submodule
    tags: [git]
  git submodule status:
    desc: List submodules
    tags: [git]
  git submodule foreach -q git config remote.origin.url:
    desc: List submodules origin urls
    tags: [git]
  git submodule deinit -- <SUBMODULE> && rm -rf .git/modules/<SUBMODULE> && git rm --cached <SUBMODULE>:
    desc: Remove SUBMODULE
    tags: [git]
  git submodule deinit -f -- <SUBMODULE> && rm -rf .git/modules/<SUBMODULE> && git rm -f --cached <SUBMODULE>:
    desc: Remove SUBMODULE - FORCED
    tags: [git]
  git submodule update --remote --merge:
    desc: Update all submodules
    tags: [git]
  git config --file .gitmodules -l:
    desc: List submodule configurations
    tags: [git]

  # MISC
  git grep pattern $(git rev-list --all):
    desc: Search for a pattern among all committed files in a repository.
    tags: [git]
    links: [https://commands.dev/workflows/search_committed_files]
  git clean -fd:
    desc: Remove untracked files and directories from the working directory.
    tags: [git]
    links: [https://commands.dev/workflows/remove_untracked_files]

