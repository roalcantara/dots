  https://semantic-release.gitbook.io:
    desc: Fully automated version management and package publishing
    tags: [semantic-release, docs]
    links:
      - Configuration: https://semantic-release.gitbook.io/semantic-release/usage/configuration#configuration
      - Configuration:CI: https://semantic-release.gitbook.io/semantic-release/usage/ci-configuration
      - Github Actions: https://semantic-release.gitbook.io/semantic-release/recipes/ci-configurations/github-actions
    notes:
      - md: | #markdown
          | Commit message                                                                                                                                                                                   | Release type                                                                                                    |
          | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | --------------------------------------------------------------------------------------------------------------- |
          | `fix(pencil): stop graphite breaking when too much pressure applied`                                                                                                                             | ~~Patch~~ Fix Release                                                                                           |
          | `feat(pencil): add 'graphiteWidth' option`                                                                                                                                                       | ~~Minor~~ Feature Release                                                                                       |
          | `perf(pencil): remove graphiteWidth option`<br><br>`BREAKING CHANGE: The graphiteWidth option has been removed.`<br>`The default graphite width of 10mm is always used for performance reasons.` | ~~Major~~ Breaking Release <br /> (Note that the `BREAKING CHANGE: ` token must be in the footer of the commit) |

          ### Release steps

          After running the tests, the command `semantic-release` will execute the following steps:

          | Step              | Description                                                                                                                     |
          | ----------------- | ------------------------------------------------------------------------------------------------------------------------------- |
          | Verify Conditions | Verify all the conditions to proceed with the release.                                                                          |
          | Get last release  | Obtain the commit corresponding to the last release by analyzing [Git tags](https://git-scm.com/book/en/v2/Git-Basics-Tagging). |
          | Analyze commits   | Determine the type of release based on the commits added since the last release.                                                |
          | Verify release    | Verify the release conformity.                                                                                                  |
          | Generate notes    | Generate release notes for the commits added since the last release.                                                            |
          | Create Git tag    | Create a Git tag corresponding to the new release version.                                                                      |
          | Prepare           | Prepare the release.                                                                                                            |
          | Publish           | Publish the release.                                                                                                            |
          | Notify            | Notify of new releases or errors.                                                                                               |

          ### Configuration

          ```yaml
          # .releaserc.yml
          ---
          branches:
            - '+([0-9])?(.{+([0-9]),x}).x'
            - name: main
              channel: stable
            - name: next
              prerelease: beta
              channel: canary
          plugins:
            - '@semantic-release/commit-analyzer'
            - '@semantic-release/release-notes-generator'
            - '@semantic-release/changelog'
            - - '@semantic-release/git'
              - assets:
                  - CHANGELOG.md
                message: |-
                  chore(release): ${nextRelease.version} [skip ci]
                  ${nextRelease.notes}
            - '@semantic-release/github'
          ```

