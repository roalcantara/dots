workflows:
  configure git to use it for diffs and logs:
    cmds:
      - git config --global core.pager "delta" git config --global interactive.diffFilter "delta --color-only" git config --global merge.conflictstyle "merge" git config --global diff.colorMoved "default"
    tags: [git, delta]

  to handle diffs during an interactive rebase or when viewing a specific commit:
    cmds:
      - git config --global pager.diff "delta" git config --global pager.show "delta"
    tags: [git, delta]

  configure Delta to use specific colors or to enable side-by-side diffs:
    cmds:
      - git config --global delta.features "side-by-side line-numbers decorations" git config --global delta.plus-color "#012800" git config --global delta.minus-color "#340001" git config --global delta.syntax-theme "Dracula"
    tags: [git, delta]

  only want Delta to be used with certain git commands, you can specify that in your git alias:
    cmds:
      - git config --global alias.diff "git diff --color | delta" git config --global alias.show "git show --color | delta"
    tags: [git, delta]

  revert to the default git pager, you can unset DELTA configurations:
    cmds:
      - git config --global --unset core.pager git config --global --unset interactive.diffFilter git config --global --unset pager.diff git config --global --unset pager.show
    tags: [git, delta]

  Generate a new library in your Nx workspace:
    cmd: 'npx nx g @nrwl/{{framework}}:library --name={{name}}'
    tags: [nx, workspace]
    desc: This command generates a new library in your existing Nx workspace.
    arguments:
      - name: framework
        description: The presets you want to use when generating your library. Supported values -> angular, react, web, node, nest, next, detox, react-native, workspace, js.
        default_value: ~
      - name: name
        description: The name you want to use for your library
        default_value: ~
    source_url: 'https://nx.dev/generators/using-schematics'

