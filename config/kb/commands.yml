  act -s GITHUB_TOKEN="$(gh auth token)":
    desc: Run GitHub Actions locally with GITHUB_TOKEN secret
    notes:
      - sh: |
          # Install
          brew install act

          # Command structure:
          act [<event>] [options]
          If no event name passed, will default to "on: push"
          If actions handles only one event it will be used as default instead of "on: push"

          # List all actions for all events:
          act -l

          # List the actions for a specific event:
          act workflow_dispatch -l

          # List the actions for a specific job:
          act -j test -l

          # Run the default (`push`) event:
          act

          # Run a specific event:
          act pull_request

          # Run a specific job:
          act -j test

          # Collect artifacts to the /tmp/artifacts folder:
          act --artifact-server-path /tmp/artifacts

          # Run a job in a specific workflow (useful if you have duplicate job names)
          act -j lint -W .github/workflows/checks.yml

          # Run in dry-run mode:
          act -n

          # Enable verbose-logging (can be used with any of the above commands)
          act -v

          # Pass secrets to the container (can be used with any of the above commands)
          act -s MY_SECRET=somevalue -s ANOTHER_SECRET=anothervalue

          # Vars

          # use somevalue as the value for VARIABLE
          act --var VARIABLE=somevalue

          # load variables values from my.variables file (.env format)
          act --var-file my.env

          # When running for the 1st time, it will ask you to choose the default image and save it to ~/.actrc
          ls ~/.actrc
    tags:
      - github
      - actions
    links:
      - Docs: https://nektosact.com
      - Github: https://github.com/nektos/act
      - User Guide: https://github.com/nektos/act?tab=readme-ov-file#act-user-guide
      - How GitHub Actions 10x my productivity: https://youtu.be/yfBtjLxn_6k
