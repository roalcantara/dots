  jwt encode --secret "a-256-bit-secret-key" '{"user":"example"}':
    desc: Encode and payload into JWT token with a secret key
    tags:
      - jwt
    notes:
      - md: |
          ## EXAMPLE

          ```sh
          # Encode a payload into a JWT Token with a secret key
          $ jwt encode --secret "a-256-bit-secret-key" '{"user":"example"}'
          # => eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3MzQwNTI5NzAsInVzZXIiOiJleGFtcGxlIn0.s7XzVxFdOc7oP9wiPkURglxaEREg177IorST-6S6EoA
          ```

          > The output is a JWT token that can be used for authentication and authorization purposes.

          ```sh
          # To decode the JWT token, use the following command:
          $ jwt decode eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3MzQwNTI5NzAsInVzZXIiOiJleGFtcGxlIn0.s7XzVxFdOc7oP9wiPkURglxaEREg177IorST-6S6EoA
          ```

          > Token header
          > ------------
          > {
          >   "typ": "JWT",
          >   "alg": "HS256"
          > }
          >
          > Token claims
          > ------------
          > {
          >   "iat": 1719007185,
          >   "user": "example"
          > }
          ```
  jwt decode --secret "your-256-bit-secret" <token>:
    desc: Verify if the JWT provided has a valid signature
    tags:
      - jwt
    notes:
      - md: |
          ## EXAMPLES
      - sh: |
          # Encode a payload into a JWT Token with a secret key
          $ jwt encode --secret "a-256-bit-secret-key" '{"user":"example"}'
          # => eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3MzQwNTQ1NDAsInVzZXIiOiJleGFtcGxlIn0.3cIYisVMLghSzg0rzcVnSFROZYmy2ZgTuhHTpidxqdQ
      - md: |
          - Verify the JWT Token
      - sh: |
          # If the token is invalid, you will see an error message:
          $ jwt decode --secret "wringSecret" eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3MzQwNTQ1NDAsInVzZXIiOiJleGFtcGxlIn0.3cIYisVMLghSzg0rzcVnSFROZYmy2ZgTuhHTpidxqdQ
          # => The JWT provided has an invalid signature
      - md: '## Decode a JWT Token'
      - sh: |
          # If the token is valid, you will see the decoded token:
          $ jwt decode eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3MzQwNTQ1NDAsInVzZXIiOiJleGFtcGxlIn0.3cIYisVMLghSzg0rzcVnSFROZYmy2ZgTuhHTpidxqdQ
          # Token header
          #  ------------
          #  {
          #    "typ": "JWT",
          #    "alg": "HS256"
          #  }
          #
          #  Token claims
          #  ------------
          #  {
          #    "iat": 1734054540,
          #    "user": "example"
          #  }
  jwt decode <token>:
    desc: Decoding a JWT
    tags:
      - jwt
      - decode
    notes:
      - md: |
          ## Example

          $ jwt decode eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYW1lIjoiSm9obiBEb2UifQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c

          > Token header
          > ------------
          > {
          >   "typ": "JWT",
          >   "alg": "HS256"
          > }
          >
          > Token claims
          > ------------
          > {
          >   "name": "John Doe"
          > }
  hasura init .:
    desc: Initialize a new Hasura project in the current directory - To create a new Hasura project in the current directory
    tags:
      - hasura
  hasura update-cli:
    desc: Updates the Hasura CLI to the latest version - To ensure you are using the most up-to-date version of the Hasura CLI with all the latest bug fixes and features
    tags:
      - hasura
  hasura metadata ic diff:
    desc: Shows the differences between the current metadata and the applied metadata - to review metadata changes before applying them.
    tags:
      - hasura
  hasura metadata ic list:
    desc: Lists all pending metadata changes - to get an overview of metadata changes that have not yet been applied
    tags:
      - hasura
  hasura migrate create "migration_name" --from-server:
    desc: Creates a new migration based on the current state of the server. To capture the current state of the database and create corresponding migrations.
    tags:
      - hasura
  harusa metadata apply:
    desc: Applies the local metadata changes to the Hasura server to synchronize metadata changes (schemas, permissions, etc.) from your local project with the Hasura server.
    tags:
      - hasura
  harusa migrate apply --database-name=default:
    desc: Applies all pending migrations to the specified database (in this case, the default database) to ensure all database schema changes are applied as configured in migrations.
    tags:
      - hasura
  hasura seed create crate_authors_seed --from-table authors:
    desc: Creates a seed file based on the data in the author table. To generate a seed file that contains the data from the specified table.
    tags:
      - hasura
  hasura seed apply --database-name=default:
    desc: Applies seed data to the specified database. To populate the database with initial or test data as configured in seed files.
    tags:
      - hasura
  hasura seed apply --file 1718916648431_add_authors_seed.sql --database-name=default:
    desc: Applies seed data to the specified database. To populate the database with initial or test data as configured in seed files.
    tags:
      - hasura
  hasura metadata reload:
    desc: Reloads metadata on the Hasura server from the current configuration (when you need to refresh or revert to the currently loaded metadata configuration on the server).
    tags:
      - hasura
  hasura console:
    desc: Opens the Hasura Console web interface - useful for managing Hasura visually.
    tags:
      - hasura
  hasura console --no-browser:
    desc: Starts the Hasura Console without automatically opening it in the browser. When you prefer to manually access the console through a specific URL
    tags:
      - hasura
  hasura metada export:
    desc: Exports the current metadata configuration to a file - to save the current metadata configuration to a file for backup or version control.
    tags:
      - hasura
