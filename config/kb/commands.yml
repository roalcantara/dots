  find . -maxdepth 1 -type f -size 0:
    desc: Find empty files in the current directory
    tags:
      - cli
      - find
    notes:
      - md: |
          This command breaks down as follows:

          - `find .` starts the search in the current directory.
          - `-maxdepth 1` ensures that find only looks in the current directory and does not go into subdirectories.
          - `-type f` filters the search to only include files.
          - `-size 0` finds files that are exactly 0 bytes in size.
