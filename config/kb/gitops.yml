commands:
  ## GIT transcrypt
  ## https://github.com/elasticdog/transcrypt
  brew install transcrypt:
    desc: Install transcrypt
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt -c aes-256-cbc -p 'password':
    desc: Initialize transcrypt in a repository with AES-256-CBC cipher
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt -c aes-256-ctr -p 'password':
    desc: Initialize transcrypt in a repository with AES-256-CTR cipher
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --list-ciphers:
    desc: Display available ciphers for transcrypt
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --display:
    desc: Show current repository's settings and files under encryption
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --add-config path/to/file:
    desc: Add new file to be encrypted without re-encrypting existing files
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: | #shell
          # Add multiple files
          transcrypt --add-config file1 file2
  transcrypt --flush-credentials:
    desc: Remove locally cached encryption credentials
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --rekey:
    desc: Re-encrypt all encrypted files with a new password
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: | #shell
          # First flush old credentials
          transcrypt --flush-credentials

          # Then rekey with new password
          transcrypt --rekey
  transcrypt --import path/to/keyfile:
    desc: Import encryption configuration from a file
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --export-gpg recipient@example.com:
    desc: Export credentials encrypted with GPG for secure sharing
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --uninstall:
    desc: Remove transcrypt configuration from repository
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: | #shell
          # Decrypt files first
          transcrypt --flush-credentials
          transcrypt --uninstall
  transcrypt --show-raw file:
    desc: Display raw encrypted contents of a file
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
  transcrypt --verify:
    desc: Verify repository configuration and file consistency
    tags: [gitops, transcrypt]
    links: [https://github.com/elasticdog/transcrypt]
    notes:
      - sh: | #shell
          # Check specific files
          transcrypt --verify path/to/file

  # AGE - Simple, modern and secure encryption tool
  # https://age-encryption.org
  brew install age:
    desc: Install AGE
    tags: [gitops, age]
    links: [https://age-encryption.org]
  mkdir -p ~/.config/age && age-keygen -o ~/.config/age/keys.txt > ~/.config/age/recipient.txt:
    desc: Generate a new AGE key pair (private + public) and save them to ~/.config/age/
    tags: [gitops, age]
    links: [https://age-encryption.org]
  chmod 600 ~/.config/age/keys.txt && echo ".config/age/keys.txt" >> ~/.config/.gitignore:
    desc: Secure the IDENTITY (Private Key) and ensure it is not backed up to git
    tags: [gitops, age]
  mkdir -p ~/.config/age && age-keygen -o ~/.config/age/keys.txt > ~/.config/age/recipient.txt && chmod 600 ~/.config/age/keys.txt && echo ".config/age/keys.txt" >> ~/.config/.gitignore:
    desc: Generate a new AGE key pair (private + public), save them to ~/.config/age/, secure the IDENTITY (Private Key) and ensure it is not backed up to git
    tags: [gitops, age]
  grep -Eo 'age1[0-9a-z]+' ~/.config/age/keys.txt | head -1:
    desc: Extract the recipient from ~/.config/age/keys.txt
    tags: [gitops, age]
  age -r $(grep -Eo 'age1[0-9a-z]+' ~/.config/age/keys.txt | head -1) -o /tmp/secret.txt.age /tmp/secret.txt:
    desc: Encrypt /tmp/secret.txt for yourself (using your own RECIPIENT)
    tags: [gitops, age]
  age -r $(cat ~/.config/age/recipient.txt) -o /tmp/secret.recipients.txt.age /tmp/secret.txt:
    desc: Encrypt /tmp/secret.txt for any recipient (using the recipient file)
    tags: [gitops, age]
  age -p -o /tmp/secret.passbased.txt.age /tmp/secret.txt:
    desc: Encrypt /tmp/secret.txt using PASSWORD (symmetric encryption)
    tags: [gitops, age]
  tar czf - /opt/app | age -R ~/.config/age/recipients.txt > /tmp/app.tar.gz.age:
    desc: Encrypt a whole directory (e.g., /opt/app) using multiple RECIPIENTS listed in a file
    tags: [gitops, age]
  age -a -R ~/.config/age/recipients.txt /tmp/secret.txt > /tmp/secret.txt.age.asc:
    desc: Use ASCII armor to protect /tmp/secret.txt.age safe for version control
    tags: [gitops, age]
  age-keygen -y ~/.config/age/keys.txt > ~/.config/age/recipient.txt:
    desc: Extract (REGENERATE) the recipient from ~/.config/age/keys.txt and save it to ~/.config/age/recipient.txt
    tags: [gitops, age]
  age --decrypt --identity ~/.config/age/keys.txt -o /tmp/secret.out.txt /tmp/secret.txt.age:
    desc: Decrypt /tmp/secret.txt.age using your IDENTITY (Private Key) and save the output to /tmp/secret.out.txt
    tags: [gitops, age]

  # SOPS - Simple and flexible tool for managing secrets
  # https://github.com/getsops/sops
  brew install sops:
    desc: Install SOPS
    tags: [gitops, sops]
  sops -e -i config.yml:
    desc: Encrypt a file
    tags: [gitops, sops]
  sops -d config.yml:
    desc: Decrypt a file
    tags: [gitops, sops]
  sops --encrypt --in-place --age-recipient <recipient-id> <file>:
    desc: Encrypt a file with AGE
    tags: [gitops, sops]
  sops --decrypt --in-place <file>:
    desc: Decrypt a file with AGE
    tags: [gitops, sops]
