          ## [TOOLS](https://gitops.tech/#tools-articles-and-talks)

          - [Awesome-GitOps](https://github.com/weaveworks/awesome-gitops): Curated list of GitOps tools and resources
          - [ArgoCD](https://argoproj.github.io/argo-cd): A GitOps operator for Kubernetes with a web interface
          - [Flux](https://github.com/fluxcd/flux): The GitOps Kubernetes operator by the [creators](https://weave.works/technologies/gitops) of GitOps
          - [Gitkube](https://github.com/hasura/gitkube): A tool for building and deploying docker images on Kubernetes using `git push`
          - [JenkinsX](https://jenkins-x.io): Continuous Delivery on Kubernetes with built-in GitOps
          - [Terragrunt](https://github.com/gruntwork-io/terragrunt): A wrapper for [Terraform](https://terraform.io) for keeping configurations DRY, and managing remote state
          - [WKSctl](https://github.com/weaveworks/wksctl): A tool for Kubernetes cluster configuration management based on GitOps principles
          - [Helm Operator](https://github.com/fluxcd/helm-operator): An operator for using GitOps on K8s with Helm
          - [werf](https://werf.io): CLI to build images and deploy them to Kubernetes via push-based approach
          - [Gimlet](https://gimlet.io): CLI and a dashboard that packages a set of conventions and matching workflows to manage a gitops developer platform effectively

