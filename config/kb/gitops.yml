  https://gopass.pw:
    desc: Gopass - The Standard Unix Password Manager
    tags: [gitops, gopass]
    links: [https://gopass.pw, https://github.com/gopasspw/gopass, https://domaindrivenarchitecture.org/posts/2020-01-29-GopassQuickRef, https://codelinter.com/blog/post/managing-secrets-with-gopass-age]
    notes:
      - md: | #markdown
          Gopass is a modern, open-source password manager that provides a secure and user-friendly way to manage your passwords.

          1. Install Gopass

            ```bash
            brew install gopass
            ```

          2. Generate a new key pair

            ```bash
            age-keygen -o ~/.config/age/key.txt
            # => PUBLIC KEY: age1PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP
            # => SECRET KEY: AGE-SECRET-KEY-1SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS
            ```

          3. Add AGE SECRET and PUBLIC KEYS as AGE identity to the Gopass store

            ```bash
            gopass age identities add AGE-SECRET-KEY-1SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS age1PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP
            ```

          4. Add AGE PUBLIC KEY as recipient to the Gopass store

            ```bash
            gopass recipients add age1PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP
            # If there are existing encrypted secrets, this will re-encrypt them.
            ```

          5. Setup Gopass with Age backend

            ```bash
            gopass setup --crypto age --storage gitfs
            ```

          6. Adjust the defaault template

            1. Edit the default template

              ```bash
              gopass templates edit
              ```

            2. Add the following to the template

              ```yaml
                {{ .Content }}
                ---
                comment: "{{ .Name }}"
                url: http://{{ .Name }}
                username: rogerio.alcantara@gmail.com
                password-change-url: https://{{ .Name }}/.well-known/change-password
                # This is an example of the available template operations
                # Predefined variables:
                # - .Content: The secret payload, usually a generated password
                # - .Name: The name of this secret
                # - .Path: The path to this secret
                # - .Dir: The dir of this secret
                #
                # Available Template functions:
                # - md5sum: e.g. {{ .Content | md5sum }}
                # - sha1sum: e.g. {{ .Content | sha1sum }}
                # - blake3 e.g. {{ .Content | blake3 }}
                # - md5crypt: e.g. {{ .Content | md5crypt }}
                # - ssha: e.g. {{ .Content | ssha }}
                # - ssha256: e.g. {{ .Content | ssha256 }}
                # - ssha512: e.g. {{ .Content | ssha512 }}
                # - get "key": e.g. {{ get "path/to/some/other/secret" | md5sum }}
              ```

          7. Add the create template for `tokens`:

            1. Run the command

              ```bash
              vi ~/.local/share/gopass/password-store/.gopass/create/2-token.yml
              ```

            2. Add the following to the template

              ```yaml
                ---
                priority: 2
                name: Token
                prefix: tokens
                name_from:
                  - org
                welcome: "🧪 Creating Token"
                attributes:
                  - name: org
                    type: string
                    prompt: Organization
                    min: 1
                  - name: token
                    type: password
                    prompt: Token
                  - name: comment
                    type: string
                    prompt: Comments
                  - url: string
                    type: string
                    prompt: Source
              ```

            3. Sync the changes

              ```bash
                gopass fsck
                # if it fails, run:
                gopass sync
                # if it fails, run:
                cd ~/.local/share/gopass/password-store/
                git push
              ```

          8. Add the create template for `aws`:

            1. Run the command

              ```bash
              vi ~/.local/share/gopass/password-store/.gopass/create/3-aws.yml
              ```

            2. Add the following to the template

              ```yaml
                ---
                priority: 3
                name: AWS
                prefix: aws
                name_from:
                  - org
                  - user
                welcome: "🧪 Creating AWS credentials"
                # https://github.com/gopasspw/gopass/blob/master/docs/commands/create.md?plain=1
                attributes:
                  - name: org
                    type: string
                    prompt: Organization
                    min: 1
                  - name: user
                    type: string
                    prompt: User
                    min: 1
                  - name: password
                    type: password # hide input
                    prompt: Password
                    always_prompt: true # do not offer password generation, always ask
                    charset: abcdefghijklmnop # generate password with this charset
                  - name: comment
                    type: string
                    prompt: Comments
              ```

            3. Sync the changes

              ```bash
                gopass fsck
                # if it fails, run:
                gopass sync
                # if it fails, run:
                cd ~/.local/share/gopass/password-store/
                git push
              ```
