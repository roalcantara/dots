bookmarks:
  https://age-encryption.org:
    desc: AGE is a simple, modern and secure encryption tool (and Go library) with small explicit keys, no config options, and UNIX-style composability
    tags: [devops, crypt, secrets]
    links:
      - GitHub: https://github.com/FiloSottile/age
      - Specification: https://age-encryption.org/v1
      - RUST Implementation: https://github.com/str4d/rage
      - TypeScript implementation: https://github.com/FiloSottile/typage
      - Hardware PIV tokens such as YubiKeys: https://github.com/str4d/age-plugin-yubikey
      - Awesome AGE: https://github.com/FiloSottile/awesome-age
      - MAN: https://filippo.io/age/age.1
    notes:
      - md: | #markdown
          ## AGE

          > **AGE** is a simple, modern and secure file encryption tool, format, and Go library.
          > It supports both password-based and public key encryption
          > It was created to replace some of the use cases for GnuPG (PGP), focusing on specialized, opinionated design for tasks like file encryption.
          > It features small explicit keys, no config options, and UNIX-style composability.

          ```sh
          $ age-keygen -o key.txt
          Public key: age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p
          $ tar cvz ~/data | age -r age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p > data.tar.gz.age
          $ age --decrypt -i key.txt data.tar.gz.age > data.tar.gz
          $ tar xvzf data.tar.gz
          ```

          ## 🔑 CONCEPTS

          | **CONCEPT**         | **WHAT IT IS**                                              | **FLAGS**  |
          | ------------------- | ----------------------------------------------------------- | ---------- |
          | **RECIPIENT**       | A public key (or SSH public key) that is allowed to decrypt | `-r`, `-R` |
          | **IDENTITY**        | A private key used to decrypt (read from a file)            | `-i`       |
          | **RECIPIENTS FILE** | Text file with one recipient per line                       | `-R`       |
          | **PASSPHRASE MODE** | Derives a key from a passphrase; no key files needed        | `-p`       |
          | **ASCII ARMOR**     | ASCII armors the ciphertext (useful for copy/paste or git)  | `-a`       |

          ## 💡 NOTES

          - **AGE** doesn't use a keyring or agent by default.
          - Point to identity files explicitly with `-i` when decrypting.
          - SSH keys can be used as recipients _(public key)_ and identities _(private key)_.
          - Prefer dedicated **AGE** keys for automation; SSH keys are handy for ad-hoc sharing.
          - Key files are text files; they contain comments and one private key.
          - Store them securely (e.g., `~/.config/age/keys.txt`).
      - sh: | #shell
          #!/bin/sh

          ######################################################################
          ## 🚀 QUICK-START
          ######################################################################

          # ==> 1. Install
          brew install age                              # macOS
          sudo apt update && sudo apt install -y age    # Debian/Ubuntu
          sudo pacman -S age                            # Arch Linux
          apk add age                                   # Alpine Linux

          # ==> 2. Generate a new key pair (private + public)
          mkdir -p ~/.config/age && age-keygen -o ~/.config/age/keys.txt > ~/.config/age/recipient.txt
          # 💡 ~/.config/age/keys.txt
          #     → Is IDENTITY (Private Key);
          #     → Used to decrypt files;
          #     → readable only by me;
          #     → kept it secret! Never commit to git or share!
          # 💡 ~/.config/age/recipient.txt
          #     → Is RECIPIENT (Public Key);
          #     → Used to encrypt files;
          #     → shareable with others

          # ==> 3. Secure the IDENTITY (Private Key)
          chmod 600 ~/.config/age/keys.txt # Ensure the IDENTITY is secure and not readable by others
          echo ".config/age/keys.txt" >> ~/.config/.gitignore # Ensure that IDENTITY will not be backed up to git (if you use git to manage your dotfiles)

          # ==> 4. Create some file to encrypt
          echo "my secret" > /tmp/secret.txt

          # ==> 5. Encrypt for yourself (using your own RECIPIENT)
          age -r $(grep -Eo 'age1[0-9a-z]+' ~/.config/age/keys.txt | head -1) -o /tmp/secret.txt.age /tmp/secret.txt

          # ==> 6. Decrypt the file using your IDENTITY (Private Key)
          age --decrypt --identity ~/.config/age/keys.txt -o /tmp/secret.out.txt /tmp/secret.txt.age

          # ==> 7. Compare the original and decrypted files; OK means they are identical! 🎉🎉
          diff -u /tmp/secret.txt /tmp/secret.out.txt && echo "OK"
      - sh: | #shell
          #!/bin/sh

          ######################################################################
          ## 🔖 ADVANCED SCENARIOS
          ######################################################################

          # Given a file to encrypt
          echo "my secret" > /tmp/secret.txt

          # Encrypt for any recipient (using the recipient file)
          age -r $(cat ~/.config/age/recipient.txt) -o /tmp/secret.recipients.txt.age /tmp/secret.txt
          # 💡 Ensure ~/.config/age/recipient.txt contains a valid recipient (public key)

          # Encrypt for MULTIPLE RECIPIENTS (using your own RECIPIENT + another person's RECIPIENT);
          age -r $(grep -Eo 'age1[0-9a-z]+' ~/.config/age/keys.txt | head -1) -r /path/to/OTHER_AGE_PUBLIC_KEY.txt /tmp/secret.txt > /tmp/secret.multiplerecipients.txt.age
          # 💡 Ensure /path/to/OTHER_AGE_PUBLIC_KEY.txt contains a valid recipient (Public Key)
          # 💡 Any of the recipients can decrypt the file using their own IDENTITY (Private Key)

          # Encrypt using PASSWORD (symmetric encryption)
          age -p -o /tmp/secret.passbased.txt.age /tmp/secret.txt
          # 💡 It will prompt you to enter a passphrase (twice)
          # 💡 /tmp/secret.passbased.txt.age can only be decrypted with the given passphrase

          # Encrypt using existing SSH Public Key;
          age -R ~/.ssh/id_ed25519.pub -o /tmp/config.ini.age /tmp/secret.txt
          # 💡 Ensure you have an SSH key pair (e.g., ~/.ssh/id_ed25519)
          # 💡 To extract SSH Public Key: ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

          # Encrypt a whole directory (e.g., /opt/app) using multiple RECIPIENTS listed in a file;
          tar czf - /opt/app | age -R ~/.config/age/recipients.txt > /tmp/app.tar.gz.age
          # 💡 Ensure ~/.config/age/recipients.txt contains a list of valid recipients

          # Use ASCII armor to protect the encrypted file safe for version control
          age -a -R ~/.config/age/recipients.txt /tmp/secret.txt > /tmp/secret.txt.age.asc
          # 💡 the output is ASCII text safe for version control

  https://github.com/getsops/sops:
    desc: Simple and flexible tool for managing secrets
    tags: [devops, crypt, secrets]
    notes:
      - md: | #markdown
          ## SOPS

          > **SOPS** (Secrets OPerationS) is an editor of encrypted files that supports YAML, JSON, ENV, INI, and BINARY formats.
          > It supports AWS KMS, GCP KMS, Azure Key Vault, HashiCorp Vault, and PGP as key management services.
          > It was created to manage secrets in a git repository.
          > It features a simple and flexible design, allowing you to encrypt only the parts of the file that need to be kept secret.

      - sh: | #shell
          #!/bin/sh

          ######################################################################
          ## 🚀 QUICK-START
          ######################################################################

          # ==> 1. Install
          brew install sops                             # macOS
          sudo apt update && sudo apt install -y sops   # Debian/Ubuntu
          sudo pacman -S sops                           # Arch Linux
          apk add sops                                  # Alpine Linux

          # ==> 2. Generate a new AGE key pair (private + public)
          mkdir -p ~/.config/age && age-keygen -o ~/.config/age/keys.txt > ~/.config/age/recipient.txt
          # 💡 ~/.config/age/keys.txt
          #     → Is IDENTITY (Private Key);
          #     → Used to decrypt files;
          #     → readable only by me;
          #     → kept it secret! Never commit to git or share!
          # 💡 ~/.config/age/recipient.txt
          #     → Is RECIPIENT (Public Key);
          #     → Used to encrypt files;
          #     → shareable with others

          # ==> 3. Secure the IDENTITY (Private Key)
          chmod 600 ~/.config/age/keys.txt # Ensure the IDENTITY is secure and not readable by others
          echo ".config/age/keys.txt" >> ~/.config/.gitignore # Ensure that IDENTITY will not be backed up to git (if you use git to manage your dotfiles)

          # ==> 4. Create SOPS configuration file to use AGE as the default KMS
          mkdir -p ~/.config/sops
          cat > ~/.config/sops/config.yaml
          # ---
          # creation_rules:
          #   - pgp: []
          #     gcp_kms: []
          #     azure_kv: []
          #     aws_kms: []
          #     age: ["$(cat ~/.config/age/recipient.txt)"]
          #     encrypted_regex: '^(data|stringData)$'
          #     path_regex: '.*\.ya?ml$'

          # ==> 4. Create some file to encrypt
          echo "DB_PASSWORD: mysecretpassword" > /tmp/config.yaml

          # ==> 5. Encrypt the file using SOPS + AGE RECIPIENT (output to stdout)
          sops --encrypt .env

          # ==> 5. Encrypt the file using SOPS + AGE RECIPIENT (output to a different file)
          sops --encrypt --input-type dotenv --output-type dotenv --output .env.sops .env

          # ==> 5. Encrypt the file using SOPS + AGE RECIPIENT (pipe input to output)
          sops --encrypt --input-type dotenv --output-type dotenv .env > .env.sops

          # ==> 5. Encrypt the file using SOPS + AGE RECIPIENT (output to the same file, in-place)
          sops --encrypt --in-place .env

          # ==> 5. Encrypt the file using SOPS + AGE RECIPIENT
          sops --encrypt --age $(cat ~/.config/age/recipient.txt) /tmp/config.yaml > /tmp/config.enc.yaml

          # ==> 6. Decrypt the file using SOPS + AGE IDENTITY (Private Key)
          sops --decrypt --age-identity ~/.config/age/keys.txt /tmp/config.enc.yaml > /tmp/config.dec.yaml

          # ==> 7. Compare the original and decrypted files; OK means they are identical! 🎉🎉
          diff -u /tmp/config.yaml /tmp/config.dec.yaml && echo "OK"
      - sh: | #shell
          #!/bin/sh

          ## DECRIPTING FILES WITH SOPS + AGE IDENTITY (Private Key)
          sops --decrypt --age-identity ~/.config/age/keys.txt /path/to/encrypted-file.yaml > /path/to/decrypted-file.yaml

          # 💡 Use the SOPS_AGE_KEY environment variable (Recommended)
          # Set SOPS_AGE_KEY environment variable to point to your AGE private key file
          # This allows SOPS to use your AGE identity (private key) for decryption automatically
          export SOPS_AGE_KEY=$(cat ~/.config/age/keys.txt)

          # Use the SOPS_AGE_KEY_FILE environment variable
          # Create a SOPS config file to automatically locate age keys
          Create ~/.config/sops/age/keys.txt (symlink to your existing key):

          # This allows SOPS to use your AGE identity (private key) for decryption automatically
          export SOPS_AGE_KEY=$(cat ~/.config/age/keys.txt)
          sops --decrypt --input-type dotenv --output-type dotenv .env.encrypted > .env.decrypted

          # This allows SOPS to use your AGE identity (private key) for decryption automatically
          export SOPS_AGE_KEY_FILE=~/.config/age/keys.txt
          sops decrypt --input-type dotenv --output-type dotenv .env.encrypted > .env.decrypted


          # 💡 To SOPS use your AGE identity (private key) for decryption automatically without needing to set the SOPS_AGE_KEY environment variable
          mkdir -p ~/.config/sops
          touch ~/.config/sops/config.yaml
          # ---
          # creation_rules:
          #   - pgp: []
          #     gcp_kms: []
          #     azure_kv: []
          #     aws_kms: []
          #     age: ["$(cat ~/.config/age/recipient.txt)"]
          #     encrypted_regex: '^(data|stringData)$'
          #     path_regex: '.*\.ya?ml$'

          # 💡 To SOPS use your AGE identity (private key) for decryption automatically without needing to set the SOPS_AGE_KEY environment variable
          mkdir -p ~/.config/sops
          ln -s ~/.config/age ~/.config/sops/age

commands:
  # AGE - Simple, modern and secure encryption tool | https://age-encryption.org
  mkdir -p ~/.config/age && age-keygen -o ~/.config/age/keys.txt > ~/.config/age/recipient.txt:
    desc: Generate a new AGE key pair (private + public) and save them to ~/.config/age/
    tags: [devops, security, secrets, age]
  chmod 600 ~/.config/age/keys.txt && echo ".config/age/keys.txt" >> ~/.config/.gitignore:
    desc: Secure the IDENTITY (Private Key) and ensure it is not backed up to git
    tags: [devops, security, secrets, age]
  mkdir -p ~/.config/age && age-keygen -o ~/.config/age/keys.txt > ~/.config/age/recipient.txt && chmod 600 ~/.config/age/keys.txt && echo ".config/age/keys.txt" >> ~/.config/.gitignore:
    desc: Generate a new AGE key pair (private + public), save them to ~/.config/age/, secure the IDENTITY (Private Key) and ensure it is not backed up to git
    tags: [devops, security, secrets, age]
  grep -Eo 'age1[0-9a-z]+' ~/.config/age/keys.txt | head -1:
    desc: Extract the recipient from ~/.config/age/keys.txt
    tags: [devops, security, secrets, age]
  age -r $(grep -Eo 'age1[0-9a-z]+' ~/.config/age/keys.txt | head -1) -o /tmp/secret.txt.age /tmp/secret.txt:
    desc: Encrypt /tmp/secret.txt for yourself (using your own RECIPIENT)
    tags: [devops, security, secrets, age]
  age -r $(cat ~/.config/age/recipient.txt) -o /tmp/secret.recipients.txt.age /tmp/secret.txt:
    desc: Encrypt /tmp/secret.txt for any recipient (using the recipient file)
    tags: [devops, security, secrets, age]
  age -p -o /tmp/secret.passbased.txt.age /tmp/secret.txt:
    desc: Encrypt /tmp/secret.txt using PASSWORD (symmetric encryption)
    tags: [devops, security, secrets, age]
  tar czf - /opt/app | age -R ~/.config/age/recipients.txt > /tmp/app.tar.gz.age:
    desc: Encrypt a whole directory (e.g., /opt/app) using multiple RECIPIENTS listed in a file
    tags: [devops, security, secrets, age]
  age -a -R ~/.config/age/recipients.txt /tmp/secret.txt > /tmp/secret.txt.age.asc:
    desc: Use ASCII armor to protect /tmp/secret.txt.age safe for version control
    tags: [devops, security, secrets, age]
  age-keygen -y ~/.config/age/keys.txt > ~/.config/age/recipient.txt:
    desc: Extract (REGENERATE) the recipient from ~/.config/age/keys.txt and save it to ~/.config/age/recipient.txt
    tags: [devops, security, secrets, age]
  age --decrypt --identity ~/.config/age/keys.txt -o /tmp/secret.out.txt /tmp/secret.txt.age:
    desc: Decrypt /tmp/secret.txt.age using your IDENTITY (Private Key) and save the output to /tmp/secret.out.txt
    tags: [devops, security, secrets, age]

cheats:
  Setup SOPS + Git Filters for Automatic Encryption/Decryption:
    desc: Protect secrets with Git filter, SOPS and AGE
    tags: [devops, security, secrets, age]
    links:
      - SOPS: https://github.com/getsops/sops
      - AGE: https://github.com/FiloSottile/age
      - Git filter: https://git-scm.com/docs/gitattributes
      - Protect secrets in Git with the clean/smudge filter: https://developers.redhat.com/articles/2022/02/02/protect-secrets-git-cleansmudge-filter
      - Using SOPS with Age and Git like a Pro: https://devops.datenkollektiv.de/using-sops-with-age-and-git-like-a-pro.html
    notes:
      - sh: | #shell
          #!/bin/bash

          # Setup SOPS + Git Filters for Automatic Encryption/Decryption
          # Run this from your dotfiles repository root

          set -e

          echo "Setting up SOPS git filters..."

          # Configure git filters
          echo "Configuring git clean filter (encrypt on commit)..."
          git config filter.sops.clean 'sops --encrypt --input-type dotenv --output-type dotenv /dev/stdin'

          echo "Configuring git smudge filter (decrypt on checkout)..."
          git config filter.sops.smudge 'sops decrypt --input-type dotenv --output-type dotenv /dev/stdin'

          echo "Configuring diff filter (show decrypted content in diffs)..."
          git config diff.sops.textconv 'sops decrypt --input-type dotenv --output-type dotenv'

          # Setup .gitattributes
          echo "Setting up .gitattributes..."
          if ! grep -q "\.config/\.env filter=sops" .gitattributes 2>/dev/null; then
              echo ".config/.env filter=sops diff=sops" >> .gitattributes
              echo "Added .config/.env to .gitattributes"
          else
              echo ".gitattributes already configured"
          fi

          # Check if .env exists and handle initial encryption
          if [ -f ".config/.env" ]; then
              echo "Found .config/.env file"

              # Check if file is already encrypted
              if head -1 .config/.env | grep -q "sops:"; then
                  echo ".env file appears to be already encrypted"
                  echo "Decrypting for local use..."
                  sops decrypt --in-place --input-type dotenv --output-type dotenv .config/.env
              else
                  echo ".env file is currently unencrypted"
                  echo "Encrypting and committing the encrypted version..."

                  # Backup current file
                  cp .config/.env .config/.env.backup

                  # Encrypt for git
                  sops --encrypt --in-place --input-type dotenv --output-type dotenv .config/.env

                  # Add and commit encrypted version
                  git add .config/.env .gitattributes
                  git commit -m "Add encrypted .env file with SOPS git filters"

                  # Restore decrypted version for local use
                  cp .config/.env.backup .config/.env
                  rm .config/.env.backup

                  echo "Encrypted version committed, decrypted version restored for local use"
              fi
          else
              echo "No .config/.env file found - you can create one normally and it will be auto-encrypted on commit"
          fi

          echo ""
          echo "✅ SOPS git filters setup complete!"
          echo ""
          echo "Test your setup:"
          echo "1. Edit .config/.env and add a test variable"
          echo "2. Run 'git status' - should show .env as modified"
          echo "3. Run 'git diff .config/.env' - should show decrypted diff"
          echo "4. Run 'git add .config/.env && git show :0:.config/.env' - should show encrypted content"
          echo ""
          echo "The file will now be automatically encrypted on commit and decrypted on checkout!"
