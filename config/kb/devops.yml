cheats:
  # DEPLOYMENT PATTERNS
  Top Most-Used Deployment Strategies:
    desc: Rolling x Big Bang x Feature x Blue-Green x Canary
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: | #markdown
          | **Strategy**              | **Key Characteristics**                         | **Focus**                                             |
          | ------------------------- | ----------------------------------------------- | ----------------------------------------------------- |
          | **Rolling**               | Minimizes downtime, gradual rollout             | Stability and minimal user impact                     |
          | **Big Bang**              | Immediate switch, higher risk                   | Less complex or small-scale applications              |
          | **Feature Toggles/Flags** | Dynamic feature management, flexible deployment | Flexibility in feature release and rollback           |
          | **Blue-Green**            | Zero downtime, high resource requirement        | High availability and immediate rollback              |
          | **Canary**                | User feedback-oriented, phased release          | Testing in real-world conditions and gradual exposure |
      - mermaid: | #mermaid
          graph TD
            A[Application Type] -->|Critical with High Availability| B[Blue-Green]
            A -->|Large Scale with Direct User Feedback| C[Canary]
            A -->|Ongoing Development, Continuous Delivery| D[Feature Toggles/Flags]
            A -->|Smaller or Less Critical Updates| E[Big Bang]
            A -->|Critical Applications, Minimized Downtime| F[Rolling]
  Rolling Deployment:
    desc: Gradual rollout to minimize downtime and risk
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: | #markdown
          # Rolling Deployment

          > Focuses on stability and minimal user impact

          This strategy updates one server at a time instead of all at once
          - Minimizes downtime
          - Gradual exposure of new version to users
          - If issues arise, only a portion of users are affected

          ## Advantages
          - Reduces risk of widespread failure
          - Easier to rollback if problems occur
          - Less impact on user experience

          ## Challenges
          - Longer overall deployment time
          - Temporary inconsistency between servers

          ## Usage
          - **Ideal for critical applications where reliability is a priority**
          - When downtime needs to be minimized
          - For large-scale applications with many users
  Big Bang Deployment:
    desc: All-at-once approach for immediate switch over
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: | #markdown
          # Big Bang Deployment

          > Suited for less complex or small-scale applications

          Complete and simultaneous update of all servers and components
          - Immediate switch to the new version
          - Synchronous update across all systems

          ## Advantages
          - Immediate results
          - Quick implementation

          ## Challenges
          - High risk of failure
          - Difficult to rollback
          - Potential significant downtime

          ## Usage
          - **When updates are small or non-critical**
          - When a system can afford downtime
          - For smaller or less complex applications
  Feature Toggles/Flags:
    desc: Enabling/disabling features dynamically at runtime
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
      - Ship faster with feature flags using Firebase Remote Config: https://youtu.be/vWJ8wDzeEg0
    notes:
      - md: | #markdown
          # Feature Toggles/Flags

          > Flexibility in feature release and rollback

          Allows features to be turned on/off without deploying new code
          - Flexibility in releasing features
          - Facilitates A/B testing and canary releases

          ## Advantages
          - Allows for incremental development
          - Reduces need for multiple deployments
          - Helps in managing feature rollouts and rollbacks

          ## Challenges
          - Potential technical debt
          - Complexity in managing toggles

          ## Usage
          - **For large applications with ongoing development**
          - When continuous delivery is in place
          - For testing features with specific user segments
  Blue/Green (or Red/black) Deployment:
    desc: Reduces downtime and risk by running two identical environments
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: | #markdown
          # Blue/Green (or Red/black) Deployment

          > High availability and immediate rollback

          Switch between active (Blue) and idle (Green) environments
          - Zero downtime deployments
          - Immediate rollback capability
          - Only one is active at any given moment
          - Router or load balancer aids in traffic control

          ## Advantages
          - High availability during deployments
          - Instantaneous switch over and rollback

          ## Challenges
          - Complexity in synchronization and data migration
          - Resource intensive (requires double the environment)

          ## Usage
          - **For applications where downtime is unacceptable**
          - In environments with critical 24/7 operations
          - When testing in near-production conditions is needed
  Canary Deployment:
    desc: Gradual release to a subset of users
    tags: [pattern, deployment]
    links:
      - What Are Deployment Patterns?: https://newsletter.techworld-with-milan.com/p/what-are-deployment-patterns
      - Top 5 Most-Used Deployment Strategies: https://youtu.be/AWVTKBUnoIg
    notes:
      - md: | #markdown
          # Canary Deployment

          > Spotting possible issues before they affect all consumers

          Starts with a small group of users, increases gradually
          - Minimizes impact of bugs
          - Allows for user feedback
          - One of the main enablers of **Continuous Deployments**

          ## Advantages
          - Feedback-oriented approach
          - Risk mitigation by affecting a small user base initially

          ## Challenges
          - Complexity in traffic routing
          - Longer time to full deployment

          ## Usage
          - **For user-centric applications with direct user feedback**
          - When new features need to be tested in the real world
          - In large-scale systems with diverse user groups
  DevSecOps checklist:
    desc: Checklist for DevSecOps
    tags: [pattern, deployment]
    links: [https://gitguardian.com/glossary/devsecops-checklist]
    notes:
      - md: | #markdown
          ### DevSecOps checklist

          **Know Your Dependencies**:
            - Map all software components and their security risks

          **Automate Security Testing**:
            - Integrate SAST, DAST, and secrets detection into CI/CD pipelines

          **Shift left**: _(Test Early, Test Often)_
            - Scan for vulnerabilities before code commits

          **Maintain Compliance**:
            - Continuously track and document security threats

          **Secure Cloud-Native Apps**:
            - Use CI/CD platforms that meet security standards

          **Manage Secrets Properly**:
            - Implement dedicated tools and training for credential security

          **Make Security Everyone's Job**:
            - Train developers and embed security specialists in teams
  AGE:
  SOPS/AGE:
    desc: SOPS (Secrets OPerationS) is an editor of encrypted files that supports YAML, JSON, ENV, INI and BINARY formats and encrypts with AWS KMS, GCP KMS, Azure Key Vault, PGP and age.
    tags: [pattern, deployment, secrets]
    notes:
      - md: | #markdown
          # SOPS/AGE

          SOPS (Secrets OPerationS) is an editor of encrypted files that supports YAML, JSON, ENV, INI and BINARY formats and encrypts with AWS KMS, GCP KMS, Azure Key Vault, PGP and age.

          AGE is a simple, modern and secure file encryption tool, format, and Go library. It supports both password-based and public key encryption.
      - md: | #markdown
          ### SOPS

          ```bash
          # MacOS
          brew install sops

          # Debian/Ubuntu
          sudo apt install sops

          # Fedora
          sudo dnf install sops

          # Arch Linux
          sudo pacman -S sops
          ```
