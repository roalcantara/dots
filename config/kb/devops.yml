commands:
  # MISE | The Modern Infrastructure as Code Tool
  # https://mise.jdx.dev
  mise generate config > mise.toml:
    desc: Generate a mise.toml file
    tags: [mise]
    links: [https://mise.jdx.dev/cli/generate/config.html]
  mise generate devcontainer --name "$(basename "$PWD")" --image mcr.microsoft.com/devcontainers/base:debian --write:
    desc: Generate a devcontainer to execute mise and write it to .devcontainer/devcontainer.json
    tags: [mise]
    links: [https://mise.jdx.dev/cli/generate/devcontainer.html]
  mise generate devcontainer --name "$(basename "$PWD")" --image mcr.microsoft.com/devcontainers/base:ubuntu --write:
    desc: Generate a devcontainer to execute mise and write it to .devcontainer/devcontainer.json
    tags: [mise]
    links: [https://mise.jdx.dev/cli/generate/devcontainer.html]
  mise config ls:
    desc: List config files currently in use
    tags: [mise]
    links: [https://mise.jdx.dev/cli/config/ls.html]
  mise trust:
    desc: Trust mise.toml in the current or parent directory
    tags: [mise]
    links: [https://mise.jdx.dev/cli/trust.html]
  mise trust --all:
    desc: Trust all config files in the current directory and its parents
    tags: [mise]
    links: [https://mise.jdx.dev/cli/trust.html]
  mise trust --untrust:
    desc: No longer trust this config, will prompt in the future
    tags: [mise]
    links: [https://mise.jdx.dev/cli/trust.html]
  mise trust --show:
    desc: Show the trusted status of config files from the current directory and its parents. Does not trust or untrust any files.
    tags: [mise]
    links: [https://mise.jdx.dev/cli/trust.html]
  mise install:
    desc: Installs everything specified in mise.toml
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise install node@20:
    desc: Installs a tool version to ~/.local/share/mise/installs/node/20 Installing alone will not activate the tools so they won't be in PATH - use `mise use` instead!
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise uninstall <PACKAGE>:
    desc: Uninstall a package with mise
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise ls:
    desc: List installed and active tool versions
    tags: [mise]
    links: [https://mise.jdx.dev/cli/ls.html]
  mise ls --current:
    desc: Only list tool versions currently specified in a mise.toml
    tags: [mise]
    links: [https://mise.jdx.dev/cli/ls.html]
  mise ls --local:
    desc: Only list tool versions currently specified in the local mise.toml
    tags: [mise]
    links: [https://mise.jdx.dev/cli/ls.html]
  mise ls --global:
    desc: Only list tool versions currently specified in the global mise.toml
    tags: [mise]
    links: [https://mise.jdx.dev/cli/ls.html]
  mise ls --installed:
    desc: Only list tool versions that are installed (Hides tools defined in mise.toml but not installed)
    tags: [mise]
    links: [https://mise.jdx.dev/cli/ls.html]
  mise ls-remote:
    desc: List all available tool versions for a plugin to install
    tags: [mise]
    links: [https://mise.jdx.dev/cli/ls-remote.html]
  mise ls-remote node:
    desc: List all available tool versions for node to install
    tags: [mise]
    links: [https://mise.jdx.dev/cli/ls-remote.html]
  mise ls-remote | fzf --header "Select a tool version to install":
    desc: List all available tool versions for all plugins and select one with fzf
    tags: [mise]
    links: [https://mise.jdx.dev/cli/ls-remote.html]
  mise update:
    desc: Update a package with mise
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise upgrade:
    desc: Upgrade a package with mise
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise clean:
    desc: Clean a package with mise
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise help:
    desc: Show help for a command with mise
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise version:
    desc: Show version of mise
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise activate:
    desc: Initializes mise in the current shell session. This should go into your shell's rc file or login shell
    tags: [mise]
    links: [https://mise.jdx.dev/cli/activate.html]
  echo 'eval "$(mise activate zsh)"' >> ~/.zshrc:
    desc: Add mise activate to your shell's rc file
    tags: [mise]
    links: [https://mise.jdx.dev/cli/activate.html]
  echo 'eval "$(mise activate bash)"' >> ~/.bashrc:
    desc: Add mise activate to your shell's rc file
    tags: [mise]
    links: [https://mise.jdx.dev/cli/activate.html]

