    desc: Distributed SQL query engine designed to query large data sets distributed over one or more heterogeneous data sources
    tags: [db, sql]
    links: [
      https://trino.io/docs/current/client/cli.html,
      https://trino.io/docs/current/glossary.html,
      https://youtu.be/SnvSBYhRZLg,
      https://starburst.io
    ]
    notes:
      - sh: | #shell
          #!/bin/bash

          # TRINO's CHEATSHEET
          # Distributed SQL query engine designed to query large data sets distributed over one or more heterogeneous data sources

          # 1. Run trinodb container with a default configuration (containing some catalogs to explore) mounted at /etc/trino
          docker run --rm -i --name trino -d -p 8080:8080 trinodb/trino

          # 2. The default server URL in the CLI matches the port used in the command to start the container (-p 8080:8080)
          open http://localhost:8080

          # 3. Execute queries in the existing Trino server container
          docker exec -it trino trino

          # 4. After starting the client, type and execute a query example data
          # trino>
          select count(*) from tpch.sf1.nation;
          # _col0
          # -------
          #     25
          # (1 row)
          #
          # Query 20250908_195801_00000_3enfm, FINISHED, 1 node
          # Splits: 13 total, 13 done (100.00%)
          # 1.27 [25 rows, 0B] [19 rows/s, 0B/s]

          # 5. When you are done with your exploration enter the quit command
          # trino>
          quit;

          # CONTAINER CONFIGURATIONS

          # 6. To customise the configuration files (rather than using the image's defaults) mounts /etc/trino
          docker run --name trino -d -p 8080:8080 --volume $PWD/etc:/etc/trino trinodb/trino

          # 7. To keep the default configuration and only configure catalogs, mounts /etc/trino/catalog - or individual catalog property files in it
          docker run --name trino -d -p 8080:8080 --volume $PWD/etc/catalog:/etc/trino/catalog trinodb/trino

          # 8. To use additional plugins mounts /usr/lib/trino/plugin
          docker run --name trino -d -p 8080:8080 --volume $PWD/plugins:/usr/lib/trino/plugin trinodb/trino

          # 14. Stop the trinodb container
          docker stop trino

          # 15. To start trinodb container
          docker start trino

          # 16. To remove a stopped trinodb container
          docker rm trino
      - sh: | #shell
          #!/bin/bash

          # TRINO's DYNAMIC CATALOG CHEATSHEET
          # Distributed SQL query engine designed to query large data sets distributed over one or more heterogeneous data sources

          # 1. To avoid having to create catalog files and mount them in the container enable dynamic catalog management
          docker run --name trino -d -p 8080:8080 -e CATALOG_MANAGEMENT=dynamic trinodb/trino

          # 2. To make dynamic catalog changes persistent across container restarts mounts /etc/trino/catalog
          docker run --name trino -d -p 8080:8080 -e CATALOG_MANAGEMENT=dynamic --volume $PWD/etc/catalog:/etc/trino/catalog trinodb/trino

          # 3. Execute queries in the existing Trino server container
          docker exec -it trino trino

          # 4. To create dynamic catalogs run
          # trino>
          CREATE CATALOG my_catalog WITH (
              connector = 'hive',
              hive.metastore.uri = 'thrift://localhost:9083'
          );

          # 5. After creating the dynamic catalog, you can use it in your queries
          # trino>
          SELECT * FROM my_catalog.my_table;

          # 6. To drop dynamic catalogs run
          # trino>
          DROP CATALOG my_catalog;

          # 7. When you are done with your exploration enter the quit command
          # trino>
          quit;

          # 8. Stop the trinodb container
          docker stop trino

          # 8. To remove a stopped trinodb container
          docker rm trino
  MongoDB:
    desc: General-purpose, document-based, distributed database built for modern application developers and for the cloud era.
    tags: [AVN, mongodb, macos]
    links:
      - Install On OSX: https://mongodb.com/docs/manual/tutorial/install-mongodb-on-os-x
      - The MongoDB Database Tools Documentation: https://mongodb.com/docs/database-tools
      - Install mongoDB and MongoDB Compass on Mac: https://youtu.be/MyIiM7z_j_Y
      - How to build a REST API with TypeScript & MongoDB: https://youtu.be/sYWhyjy1IKc
    notes:
      - md: |
          # Overview

          MongoDB is a general-purpose, document-based, distributed database built for modern application developers and for the cloud era.

          ## What is MongoDB?

          MongoDB is a document database, which means it stores data in JSON-like documents.

          These documents are flexible, allowing fields to vary from document to document and data structure to be changed over time.

          ## Key Features

          - **Document-Oriented Storage:** JSON-like documents with dynamic schemas offer simplicity and power.
          - **Full Index Support:** Index on any attribute, just like you're used to.
          - **Replication & High Availability:** Mirror across LANs and WANs for scale and peace of mind.
          - **Auto-Sharding:** Scale horizontally without compromising functionality.
          - **Querying:** Rich, document-based queries.
          - **Fast In-Place Updates:** Atomic modifiers for contention-free performance.
          - **Map/Reduce:** Flexible aggregation and data processing.
          - **GridFS:** Store files of any size without complicating your stack.
          - **Professional Support:** Enterprise class support, training, and consulting available.
      - md: |
          # Installation & Setup

          ### Tap the MongoDB Homebrew Tap to download the official Homebrew formula for MongoDB and the Database Tools

          > brew tap mongodb/brew

          ### update Homebrew and all existing formulae

          > brew update

          ### Install MongoDB

          > brew install mongodb-community
          > brew install --cask mongodb-compass

          The installation includes the following binaries:

          - `mongod` the server
          - `mongos` the sharded cluster query router
          - `mongosh` the MongoDB Shell

          In addition, the installation creates the following files and directories at the location specified below, depending on your Apple hardware:

          | **Desc**           | **Intel Processor**        | **Apple Silicon Processor**   |
          | ------------------ | -------------------------- | ----------------------------- |
          | configuration file | /usr/local/etc/mongod.conf | /opt/homebrew/etc/mongod.conf |
          | log directory      | /usr/local/var/log/mongodb | /opt/homebrew/var/log/mongodb |
          | data directory     | /usr/local/var/mongodb     | /opt/homebrew/var/mongodb     |

          ### Run MongoDB Community Edition

          To run MongoDB (i.e. the mongod process) as a macOS service, run:

          > brew services start mongodb/brew/mongodb-community

          To stop a mongod running as a macOS service, use the following command as needed:

          > brew services stop mongodb/brew/mongodb-community

          To run mongod manually as a background process using a config file, run:

          > mongod --config /usr/local/etc/mongod.conf --fork

          For macOS running on Apple Silicon processors:

          > mongod --config /opt/homebrew/etc/mongod.conf --fork

          To run mongod manually as a background process specifying --dbpath and --logpath on the command line, run:

          > mongod --dbpath /path/to/dbdir --logpath /path/to/mongodb.log --fork

          To stop a mongod running as a background process, connect to the mongod using mongosh, and issue the shutdown command as needed.

          ### To verify that MongoDB is running, perform one of the following

          - If you started MongoDB as a macOS service:

          > brew services list

          You should see the service mongodb-community listed as started.

          - Check the MongoDB version:

            > mongod --version

          If you started MongoDB manually as a background process:

          > ps aux | grep -v grep | grep mongod

          You should see your mongod process in the output.

          You can also view the log file to see the current status of your mongod process:

          > /usr/local/var/log/mongodb/mongo.log

          #### Connect and Use MongoDB

          To begin using MongoDB, connect `mongosh` to the running instance. From a new terminal, issue the following:

          > mongosh

          #### Using the MongoDB Database Tools

          The MongoDB Database Tools are a collection of command-line utilities for working with a MongoDB deployment,
          including data backup and import/export tools like `mongoimport` and `mongodump` as well as monitoring tools like `mongotop`.

          Run `mongotop` against your running MongoDB instance by invoking it in your macOS Terminal like so

          > mongotop

          ## Localhost Binding by Default

          By default, MongoDB launches with bindIp set to `127.0.0.1`, which binds to the localhost network interface.

          This means that the mongod can only accept connections from clients that are running on the same machine.

          Remote clients will not be able to connect to the mongod, and the mongod will not be able to initialize a replica set unless this value is set to a valid network interface which is accessible from the remote clients.

          This value can be configured either:

          - in the MongoDB configuration file with `bindIp`, or
          - via the command-line argument `--bind_ip`

          ### Install MongoDB Community with Docker

          #### 1. Pull the MongoDB Docker Image

          > docker pull mongodb/mongodb-community-server:latest

          #### 2. Run the Image as a Container

          > docker run --name mongodb -p 27017:27017 -d mongodb/mongodb-community-server:latest

          The `-p 27017:27017` in this command maps the container port to the host port.

          This allows you to connect to MongoDB with a `localhost:27017` connection string.

          To install a specific version of MongoDB, specify the version after the : in the Docker run command. Docker pulls and runs the specified version.

          > docker run --name mongodb -p 27017:27017 -d mongodb/mongodb-community-server:5.0-ubuntu2004

          #### 3. Check that the Container is Running

          > docker container ls

          #### 4. Connect to the MongoDB Deployment with mongosh

          > mongosh mongodb://localhost:27017
          > mongosh --port 27017

          #### 5. Validate Your Deployment

          To confirm your MongoDB instance is running, run the `Hello` command:

          ```mongodb
          db.runCommand(
            {
                hello: 1
            }
          )
          ```

          The result of this command returns a document describing your mongod deployment:

          ```json
          {
            isWritablePrimary: true,
            topologyVersion: {
                processId: ObjectId("63c00e27195285e827d48908"),
                counter: Long("0")
          },
            maxBsonObjectSize: 16777216,
            maxMessageSizeBytes: 48000000,
            maxWriteBatchSize: 100000,
            localTime: ISODate("2023-01-12T16:51:10.132Z"),
            logicalSessionTimeoutMinutes: 30,
            connectionId: 18,
            minWireVersion: 0,
            maxWireVersion: 20,
            readOnly: false,
            ok: 1
          }
          ```
      - md: |
          ## MongoDB Auth

          Setting up a username and password for a MongoDB database involves creating a user with authentication credentials within the MongoDB instance

          ### Step 1: Start MongoDB Without Access Control

          Start the MongoDB server without access control enabled. This is the default behavior when you first install MongoDB.

          ### Step 2: Connect to the MongoDB Instance

          Use the MongoDB shell or a MongoDB client to connect to your MongoDB instance.

          If you're using the MongoDB shell, you can simply run mongo to connect to your local MongoDB server.

          ### Step 3: Switch to the admin Database

          Authentication and user management are done in the context of a database.

          The admin database is typically used for creating users who have privileges across all databases.

          Switch to the admin database using the following command:

          > use admin

          ### Step 4: Create the User

          You can create a new user with a username and password and assign roles to this user.
          The roles determine what actions the user can perform.

          For example, to create a user with the ability to read and write to any database and also manage users:

          ```mongodb
          db.createUser({
            user: "root",
            pwd: "root..",
            roles: [
              { role: "readWriteAnyDatabase", db: "admin" },
              { role: "userAdminAnyDatabase", db: "admin" }
            ]
          })
          ```

          #### Step. 4.1: Create a User with Specific Roles

          Switch to the database you want the user to have access to. If the database doesn't exist yet, MongoDB will create it when you first store data in it.

          > use mydatabase

          Use the db.createUser command to create a new user with read and write permissions specifically for the "customer-db" database.
          You will assign the readWrite role on the "customer-db" database to the user.

          ```mongodb
          db.createUser({
              user: "root",
              pwd: "root..",
              roles: [
                  { role: "readWrite", db: "customer-db" }
              ]
          })
          ```

          #### Notes

          - The readWrite role allows the user to perform read and write operations on all non-system collections and on the system.js collection in the specified database.
          - If you have access control enabled (which you should for production environments), you'll need to authenticate as an administrative user before you can create or modify other users.
          - You can authenticate using the mongo command with -u (username), -p (password), and --authenticationDatabase options if you're connecting through the shell.
          - To enforce these access controls, ensure that the MongoDB server is restarted with access control enabled (security.authorization set to enabled in the mongod.conf file).
          - Security best practices recommend granting users the least privileges they need to perform their tasks.
          - This approach limits the potential damage in case the user's credentials are compromised.

          ### Step 5: Enable Access Control

          Stop the MongoDB server and restart it with access control enabled.

          This usually involves modifying the MongoDB configuration file (typically named `mongod.conf`) to include the security option with authorization enabled:

          ```yaml
          security:
            authorization
          ```

          Then, restart the MongoDB service. The method to do this can vary depending on your operating system.

          For example, on many Linux distributions, you might use:

          > sudo systemctl restart mongod

          On macOS, you might use:

          > brew services restart mongodb/brew/mongodb-community

          ### Step 6: Connect with Authentication

          After enabling access control, you must authenticate to perform any actions on the MongoDB instance.

          To authenticate, connect to the MongoDB instance and provide the username and password you created:

          > mongo -u root -p root.. --authenticationDatabase admin

          ### Step 7: Create Additional Users

          You can create additional users with different roles and permissions as needed.

          ### Step 8: Verify Authentication

          To verify that authentication is working, try to perform an action that requires authentication, such as listing the databases:

          > show dbs

          If you're able to list the databases, authentication is working correctly.

          ### Step 9: Secure Your MongoDB Deployment

          Ensure that your MongoDB deployment is secure by following best practices for security, such as:

          - Regularly updating MongoDB to the latest version
          - Enabling SSL/TLS encryption
          - Configuring network security settings
          - Monitoring and auditing user activity
          - Backing up your data regularly
  mongosh | MongoDB:
    desc: A shell-centric CLI for MongoDB with syntax highlighting, intelligent autocomplete, and more.
    tags: [AVN, mongodb, shell, cli]
    notes:
      - sh: |
          # enter the MongoDB Shell
          mongosh

          # show databases
          test> show dbs;

          # use/create a database
          test> use mydatabase;

          # show collections
          mydatabase> show collections;

          # create collection
          mydatabase> db.createCollection('myCollection');
          # { ok: 1 }

          # insert a document into a collection
          mydatabase> db.myCollection.insertOne({ field: "foo" });
          # {
          #   acknowledged: true,
          #   insertedId: ObjectId('660b6607f034a39c80c93426')
          # }

          # find all documents in a collection
          mydatabase> db.myCollection.find();
          # > [ { _id: ObjectId('660b6607f034a39c80c93426'), field: 'foo' } ]

          # find documents with a specific field value
          mydatabase> db.myCollection.find({ field: "foo" });
          # > [ { _id: ObjectId('660b6607f034a39c80c93426'), field: 'foo' } ]

          # find documents with a specific field value and return only specific fields
          mydatabase> db.myCollection.find({ field: "foo" }, { field: 1, _id: 0 });
          # > { "field": "foo" }

          # find documents with a specific field value and sort the results
          mydatabase> db.myCollection.find({ field: "foo" }).sort({ field: 1 });

          # find documents with a specific field value and limit the results
          mydatabase> db.myCollection.find({ field: "foo" }).limit(5);

          # find documents with a specific field value and skip the first 5 results
          mydatabase> db.myCollection.find({ field: "foo" }).skip(5);

          # find documents with a specific field value and return only specific fields, sort the results, and limit the results
          mydatabase> db.myCollection.find({ field: "foo" }, { field: 1, _id: 0 }).sort({ field: 1 }).limit(5);

          # update a document in a collection
          mydatabase> db.myCollection.updateOne({ field: "foo" }, { $set: { field: "bar" } });
          # {
          #   acknowledged: true,
          #   insertedId: null,
          #   matchedCount: 1,
          #   modifiedCount: 1,
          #   upsertedCount: 0
          # }

          # delete a document from a collection
          mydatabase> db.myCollection.deleteOne({ field : "bar" });

          # count the number of documents in a collection
          mydatabase> db.myCollection.countDocuments();

          # count the number of documents in a collection that match a query
          mydatabase> db.myCollection.countDocuments({ field: "foo" });

          # exit the MongoDB Shell
          mydatabase> exit;
  Modeling | MongoDB:
    desc: Estratégias para modelar dados em MongoDB para grandes volumes de dados
    tags: [AVN, mongodb, db]
    notes: |
      ## Modelagem de Dados para grande volume

      Estratégias para modelar dados em MongoDB para grandes volumes de dados.

      ### 1. Denormalização

      Incorporar dados relacionados em um único documento para reduzir a necessidade de joins.

      ### 2. Indexação

      Indexar campos frequentemente consultados para melhorar o desempenho das consultas.

      ### 3. Sharding

      Distribuir dados em vários servidores para lidar com grandes volumes de dados.

      ### 4. Preaggregation

      Pré-calcular e armazenar resultados de consultas frequentes para reduzir o tempo de resposta.

      ### 5. TTL Indexes

      Expirar documentos automaticamente após um período de tempo.
  Denormalization | MongoDB:
    desc: Incorporate related data into a single document to reduce the need for joins
    tags: [AVN, mongodb]
    notes: |
      ## Denormalization

      In a normalized schema, data is divided into multiple collections, which can lead to complex queries with multiple joins.

      💡 Denormalization is the process of incorporating related data into a single document to reduce the need for joins.

      ### Example

      ```js
      // Denormalized schema
      {
        _id: ObjectId('60b6607f034a39c80c93426'),
        name: 'John Doe',
        email: 'john@doe.com',
        address: {
          street: '123 Main St',
          city: 'Anytown',
          state: 'CA',
          zip: '12345'
        },
        orders: [
          {
            _id: ObjectId('60b6607f034a39c80c93427'),
            date: ISODate('2023-01-01T00:00:00Z'),
            total: 100.00
          },
          {
            _id: ObjectId('60b6607f034a39c80c93428'),
            date: ISODate('2023-01-02T00:00:00Z'),
            total: 150.00
          }
        ]
      }
      ```

      ### Use Cases

      - E-commerce
      - Social networks
      - Content management systems
  Sharding | MongoDB:
    desc: Distribute data across multiple servers to handle large data volumes
    tags: [AVN, mongodb]
    notes: |
      ## Sharding

      As data volumes grow, a single MongoDB instance may not be able to handle the load.

      💡 Sharding is the process of distributing data across multiple servers to handle large data volumes.

      ### Example

      ```js
      // Enable sharding for a database
      sh.enableSharding('mydatabase');

      // Create a sharded collection
      sh.shardCollection('mydatabase.myCollection', { _id: 'hashed' });
      ```

      ### Key Components

      - **Shard:** Single MongoDB instance that holds a data's subset.
      - **Shard Key:** The field used to distribute data across shards.
      - **Config Server:** Stores metadata about the sharded cluster.
      - **Router:** Routes queries to the appropriate shard.
  TTL | MongoDB:
    desc: Automatically expire documents after a specified period of time
    tags: [AVN, mongodb]
    notes: |
      ## TTL Indexes

      Some data is only relevant for a limited time and should be automatically deleted after a certain period.

      💡 TTL (Time-To-Live) indexes automatically expire documents after a specified period of time.

      ### Example

      ```js
      // Create a TTL index on the createdAt field
      // This index will automatically delete documents where the `createdAt` field is older than 1 hour.
      db.customers.createIndex({ createdAt: 1 }, { expireAfterSeconds: 3600 });
      ```

      ### Use Cases

      - Session data
      - Cache data
      - Log data

      ### Considerations

      - TTL indexes are not suitable for all use cases.
      - The expiration process runs every 60 seconds.
      - The TTL index does not guarantee that expired data will be deleted immediately.
  Preaggregation | MongoDB:
    desc: Pre-calculate and store results of frequent queries to reduce response time
    tags: [AVN, mongodb]
    notes: |
      ## Preaggregation

      Aggregating data in real-time can be resource-intensive and slow.

      💡 Preaggregation is the process of pre-calculating and storing the results of frequent queries to reduce response time.

      ### Example

      ```js
      // Create an aggregation pipeline to calculate the total sales by product

      db.sales.aggregate([
        { $group: { _id: '$product', totalSales: { $sum: '$amount' } } }
      ]);
      ```

      ### Use Cases

      - Reporting
      - Analytics
      - Dashboards

      ### Considerations

      - Store the results of this aggregation in a separate collection for faster access.
      - Preaggregation can improve query performance but may require additional storage.
      - Update the preaggregated data periodically to keep it up-to-date.
  Indexes | MongoDB:
    desc: Crie índices em campos frequentemente consultados para melhorar o desempenho das consultas
    tags: [AVN, mongodb, perf]
    notes: |
      > Indices podem ser criados em qualquer campo de um documento, incluindo campos dentro de arrays e subdocumentos, tornando as consultas mais rápidas e eficientes.

      ## 1. Initialize mongosh

      > mongosh "mongodb://root:root..@localhost:27017/customer-db"

      ## 2. Mock data

      ```js
      // insert documents
      for (let i = 0; i < 100000; i++) {
        db.customers.insertMany([
          {
            nome: 'Customer ' + i,
            email: 'customer' + i + '@exemplo.com',
            createdAt: new Date() - Math.floor(Math.random() * 10000000000),
          },
        ]);
      }
      ```

      ## 3. Count documents

      > db.customers.countDocuments()

      ## 4. Search without index

      > db.customers.find({ email: 'customer99999@exemplo.com' });

      ## 5. Explain the query (totalDocsExamined and executionTimeMillis)

      > db.customers.find({ email: 'customer99999@exemplo.com' }).explain('executionStats');

      ## 6. Create an index

      > db.customers.createIndex({ email: 1 });

      ## 7. Drop the index

      > db.customers.dropIndex('email_1');

      ## 8. Create compound index

      > db.customers.createIndex({ email: 1, createdAt: 1 });
  Aggregations | MongoDB:
    desc: Use pipelines de agregação para processar e transformar dados
    tags: [AVN, mongodb]
    notes: |
      ### Aggregations

      Use pipelines de agregação para processar e transformar dados.

      ```js
      // match documents with status 'A' and group by cust_id
      db.sales.aggregate([
        { $match: { status: 'A' } },
        { $group: { _id: '$cust_id', total: { $sum: '$amount' } } }
      ]);
      ```
  Aggregation Pipelines | MongoDB:
    desc: Transforming and combining data in collections through a multi-stage pipeline
    tags: [AVN, mongodb]
    notes:
      - md: |
          ## Aggregation Pipelines

          Complex aggregation pipelines in MongoDB are powerful tools for transforming and combining data in collections through a multi-stage pipeline.

          These pipelines allow for a variety of operations such as filtering, grouping, sorting, and joining data across documents.
      - md: |
          ### EXAMPLE 1. User Activity Summary

          Suppose you have a collection of user activity logs with fields such as userId, activityType, timestamp, and details.

          You want to generate a summary of each user's activity, including the count of each activity type and the last activity timestamp.

          ```js
          [
            {
              "$match": {
                "timestamp": {
                  "$gte": ISODate("2023-01-01"),
                  "$lt": ISODate("2023-12-31")
                }
              }
            },
            {
              "$group": {
                "_id": "$userId",
                "activityCounts": {
                  "$sum": 1
                },
                "activities": {
                  "$push": {
                    "type": "$activityType",
                    "details": "$details"
                  }
                },
                "lastActivity": {
                  "$max": "$timestamp"
                }
              }
            },
            {
              "$sort": {
                "lastActivity": -1
              }
            }
          ]
          ```
      - md: |
          ### EXAMPLE 2. Joining Collections and Aggregating Results

          Imagine you have two collections: orders with fields orderId, customerId, orderDate, total, and items, and customers with customerId, name, and location.

          You want to find the total spent per customer in a certain location and their latest order date.

          ```js
          [
            {
              "$lookup": {
                "from": "customers",
                "localField": "customerId",
                "foreignField": "customerId",
                "as": "customerInfo"
              }
            },
            {
              "$match": {
                "customerInfo.location": "New York"
              }
            },
            {
              "$group": {
                "_id": "$customerId",
                "totalSpent": {
                  "$sum": "$total"
                },
                "latestOrder": {
                  "$max": "$orderDate"
                }
              }
            },
            {
              "$sort": {
                "totalSpent": -1
              }
            }
          ]
          ```
      - md: |
          ### EXAMPLE 3. Time Series Data Analysis

          For a collection of time-series data such as stock prices with fields symbol, price, timestamp,

          To calculate the moving average and maximum price of each stock symbol within a specified time window:

          ```js
          [
            {
              "$match": {
                "symbol": "AAPL",
                "timestamp": {
                  "$gte": ISODate("2023-01-01"),
                  "$lt": ISODate("2023-01-31")
                }
              }
            },
            {
              "$sort": {
                "timestamp": 1
              }
            },
            {
              "$group": {
                "_id": "$symbol",
                "avgPrice": {
                  "$avg": "$price"
                },
                "maxPrice": {
                  "$max": "$price"
                }
              }
            }
          ]
          ```
      - md: |
          ### EXAMPLE 4. Complex Filtering and Projection

          You want to filter documents based on complex criteria and transform the output to include calculated fields.

          Suppose you have a collection of products with fields productId, name, category, price, and ratings.

          You aim to find products in a specific category with a minimum average rating and include a new field indicating a price range.

          ```js
          [
            {
              "$match": {
                "category": "Electronics",
                "ratings": {
                  "$gte": 4
                }
              }
            },
            {
              "$project": {
                "name": 1,
                "price": 1,
                "priceRange": {
                  "$cond": {
                    "if": {
                      "$lt": ["$price", 100]
                    },
                    "then": "Under $100",
                    "else": "Over $100"
                  }
                }
              }
            }
          ]
          ```
