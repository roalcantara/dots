      Use transações para garantir a consistência dos dados.

      ```js
      const session = db.getMongo().startSession();
      session.startTransaction();

      try {
        db.collection1.insertOne({ name: 'Alice' }, { session });
        db.collection2.insertOne({ name: 'Bob' }, { session });

