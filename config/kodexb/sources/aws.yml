  https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-using-build.html#building-applications-skip:
    desc: Building functions outside of AWS SAM using SkipBuild metadata
    tags: [aws, serverless, sam]
    notes:
      - md: | #markdown
          ## Build some function resources outside of AWS SAM

          - To have AWS SAM skip a function when using sam build, configure the following in your AWS SAM template:

            1. Add the `SkipBuild: True` metadata property to your function.
            2. Specify the path to your built function resources.

          - Here is an example, with TestFunction configured to be skipped:

            ```yaml
            # Its built resources are located at `built-resources/TestFunction.zip`:
            TestFunction:
              Type: AWS::Serverless::Function
              Properties:
                CodeUri: built-resources/TestFunction.zip
                Handler: TimeHandler::handleRequest
                Runtime: java11
              Metadata:
                SkipBuild: True
            ```

          - Now, when you run sam build, AWS SAM will do the following:

            1. AWS SAM will skip functions configured with `SkipBuild: True`.
            2. AWS SAM will build all other function resources and cache them in the `.aws-sam` build directory.
            3. For skipped functions, their template in the `.aws-sam` build directory will automatically be updated to reference the specified path to your built function resources.

          - Here is an example of the cached template for TestFunction in the `.aws-sam` build directory:

            ```yaml
            TestFunction:
              Type: AWS::Serverless::Function
              Properties:
                CodeUri: ../../built-resources/TestFunction.zip
                Handler: TimeHandler::handleRequest
                Runtime: java11
              Metadata:
                SkipBuild: True
            ```
  https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-specification-template-anatomy.html:
    desc: AWS SAM Template Anatomy - Structure and components
    tags: [aws, serverless, sam]
    notes:
      - yaml: | #yaml
          # The following example shows a YAML-formatted template fragment.
          Transform: AWS::Serverless-2016-10-31

          # Properties that are common to all your serverless functions, APIs, and simple tables.
          Globals:
            set of globals

          # A text string that describes the template.
          # This section corresponds directly with the Description section of CloudFormation templates.
          Description:
            String

          # Objects that provide additional information about the template.
          # This section corresponds directly with the Metadata section of CloudFormation templates.
          Metadata:
            template metadata

          # Values to pass to your template at runtime (when you create or update a stack).
          # You can refer to parameters from the Resources and Outputs sections of the template.
          # Objects that are declared in the Parameters section cause the sam deploy --guided command to present additional prompts to the user.
          # Values that are passed in using the --parameter-overrides parameter of the sam deploy command—and entries in the configuration file—take precedence over entries in the AWS SAM template file.
          Parameters:
            set of parameters

          # A mapping of keys and associated values that you can use to specify conditional parameter values, similar to a lookup table.
          # You can match a key to a corresponding value by using the Fn::FindInMap intrinsic function in the Resources and Outputs sections.
          # This section corresponds directly with the Mappings section of CloudFormation templates.
          Mappings:
            set of mappings

          # Conditions that control whether certain resources are created or whether certain resource properties are assigned a value during stack creation or update.
          # For example, you could conditionally create a resource that depends on whether the stack is for a production or test environment.
          # This section corresponds directly with the Conditions section of CloudFormation templates.
          Conditions:
            set of conditions

          # The stack resources and their properties, such as an Amazon Elastic Compute Cloud (Amazon EC2) instance or an Amazon Simple Storage Service (Amazon S3) bucket.
          # You can refer to resources in the Resources and Outputs sections of the template.
          # This section is similar to the Resources section of CloudFormation templates.
          # In AWS SAM templates, this section can contain AWS SAM resources in addition to CloudFormation resources.
          Resources:
            set of resources

          # The values that are returned whenever you view your stack's properties.
          # For example, you can declare an output for an S3 bucket name, and then call the aws cloudformation describe-stacks AWS Command Line Interface (AWS CLI) command to view the name.
          # This section corresponds directly with the Outputs section of CloudFormation templates.
          Outputs:
            set of outputs
