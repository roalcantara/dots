    notes:
      - md: | #markdown
          ### AWS Well-Architected Framework Pillars

          > The AWS Well-Architected Framework is based on six pillars that help you understand the pros and cons of decisions you make while building systems on AWS.
          - **Operational:**
             Focuses on operations in the cloud, including monitoring, incident response, and evolving procedures
          - **Security:**
             Emphasizes protecting information, systems, and assets while delivering business value through risk assessments and mitigation strategies
          - **Reliability:**
             Ensures a workload performs its intended function correctly and consistently, including recovery from failures and scaling to meet demand
          - **Performance:**
             Focuses on using IT and computing resources efficiently to meet system requirements and maintain efficiency as demand changes
          - **Cost Optimization:**
             Involves avoiding unnecessary costs by selecting the right resource types and sizes, monitoring usage, and scaling to meet actual demand
          ### The eight areas to consider when building serverless workloads
          #### 1. [Compute layer](https://docs.aws.amazon.com/wellarchitected/latest/serverless-applications-lens/compute-layer.html)
          Manages incoming requests with authorization and executes business logic.
          **Related Tools:**
            - **AWS Lambda:** Serverless function runtime for microservices
            - **Amazon API Gateway:** REST API layer with authorization and traffic management
            - **AWS Step Functions:** Workflow orchestration for multi-step and long-running processes
          #### 2. [Data layer](https://docs.aws.amazon.com/wellarchitected/latest/serverless-applications-lens/data-layer.html)
          Manages persistent storage, maintains application state, and enables real-time responses to data changes.
          - **Amazon DynamoDB:** Managed NoSQL database with Streams for real-time triggers and DAX for in-memory caching
          - **Amazon S3:** Object storage with CDN integration for serving static assets
          - **Amazon OpenSearch Service:** Managed search and analytics engine for logs, full-text search, and monitoring
          - **AWS AppSync:** Managed GraphQL API with real-time, offline, and enterprise security capabilities
          #### 3. [Messaging and streaming layer](https://docs.aws.amazon.com/wellarchitected/latest/serverless-applications-lens/messaging-and-streaming-layer.html)
          Manages inter-component communications and enables real-time analysis and processing of streaming data.
          - **Amazon SNS:** Managed pub/sub messaging service for asynchronous event notifications and mobile push
          - **Amazon Kinesis:** Collects and analyzes real-time streaming data with SQL processing capabilities
          - **Amazon Data Firehose:** Captures, transforms, and loads streaming data to multiple destinations for near real-time analytics
          #### 4. [User management and identity layer](https://docs.aws.amazon.com/wellarchitected/latest/serverless-applications-lens/user-management-and-identity-layer.html)
            Provides identity, authentication, and authorization for internal and external users.
            **Related Tools:**
            - **Amazon Cognito User Pools:** User sign-up and sign-in with social provider and SAML federation
            - **Amazon Cognito Federated Identities:** Scoped access management to AWS resources
          #### 5. [Edge layer](https://docs.aws.amazon.com/wellarchitected/latest/serverless-applications-lens/edge-layer.html)
          Delivers content with low latency and high transfer speeds to global users.
          - **Amazon CloudFront:** Global content delivery network (CDN) with edge locations for low-latency delivery
          #### 6. [Systems monitoring and deployment](https://docs.aws.amazon.com/wellarchitected/latest/serverless-applications-lens/systems-monitoring-and-deployment.html)
          Provides system visibility and performance insights, and manages workload changes through release processes.
          - **Amazon CloudWatch:** Consolidated metrics, logs, and custom KPIs with dashboards and automated alerting
          - **AWS X-Ray:** Distributed tracing and service mapping for identifying performance bottlenecks
          - **AWS SAM:** Packages, tests, and deploys serverless applications with local debugging support
          #### 7. [Deployment approaches](https://docs.aws.amazon.com/wellarchitected/latest/serverless-applications-lens/deployment-approaches.html)
          Ensures safe releases by managing consumer impact and enabling quick rollbacks through strategic deployment patterns.
          **All-at-once**
          - **Consumer Impact:** All at once
          - **Rollback:** Redeploy older version
          - **Best for:** Low concurrency workloads
          - **Speed:** Immediate
          - **Use case:** Non-critical environments (development)
          **Blue/Green**
          - **Consumer Impact:** All at once with pre-production testing
          - **Rollback:** Revert traffic to previous environment
          - **Best for**: Medium concurrency workloads (async and sync)
          - **Speed:** Minutes to hours of validation, then immediate to customers
          - **Use case**: Production changes with near zero-downtime releases
          **Canary (or Linear)**
          - **Consumer Impact:** 1-10% initial traffic shift, then phased increases
          - **Rollback:** Revert 100% of traffic to previous deployment
          - **Best for:** High concurrency workloads
          - **Speed:** Minutes to hours
          - **Use case:** Gradual, coordinated releases with rapid deployment cycles
          #### 8. Lambda version control
          Enables safe deployments and quick rollbacks through immutable versions and simplified alias management.
          **Lambda Versioning**
          - Creates immutable versions of Lambda functions with unique ARNs
          - Enables visibility of previously functioning code and quick rollback capabilities
          - Changes are auditable through AWS CloudTrail
          - **Best practice:** Enable in production for reliable architecture
          **Lambda Aliases**
          - Points to specific Lambda versions across development workflows (development, beta, production)
          - Simplifies deployments by keeping caller configuration static
          - Reduces deployment risk and error by decoupling API Gateway integrations from version changes
          - Enables safe promotions of new versions to live environments
