    notes:
      - md: | #markdown
          ### Implementing Observability with Powertools for AWS Lambda

          **System Overview**
          - Given an event-driven ride-sharing platform consisting of 5 interconnected Lambda functions
          - that process ride requests through an API Gateway, EventBridge, and multiple DynamoDB tables.

          #### KEY COMPONENTS

          1. **ride-service:** API entry point that creates ride records
            - `TRIGGER:` API Gateway HTTP requests
            - `WHEN:` customer requests a ride through the mobile app, then:
              1. Receives the HTTP POST request with ride details (pickup, destination, payment method)
              2. Creates a ride record in DynamoDB
              3. Publishes a _RideCreated_ event to EventBridge to trigger pricing
          2. **dynamic-pricing-service:** Calculates ride pricing with surge multipliers
            - `TRIGGER:` EventBridge _RideCreated_ events
            - `WHEN`: a ride is created, then:
              1. Calculates ride pricing using random base prices (5-20 range) with surge multipliers
              2. Publishes a _PriceCalculated_ event to EventBridge
          3. **driver-matching-service:** Assigns available drivers to rides
            - `TRIGGER:` EventBridge _PriceCalculated_ events
            - `WHEN:` pricing is calculated, then:
              1. Queries DynamoDB for available drivers
              2. Assigns the first available driver to the ride
              3. Publishes a _DriverAssigned_ event to EventBridge
          4. **payment-processor:** Processes payments with various payment methods
            - `TRIGGER:` EventBridge _DriverAssigned_ events
            - `WHEN:` a driver is assigned, then:
              1. Processes payments with simulation (90% success rate, 10% failure rate)
              2. Applies different latencies based on payment method:
                - SomeCompany Pay: 5 seconds delay
                - Other methods: 100-300ms random delay
              3. Publishes a _PaymentCompleted_ event to EventBridge
          5. **ride-completion-service:** Finalizes rides and updates driver availability
            - `TRIGGER:` EventBridge _PaymentCompleted_ events
            - `WHEN:` payment is completed, then:
              1. Updates the ride record status to `"completed"` in DynamoDB
              2. Sets the driver status back to `"available"` in DynamoDB

          **Observability Challenges**

            - No correlation across services, making it difficult to trace a single ride through the entire workflow
            - Generic logs lacking ride IDs, customer IDs, and business context
            - No performance metrics to identify bottlenecks or slow payment methods
            - Silent failures from old Android devices with missing headers
            - Manual log searching required for root cause analysis

          **Objectives with Powertools**

            - **Structured Logging:** Transform unstructured logs into queryable JSON for easier searchability and context
            - **Custom Metrics:** Create operational dashboards and enable real-time monitoring of business KPIs
            - **Business Context:** Add ride IDs, customer IDs, and payment methods to enable end-to-end customer journey tracking
            - **Log Buffering:** Optimize log performance to reduce CloudWatch costs
            - **Distributed Tracing:** Implement AWS X-Ray integration for complete visibility across all services
            - **Secure Configuration:** Manage sensitive data with caching to improve performance and security

          **Enable the following Business Metrics**

            - **Ride Requests & Success Rate** Track incoming ride requests and your conversion rate in real-time.
            - **Revenue Metrics** Monitor payment amounts and completed ride revenue.
            - **Payment Processing Duration** See how long payments take to process.
            - **Payments by Method** Distribution across credit card, somecompany pay, and cash payments.
      - ts: | #ts
          /**
          *  Add Structured Logging, Metrics, and Business Context to **ride-service**:
          *   - Add structured logging using Powertools Logger with correlation ID tracking
          *   - Add custom metrics to track RideRequests, RideCreated, and failures
          *   - Add business context (device_id, ride_id, rider_id, payment_method) to logs
          *   - Use middleware for automatic log injection and metric publishing
          **/
          import { Logger } from '@aws-lambda-powertools/logger';
          import { search } from '@aws-lambda-powertools/logger/correlationId';
          import { injectLambdaContext } from '@aws-lambda-powertools/logger/middleware';
          import { Metrics, MetricUnit } from '@aws-lambda-powertools/metrics';
          import { logMetrics } from '@aws-lambda-powertools/metrics/middleware';
          import middy from '@middy/core';
          import type { APIGatewayProxyEvent, APIGatewayProxyResult, Context } from 'aws-lambda';
          import type { Ride } from './models';
          import { RideService } from './services/RideService';
          import { RouteHandler } from './utils/RouteHandler';

          const rideService = new RideService();
          const logger = new Logger({ correlationIdSearchFn: search });
          const metrics = new Metrics();

          const lambdaHandler = async (
            event: APIGatewayProxyEvent,
            context: Context
          ): Promise<APIGatewayProxyResult> => {
            try {
              // Check if this is a POST /rides request
              if (event.httpMethod !== 'POST' || event.path !== '/rides') {
                return RouteHandler.notFound('Endpoint not found');
              }

              // Track ride request with metrics
              metrics.addMetric('RideRequests', MetricUnit.Count, 1);

              // Extract headers
              const deviceId = getDeviceIdFromHeaders(event.headers);

              // Append device info to logs
              logger.appendKeys({
                x_device: event.headers['x-device'],
                x_device_id: deviceId,
              });

              // Create ride (validation happens in service)
              const result = await rideService.createRide(event, deviceId);

              if (!result.success) {
                // Track failed ride creation with metrics and logs
                metrics.addMetric('RideCreationFailed', MetricUnit.Count, 1);

                logger.error(`Error creating ride: ${result.errorMessage}`);
                return RouteHandler.handleError();
              }

              const ride = result.ride as Ride;

              logger.appendKeys({
                ride_id: ride.rideId,
                rider_id: ride.riderId,
                payment_method: ride.paymentMethod,
              });

              // Track successful ride creation with business metrics
              metrics.addMetric('RideCreated', MetricUnit.Count, 1);
              metrics.addDimension('PaymentMethod', ride.paymentMethod);

              logger.info('Ride created successfully', { rider_id: ride.riderId });
              return RouteHandler.created(result.ride);
            } catch (error) {
              metrics.addMetric('RideCreationError', MetricUnit.Count, 1);
              logger.error('Unexpected error processing ride request', { error });
              return RouteHandler.handleError();
            }
          };

          function getDeviceIdFromHeaders(
            headers: { [key: string]: string | undefined } | null
          ): string {
            const deviceId = Object.entries(headers ?? {}).find(
              ([key]) => key.toLowerCase() === 'x-device-id'
            )?.[1];

            if (!deviceId) {
              throw new Error('Header not found');
            }

            return deviceId;
          }

          export const handler = middy(lambdaHandler)
            .use(
              injectLambdaContext(logger, {
                resetKeys: true,
                correlationIdPath: 'headers."x-correlation-id"',
              })
            )
            .use(logMetrics(metrics, { captureColdStartMetric: true }));
      - ts: | #ts
          /**
          *  Add Structured Logging, Metrics, and Business Context to **dynamic-pricing-service**:
          *   - Add structured logging for pricing operations with correlation ID tracking
          *   - Add custom metrics to track PricingSuccess, FinalPrice, and failures
          *   - Add pricing business context (ride_id, rider_id, final_price, base_price, surge_multiplier)
          *   - Use middleware for automatic metric publishing
          **/
          import { Logger } from '@aws-lambda-powertools/logger';
          import { search } from '@aws-lambda-powertools/logger/correlationId';
          import { injectLambdaContext } from '@aws-lambda-powertools/logger/middleware';
          import { Metrics, MetricUnit } from '@aws-lambda-powertools/metrics';
          import { logMetrics } from '@aws-lambda-powertools/metrics/middleware';
          import middy from '@middy/core';
          import type { EventBridgeEvent } from 'aws-lambda';
          import type { RideCreatedEvent } from './models';
          import { PricingService } from './services/PricingService';
          import { RushHourMultiplierService } from './services/RushHourMultiplierService';

          const pricingService = new PricingService();
          const rushHourMultiplierService = new RushHourMultiplierService();
          const logger = new Logger({ correlationIdSearchFn: search });
          const metrics = new Metrics();

          const lambdaHandler = async (
            event: EventBridgeEvent<'RideCreated', RideCreatedEvent>
          ): Promise<void> => {
            try {
              // Retrieve rush hour multiplier from Secrets Manager
              const rushHourMultiplier = await rushHourMultiplierService.getRushHourMultiplier();

              logger.info('Retrieved rush hour multiplier', {
                rush_hour_multiplier: rushHourMultiplier,
              });

              const result = await pricingService.processRideCreatedEvent(
                event.detail, rushHourMultiplier
              );

              // Add pricing business context
              logger.appendKeys({
                ride_id: result.rideId,
                rider_id: result.riderId,
                final_price: result.finalPrice,
                base_price: result.basePrice,
                surge_multiplier: result.surgeMultiplier,
              });

              if (!result.success) {
                metrics.addMetric('PricingFailed', MetricUnit.Count, 1);
                logger.error('Pricing Failure', { error: result.errorMessage });
                return;
              }

              // Track successful pricing
              metrics.addMetric('PricingSuccess', MetricUnit.Count, 1);
              metrics.addMetric('FinalPrice', MetricUnit.Count, result.finalPrice ?? 0);
              metrics.addDimension('SurgeApplied', (result.surgeMultiplier ?? 0 > 1) ? 'Yes' : 'No');

              logger.info('Successfully processed pricing', { ride_id: result.rideId });
            } catch (error) {
              metrics.addMetric('PricingError', MetricUnit.Count, 1);
              logger.error('Pricing error', { error });
              throw error;
            }
          };

          export const handler = middy(lambdaHandler)
            .use(
              injectLambdaContext(logger, {
                resetKeys: true, correlationIdPath: 'detail.correlationId',
              })
            ).use(logMetrics(metrics, { captureColdStartMetric: true }));
      - ts: | #ts
          /**
          *  Add Structured Logging, Metrics, and Business Context to **driver-matching-service**:
          *   - Add structured logging for driver matching operations with correlation ID tracking
          *   - Add custom metrics to track DriverMatchingSuccess, AvailableDrivers, and failures
          *   - Add business context (ride_id, driver_id, available_drivers_count)
          *   - Use middleware for automatic metric flushing
          **/
          import { Logger } from '@aws-lambda-powertools/logger';
          import { search } from '@aws-lambda-powertools/logger/correlationId';
          import { injectLambdaContext } from '@aws-lambda-powertools/logger/middleware';
          import { Metrics, MetricUnit } from '@aws-lambda-powertools/metrics';
          import { logMetrics } from '@aws-lambda-powertools/metrics/middleware';
          import middy from '@middy/core';
          import type { EventBridgeEvent } from 'aws-lambda';
          import type { PriceCalculatedEvent } from './models';
          import { DriverMatchingService } from './services/DriverMatchingService';

          const driverMatchingService = new DriverMatchingService();
          const logger = new Logger({ correlationIdSearchFn: search });
          const metrics = new Metrics();

          const lambdaHandler = async (
            event: EventBridgeEvent<'PriceCalculated', PriceCalculatedEvent>
          ): Promise<void> => {
            try {
              const result = await driverMatchingService.processPriceCalculatedEvent(event.detail);

              // Add business context for driver matching (Adds ride context (ride_id, driver_id) to all logs)
              logger.appendKeys({ride_id: result.rideId, driver_id: result.assignedDriverId });

              metrics.addMetric('AvailableDrivers', MetricUnit.Count, result.availableDriversCount ?? 0 );

              if (!result.success) {
                metrics.addMetric('DriverMatchingFailed', MetricUnit.Count, 1);
                logger.error('No available drivers for ride', { ride_id: result.rideId });
                return;
              }

              // Tracks driver availability and matching success rates
              metrics.addMetric('DriverMatchingSuccess', MetricUnit.Count, 1);
              logger.info('Successfully assigned driver to ride and sent event to payment processor', {
                driver_id: result.assignedDriverId, ride_id: result.rideId,
              });
            } catch (error) {
              metrics.addMetric('DriverMatchingError', MetricUnit.Count, 1);
              logger.error('[ERROR] DRIVER_MATCHING_ERROR:', { error });
              throw error;
            }
          };

          export const handler = middy(lambdaHandler)
            .use(
              // Enables structured logging for driver matching with correlation ID tracking
              injectLambdaContext(logger, {
                resetKeys: true, correlationIdPath: 'detail.correlationId',
              })
            ) // Tracks driver matching KPIs (DriverMatchingSuccess, AvailableDrivers) and automatically flushes them
            .use(logMetrics(metrics, { captureColdStartMetric: true }));
      - ts: | #ts
          /**
          *  Add Structured Logging, Metrics, and Business Context to **payment-processor**:
          *   - Add structured logging for payment processing with correlation ID tracking
          *   - Add custom metrics to track PaymentSuccess, PaymentAmount, PaymentProcessingTime
          *   - Add payment context (ride_id, rider_id, payment_id, payment_method)
          *   - Use middleware for automatic metric publishing
          **/
          // (Similar structure as above services, focusing on payment processing)
          import { Logger } from '@aws-lambda-powertools/logger';
          import { search } from '@aws-lambda-powertools/logger/correlationId';
          import { injectLambdaContext } from '@aws-lambda-powertools/logger/middleware';
          import { Metrics, MetricUnit } from '@aws-lambda-powertools/metrics';
          import { logMetrics } from '@aws-lambda-powertools/metrics/middleware';
          import middy from '@middy/core';
          import type { EventBridgeEvent } from 'aws-lambda';
          import type { DriverAssignedEvent } from './models';
          import { PaymentProcessor } from './PaymentProcessor';

          const logger = new Logger({ correlationIdSearchFn: search, logLevel: "DEBUG" });
          const metrics = new Metrics();
          const paymentProcessor = new PaymentProcessor(logger);

          const lambdaHandler = async (
            event: EventBridgeEvent<'DriverAssigned', DriverAssignedEvent>
          ): Promise<void> => {
            try {
              logger.debug('Processing payment for event', { event });

              const result = await paymentProcessor.handlePayment(event.detail);

              // Track payment requests and amounts
              metrics.addMetric('PaymentRequests', MetricUnit.Count, 1);
              metrics.addMetric('PaymentAmount', MetricUnit.Count, result?.payment?.amount ?? 0 );

              // Add business context for payment tracking
              logger.appendKeys({
                ride_id: result.payment?.rideId,
                rider_id: result.payment?.riderId,
                payment_amount: result.payment?.amount,
                payment_method: result.payment?.paymentMethod,
              });

              logger.debug('Payment processing result', { result });
              logger.debug('Payment details', { payment: result.payment });
              logger.debug('Processing time (ms)', { time: result.processingTimeMs });

              if (result.success) {
                // Track successful payment with metrics
                metrics.addMetric('PaymentSuccess', MetricUnit.Count, 1);
                metrics.addMetric('PaymentProcessingTime', MetricUnit.Milliseconds, result.processingTimeMs );
                metrics.addDimension('PaymentMethod', result.payment?.paymentMethod ?? '');
                logger.info('Payment completed successfully', { payment_id: result.payment?.paymentId, amount: result.payment?.amount });
              } else {
                // Track failed payment
                metrics.addMetric('PaymentFailed', MetricUnit.Count, 1);
                metrics.addDimension('PaymentMethod', result.payment?.paymentMethod ?? '');
                logger.debug('Error processing payment', { error: result.errorMessage });
                logger.error('Payment failed', { payment: result.payment });
              }
            } catch (error) {
              metrics.addMetric('PaymentError', MetricUnit.Count, 1);
              logger.error('Error in lambda_handler', { error });
              throw error;
            }
          };

          export const handler = middy(lambdaHandler)
            .use(
              injectLambdaContext(logger, {
                resetKeys: true,
                correlationIdPath: 'detail.correlationId',
              })
            )
            .use(logMetrics(metrics, { captureColdStartMetric: true }));
      - ts: | #ts
          /**
          *  Add Structured Logging, Metrics, and Business Context to **ride-completion-service**:
          *   - Add structured logging for ride completion with correlation ID tracking
          *   - Add custom metrics to track RideCompletionSuccess and failures
          *   - Add completion context (ride_id, driver_id, payment_id, error_type)
          *   - Track success rates for both ride and driver status updates
          **/
          import { Logger } from '@aws-lambda-powertools/logger';
          import { search } from '@aws-lambda-powertools/logger/correlationId';
          import { injectLambdaContext } from '@aws-lambda-powertools/logger/middleware';
          import { Metrics, MetricUnit } from '@aws-lambda-powertools/metrics';
          import { logMetrics } from '@aws-lambda-powertools/metrics/middleware';
          import middy from '@middy/core';
          import type { Context } from 'aws-lambda';
          import type { CloudWatchEvent, PaymentCompletedEvent } from './models';
          import { RideCompletionService } from './services/RideCompletionService';

          const rideCompletionService = new RideCompletionService();
          const logger = new Logger({ correlationIdSearchFn: search });
          const metrics = new Metrics();

          const lambdaHandler = async (
            event: CloudWatchEvent<PaymentCompletedEvent>,
            context: Context
          ): Promise<void> => {
            try {
              const result = await rideCompletionService.processPaymentCompletedEvent(event.detail, event['detail-type']);

              // Add business context for ride completion:
              // Use logger.appendKeys() for completion context (payment_id, ride_id, driver_id)
              logger.appendKeys({
                ride_id: result.rideId,
                rider_id: result.riderId,
                driver_id: result.driverId,
                ride_update_successful: result.rideUpdateSuccessful,
                driver_update_successful: result.driverUpdateSuccessful,
              });

              // Track RideCompletionSuccess, RideCompletionFailed, RideUpdateSuccess, DriverUpdateSuccess metrics
              if (!result.success) {
                // Uses metrics.addDimension() to filter by ErrorType when failures occur
                metrics.addMetric('RideCompletionFailed', MetricUnit.Count, 1);
                logger.error('Failed to process payment completion', {
                  payment_id: result.paymentId,
                  error_type: result.errorType,
                  error: result.errorMessage,
                });
                return;
              }
              metrics.addMetric('RideCompletionSuccess', MetricUnit.Count, 1);
              metrics.addMetric('CompletedRideAmount', MetricUnit.Count, result.amount);
              logger.info('Payment completion event processing completed successfully', { payment_id: result.paymentId });
            } catch (error) {
              // Uses metrics.addDimension() to filter by ErrorType when failures occur
              metrics.addMetric('RideCompletionError', MetricUnit.Count, 1);
              logger.error('Unexpected error processing payment completion', { error });
              throw error;
            }
          };

          export const handler = middy(lambdaHandler)
            .use(
              // Enables structured logging for ride completion
              injectLambdaContext(logger, {
                resetKeys: true, // Clears logging context between invocations to prevent data leakage
                correlationIdPath: 'detail.correlationId' // Automatically extracts correlation ID from request headers
              })
            ) // Tracks ride completion KPIs (RideCompletionSuccess, CompletedRideAmount)
            .use(logMetrics(metrics, { captureColdStartMetric: true })); // Automatically tracks Lambda cold starts as a metric
      - md: | #markdown
          ### The Customer Journey Problem:

          In a distributed system with many microservices, a single customer action (like requesting a ride) triggers a chain of events:

          1. Customer app → ride-service (creates ride)
          2. ride-service → dynamic-pricing-service (calculates price)
          3. dynamic-pricing-service → driver-matching-service (finds driver)
          4. driver-matching-service → payment-processor (processes payment)
          5. payment-processor → payment-stream-processor (handles payment events)
          6. payment-stream-processor → ride-completion-service (completes ride)

          Without **correlation IDs**, you cannot connect these logs together.

          If a customer reports an issue, you would need to manually search through logs from all 6 services trying to piece together what happened.

          #### How Powertools Solves This:

          The correlationIdPath parameter in the injectLambdaContext middleware tells Powertools to:

          1. Extract the correlation ID from the incoming event
          2. Add it automatically to every log entry in that request

          This allows viewing the complete end-to-end flow of a single customer request across all microservices,
          demonstrating the power of correlation IDs tracking for debugging and understanding system behavior.

          #### What You've Accomplished

          Fully observable platform with all three pillars of observability implemented:

          - ✅ Implemented structured logging with automatic correlation ID tracking across all services
          - ✅ Added custom business metrics to track KPIs (rides, payments, revenue) in real-time
          - ✅ Enriched logs with business context (ride_id, rider_id, payment_method) for complete journey tracking
          - ✅ Used dashboard widgets to identify patterns in device header issues
          - ✅ Found the exact error location using stack traces pointing to line 79
          - ✅ Completed root cause investigation - old Android devices send x-device instead of x-device-id
          - ✅ Resolved customer issues - old Android devices now work correctly
          - ✅ Created metric dimensions for flexible filtering and analysis by payment method and device type
          - ✅ Enabled end-to-end tracing with correlation IDs flowing through all 5 microservices

          > **From Reactive to Proactive:**
          >
          > You've moved from `"What happened?"`
          >
          > to `"What's happening right now?"`
          >
          > to `"Why did it happen?"`

          #### Your stakeholders can now:

          - See live metrics on customer demand, revenue flow, and operational efficiency
          - Trace individual customer journeys from mobile app through all services
          - Analyze business patterns like surge pricing effectiveness and payment method distribution
          - Debug issues with complete context including headers, business data, and correlation IDs
