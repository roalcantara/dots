commands:
  # AWS AUTH/CREDENTIALS
  cat ~/.aws/credentials:
    desc: Used by the AWS Command Line Interface (CLI) and SDKs to store the access key and secret access key for authenticating AWS API requests.
    tags: [aws, config, profile]
  aws configure list:
    desc: List the current configuration values for AWS CLI
    tags: [aws, profile]
  aws configure --profile <profile_name>:
    desc: Configure the AWS CLI with a named profile
    tags: [aws, serverless, sam]
  aws configure list-profiles:
    desc: List the available profiles configured in the AWS CLI. It requires ACCESS_KEY_ID, SECRET_ACCESS_KEY and REGION
    tags: [aws, serverless, sam]
  # AWS IAM POLICIES
  aws iam list-policies:
    desc: List all IAM policies in the current account
    tags: [aws, serverless, sam]
  aws iam list-policies --output yaml:
    desc: List all IAM policies in the current account in YAML format
    tags: [aws, serverless, sam]
  # AWS SECRETS MANAGER | https://us-east-1.console.aws.amazon.com/secretsmanager/listsecrets?region=us-east-1
  aws secretsmanager list-secrets:
    desc: List all secrets in the current account
    tags: [aws, serverless, sam]
    links:
      - https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html

      - https://us-east-1.console.aws.amazon.com/secretsmanager/listsecrets?region=us-east-1
  aws secretsmanager list-secrets --max-results 10:
    desc: List the first 10 secrets in the current account
    tags: [aws, serverless, sam]
    links:
      - https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html

      - https://us-east-1.console.aws.amazon.com/secretsmanager/listsecrets?region=us-east-1
  aws secretsmanager list-secrets --filters Key=tag-key,Values=example-key:
    desc: List all secrets in the current account that have a tag with the key 'example-key'
    tags: [aws, serverless, sam]
    links:
      - https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html

      - https://us-east-1.console.aws.amazon.com/secretsmanager/listsecrets?region=us-east-1
  aws secretsmanager list-secrets --query "SecretList[*].Name":
    desc: List the names of all secrets in the current account
    tags: [aws, serverless, sam]
    links:
      - https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html

      - https://us-east-1.console.aws.amazon.com/secretsmanager/listsecrets?region=us-east-1
  # AWS CLOUDFORMATION
  aws cloudformation create-stack --stack-name my-stack --template-body file://template.yaml --parameters ParameterKey=Param1,ParameterValue=Value1:
    desc: Create a CloudFormation stack named 'my-stack' with the specified template and parameters
    tags: [aws, serverless, sam]
  aws cloudformation list-stacks:
    desc: List all CloudFormation stacks in the current account
    tags: [aws, serverless, sam]
  aws cloudformation update-stack --stack-name my-stack --template-body file://template.yaml --parameters ParameterKey=Param1,ParameterValue=Value1:
    desc: Update the CloudFormation stack named 'my-stack' with a new template and parameters
    tags: [aws, serverless, sam]
  aws cloudformation describe-stacks --stack-name my-stack:
    desc: Describe the CloudFormation stack named 'my-stack'
    tags: [aws, serverless, sam]
  aws cloudformation describe-stacks --stack-name my-lambda-stack --query 'Stacks[0].Outputs':
    desc: Describe the outputs of the CloudFormation stack named 'my-lambda-stack'
    tags: [aws, serverless, sam]
  aws cloudformation cancel-update-stack --stack-name my-lambda-stack:
    desc: Cancel an ongoing update for the CloudFormation stack named 'my-lambda-stack'
    tags: [aws, serverless, sam]
  aws cloudformation delete-stack --stack-name my-stack:
    desc: Delete the CloudFormation stack named 'my-stack'
    tags: [aws, serverless, sam]
  # AWS lambda functions
  aws lambda list-functions:
    desc: List Lambda functions in LocalStack using the 'localstack' profile
    tags: [aws, lambda]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_lambda_code_examples.html]
  aws lambda list-functions --output yaml:
    desc: List all Lambda functions in the current account in YAML format
    tags: [aws, lambda]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_lambda_code_examples.html]
  aws lambda create-function --function-name my-node-function --runtime nodejs22.x --role arn:aws:iam::123456789012:role/service-role/MyTestFunction-role-tges6bf4 --handler my-function.handler --zip-file fileb://my-function.zip:
    desc: Create a Node.js Lambda function from zip file
    tags: [aws, lambda]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_lambda_code_examples.html]
  aws lambda create-function --function-name my-phython-function --runtime python3.10 --role arn:aws:iam::account-id:role/lambda-ex-role --handler lambda_function.lambda_handler --zip-file fileb://function.zip:
    desc: Create a Phython Lambda function from zip file
    tags: [aws, lambda]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_lambda_code_examples.html]
  aws lambda create-function --function-name my-function --runtime python3.10 --role arn:aws:iam::123456789012:role/lambda-ex --handler lambda_function.lambda_handler --zip-file fileb://my-function.zip --logging-config '{"LogFormat":"JSON", "ApplicationLogLevel":"DEBUG", "SystemLogLevel":"INFO", "LogGroup":"/aws/lambda/my-custom-log-group"}':
    desc: Create a Python Lambda function with custom logging configuration
    tags: [aws, lambda]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_lambda_code_examples.html]
  aws lambda get-function --function-name address_get:
    desc: Retrieve information about 'address_get' Lambda function in LocalStack
    tags: [aws, lambda]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_lambda_code_examples.html]
  aws lambda invoke --function-name address_get --cli-binary-format raw-in-base64-out --payload '{ "name":"Bob" }' response.json:
    desc: Invoke 'address_get' Lambda function in LocalStack with a test payload
    tags: [aws, lambda]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_lambda_code_examples.html]
  aws lambda delete-function --function-name address_get:
    desc: Delete 'address_get' Lambda function in LocalStack
    tags: [aws, lambda]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_lambda_code_examples.html]
  aws lambda list-layers --compatible-runtime python3.11:
    desc: List layers compatible with Python 3.11 runtime in LocalStack
    tags: [aws, lambda]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_lambda_code_examples.html]
  aws lambda list-layers --compatible-runtime nodejs20.x:
    desc: List layers compatible with Node.js 20.x runtime in LocalStack
    tags: [aws, lambda]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_lambda_code_examples.html]
  # AWS-CLI/DynamoDB
  aws dynamodb list-tables:
    desc: List DynamoDB tables in LocalStack
    tags: [aws, dynamodb]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_dynamodb_code_examples.html]
  aws dynamodb create-table --table-name MusicCollection --attribute-definitions AttributeName=Artist,AttributeType=S AttributeName=SongTitle,AttributeType=S --key-schema AttributeName=Artist,KeyType=HASH AttributeName=SongTitle,KeyType=RANGE --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 --tags Key=Owner,Value=blueTeam:
    desc: Create a DynamoDB table named 'MusicCollection' in LocalStack
    tags: [aws, dynamodb]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_dynamodb_code_examples.html]
  aws dynamodb describe-table --table-name MusicCollection:
    desc: Describe the DynamoDB table 'MusicCollection' in LocalStack
    tags: [aws, dynamodb]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_dynamodb_code_examples.html]
  aws dynamodb put-item --table-name MusicCollection --item file://item.json --return-consumed-capacity TOTAL --return-item-collection-metrics SIZE:
    desc: Put an item into the DynamoDB table 'MusicCollection' in LocalStack
    tags: [aws, dynamodb]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_dynamodb_code_examples.html]
  aws dynamodb get-item --table-name MusicCollection --key '{"Artist":"Acme Band","SongTitle":"Happy Day"}':
    desc: Get an item from the DynamoDB table 'MusicCollection' in LocalStack
    tags: [aws, dynamodb]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_dynamodb_code_examples.html]
  aws dynamodb query --table-name MusicCollection --projection-expression "SongTitle" --key-condition-expression "Artist = :v1" --expression-attribute-values file://expression-attributes.json --return-consumed-capacity TOTAL:
    desc: Query the DynamoDB table 'MusicCollection' in LocalStack
    tags: [aws, dynamodb]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_dynamodb_code_examples.html]
  aws dynamodb delete-item --table-name MusicCollection --key file://key.json --return-values ALL_OLD --return-consumed-capacity TOTAL --return-item-collection-metrics SIZE:
    desc: Delete an item from the DynamoDB table 'MusicCollection' in LocalStack
    tags: [aws, dynamodb]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_dynamodb_code_examples.html, https://awscli.amazonaws.com/v2/documentation/api/latest/reference/dynamodb/delete-item.html]
  aws dynamodb delete-table --table-name MusicCollection:
    desc: Delete the DynamoDB table 'MusicCollection' in LocalStack
    tags: [aws, dynamodb]
    links: [https://docs.aws.amazon.com/cli/v1/userguide/cli_dynamodb_code_examples.html]
  # AWS-CLI/Kinesis
  aws kinesis list-streams:
    desc: List Kinesis streams in LocalStack
    tags: [aws, kinesis]
  # AWS-CLI/SQS
  aws sqs create-queue --queue-name my-queue:
    desc: Create an SQS queue named 'my-queue' in LocalStack
    tags: [aws, sqs]
    links: [https://docs.localstack.cloud/aws/capabilities/config/initialization-hooks/#example]
  # AWS-CLI/S3
  aws s3 ls:
    desc: List S3 buckets in LocalStack
    tags: [aws, s3]
  aws s3 mb s3://bucket1:
    desc: Create an S3 bucket 'bucket1' in LocalStack
    tags: [aws, s3]
  aws s3 ls s3://bucket1:
    desc: List objects in an S3 bucket 'bucket1' in LocalStack
    tags: [aws, s3]
  aws s3 cp local.txt s3://bucket1:
    desc: Copy a local file to an S3 bucket 'bucket1' in LocalStack
    tags: [aws, s3]
  aws s3 cp s3://bucket1/local.txt local.txt:
    desc: Copy an S3 object from S3 bucket 'bucket1' in LocalStack to a local file
    tags: [aws, s3]
  aws s3 rm s3://bucket1/local.txt:
    desc: Remove an S3 object from S3 bucket 'bucket1' in LocalStack
    tags: [aws, s3]
  aws s3 rb s3://bucket1:
    desc: Remove an S3 bucket 'bucket1' in LocalStack
    tags: [aws, s3]
  # AWS SAM CLI
  brew tap aws/tap && brew install aws-sam-cli:
    desc: Install AWS SAM CLI using Homebrew
    tags: [aws, serverless, sam]
    notes:
      - md: | #markdown
          | **COMMAND**           | **WHAT IT DOES**                  |
          | --------------------- | --------------------------------- |
          | `sam init`            | Create new SAM project            |
          | `sam validate`        | Check template syntax             |
          | `sam build`           | Build & package code              |
          | `sam local start-api` | Test HTTP locally                 |
          | `sam local invoke`    | Test function directly            |
          | `sam deploy --guided` | Deploy (first time, saves config) |
          | `sam deploy`          | Deploy (quick, uses saved config) |
          | `sam logs`            | View Lambda logs                  |
          | `sam delete`          | Delete everything                 |
      - yaml: | #yaml
          # template.yaml - Common Structure
          AWSTemplateFormatVersion: '2010-09-09'
          Transform: AWS::Serverless-2010-05-13

          Description: My Lambda Application

          Globals:
            Function:
              Runtime: nodejs20.x
              Timeout: 30
              MemorySize: 256
              Environment:
                Variables:
                  ENVIRONMENT: dev

          Parameters:
            Environment:
              Type: String
              Default: dev
              AllowedValues: [dev, staging, prod]

          Resources:
            MyLambdaFunction:
              Type: AWS::Serverless::Function
              Properties:
                FunctionName: !Sub 'my-function-${Environment}'
                CodeUri: src/
                Handler: handlers/index.handler
                Runtime: nodejs20.x
                Timeout: 30
                MemorySize: 256
                Environment:
                  Variables:
                    LOG_LEVEL: info
                Events:
                  ApiEvent:
                    Type: Api
                    Properties:
                      RestApiId: !Ref MyApi
                      Path: /hello
                      Method: GET
                  ScheduledEvent:
                    Type: Schedule
                    Properties:
                      Schedule: 'rate(5 minutes)'

            MyApi:
              Type: AWS::Serverless::Api
              Properties:
                StageName: !Ref Environment
                Auth:
                  DefaultAuthorizer: MyCognitoAuth
                Cors:
                  AllowMethods: "'GET,POST,PUT,DELETE'"
                  AllowHeaders: "'Content-Type'"
                  AllowOrigin: "'*'"

          Outputs:
            ApiEndpoint:
              Description: API Gateway endpoint
              Value: !Sub 'https://${MyApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
            FunctionArn:
              Description: Lambda function ARN
              Value: !GetAtt MyLambdaFunction.Arn
