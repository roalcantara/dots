  https://app.localstack.cloud/getting-started:
    desc: LocalStack Panel
    tags: [aws, localstack]
    notes:
      - sh: | #shell
          #!/bin/bash

          # Install LocalStack CLI using Homebrew
          brew install localstack/tap/localstack-cli

          # Open LocalStack Admin Panel
          open https://app.localstack.cloud/getting-started

          # Set LocalStack environment variables
          export AWS_ACCESS_KEY_ID="test"
          export AWS_SECRET_ACCESS_KEY="test"
          export AWS_DEFAULT_REGION="us-east-1"
          export LOCALSTACK_HOST="localhost"
          export AWS_ENDPOINT_URL="http://$LOCALSTACK_HOST:4566"
          export AWS_PROFILE="localstack"

          # Set your token to activate your license
          localstack auth set-token ls-00000000-1111-2222-3333-555555555

          ######################################################################
          ### Create an S3 bucket in LocalStack
          # Using AWS_PROFILE=localstack environment variable
          aws s3 mb s3://bucket1
          # Using --profile localstack flag
          aws --profile localstack s3 mb s3://bucket1
          # Using --endpoint-url flag
          aws --endpoint-url=http://localhost.localstack.cloud:4566 s3 mb s3://bucket1

          ######################################################################
          ### List S3 buckets in LocalStack
          # Using AWS_PROFILE=localstack environment variable
          aws s3 ls
          # Using --profile localstack flag
          aws --profile localstack s3 ls
          # Using --endpoint-url flag
          aws --endpoint-url=http://localhost.localstack.cloud:4566 s3 ls
