      - yaml: | #yaml
          # template.yaml - Common Structure
          AWSTemplateFormatVersion: '2010-09-09'
          Transform: AWS::Serverless-2010-05-13

          Description: My Lambda Application

          Globals:
            Function:
              Runtime: nodejs20.x
              Timeout: 30
              MemorySize: 256
              Environment:
                Variables:
                  ENVIRONMENT: dev

          Parameters:
            Environment:
              Type: String
              Default: dev
              AllowedValues: [dev, staging, prod]

          Resources:
            MyLambdaFunction:
              Type: AWS::Serverless::Function
              Properties:
                FunctionName: !Sub 'my-function-${Environment}'
                CodeUri: src/
                Handler: handlers/index.handler
                Runtime: nodejs20.x
                Timeout: 30
                MemorySize: 256
                Environment:
                  Variables:
                    LOG_LEVEL: info
                Events:
                  ApiEvent:
                    Type: Api
                    Properties:
                      RestApiId: !Ref MyApi
                      Path: /hello
                      Method: GET
                  ScheduledEvent:
                    Type: Schedule
                    Properties:
                      Schedule: 'rate(5 minutes)'

            MyApi:
              Type: AWS::Serverless::Api
              Properties:
                StageName: !Ref Environment
                Auth:
                  DefaultAuthorizer: MyCognitoAuth
                Cors:
                  AllowMethods: "'GET,POST,PUT,DELETE'"
                  AllowHeaders: "'Content-Type'"
                  AllowOrigin: "'*'"

          Outputs:
            ApiEndpoint:
              Description: API Gateway endpoint
              Value: !Sub 'https://${MyApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
            FunctionArn:
              Description: Lambda function ARN
              Value: !GetAtt MyLambdaFunction.Arn
