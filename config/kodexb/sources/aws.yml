cheats:
  Error 'Role arn:aws:iam::123456789012:role/aws-sam-cli-managed-foo--CloudFormationExecutionRo-bar is invalid or cannot be assumed' when deleting a cloudformation stack:
    desc: This error occurs when the IAM role used by AWS SAM CLI to manage CloudFormation stacks is missing or misconfigured. To resolve this issue, you can try the following steps
    tags: [aws, serverless, sam]
    notes:
      - md: | #markdown
          ### Error on Deleting CloudFormation Stack

          #### WHAT

          - When attempting to delete a CloudFormation stack using AWS SAM CLI, you may encounter the following error message:

            ```sh
            sam delete --stack-name your-stack-name
            # => An error occurred (ValidationError) when calling the DeleteStack operation: arn:aws:iam::123456789012:role/aws-sam-cli-managed-foo--CloudFormationExecutionRo-bar is invalid or cannot be assumed
            ```

          #### WHY?

          > This error typically occurs when the IAM role that CloudFormation needs to delete the stack no longer exists or can't be assumed

          1. Ensure that the IAM role role exists in your AWS account

             ```sh
             aws iam get-role --role-name aws-sam-cli-managed-foo--CloudFormationExecutionRo-bar
             ```

          2. If the role is missing, you can recreate it:

            1. Create a JSON file named `trust-policy.json` with the following content:

               ```json
               {
                 "Version": "2012-10-17",
                 "Statement": [
                   {
                     "Effect": "Allow",
                     "Principal": {
                       "Service": "cloudformation.amazonaws.com"
                     },
                     "Action": "sts:AssumeRole"
                   }
                 ]
               }
               ```

            2. Create the IAM role using the AWS CLI:

               ```sh
               aws iam create-role --role-name aws-sam-cli-managed-foo--CloudFormationExecutionRo-bar --assume-role-policy-document file://trust-policy.json
               ```

            3. Attach the necessary policies to the role:

               ```sh
               aws iam attach-role-policy --role-name aws-sam-cli-managed-foo--CloudFormationExecutionRo-bar --policy-arn arn:aws:iam::aws:policy/AdministratorAccess
               ```

            4. Verify that the role has been created and the policies are attached:

               ```sh
               aws iam get-role --role-name aws-sam-cli-managed-foo--CloudFormationExecutionRo-bar
               aws iam list-attached-role-policies --role-name aws-sam-cli-managed-foo--CloudFormationExecutionRo-bar
               ```

            5. Run the command to delete the CloudFormation stack again:

               ```sh
               sam delete --stack-name your-stack-name --debug
               ```
