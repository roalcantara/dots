bookmarks:
  https://mise.jdx.dev:
    desc: Like asdf (or nvm or pyenv but for any language) it manages dev tools like node, python, cmake, terraform, and hundreds more.
    tags: [devops, package-manager, mise]
    links: [https://mise.jdx.dev/dev-tools]
commands:
  # TOOLS | https://mise.jdx.dev/dev-tools
  # Installs development tools and selects their versions for each project
  mise use:
    desc: Select or change the versions of tools for the current project with interactive selector
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/use.html]
  mise use node@24 python@3.13:
    desc: Add or change a project's tool version
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/use.html]
  mise use --global node@24:
    desc: Set the global version of Node.js
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/use.html]
  mise use --postinstall "mbx setup --defaults" mr-boxington:
    desc: Run a post-install command after setting the tool versions
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/use.html]
  mise use --tool-option mr_boxington=true rust mr-boxington:
    desc: enable a Rust tool option while installing Rust and mbx
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/use.html]
  mise use -g --pin node@20:
    desc: Pin the global version of Node.js to 20
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/use.html]
  mise use --env local node@20:
    desc: writes mise.local.toml (preserving .mise.local.toml if it already exists)
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/use.html]
  mise use --env staging node@20:
    desc: writes mise.staging.toml (loaded with MISE_ENV=staging)
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/use.html]
  mise ls --current:
    desc: Show tools selected by the current configuration
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/ls.html]
  mise install:
    desc: Installs everything specified in mise.toml
    tags: [devops, package-manager, mise]
    links: [https://mise.jdx.dev/dev-tools]
  mise update:
    desc: Update a package with mise
    tags: [devops, package-manager, mise]
    links: [https://mise.jdx.dev/dev-tools]
  mise upgrade:
    desc: Upgrade a package with mise
    tags: [devops, package-manager, mise]
    links: [https://mise.jdx.dev/dev-tools]
  mise exec -- node --version:
    desc: Execute a command using the specified versions of tools managed by mise
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/exec.html]
  mise exec node@24 -- node --version:
    desc: Try a version without saving it
    tags: [mise]
    links: [https://mise.jdx.dev/dev-tools, https://mise.jdx.dev/cli/exec.html]

  mise trust:
    desc: Trust mise.toml in the current or parent directory
    tags: [mise]
    links: [https://mise.jdx.dev/cli/trust.html]
  mise trust --all:
    desc: Trust all config files in the current directory and its parents
    tags: [mise]
    links: [https://mise.jdx.dev/cli/trust.html]
  mise trust --untrust:
    desc: No longer trust this config, will prompt in the future
    tags: [mise]
    links: [https://mise.jdx.dev/cli/trust.html]
  mise trust --show:
    desc: Show the trusted status of config files from the current directory and its parents. Does not trust or untrust any files.
    tags: [mise]
    links: [https://mise.jdx.dev/cli/trust.html]
  mise clean:
    desc: Clean a package with mise
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise help:
    desc: Show help for a command with mise
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise version:
    desc: Show version of mise
    tags: [mise]
    links: [https://mise.jdx.dev]
  mise activate:
    desc: Initializes mise in the current shell session. This should go into your shell's rc file or login shell
    tags: [mise]
    links: [https://mise.jdx.dev/cli/activate.html]

  mise doctor project:
    desc: Run the project's diagnostic checks
    tags: [mise]
    links: [https://mise.jdx.dev/cli/doctor/project.html#mise-doctor-project, https://mise.jdx.dev/configuration/project-diagnostics.html]
    notes:
      - md: | #markdown
          ## Project diagnostics

          `mise doctor project` runs named checks from your project's configuration and reports every result.

          Use it to check requirements that tool versions alone cannot establish, such as
          whether a compiler can discover a native library or
          whether a database accepts connections.

          ```toml
          [doctor.checks.openssl]
          description = "OpenSSL development files are discoverable"
          run = "pkg-config --exists openssl"
          hint = "Run `mise bootstrap packages apply` to install the declared build dependencies."
          timeout = "5s"
          os = ["linux", "macos"]

          [doctor.checks.database]
          description = "PostgreSQL accepts connections"
          run = "pg_isready --quiet"
          hint = "Start the project's services with pitchfork."
          timeout = "5s"
          ```

          ```sh
          mise doctor project
          mise doctor project --json
          ```

          Example output:

          ```text
          PASS database: PostgreSQL accepts connections
          FAIL openssl: OpenSSL development files are discoverable
            Command exited with exit status: 1
            Run `mise bootstrap packages apply` to install the declared build dependencies.
          Ordinary mise doctor continues to diagnose mise itself; it does not run these checks. Checks do not run automatically when entering a directory or running a task. There are no implicit project checks: declare the requirements you need.
          ```

  mise dot status:
    desc: Show the state of your dotfiles and their history
    tags: [mise]
  mise dot add ~/.zshrc:
    desc: Start managing ~/.zshrc from your dotfiles directory
    tags: [mise]
  mise dot track ~/.config/nvim:
    desc: Save the history of a directory in place
    tags: [mise]
  mise dot undo:
    desc: Revert the last change to the dotfiles managed by mise
    tags: [mise]
  mise dot save:
    desc: Save the current state of the dotfiles managed by mise
    tags: [mise]
  mise dot apply:
    desc: Deploy every [dotfiles] entry
    tags: [mise]
  mise dot sync:
    desc: Sync the dotfiles managed by mise with the remote repository
    tags: [mise]
  mise dot history:
    desc: List saved checkpoints
    tags: [mise]
  mise dot origin set https://github.com/roalcantara/dots-history.git --sync manual -E desktop:
    desc: Set the origin for the dotfiles repository and sync manually for the desktop environment
    tags: [mise]
  mise dot save -E desktop && mise dot sync -E desktop:
    desc: Save and sync the dotfiles for the desktop environment
    tags: [mise]

  mise bootstrap --only dotfiles,tools:
    desc: Apply everything except tools and the bootstrap task
    tags: [mise]
  mise bootstrap --force-dotfiles:
    desc: Replace files that conflict with whole-file dotfile entries
    tags: [mise]
  mise bootstrap --from git@github.com:example/workstation.git:
    desc: Clone a bootstrap project and apply it
    tags: [mise]
  mise -E work bootstrap --from git@github.com:example/workstation.git:
    desc: Clone a bootstrap work project (mise.work.toml) and apply it
    tags: [mise]
  mise bootstrap --from https://github.com/example/dotfiles.git --from-dir ~/.dotfiles --config-dir .config/mise:
    desc: Clone a dotfiles repository and link ~/.config/mise to its .config/mise
    tags: [mise]
  mise bootstrap packages import --manager brew:
    desc: Import packages using the Homebrew package manager
    tags: [mise]
  mise bootstrap --adopt example/mise-config:
    desc: Clone global config into ~/.config/mise, then apply it
    tags: [mise]
  mise bootstrap --adopt example/setup --replace-history --yes:
    desc: Use a setup repository's dotfile history instead of this machine's
    tags: [mise]
  mise bootstrap --update:
    desc: Refresh package metadata and fast-forward repositories first
    tags: [mise]
  mise bootstrap -E desktop:
    desc: Bootstrap the desktop environment with the specified profile
    tags: [mise]
  mise bootstrap --adopt:
    desc: Adopt the current environment into the mise bootstrap process
    tags: [mise]
  mise bootstrap --adopt dots-history:
    desc: Adopt the current environment into the mise bootstrap process for the dots-history profile
    tags: [mise]
  mise bootstrap packages status:
    desc: Show the status of the bootstrap packages
    tags: [mise]
