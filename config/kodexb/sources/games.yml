bookmarks:
  https://youtu.be/6NVOVhWhRQU:
    desc: Electra Ultimate Guide - The Most Unique Tank in Hero Wars Alliance!
    tags: [games, heroes]
    notes:
      - md: | #markdown
          # Electra Ultimate Guide - The Most Unique Tank in Hero Wars Alliance!

          The video outlines five distinct team compositions designed to maximize Electra von Grave's effectiveness as a front-line tank, emphasizing her ability to absorb damage and boost magical allies (12:46).

          Here are the recommended teams and their characteristics:

          ## Electra, Cai, Zesha, Amamira, and Aiden:
          - A balanced mix of protection and explosive magic.
          - Electra handles damage absorption, while Aiden boosts healing and shields.
          - Amamira effectively counters creep-based attackers, and Zesha provides significant magical follow-up.

          ## Electra, Tempest, Nebula, Folio, and Polaris (13:28)
          - Focused on tempo control.
          - Tempest locks the enemy team down, Nebula enhances burst potential
          - Folio and Polaris disrupt formations to create synchronized damage windows.

          ## Electra, Nebula, Zesha, Folio, and Aiden (14:03)
          - This lineup prioritizes raw magical power.
          - It is highly effective against mixed physical-magical enemy teams
          - Nebula supercharging Zesha for lethal, high-damage eliminations.

          ## Electra, Iris, Somna, and Faceless (14:37)
          - A strategy built on controlled chaos.
          - This team utilizes Somna's sleep mechanics and Iris's soul-burning execution to punish debuffed enemies
          - While Faceless offers crowd control by throwing or copying key abilities.

          ## Electra, Tempest, Morgan, Iris, and Faceless (15:15)
          - The ultimate dismantling composition.
          - Tempest prevents the enemy from acting, allowing Electra to soak pressure
          - While Morgan and Iris wipe the field through sustained magical damage and resurrection punishment.
