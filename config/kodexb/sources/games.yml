  Common Hydra Darkness:
    desc: A dark variant of the common hydra, known for its multiple heads and regenerative abilities.
    tags: [games, heroes, hydra]
    notes:
      - md: | #markdown
          ## Common Hydra Darkness
          > Best results come from a front-line sustain team that can absorb pressure, keep the party alive, and finish the fight without losing tempo.

          - Team 1: Control + sustain
            > This is the safest setup for a slower, more methodical fight because it keeps the front line stable while preserving enough support to survive the hydra's damage spikes.
            > Leonel provides the strongest melee pressure from the front line and helps keep the fight moving with high physical attack output.
            > Mojo adds magic pressure and keeps the team from being too dependent on a single damage source, which matters when the hydra is durable and long-lived.
            > Morrigan adds sustain and magic-focused healing, helping the squad recover during the longer damage phases.
            > Aurora gives the team the reliable tanking and durability needed to anchor the formation while staying safe under fire.
            > Guus is the clean support anchor here: his healing and team utility keep the party steady and reduce the risk of the fight collapsing after a bad burst window.
            1. Leonel
            2. Mojo
            3. Morrigan
            4. Aurora
            5. Guus

          - Team 2: Front-line bruiser
            > This lineup focuses on heavy damage absorption and strong healing throughput because the hydra can punish thin, glassy teams.
            > Mushy and Shroom is the primary wall here: a tank hero with high health and front-line presence makes it much easier to absorb pressure before the back line is exposed.
            > Kayla contributes direct melee damage and keeps pressure on the hydra while the team absorbs the incoming punishment.
            > Phobos adds control and target disruption, which helps the team keep the hydra from freely pushing back into the formation.
            > Maya provides the sustain side of the duo, keeping the back line stable during the longer damage cycles.
            > Ziri brings extra tank durability and a second sturdy front-line anchor so the team can trade health more safely and recover faster.
            1. Mushy and Shroom
            2. Kayla
            3. Phobos
            4. Maya
            5. Ziri

          - Team 3: Burst + cleanup
            > Best when you want a faster kill pattern and quick removal of the strongest head because the damage carriers are concentrated enough to end the fight before sustain becomes an issue.
            > Dante is the main carry here: his marksmanship profile and high physical attack output make him ideal for clean finishing damage.
            > Byrna provides team sustain and anti-control support, keeping the burst group from falling apart during a bad exchange.
            > Julius adds a second durable front-line component, which is valuable because the battleground is more dangerous when the team tries to rush the kill.
            > Jorgen brings the control-side utility needed to keep the hydra from overwhelming the squad during the burst sequence.
            > Thea gives the team enough healing and support consistency to keep the burst core alive long enough to finish the head.
            1. Dante
            2. Byrna
            3. Julius
            4. Jorgen
            5. Thea
  Common Hydra Water:
    desc: A water variant of the common hydra that punishes slow teams and favors sustained control and magic-safe front lines.
    tags: [games, heroes, hydra]
    notes:
      - md: | #markdown
          ## Common Hydra Water
          > The best approach is a balanced team with reliable front-line durability, magic control, and enough healer coverage to survive long pressure phases.

          - Team 1: Magic control core
            > This team works because it combines two durable front-line anchors with strong magic control and enough sustain to keep the hydra from outlasting the party.
            > Mojo is the magical pressure piece: his mage profile and strong magic output let the team punish the hydra while staying in range.
            > Folio adds another high-magic damage lane and keeps the compositional pressure high, which is important against a water head that favors drawn-out fights.
            > Jorgen gives the team power through control and utility, helping the squad stay stable instead of being overwhelmed by repeated pressure.
            > Aurora provides a safe front-line anchor and makes the formation more forgiving when the hydra starts trading damage in longer lanes.
            > Guus keeps the whole setup alive with healing support, which is especially valuable in a slower hydra fight where the team cannot afford a bad sustain break.
            1. Mojo
            2. Folio
            3. Jorgen
            4. Aurora
            5. Guus

          - Team 2: Back-line burst
            > This lineup works best when you want to pressure the hydra fast and finish before it can recover because the actual damage core is concentrated in the ranged carries.
            > Keira adds elite marksman pressure and backs the team's burst sequence with a strong ranged attack profile.
            > Nebula gives this setup a support layer that keeps the damage core active and stable during the key burst windows.
            > Artemis increases the ranged burst value and helps the team convert a short opening into a quicker finish.
            > Ziri provides the secondary front-line protection needed so the back line is not exposed while the squad is committing to damage.
            > Maya supplies sustain and healing, which makes the burst line less fragile when the hydra counters with pressure.
            1. Keira
            2. Nebula
            3. Artemis
            4. Ziri
            5. Maya

          - Team 3: Sustain pressure
            > This team is stronger when the fight drags because it has a stable tank, solid healing, and enough ranged pressure to keep the hydra under control while the party recovers.
            > Electra von Grave acts as the primary front-line anchor and absorbs pressure so the team can keep attacking without immediately collapsing.
