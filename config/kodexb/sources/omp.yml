          # Oh My Pi (OM) - Free Terminal Agent

          > *Oh My Pi* (*OM*) is an open-source terminal coding agent that functions as a fork of *Pi*.
          > It focuses on performance and workflow integration, offering several distinct advantages over other coding agents.

          ### KEY FEATURES AND HIGHLIGHTS

          - **Native Multi-Platform Support:**
            - Works natively on *macOS*, *Linux*, and *Windows* without requiring *WSL*.

          - **Unified Configuration:**
            - Automatically detects and imports rules, skills, and *MCP* server definitions from other tools like *Claude Code*, *Cursor*, *Copilot*, *Gemini*, and more without manual conversion.

          - **Subscription Reuse:**
            - Allows sign-in with existing coding plan subscriptions (e.g., *Claude*) to bill against the plan rather than individual per-token API pricing.

          - **Flexible Model Roles:**
            - Users can assign different models to specific roles and cycle through them mid-session
            - *default* (Sonic) for general coding
            - *small* for subagent fan-out (DeepSeek)
            - *slow* for heavy reasoning (Opus)
            - *plan* mode (Opus)

          - **Rotate Keys, Fall Back:**
            - Multiple API keys for one provider
            - Omp rotates through them automatically
            - 429 errors are handled with built-in back-off and fallback chains - the rest of the turn hands off your backup model automatically.
            - Multiple API keys can be stacked and rotated automatically, with built-in back-off and fallback chains to handle *429* errors.

          - **Advanced Editing System:**
            - Hashline: Uses content hashes for code edits rather than retyping full files, which significantly reduces token usage and prevents formatting errors.

          - **LSP Integration:**
            - Includes 14 language server operations for refactoring, symbol tracking, and diagnostics, allowing the agent to understand code as an IDE does.

          - **Native Debugger Support:**
            - Supports 28 debug adapter protocol operations, allowing it to attach to running processes (e.g., *Delve*, *Debuggy*, *LLDB*) to resolve deadlocks and inspect memory.

          - **Advanced Workflow Tools:**
            - Time-traveling stream rules
            - Advisor mode for oversight
            - `/review` - reviewer sub-agents with veredict
            - `/collab` - live collaboration
            - Hindsight: local memory layer

          ### TECHNICAL ADVANTAGES

          - **Rust Internals:**
            - Unlike other agents that shell out to external binaries, *OM* uses a 55,000-line *Rust* core.
            - Tools like *Ripgrep*, file walking, and a vendored shell (*Brush*) are compiled directly into the binary, resulting in faster performance and no dependency on external Unix binaries.

          - **Context Efficiency:**
            - Uses a *Tree-sitter* powered summarizer to pull structural snippets instead of dumping entire file contents into the context window.

          - **Resilient Fallbacks:**
            - Automatically rotates through multiple stacked API keys and handles *429* errors with built-in back-off and fallback chains.
