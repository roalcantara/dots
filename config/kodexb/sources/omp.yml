      - md: | #markdown
          # IS THIS THE BEST AGENT HARNESS?

          > *Oh My Pi* (OM) is a feature-rich, "batteries-included" coding agent harness built upon the minimal *Pi* harness.
          > It is designed to be a complete, opinionated coding environment with an IDE "wired in."

          ### KEY FEATURES AND HIGHLIGHTS
          - **Config**:
              - Automatically detects and imports rules, skills, and *MCP* server definitions from other tools like *Claude Code*, *Cursor*, *Copilot*, *Gemini*, and more without manual conversion.
          - **Hashline Editing:** A robust editing approach that uses unique hash identifiers for lines of code rather than simple string matching, leading to better accuracy and token efficiency.
          - **Built-in LSP:** Supports workspace-wide refactoring (renaming variables, functions, or files) by understanding imports and project structure, rather than just performing superficial text replacements.
          - **Native Debugger:** Utilizes *debugpy* to inject into processes, allowing the agent to set breakpoints, inspect variables, and step through code to diagnose runtime issues like the "zero division error" mentioned.
          - **Collaboration & Remote Control:** Generates QR codes or links to open a session in a browser, enabling cross-device coding or collaborative sessions.
          - **Voice Interaction:**
              - **Real-time Voice Mode:** Uses *Codeex* for back-and-forth conversational coding.
              - **Voice Input:** Supports speech-to-text (using local models like Nvidia) and text-to-speech (via *Kakoro*).
          - **Browser Tool:** Can launch a headless browser instance to scrape the web or perform complex web-based tasks instead of relying solely on standard web search.
          - **Advanced Logic Features:**
              - **Time-Traveling Stream Rules:** Triggers rules based on regex matches, avoiding the need to clutter the LLM context window.
              - **Advisor Models:** Allows a secondary model to oversee or check the work of the primary agent.
              - **Built-in Binaries:** Includes native tools like *ripgrep*, *grep*, and *find* directly in the binary, improving cross-platform compatibility (including Windows).
          - **Plugin Ecosystem:** Inherits the plugin ecosystem of the base *Pi* harness, allowing users to install or uninstall extensions via simple commands (e.g., `om install`).
          - **User Experience:**
              - **Configuration:** Offers extensive settings, including an "always ask" mode for tool approval to prevent autonomous agent errors.
              - **Persistence:** Automatically detects and respects existing project configuration files (e.g., *claud.md* or other IDE configs) in the workspace.
