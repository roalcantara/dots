bookmarks:
  https://rayanbo.github.io/todo:
    title: TODO CLI
    desc: Single binary that reads and writes project's TODO.md in MD or YAML
    tags: [todo, cli]
    links:
      Docs: https://rayanbo.github.io/todo/documentation
    notes:
      - md: | #markdown
          # TODO.md

          > A plain Markdown document with three sections: Tasks, Actors, and Comments.

          When a task has a code position, it includes a Position field.
      - md: | #markdown
          # Tasks
          - [ ] a1b2 **Build login** - **Actors**: u0v1 - **Priority**: high - **Created**: 2026-07-07 12:00 - **Position**: "file:///C:/project/src/main.rs#L15:10"
          - [x] x9k2 **Deploy to prod** - **Due**: 2026-07-15 18:00
          # Actors
          - u0v1 - **Pseudo**: Alice - **Pic**: https://example.com/alice.png - **Type**: Human
          # Comments
          - c1d2 - **Text**: This is a comment - **Task**: a1b2 - **Actors**: u0v1

commands:
  /todo-init [--force, --yaml, --md, --both]:
    title: Create TODO file
    desc: Create a new TODO file (md or yaml)
    cmd: todo --init
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-add [task|actor|comment]:
    title: Add a TODO item
    desc: Add a task, actor, or comment to a TODO file.
    cmd: todo add
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-list [tasks|actors|comments]:
    title: List TODO entries
    desc: List tasks, actors, or comments from the current TODO store.
    cmd: todo list
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-update <id> [field=value]:
    title: Update a TODO item
    desc: Update fields on an existing task, actor, or comment by ID.
    cmd: todo update
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-delete <id>:
    title: Delete a TODO item
    desc: Delete a task, actor, or comment by ID.
    cmd: todo delete
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-install [--force]:
    title: Install the todo binary
    desc: Install the todo CLI into PATH so it is available globally.
    cmd: todo install
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-completion [bash|zsh|fish]:
    title: Generate shell completions
    desc: Generate shell completion scripts for the current shell.
    cmd: todo completion
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-dashboard:
    title: Start the web dashboard
    desc: Launch the local TODO dashboard in the browser.
    cmd: todo dashboard
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-tags:
    title: List tags and counts
    desc: Show all tags and how many tasks each tag contains.
    cmd: todo tags
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-search <query>:
    title: Search TODO content
    desc: Search tasks by query across the TODO data.
    cmd: todo search
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-status <id> [done|pending]:
    title: Change task status
    desc: Update the status of a task or item.
    cmd: todo status
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-upgrade:
    title: Upgrade todo
    desc: Check for updates and upgrade the todo CLI to the latest version.
    cmd: todo upgrade
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-cwi [md|yaml]:
    title: Set current working file format
    desc: Set the current working file format to Markdown or YAML.
    cmd: todo cwi
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  /todo-scan [path ...]:
    title: Scan files for TODO comments
    desc: Scan source files for TODO markers and add them as tasks.
    cmd: todo scan
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  todo status a1b2 --set done:
    desc: Change a task's status
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  todo add --task "Build login" --priority high --tag login --comment "Started on this":
    desc: Add a new task with specified actors and priority
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  todo list --tasks:
    desc: List all tasks
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]

  todo list --overdue:
    desc: List all overdue tasks
    tags: [todo, cli]
    links: [https://rayanbo.github.io/todo/documentation]
