commands:
  fabric --pattern summarize -y "https://www.youtube.com/watch?v=${1:dQw4w9WgXcQ}":
    desc: Extract a YouTube video transcript and process it with a pattern "Summarize"
    tags: [fabric, ai]
    links:
      - https://github.com/danielmiessler/Fabric/blob/main/docs/YouTube-Processing.md#youtube-processing-with-fabric
      - https://github.com/yt-dlp/yt-dlp/wiki/Installation
    notes:
      - sh: |
          #!/bin/bash

          # Install fabric and yt-dlp for required for transcript extraction
          brew install fabric-ai yt-dlp

          # Configure fabric:
          mkdir -p ~/.config/fabric/ && vi ~/.config/fabric/config.yaml

          # Configure YouTube API (only needed for comments and metadata extraction):
          # 1. Go to https://console.cloud.google.com/
          # 2. Create a new project
          # 3. Enable the YouTube Data API
          # 4. Create a new API key
          # 5. Add the API key to the .env file
          # 6. Add the API key to the Fabric configuration
          # 7. Configure YouTube API
          fabric --setup
  fabric --pattern extract_wisdom -y "https://www.youtube.com/watch?v=${1:dQw4w9WgXcQ}" --transcript-with-timestamps:
    desc: Extract a YouTube video transcript with timestamps preserved and process it with a pattern "Extract Wisdom"
    tags: [fabric, ai]
