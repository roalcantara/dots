# The image each tag shows in kb, read by kb's `mise run tags:images` (docs/doctrine/tag-conventions.doctrine.md). A
# value is `lucide:<name>` (lucide.dev/icons), `simple-icons:<slug>` (simpleicons.org), `file:<name>.svg` (an image
# already in the tag-images folder) or "-" (no image: the tag stays a text pill). A tag missing here takes the Simple
# Icons logo, else the image already there, else the Lucide icon of the same name. Logos keep their brand colour unless
# it is too dark for kb's window; kb draws a coloured image as it is and a shape in its muted text colour, all in the
# same 16-point square.

