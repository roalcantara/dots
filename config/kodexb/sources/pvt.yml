              About The Team

              We are seeking a Senior Software Engineer to join one of the engineering teams building KnowBe4's core Security Awareness Training product. This is a full-stack role centered on a Ruby on Rails backend, modern front-end technologies (Vue 3, SvelteKit), and AWS cloud infrastructure.

              As a Senior Engineer, you are a strong individual contributor who owns features end-to-end from design through delivery and operation. You'll work alongside other engineers in a fast-paced, agile environment, building and scaling a multi-tenant platform deployed in a fast-paced, agile environment, building and scaling a multi-tenant platform deployed across our AWS regions under rigorous FedRAMP Moderate, SOC 2, and ISO 27001 standards. Our front-end is actively evolving — we're rewriting our micro-frontends (MFEs) to Vue 3 — so you'll both work in our current SvelteKit codebase and help build the Vue 3 future. You lead through high-quality code, sound technical judgment, and by raising the bar for the engineers around you.

              What You'll Build

              Full-stack product features — Ruby on Rails APIs, GraphQL endpoints, and Vue 3 / SvelteKit + TypeScript front-ends that ship real value to a global customer base
              The Vue 3 front-end — contributing to the rewrite of our micro-frontends (MFEs) onto Vue 3, while maintaining and evolving the existing SvelteKit application
              GraphQL APIs — schema design, batch loading, and query complexity management for high-traffic, multi-tenant access patterns
              Event-driven services — EventBridge/SQS-based communication between microservices, with an emphasis on idempotency and reliable asynchronous processing
              Serverless background processing — contributing to and optimizing our Lambda-backed worker framework (400+ workers) that powers the product's async workload
              Multi-tenant data layers — working across MySQL, PostgreSQL, DynamoDB, and Redis while maintaining strict tenant isolation and compliance guarantees
              Infrastructure-as-Code — Terraform modules and GitLab CI/CD pipelines that provision and deploy services across multiple environments and regions

              Education and Experience

              BS or equivalent plus 5 years of experience
              MS or equivalent plus 3 years of experience
              Ph.D. or equivalent plus 2 years of experience

              Essential Responsibilities

              Develops software using the KnowBe4 Software Development Lifecycle and Agile methodologies
              Designs and delivers features end to end, with limited supervision
              Solves complex technical problems and contributes to design discussions
              Writes rigorous code reviews and provides technical guidance to less-experienced engineers
              Collaborates with Product and other engineering teams to deliver against the roadmap
              Helps maintain the quality, reliability, and compliance posture of the systems they own

              Technical Requirements

              Required

              Backend & Systems - Solid production experience with Ruby on Rails; comfortable with GraphQL and relational databases design/tuning (MySQL/PostgreSQL) in multi-tenant systems
              Frontend - Proficiency with a modern component framework and strict TypeScript; Vue 3 experience is preferred given our MFE direction, and SvelteKit experience is highly valued for our current codebase (React experience also translates well); familiarity with Vite and Tailwind CSS
              Cloud - Hands-on experience with AWS (ECS/Fargate, Lambda, EventBridge, SQS, S3); working knowledge of Terraform and GitLab CI/CD
              Distributed Systems - Understanding of event-driven patterns and asynchronous processing; awareness of eventual consistency and idempotency tradeoffs
              Quality & Collaboration - Writes well-tested, maintainable code; participates constructively in code review and design discussions; communicates clearly in writing
              AI-assisted development - Comfortable using modern AI coding tools (e.g., Claude / Claude Code) to accelerate delivery, review, and problem-solving; we actively embrace these tools and value engineers who use them thoughtfully to raise both speed and quality

              Preferred / Nice-to-Have

              Experience leading or contributing to a front-end framework migration
              Experience scaling production Rails applications under real traffic
              Exposure to serverless background-processing frameworks at scale
              DynamoDB / Redis data modeling for high-throughput workloads
              Familiarity with compliance-regulated environments (FedRAMP, SOC 2, ISO 27001)
              Practical experience integrating AI tooling into day-to-day engineering workflows (code generation, review, test scaffolding, automation)
