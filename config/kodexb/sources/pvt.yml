  Interviews` common questions:
    desc: Perguntas comuns em entrevistas de emprego
    tags: [AVN, interview, questions]
    notes:
      - md: | #markdown
          # Sistema de meios de pagamento

          > Descreva uma experiência prática em que você implementou
          > ou evoluiu um sistema de meios de pagamento (PIX, TEF, A2A, adquirente ou gateway).
          > Qual foi seu papel, as principais tecnologias, integrações e resultados alcançados?

          Na N2B, liderei a arquitetura e implementação da migração do sistema de pagamentos de uma rede nacional
          de academias para o gateway Cybersource, processando mais de 50.000 transações mensais.

          **Meu Papel:**
          Arquiteto técnico responsável pelo design da solução, definição de padrões de integração e liderança da equipe de desenvolvimento.

          **Arquitetura Implementada:**
          - Microserviços em Node.js com arquitetura event-driven
          - API Gateway para roteamento e rate limiting
          - Event sourcing para auditoria de transações
          - Circuit breaker pattern para resiliência nas integrações

          **Tecnologias e Integrações:**
          - Backend: Node.js/TypeScript com Express
          - Cloud: GCP (Cloud Functions, Cloud Run, Pub/Sub)
          - Banco: PostgreSQL para dados transacionais, Redis para cache
          - Monitoramento: Cloud Monitoring + alertas customizados
          - Integração: APIs REST com Cybersource, webhooks para callbacks

          **Resultados Alcançados:**
          - Redução de 40ms no tempo médio de processamento
          - 99.95% de disponibilidade (SLA melhorado em 0.2%)
          - Zero downtime na migração (blue-green deployment)
          - Implementação de retry automático reduziu falhas em 25%
          - Conformidade PCI DSS Level 1 mantida durante toda migração
  Question to make during Interviews:
    desc: Perguntas para fazer durante entrevistas de emprego
    tags: [AVN, interview, questions]
    notes:
      - md: | #markdown
          # Perguntas para Entrevistas

          > Quais perguntas você faria ao entrevistador para entender melhor a empresa, o time e a posição?

          1. **Sobre a Empresa e Cultura**
             - Como vocês definem a cultura da empresa e quais valores são mais importantes?
             - Quais são os principais desafios que a empresa enfrenta atualmente?

          2. **Sobre o Time**
             - Como é estruturado o time de desenvolvimento/DevOps/SRE?
             - Qual é a abordagem do time em relação a metodologias ágeis e práticas de DevOps?

          3. **Sobre a Posição**
             - Quais são as expectativas para os primeiros 90 dias na posição?
             - Existem oportunidades de crescimento ou desenvolvimento profissional dentro da empresa?

          4. **Sobre Projetos e Tecnologias**
             - Quais tecnologias e ferramentas são mais utilizadas no dia a dia do time?
             - Há planos para adotar novas tecnologias ou frameworks no futuro próximo?

          5. **Sobre Processos e Práticas**
             - Como é o processo de revisão de código e integração contínua?
             - Quais práticas de monitoramento e observabilidade estão implementadas atualmente?

