    desc: Perfil, Habilidades e Competências
    tags: [pvt, jobs]
    links: [https://perfil.vagas.solides.com.br]
    notes:
      - md: | #markdown
          ### PERFIL: Executor
          - Meu perfil é predominantemente **Executor**, o que significa que ajo de forma prática, determinada e focada em resultados.
          - Tenho histórico de **reduzir MTTR em 60% e executar migrações sem downtime**, unindo execução rápida com análise estruturada.
          - Essa combinação é ideal para papéis **Fullstack/DevOps**, que exigem confiabilidade técnica, agilidade e resiliência.

          ### Executor (42%)
          - Sou reconhecido por **agir com determinação e foco em resultados**, mesmo em cenários críticos.
          - No projeto da **N2B Brasil (DevOps)**, por exemplo, liderei o cutover de produção com **zero downtime**, implementando monitoramento e alertas proativos.
          - Também padronizei **DevContainers e CI/CD**, o que reduziu drasticamente o tempo de onboarding da equipe.
          - Essas experiências reforçam minha capacidade de **tomar decisões rápidas e entregar com confiabilidade**.

          ### Analista (22%)
          - Tenho facilidade em **avaliar dados, processos e riscos antes de agir**, garantindo que as decisões sejam fundamentadas.
          - Na **Clinicorp**, liderei a iniciativa de observabilidade, ampliando a visibilidade do sistema em **40% e reduzindo MTTR em 60%**.
          - Esse viés analítico também esteve presente na **Equalize**, ao automatizar fluxos de compliance que reduziram ciclos de aprovação de meses para semanas.
          - Essa habilidade mostra meu equilíbrio entre **execução rápida e análise criteriosa**.

          ### Planejador (19%)
          - Busco sempre **organizar etapas, estruturar processos e antecipar riscos**, garantindo consistência nas entregas.
          - Como **CTO da N2B Brasil**, planejei a arquitetura de uma plataforma serverless no Firebase/GCP que escalou para **1M+ usuários**, além de estruturar pipelines de automação para **16 aplicativos white-label**.
          - Esse perfil planejador me ajuda a **transformar visão em estratégia prática**, sem perder a agilidade.

          ### Comunicador (18%)
          - Embora meu foco seja execução e análise, tenho sólida experiência em **mentoria e engajamento de times**.
          - Na **Clinicorp**, treinei equipes em práticas de DevOps e padronização de pipelines; na **Equalize**, promovi cultura de TDD e GitHub Flow; e na **Viaflow**, liderei times em projetos de automação com ganhos de até **70% em redução de custos**.
