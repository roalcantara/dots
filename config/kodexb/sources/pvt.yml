  Application Best Practices:
    desc: Application Best Practices
    tags: [AVN, application, patterns]
    notes:
      - md: | #markdown
          # What are companies interested in knowing?
          - 1. How do you work?
          - 2. What have you done professionally?
          - 3. What technologies have you worked with and for how long?
          - 4. Which of these experiences will contribute to the vacancy in question?
      - md: | #markdown
          # Cover Letter

          - Talk about the position you are looking for
          - Mention your participation in projects, awards and workshops
          - Mention your contribution in the companies where you worked, in the form of results
          - Mention ongoing initiatives at current job
          - Tell us how you think you can make a difference in an Estonian company

          ## EXAMPLE

          Ebony Moore
          (123) 456-7891
          emoore@email.com
          May 1, 2018
          Dear Hiring Manager,
          I'm excited to be applying for the Software Engineer position at River Tech. As someone who is highly focused and attentive to detail, I thrive on building quality systems that surpass end users' expectations. I'm thrilled at the opportunity to show off my technical expertise and leadership skills as part of River Tech's expert team.
          During my previous role at Crane & Jenkins, I was charged with developing innovative solutions across a variety of software platforms. I was instrumental in developing mobile-ready expense tracking software for our fast-growing portfolio of real estate clients. In 2016, I led the development of a proprietary document management system and was responsible for the successful migration of all client content from our legacy system to the new platform.
          I am also attentive to the need for continued process improvements. When we faced repeated deadline delays due to Quality Assurance challenges, I proposed and carried out the implementation of an automated bug tracking system to identify potential issues earlier in the development cycle. This resulted in an average of 43% fewer defects reported during late-stage QA reviews and a 32% reduction in days between project kickoff and production launch.
          Thank you for your time and consideration. I'm looking forward to learning more details about the Software Engineer position at River Tech. I'm excited about the opportunity to leverage my unique range of skills, and I'm eager to demonstrate my commitment to developing world-class software solutions for River Tech.
          Sincerely,
          Ebony Moore
      - md: | #markdown
          # RESUME
          1. **Be concise and objective:**
            - Keep your resume to about two pages.
            - Include your most recent professional experiences, as well as those that are most relevant (4-5) to the position you are applying for.
            - Specify the tasks performed in each of them, so that the company has a better view of your qualifications.
          2. **Show that you understand IT well:**
            - Highlight the systems, programming languages and platforms you master and what your level is.
            - If you participated in any freelance project, talk about it.
          3. **Languages:**
            - This is important so that the company knows in which languages you are able to communicate safely and feel more comfortable speaking
          4. **Certifications:**
            - People who continue to study are well regarded by Estonian companies.
            - So don't forget to add the specialization or improvement courses you have done and are relevant to the vacancy.
          5. **Keep Up to Date:**
            - Keep your resume always updated and detailed, so that recruiters can get to know your skills and contact you easily
          6. **Heads-Up!:**
            - After registering your resume, check your inbox frequently and also the spam / junk folders in your email.
            - If you are interested in the vacancy, respond as soon as possible.
