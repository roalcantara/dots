          https://linkedin.com/jobs/view/4449585585:
            title: Backend Developer Senior — Remoto
            desc: | #markdown
              A Jungle Gaming cria jogos originais e tecnologia para operações globais de iGaming. Estamos contratando Backend Developer Sênior para liderar decisões técnicas e evoluir os serviços que conectam jogos, integrações e produtos da nossa plataforma.
              Você terá responsabilidade sobre arquitetura e produção, do desenho do domínio à observabilidade. Nosso backend usa NestJS, TypeScript, MikroORM, PostgreSQL e Docker em microsserviços orientados por Domain-Driven Design (DDD), com REST APIs, WebSockets e serviços AWS como SQS, SNS, S3 e Secrets Manager. O fluxo de desenvolvimento também inclui Git e ferramentas de IA agêntica.

              Como será o sucesso na função
              Os serviços passam a ter limites de domínio, contratos e responsabilidades mais claros, e os riscos de produção ficam visíveis antes de virar incidentes. Suas decisões melhoram testabilidade, observabilidade e recuperação — não apenas a entrega de curto prazo. Outras pessoas de engenharia entendem os trade-offs, evoluem os padrões e tomam boas decisões sem depender sempre de você.

              O que você fará
              Definir limites de domínio, contratos e responsabilidades entre microsserviços
              Projetar e evoluir REST APIs e serviços WebSocket seguros, testáveis e fáceis de operar
              Tomar decisões de persistência, consultas e migrações com MikroORM e PostgreSQL
              Construir fluxos orientados a eventos e integrações confiáveis com SQS e SNS
              Elevar confiabilidade, observabilidade, performance e segurança dos serviços em produção
              Conduzir reviews, orientar outras pessoas e validar criticamente mudanças produzidas com apoio de IA

