          ## EDITOR

          ```yaml
          shortcuts:
            # Selection
            "⌘ a": ▤ Select all
            "⌘ l": ▤ Select the whole current line
            "⌘ r": ▤ Select all occurrences of the term under the cursor in the file
            "⇧ ←": ▤ Shirnk or Expand selection 1 character to the left
            "⇧ ↓": ▤ Shirnk or Expand selection down one line on the same column
            "⇧ →": ▤ Shirnk or Expand selection 1 character to the right
            "⇧ ↑": ▤ Shirnk or Expand selection up one line on the same column
