# | Modifier     | Keys produced                                             | Level |
# | ------------ | --------------------------------------------------------- | :---: |
# | None         | Lowercase letters, numbers, etc                           |   1   |
# | Shift        | Uppercase letters, symbols printed on keyboard, etc       |   2   |
# | AltGr        | Extra symbols not printed on the keyboard, some dead keys |   3   |
# | AltGr-Shift  | Even more symbols, more dead keys                         |   4   |
# | Shift+Ctrl+U | Unicode composition                                       |   5   |

# | SYMBOL | UNICODE | COMMAND         | TYPE            |
# | :----: | :-----: | --------------- | --------------- |
# |   ^    | U+005E  | Control         | Modifier keys   |
# |   ⇧    | U+21E7  | Shift           | Modifier keys   |
# |   ❖    | U+2726  | Super           | Modifier keys   |
# |   ⌘    | U+2318  | Command         | Modifier keys   |
# |   ❖    | U+229E  | Win             | Modifier keys   |
# |   ⎇   | U+2387  | Alt             | Modifier keys   |
# |   ⌥    | U+2325  | AltGr           | Modifier keys   |
# |   ⌥    | U+2325  | Option          | Modifier keys   |
# |   ✦    | U+2726  | Hyper           | Modifier keys   |
# |   ◆    | U+25C6  | Meta            | Modifier keys   |
# |   ⇪    | U+21EA  | Caps lock       | Lock key        |
# |   ↵    | U+21B5  | Enter           | Editing         |
# |   ⌫    | U+232B  | Backspace       | Editing         |
# |   ⌦    | U+2326  | Delete          | Editing         |
# |   ⇥    | U+21E5  | Tab             | Editing         |
# |   ⎀    | U+2380  | Insert          | Editing         |
# |   ␣    | U+2423  | Space bar       | Editing         |
# |   ⇱    | U+21F1  | Home            | Navigation keys |
# |   ⇲    | U+21F2  | End             | Navigation keys |
# |   ←    | U+2190  | Arrow key left  | Navigation keys |
# |   ↑    | U+2191  | Arrow key up    | Navigation keys |
# |   ↓    | U+2193  | Arrow key down  | Navigation keys |
# |   →    | U+2192  | Arrow key right | Navigation keys |
# |   ⎋    | U+238B  | Escape          | Navigation keys |
# |   ⎋    | U+238B  | Escape          | Navigation keys |
# |   ⎋    | U+238B  | Escape          | Navigation keys |
# |   ⎋    | U+238B  | Escape          | Navigation keys |
# |   ⇞    | U+21DE  | Page Up         | Navigation keys |
# |   ⇟    | U+21DF  | Page Down       | Navigation keys |
# |   ⏺    | U+1F310  | Function/Globe | Navigation keys |

