bookmarks:
  https://skills.sh:
    desc: Official skills repository
    tags: [ai, skills]

commands:
  skills list:
    desc: List installed project skills
    tags: [ai, skills]
  skills ls --agent 'universal' --json:
    desc: List all available skills for the 'universal' agent in JSON format
    tags: [ai, skills]
  skills ls -g:
    desc: List global skills
    tags: [ai, skills]
  skills ls -a claude-code:
    desc: Filter by agent
    tags: [ai, skills]
  skills ls --json:
    desc: JSON output of skills
    tags: [ai, skills]
  skills find:
    desc: Interactive search
    tags: [ai, skills]
  skills find [query]:
    desc: Search for skills by keyword
    tags: [ai, skills]
  skills find react --owner vercel:
    desc: Search within an owner
    tags: [ai, skills]
  skills add <package>:
    desc: Add a new skill to the project
    tags: [ai, skills]
  skills add -yg https://github.com/vercel-labs/skills --skill find-skills:
    desc: Install the find-skills skill globally
    tags: [ai, skills]
  skills add vercel-labs/agent-skills:
    desc: Add the vercel-labs/agent-skills skill
    tags: [ai, skills]
  skills add vercel-labs/agent-skills -g:
    desc: Add the vercel-labs/agent-skills skill globally
    tags: [ai, skills]
  skills add vercel-labs/agent-skills --agent claude-code cursor:
    desc: Add the vercel-labs/agent-skills skill with the claude-code cursor agent
    tags: [ai, skills]
  skills add vercel-labs/agent-skills --skill pr-review commit:
    desc: Add the vercel-labs/agent-skills skill with the pr-review commit skill
    tags: [ai, skills]
  skills add vercel-labs/agent-skills --json -y:
    desc: Add the vercel-labs/agent-skills skill with JSON output
    tags: [ai, skills]
  skills use <package>@<skill>:
    desc: Use a skill without installing it
    tags: [ai, skills]
  skills use vercel-labs/agent-skills@vercel-optimize | claude:
    desc: Use the vercel-optimize skill from the vercel-labs/agent-skills skill with the claude agent
    tags: [ai, skills]
  skills use vercel-labs/agent-skills --skill vercel-optimize --agent claude-code:
    desc: Use the vercel-optimize skill from the vercel-labs/agent-skills skill with the claude-code agent
    tags: [ai, skills]
  skills update:
    desc: Update installed skills
    tags: [ai, skills]
  skills update my-skill:
    desc: Update a single skill
    tags: [ai, skills]
  skills update -g:
    desc: Update global skills only
    tags: [ai, skills]
  skills remove:
    desc: Interactive prompt to remove installed skills
    tags: [ai, skills]
  skills remove web-design:
    desc: Remove by name
    tags: [ai, skills]
  skills rm --global frontend-design:
    desc: Remove a global skill by name
    tags: [ai, skills]
  skills experimental_install:
    desc: Restore from skills-lock.json
    tags: [ai, skills]
  skills experimental_sync:
    desc: Sync from node_modules (experimental)
    tags: [ai, skills]
  skills experimental_sync -y:
    desc: Sync without prompts
    tags: [ai, skills]
  skills init my-skill:
    desc: Initialize a new skill project
    tags: [ai, skills]

  /find-skills:
    desc: Discover and install specialized agent skills from the open ecosystem when users need extended capabilities.
    tags: [ai, skills, discovery]
    links:
      - https://skills.sh/vercel-labs/skills/find-skills
    notes:
      - sh: skills add -yg https://github.com/vercel-labs/skills --skill find-skills
  /interview-me:
    desc: The cheapest moment to find this gap is before any plan, spec, or code exists.
    tags: [ai, skills, discovery]
    links:
      - https://skills.sh/addyosmani/agent-skills/interview-me
    notes:
      - sh: skills add -yg https://github.com/addyosmani/agent-skills --skill interview-me
  /personal-productivity (by oldwinter):
    desc: Designing a weekly timebox plan for a high-meeting-load job (meeting windows, focus blocks, admin buffers)
    tags: [ai, skills, productivity]
    links:
      - https://skills.sh/oldwinter/skills/personal-productivity
    notes:
