cheats:
  launchctl | Services:
    desc: Tool used to control launchd services (Agents and Daemons)
    tags: [macos, schedule, service]
    links: [https://launchd.info]
    notes:
      - md: | #markdown
          ### OVERVIEW

          - `launchd` is the service management framework in macOS that handles the starting, stopping, and managing of system and user services.
          - Services managed by `launchd` are defined in property list (plist) files located in specific directories.
          - There are two main types of services managed by `launchd`:
            1. **Agents**: Run on behalf of the logged-in user.
            2. **Daemons**: Run on behalf of the system or specific users, regardless of user login status.
          - Each type has its own set of directories where their plist files are stored, and they serve different purposes within the macOS ecosystem.

          ### HANDLING AGENTS

          ```sh
          # List all your own loaded agents
          launchctl list
          ```
  launchctl | Types of services > AGENTS:
    desc: Tool used to control launchd services (Agents and Daemons)
    tags: [macos, schedule, service]
    links: [https://launchd.info]
    notes:
      - md: | #markdown
          ## Types of services managed by launchd

          ### AGENTS

          - **Agents** are services run for the logged in user:
            - Therefore, it require someone to be logged in to run
            - Typically used for user-level tasks (e.g., syncing, background apps)
            - Can interact with the user (GUI apps, notifications, etc)
            - `launchctl list` shows only user agents by default

          - Agents are loaded from:
            | **FOLDER**                   | **USAGE**                 |
            | ---------------------------- | ------------------------- |
            | ~/Library/LaunchAgents       | per-user                  |
            | /Library/LaunchAgents        | all users                 |
            | /System/Library/LaunchAgents | Apple-provided, all users |

          ### COMMON AGENTS EXAMPLES

          - Sync services (e.g., Dropbox, iCloud)
          - Background apps (e.g., messaging apps, cloud storage)
          - User-specific maintenance tasks (e.g., backups, cleanup scripts)
      - md: | #markdown
          ### PRACTICAL EXAMPLES

          1. Set up Ruby environment for services

               ```sh
               launchctl setenv GEM_HOME ~/.gem
               launchctl setenv GEM_PATH ~/.gem
               launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.myapp.worker.plist
               launchctl enable gui/$(id -u)/com.myapp.worker
               ```

          2. Deploy a service and verify it works

               ```sh
               launchctl bootstrap system /Library/LaunchDaemons/com.company.sync.plist
               sleep 1
               launchctl runstats system/com.company.sync
               # Check the output for errors
               ```

          3. Troubleshoot a failing service

               ```sh
               launchctl runstats gui/$(id -u)/com.backup.service
               # If ExitStatus != 0, the script failed
               ```

          4. Temporary service activation (no persist)

              ```sh
              launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.test.plist
              launchctl start gui/$(id -u)/com.test
              launchctl runstats gui/$(id -u)/com.test
              launchctl bootout gui/$(id -u) ~/Library/LaunchAgents/com.test.plist
              ```
  launchctl | Types of services > DAEMONS:
    desc: Tool used to control launchd services (Agents and Daemons)
    tags: [macos, schedule, service]
    links: [https://launchd.info]
    notes:
      - md: | #markdown
          ## Types of services managed by launchd

          ### DAEMONS

          - **Daemons** are services run by the system either as the root user or any other username specified in the service definition.
            - Therefore, They don't require anyone to be logged in
            - Typically used for system-level tasks (e.g., networking, system maintenance)
            - Cannot interact with the user (no GUI, notifications, etc)
            - `sudo launchctl list` shows system-wide daemons

          - Daemons are loaded from:
            | **FOLDER**                    | **USAGE**                     |
            | ----------------------------- | ----------------------------- |
            | /Library/LaunchDaemons        | third-party system daemons    |
            | /System/Library/LaunchDaemons | Apple-provided system daemons |

          ### COMMON DAEMONS EXAMPLES

          - Networking services (e.g., SSH server)
          - System maintenance tasks (e.g., software updates, backups)
          - Background services (e.g., indexing, logging)
  launchctl commands:
    desc: Common launchctl commands for managing macOS services
    tags: [macos, schedule, service]
    links: [https://launchd.info]
    notes:
      - md: | #markdown
          ## launchctl

          > Tool used to control launchd on the macOS system
          > launchd is the equivalent of systemd and other service managers
      - sh: | #shell
          #!/bin/sh

          ### Commonly used `launchctl` commands

          # List all your own loaded agents
          launchctl list
          # List all system-wide loaded daemons
          sudo launchctl list
          # View details of a specific service
          sudo launchctl list com.openssh.sshd
          # Load a launchd plist file and start the service
          launchctl load ~/Library/LaunchAgents/com.example.task.plist
          # View details of a specific service
          launchctl info system/com.example.task
          # Enable a service to start on login (10.15+)
          launchctl enable gui/501/com.example.task
          # Disable a service
          launchctl disable gui/501/com.example.task
          # Manually trigger a service right now
          launchctl start com.example.task
          # Stop a running service
          launchctl stop com.example.task
          # Unload (stop) a service
          launchctl unload ~/Library/LaunchAgents/com.example.task.plist
          # View launchd logs in real-time
          log stream --predicate 'process == "launchd"' --level debug
          # View logs for a specific service
          log show --predicate 'process == "launchd" and eventMessage contains "com.example.task"' --last 1h
          # Check stderr/stdout logs (if configured)
          cat ~/Library/Logs/com.example.task.log

  Uses Fundation Model Python API:
    desc: This section demonstrates how to use the Foundation Model (fm) Python API to triage files into "final" and "draft" categories.
    tags: [macos, fm, python]
    links: [https://developer.apple.com/videos/play/wwdc2026/334/]
    notes:
      - py: | #python
          import apple_fm_sdk as fm
          from pathlib import Path

          INSTRUCTIONS = "You're an AI assistant for Cupertino Mart, a grocery store with in-app ordering."

          class GetPastOrdersTool(fm.Tool):
              name = "get_past_orders"
              description = "Retrieves information about this user's past orders."

              @fm.generable("Past orders query parameter")
              class Arguments:
                  number_orders: str = fm.guide("How many of the last orders to retrieve")

              @property
              def arguments_schema(self) -> fm.GenerationSchema:
                  return self.Arguments.generation_schema()

              async def call(self, args: fm.GeneratedContent) -> str:
                  number_orders = args.value(int, for_property="number_orders")
                  return await Orders.load_last_orders(user_id=user_id, amount=number_orders)

          async def answer_question(prompt: str) -> str:
              session = fm.LanguageModelSession(instructions=INSTRUCTIONS, tools=[GetPastOrdersTool()])
              return await session.respond(prompt)

          # Define a generable class for suggested items in the user's cart
          @fm.generable("Suggested items")
          class ItemsSuggestion:
            item_names: list[str] = fm.guide("Names of the suggested items")

          INSTRUCTIONS = "You're an AI assistant tasked with returning potential grocery items that the user might be interested in."
          async def generate_suggested_cart_items(user_input: Optional[str]) -> ItemsSuggestion:
              session = fm.LanguageModelSession(instructions=INSTRUCTIONS, tools=[GetPastOrdersTool()])
              prompt = "Using the tools to load the user's previous orders, return a list of items the user has already ordered \ and that they might be interested in again \ as they're getting ready to place a new grocery order."
              if user_input is not None:
                  prompt += f"\nAccount for the following request from the user: {user_input}"
              return await session.respond(prompt, generating=ItemsSuggestion)

  Uses fm to triage files:
    desc: This script uses an AI model to categorize a list of files into "final" or "draft" versions and then moves them into their respective storage directories.
    tags: [macos, fm, script]
    links: [https://developer.apple.com/videos/play/wwdc2026/334/]
    notes:
      - sh: | #shell
          #!/bin/sh

          output=$(fm respond \
              --instructions "I just completed a project, and I need help triaging the latest version of the files from the previous versions. I will give you a list of files. Return a list of the latest files (i.e., all files that, you can infer from their name in the list, are the latest versions), and then return separately a list of all draft files (i.e., all files that weren't considered final)." \
              "This is the list of all files:\n\n${files_list}" \
              --schema /tmp/schema.json
          )

          echo "${output}" | jq -r '.final_files[]' | while read -r file; do
              cp "${DIRECTORY_TO_TRIAGE}/${file}" "${FINAL_FILES_STORAGE_DIRECTORY}"
          done

          echo "${output}" | jq -r '.draft_files[]' | while read -r file; do
              mv "${DIRECTORY_TO_TRIAGE}/${file}" "${DRAFT_FILES_STORAGE_DIRECTORY}"
          done
  External drive will not eject (exFAT check in progress):
    desc: Diagnose a drive that will not eject or unmount, and decide whether to wait or stop the check
    tags: [macos, disk]
    notes:
      - md: | #markdown
          # External drive will not eject

          ## Symptoms

          - The volume is not mounted, yet `diskutil unmount disk4` says it is "already unmounted".
          - `diskutil unmountDisk disk4` or `diskutil eject disk4` waits forever.

          ## 1. Is something on the volume still writing?

          ```sh
          diskutil list disk4
          mount | grep -i <volume>
          lsof +D /Volumes/<volume> | head                       # open files on the volume
          ps -axo pid,etime,stat,command | grep -iE '<volume>|zip|rsync|ditto|mds_stores|mdworker' | grep -v grep
          ```

          ## 2. Is a file-system check holding the raw device?

          ```sh
          ps -axo pid,etime,stat,command | grep -iE 'fsck|exfat|ntfs|diskutil|disk4' | grep -v grep
          lsof /dev/disk4 /dev/rdisk4 /dev/disk4s1 /dev/rdisk4s1 /dev/disk4s2 /dev/rdisk4s2
          ```

          A process such as `com.apple.fskit.exfat` holding `/dev/rdisk4s2` is macOS checking that partition. It does
          this when an exFAT volume was not ejected cleanly last time (a restart with the drive attached is
          enough). The unmount is queued behind the check, which is why it seems to hang.

          ## 3. Is the check progressing?

          ```sh
          ps -o pid,%cpu,time,etime -p <pid>
          iostat -d -w 5 -c 2 disk4                              # MB/s over 5 s
          log show --last 40m --info --style compact --process com.apple.fskit.exfat | tail
          ```

          macOS redacts the driver's log messages, so the read rate is the only progress sign. In our case it read
          about 46 GB in 38 minutes (about 20 MB/s): hours for a volume with hundreds of GB used.

          ## 4. Decide

          - **Wait (safest).** When the check finishes, the volume mounts by itself; then `diskutil eject disk4`.
          - **Stop it.** The volume stays marked unclean and is checked again next time. If the check is repairing,
            not only reading, interrupting it can corrupt the drive.

            ```sh
            kill <pid>             # sudo kill -9 <pid> if it does not stop within a few seconds
            diskutil unmountDisk disk4
            diskutil eject disk4
            ```

          Other partitions on the same disk are not involved unless they are being checked too.

  Verifying backups on an external drive (FSKit exFAT corruption):
    desc: Check that files written to an external drive read back intact; macOS's exFAT driver corrupted new writes
    tags: [macos, disk]
    notes:
      - md: | #markdown
          # Verifying backups on an external drive

          ## What happened

          On macOS 27, exFAT volumes are mounted by the FSKit driver (`com.apple.fskit.exfat`). Files written to the
          drive through it read back with different bytes: the hash of the copy differed from the original, a
          zip on the drive failed `unzip -t`, and copying again with `cp -X` (no extended attributes) gave the
          same wrong hash. Files written there months earlier read back fine. So every backup written that day was
          unusable, and nothing looked wrong until the hashes were compared.

          ```sh
          diskutil info /Volumes/<volume> | grep -E 'File System Personality|Volume Free Space'
          ```

          ## The rule: write locally, copy, compare on both sides

          ```sh
          shasum -a 256 ~/backup.zip /Volumes/<volume>/backup.zip    # both hashes must match
          unzip -tq /Volumes/<volume>/backup.zip                      # and the archive must test clean
          ```

          ## When the hashes differ

          1. Rule out a read-cache problem: eject, unplug, plug back in, hash again. If it now matches, only reads
             were wrong.
          2. Test with a throwaway file: write it, hash it, delete it. Compare with an old file on the drive.
          3. If new writes are corrupted, stop writing there. Keep backups elsewhere (local disk, another drive,
             a git repo for small encrypted files), or reformat the drive as APFS if only Macs need to read it.

          The drive also needs a clean eject every time: an exFAT volume that was not ejected cleanly triggers a
          long check on the next mount (see "External drive will not eject").

  Evaluating a tiling window manager (dinky vs yabai):
    desc: What we measured comparing dinky and yabai, and why a new window always appears then moves on macOS
    tags: [macos, twm, spaces]
    links: [https://dinky.rodeo, https://github.com/mikker/Dinky, https://github.com/koekeishiya/yabai]
    notes:
      - md: | #markdown
          # Evaluating a tiling window manager (dinky vs yabai)

          Goal: replace yabai (needs SIP partly off for its scripting addition) with a tool that tiles like
          Omarchy (dwindle), uses real macOS Spaces and leaves SIP on. Outcome: yabai stays for now.

          ## Candidates (October 2026)

          | Tool | Tiling | Spaces | SIP | Verdict |
          | --- | --- | --- | --- | --- |
          | dinky | dwindle | native | on (Accessibility only) | Tried for a day; one TOML file, `brew install --cask mikker/tap/dinky` |
          | Nehir | dwindle | its own | on | No release, no commits since August |
          | PaperWM.spoon | scrolling, not dwindle | native | on | Needs Hammerspoon; Space moves break with macOS releases |
          | AeroSpace, OmniWM, Rift, Glide | various | their own | on | Fake workspaces; same new-window behaviour |

          dinky gaps: no `fn` modifier (use a binding mode), `move` never crosses displays, no yabai-style stacks,
          and it switches Spaces with private APIs, so a macOS update can break it (as with yabai).

          ## Why a new window appears, then moves (every macOS WM)

          macOS lets the app draw its new window where it wants, and only then tells the window manager, which
          moves it into its tile. Measured with dinky and yabai on the same Space:

          | Situation | What you see | Time to tile |
          | --- | --- | --- |
          | Window-opening animation on (default) | The window grows frame by frame, fighting the move | about 150 ms |
          | Animation off, same display | Appears at the app's spot, one jump to the tile | 30–60 ms |
          | App's last window on the other display | Born on that display, moved over | 50–600 ms |
          | App not running (cold start) | Opens large at its default spot; the WM waits for it to answer Accessibility | visible, hundreds of ms |

          yabai was not faster (13–39 ms to appear, 83–179 ms to tile, vs 39–53 and 42–192 for dinky). Only a
          compositor (Hyprland on Linux) places a window before drawing it, and macOS allows no third-party one.

          ## What helps

          ```sh
          # Turn off the window-opening animation (apps pick it up when they next launch)
          defaults write -g NSAutomaticWindowAnimationsEnabled -bool false
          # Undo
          defaults delete -g NSAutomaticWindowAnimationsEnabled
          ```

          - Keep the terminal running: Ghostty's `quit-after-last-window-closed = false` (or a login item), so a
            new window never waits for a cold start.
          - Prefer tabs or splits to new terminal windows.
          - Keep the pointer on the display you work on: dinky falls back to the pointer's display when focus is
            in flux.

          ## How we measured

          - A control app: Terminal.app reproduced the same jump, so it was not Ghostty.
          - TextEdit, freshly launched, showed the animation setting's effect (apps read it at launch).
          - Close test windows by id, never with File → Close Window: that closes whichever window is in front.

          ## Settings dinky needed (reverted)

          ```sh
          # "Switch to a Space with open windows" off, so Spaces switch fast on ⌘Tab; undo:
          defaults delete com.apple.dock workspaces-auto-swoosh && killall Dock
          ```

          ## Switching back to yabai

          ```sh
          brew uninstall --cask dinky && rm ~/.config/dinky
          yabai --install-service && yabai --start-service   # yabairc loads the scripting addition via sudoers
          ```

          The dinky config stays in dots history (`config/dinky/`) for a retry after the macOS reinstall.
