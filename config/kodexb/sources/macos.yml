  ### launchctl | Task scheduler using launchd (macOS preferred approach)
  ## AGENTS ==> Services launched for the logged-in user
  ls -la ~/Library/LaunchAgents:
    desc: User's Agents are plist files placed in ~/Library/LaunchAgents
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl list:
    desc: List all loaded Agents
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl list | grep ssh:
    desc: List all loaded Agents related to ssh
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl enable gui/$(id -u)/com.example.task:
    desc: Set Service Agents to start on login (10.15+) with full user context. PERSISTS across reboots (auto-starts)
    tags: [macos, schedule, service]
    links: [https://launchd.info]
    notes:
      - md: | #markdown
          ### Enabling Service Agents with User Context

          On macOS 10.15 and later, use the user ID to enable Service Agents

            ```sh
            launchctl enable gui/$(id -u)/com.example.task
            ```

          #### WHy?

          - Ensures that the agent runs with the appropriate permissions and environment
          - Avoids conflicts (when same service name in multiple domains)
          - Is explicit, avoiding ambiguity (particularly in SCRIPTS & AUTOMATION)
          - When targeting different users than the currently logged in
          - Adheres to best practices for service management on macOS
  launchctl stop gui/$(id -u)/com.example.task:
    desc: Stop running Service Agents
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl start gui/$(id -u)/com.example.task:
    desc: Manually triggers Service Agents right now
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.example.task.plist:
    desc: Load and start immediately Service Agents from plist files into ~/Library/LaunchAgents/.
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl bootout gui/$(id -u) ~/Library/LaunchAgents/com.example.task.plist:
    desc: Stop and remove immediately Service Agents. Does NOT delete the plist file from ~/Library/LaunchAgents/.
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl disable gui/$(id -u)/com.example.task:
    desc: Disable Service Agents. PREVENTS auto-start on reboot!
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl unload ~/Library/LaunchAgents/com.example.task.plist:
    desc: (DEPRECATED! Use bootout!) Stops Service Agents immediately. Does NOT prevent auto-start on reboot!
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl load ~/Library/LaunchAgents/com.example.task.plist:
    desc: (DEPRECATED! Use bootstrap!) Load and start Service Agents immediately. Does NOT persist across reboots!
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.locate.plist 2>/dev/null || true:
    desc: Enable the locate service to update the system's locate database
    tags: [macos, schedule, service]
    links: [https://launchd.info]

  # Viewing launchd logs
  launchctl print-disabled user/$(id -u):
    desc: List all disabled Service Agents
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  log stream --predicate 'process == "launchd"' --level debug:
    desc: View launchd logs in real-time
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  log show --predicate 'process == "launchd" and eventMessage contains "com.example.task"' --last 1h:
    desc: View logs for a specific service
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  cat ~/Library/Logs/com.example.task.log:
    desc: Check stderr/stdout logs (if configured)
    tags: [macos, schedule, service]
    links: [https://launchd.info]

  # Environment Variables for launchd and its services
  launchctl getenv PATH:
    desc: Get launchd's Environment Variables' values
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl unsetenv CUSTOM_VAR:
    desc: Unset the specified env vars for all services within the domain
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl setenv PATH "/usr/local/bin:/usr/bin:/bin":
    desc: Set Environment Variable for launchd and all its children
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  launchctl enable gui/$(id -u)/setenv.local:
    desc: Set GLOBAL Environment Variable that all launchd services inherit. PERSISTS across reboots (auto-starts)
    tags: [macos, schedule, service]
    links: [https://launchd.info]
    notes:
      - xml: | #xml
          <!-- ~/Library/LaunchAgents/setenv.plist -->
          <!-- Useful for services that won't see .bashrc/.zshrc env vars (no shell context) -->
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key>
            <string>setenv.local</string>
            <key>ProgramArguments</key>
            <array>
              <string>/bin/sh</string>
              <string>-c</string>
              <string>launchctl setenv PATH /usr/local/bin:/usr/bin:/bin</string>
            </array>
            <key>RunAtLoad</key>
            <true/>
          </dict>
          </plist>

  ## DAEMONS ==> System-wide services launched by the OS
  sudo launchctl list:
    desc: List all system-wide loaded daemons
    tags: [macos, schedule, service]
    links:
      [https://launchd.info, https://rakhesh.com/mac/macos-launchctl-commands]
  sudo launchctl list | grep ssh:
    desc: List all system-wide loaded agents related to ssh
    tags: [macos, schedule, service]
    links:
      [https://launchd.info, https://rakhesh.com/mac/macos-launchctl-commands]
  sudo launchctl list com.openssh.sshd:
    desc: View details of the sshd service
    tags: [macos, schedule, service]
    links:
      [https://launchd.info, https://rakhesh.com/mac/macos-launchctl-commands]
  sudo launchctl enable system/com.openssh.sshd:
    desc: Enable dev.dotfiles.setup service
    tags: [macos, schedule, service]
    links:
      [https://launchd.info, https://rakhesh.com/mac/macos-launchctl-commands]
  sudo launchctl stop system/com.openssh.sshd:
    desc: Enable dev.dotfiles.setup service
    tags: [macos, schedule, service]
    links:
      [https://launchd.info, https://rakhesh.com/mac/macos-launchctl-commands]
  sudo launchctl start system/com.openssh.sshd:
    desc: Start the sshd service
    tags: [macos, schedule, service]
    links:
      [https://launchd.info, https://rakhesh.com/mac/macos-launchctl-commands]
  sudo launchctl disabled system/com.openssh.sshd:
    desc: Enable dev.dotfiles.setup service
    tags: [macos, schedule, service]
    links:
      [https://launchd.info, https://rakhesh.com/mac/macos-launchctl-commands]
  sudo launchctl stop system/com.openssh.sshd && sudo launchctl start system/com.openssh.sshd:
    desc: Restart the sshd service
    tags: [macos, schedule, service]
    links:
      [https://launchd.info, https://rakhesh.com/mac/macos-launchctl-commands]

  # Viewing launchd logs
  sudo launchctl print-disabled system/$(id -u):
    desc: List all disabled Service Daemons
    tags: [macos, schedule, service]
    links: [https://launchd.info]
  sudo launchctl print-disabled user/$(id -u):
    desc: List all disabled Service Agents
    tags: [macos, schedule, service]
    links: [https://launchd.info]

  ### security | Keychain management
  security add-generic-password -a bitwarden_client_id -s Bitwarden -w "$CLIENT_ID" -U:
    desc: Add a secret on the account"bitwarden_client_id" for the service "Bitwarden" with the account "bitwarden_client_id" to the keychain. The -U flag is the key detail - without it, running the command twice creates duplicates. With it, it just updates the existing entry.
    tags: [macos, security]
    links: [https://bitwarden.com]
  security add-generic-password -a bitwarden_client_secret -s Bitwarden -w "$CLIENT_SECRET" -U:
    desc: Add a secret on the account"bitwarden_client_secret" for the service "Bitwarden" with the account "bitwarden_client_secret" to the keychain. The -U flag is the key detail - without it, running the command twice creates duplicates. With it, it just updates the existing entry.
    tags: [macos, security]
    links: [https://bitwarden.com]
  security find-generic-password -w -a bitwarden_client_id -s Bitwarden:
    desc: Find a secret on the account"bitwarden_client_id" for the service "Bitwarden" with the account "bitwarden_client_id" in the keychain
    tags: [macos, security]
    links: [https://bitwarden.com]
  security find-generic-password -w -a bitwarden_client_secret -s Bitwarden:
    desc: Find a secret on the account"bitwarden_client_secret" for the service "Bitwarden" with the account "bitwarden_client_secret" in the keychain
    tags: [macos, security]
    links: [https://bitwarden.com]
  security delete-generic-password -s "$KEYRING_SERVICE" -a "$key":
    desc: Delete generic password
    tags: [macos, security]
  security dump-keychain | grep -A 1 "svce.*$KEYRING_SERVICE" | grep "acct" | sed 's/.*"acct"<blob>="\(.*\)".*/\1/' | sort:
    desc: Listing keys on Linux requires iteration through possible keys
    tags: [macos, security]

  secret-tool lookup service "$KEYRING_SERVICE" account "$key":
    desc: Look up a secret in the keyring for the given service and account
    tags: [macos, security]
    links: [https://wiki.gnome.org/Projects/SecretTool]
  secret-tool store --label="$LABEL" service "$KEYRING_SERVICE" account "$key":
    desc: Store a secret in the keyring for the given service and account
    tags: [macos, security]
    links: [https://wiki.gnome.org/Projects/SecretTool]
  secret-tool clear service "$KEYRING_SERVICE" account "$key":
    desc: Remove a secret from the keyring for the given service and account
    tags: [macos, security]
