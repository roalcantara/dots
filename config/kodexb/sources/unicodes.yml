  ghostty:
    # Ghostty Hyper2 layer (Karabiner): hold F3
    'F3 ←': 'Change focus to pane left'
    'F3 →': 'Change focus to pane right'
    'F3 ↑': 'Change focus to pane up'
    'F3 ↓': 'Change focus to pane down'
    'F3 ⇧ ←': 'Split pane to left'
    'F3 ⇧ →': 'Split pane to right'
    'F3 ⇧ ↑': 'Split pane to up'
    'F3 ⇧ ↓': 'Split pane to down'
    'F3 [': 'Change focus to pane previous'
    'F3 ]': 'Change focus to pane next'
    'F3 w': 'Close current pane'
    'F3 q': 'Quit Ghostty (all windows)'
    'F3 ,': 'Reload Ghostty config'
    'F3 i': 'Toggle inspector'
    'F3 t': 'Toggle quick terminal'
    'F3 p': 'Toggle command palette'
    'F3 n': 'New window'
    'F3 ⏎': 'Toggle fullscreen'
  amethyst:
    # Raycast Hyper on Right Command: ⌘⌃⌥
    'R⌘ ←': 'Focus next window (clockwise)'
    'R⌘ →': 'Focus previous window (counter-clockwise)'
    'R⌘ ↑': 'Focus previous screen'
    'R⌘ ↓': 'Focus next screen'
    'R⌘ [': 'Cycle layout backward'
    'R⌘ ]': 'Cycle layout forward'
    'R⌘ ⏎': 'Swap focused window with main'
    'R⌘ ⇧ ←': 'Swap with previous window'
    'R⌘ ⇧ →': 'Swap with next window'
    'R⌘ ⇧ ↑': 'Focus main window'
    'R⌘ ⇧ ↓': 'Reevaluate windows'
    'R⌘ ⇧ ,': 'Throw focused window to space left'
    'R⌘ ⇧ .': 'Throw focused window to space right'
    'R⌘ ⇧ [': 'Move focused window to previous screen'
    'R⌘ ⇧ ]': 'Move focused window to next screen'

shortcuts:
  cursor: # ← entry.key AND app slug for all bindings inside
    desc: 'Cursor keymap'
    platform: any # default for all bindings
    tags: [editor, ide]
    links:
      - VS Code Keybindings docs: https://code.visualstudio.com/docs/getstarted/keybindings
    bindings:
      - id: go-to-file
        chord: '⌘P' # accepts glyphs, words, or '+'-joined
        scope: local
        action: 'Go to File'
        group: Navigation
      - id: command-palette
        chord: '⌘⇧P'
        scope: local
        action: 'Show All Commands'
        group: Navigation
      - id: open-keymap
        chord:
          macos: '⌘K ⌘S' # per-platform override (sequence)
          linux: 'ctrl+k ctrl+s'
        scope: local
        action: 'Open Keyboard Shortcuts'

