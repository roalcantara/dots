# | Modifier     | Keys produced                                             | Level |
# | ------------ | --------------------------------------------------------- | :---: |
# | None         | Lowercase letters, numbers, etc                           |   1   |
# | Shift        | Uppercase letters, symbols printed on keyboard, etc       |   2   |
# | AltGr        | Extra symbols not printed on the keyboard, some dead keys |   3   |
# | AltGr-Shift  | Even more symbols, more dead keys                         |   4   |
# | Shift+Ctrl+U | Unicode composition                                       |   5   |

# | SYMBOL | UNICODE | COMMAND         | TYPE            |
# | :----: | :-----: | --------------- | --------------- |
# |   ^    | U+005E  | Control         | Modifier keys   |
# |   ⇧    | U+21E7  | Shift           | Modifier keys   |
# |   ❖    | U+2726  | Super           | Modifier keys   |
# |   ⌘    | U+2318  | Command         | Modifier keys   |
# |   ❖    | U+229E  | Win             | Modifier keys   |
# |   ⎇   | U+2387  | Alt             | Modifier keys   |
