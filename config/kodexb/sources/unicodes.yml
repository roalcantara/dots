# |   ✦    | U+2726  | Hyper           | Modifier keys   |
# |   ◆    | U+25C6  | Meta            | Modifier keys   |
# |   ⇪    | U+21EA  | Caps lock       | Lock key        |
# |   ↵    | U+21B5  | Enter           | Editing         |
# |   ⌫    | U+232B  | Backspace       | Editing         |
# |   ⌦    | U+2326  | Delete          | Editing         |
# |   ⇥    | U+21E5  | Tab             | Editing         |
# |   ⎀    | U+2380  | Insert          | Editing         |
# |   ␣    | U+2423  | Space bar       | Editing         |
# |   ⇱    | U+21F1  | Home            | Navigation keys |
# |   ⇲    | U+21F2  | End             | Navigation keys |
# |   ←    | U+2190  | Arrow key left  | Navigation keys |
# |   ↑    | U+2191  | Arrow key up    | Navigation keys |
# |   ↓    | U+2193  | Arrow key down  | Navigation keys |
# |   →    | U+2192  | Arrow key right | Navigation keys |
# |   ⎋    | U+238B  | Escape          | Navigation keys |
# |   ⎋    | U+238B  | Escape          | Navigation keys |
# |   ⎋    | U+238B  | Escape          | Navigation keys |
# |   ⎋    | U+238B  | Escape          | Navigation keys |
# |   ⇞    | U+21DE  | Page Up         | Navigation keys |
# |   ⇟    | U+21DF  | Page Down       | Navigation keys |

legacy:
  zsh:
    ⌥ c:
      desc: Fuzzy find directory
      tags: [search, file, fzf]
    ⌃ r:
      desc: Reverse search history
      tags: [search, history, fzf]
    ⌃ t:
      desc: Fuzzy find file
      tags: [search, file, fzf]
    ⌥ f:
      desc: Move cursor to next word (forward)
      tags: [navigation]
    ⌥ b:
      desc: Move cursor to previous word (backwards)
      tags: [navigation]
    ⌃ xx:
      desc: Toggle between the start of the line and the current cursor position
      tags: [navigation]
    ⌃ x,e:
      desc: Open the current command line in your default editor
      tags: [editing, command]
    ⌃ k:
      desc: Cut (delete) text from the current cursor position until the end of the line
      tags: [editing, delete]
    ⌃ u:
      desc: delete whole line
      tags: [editing, delete]
    ⌥ w:
      desc: Delete text from the current cursor position to the beginning of the word
      tags: [editing, delete]
    ⌥ l:
      desc: Lowercase word
      tags: [editing, transform]
    ⌥ u:
      desc: Uppercase word
      tags: [editing, transform]
    ⌃ w:
      desc: Cut the previous word, starting from the current cursor position
      tags: [editing, delete]
    ⌥ ⌫:
      desc: Delete previous word, preceding the current cursor position
      tags: [editing, delete]
    ⌥ d:
      desc: delete next word, following the current cursor position
      tags: [editing, delete]
    ⌥ .:
      desc: Previous command's last argument
      tags: [history, command, term]
    \!$:
      desc: retrieves the last argument from the previous command
      tags: [history, command, term]
    \!*:
      desc: retrieves all arguments from the previous command
      tags: [history, command, term]
    ⌥ t:
      desc: Swap the last two characters before the cursor (typo)
      tags: [editing, text]
    ⌥ r:
      desc: Undo all changes made to the current command line
      tags: [editing, undo, term]
    ⌃ l:
      desc: Clear screen
      tags: [term, ui]
    ⌃ c:
      desc: Send an Interrupt/Kill signal to the currently running command
      tags: [process, term, control]
    ⌃ d:
      desc: Close Current Shell
      tags: [term, process, control]
    ⌃ z:
      desc: Suspends the currently running foreground job and moves it to the background
      tags: [process, term, control]
    fg:
      desc: Bring the most recent background job to the foreground
      tags: [process, term, control]
    ⌃ s:
      desc: Retrieves the next most recent command from your history
      tags: [history, command, term]
    ^abc^def:
      desc: Replaces the first occurrence of "abc" in the previous command with "def"
      tags: [history, command, substitution]
    ⌃ x,v:
      desc: Switch to vi mode in Zsh
      tags: [vi-mode, term]
    set -o vi:
      desc: Enables the vi mode for the current session
      tags: [vi-mode, term]
    cd ↵:
      desc: Go to HOME
      tags: [navigation, directory]
    cd ⇥:
      desc: Fuzzy find directory
      tags: [search, directory, fzf]
