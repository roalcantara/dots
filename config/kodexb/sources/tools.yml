  # ripgrep (rg)
  brew install ripgrep:
    desc: Install ripgrep using HomeBrew
    tags: [rg]
  rg '^pattern$':
    desc: Match pattern on line boundaries using regex
    tags: [rg, ripgrep]
  rg --vimgrep pattern:
    desc: Show results in vim-compatible format
    tags: [rg, ripgrep]
  rg pattern -l | xargs sed -i 's/old/new/g':
    desc: Find files with pattern and perform replacement using sed
    tags: [rg, ripgrep, complex]
  rg --json pattern | jq '.data.lines.text':
    desc: Search with JSON output and process with jq
    tags: [rg, ripgrep, complex]
  rg '^function':
    desc: Search for pattern '^function' recursively in current directory
    tags: [rg, ripgrep]
  rg '\bconst\b':
    desc: Search for whole word 'const' using regex
    tags: [rg, ripgrep]
  rg '\b[a-z]{3}\b':
    desc: Search for whole words with 3 lowercase letters
    tags: [rg, ripgrep]
  rg -i readne:
    desc: Case-insensitive search for pattern 'readne' (e.g. README)
    tags: [rg]
  rg -w TODO:
    desc: Match whole words only
    tags: [rg]
  rg -t py main:
    desc: Search only Python files for pattern 'main'
    tags: [filter, rg]
  rg -T js pattern:
    desc: Search all files except JavaScript
    tags: [filter, rg, ripgrep]
  rg -C 3 pattern:
    desc: Show 3 lines before and after each match
    tags: [rg, ripgrep]
  rg -B 3 pattern:
    desc: Show 3 lines before each match
    tags: [rg, ripgrep]
  rg -A 3 pattern:
    desc: Show 3 lines after each match
    tags: [rg, ripgrep]
  rg --files-with-matches pattern:
    desc: Only show files containing matches (useful for scripts)
    tags: [rg, ripgrep]
  rg --files-without-match pattern:
    desc: Only show files that don't contain matches
    tags: [rg, ripgrep]
  rg --hidden pattern:
    desc: Search hidden files and directories
    tags: [rg, ripgrep]
  rg -g 'tests/*' pattern:
    desc: Only search in files under tests directory
    tags: [rg, ripgrep]
  rg -e pattern1 -e pattern2:
    desc: Search for multiple patterns
    tags: [rg, ripgrep]
  rg --json pattern:
    desc: Output results in JSON format
    tags: [rg, ripgrep]
  rg --pretty pattern:
    desc: Show results with color and line numbers in a nice format
    tags: [rg, ripgrep]
  rg --threads 4 pattern:
    desc: Use exactly 4 threads for searching
    tags: [rg, ripgrep]
  rg --no-ignore pattern:
    desc: Don't respect ignore files (.gitignore, .ignore, etc)
    tags: [rg, ripgrep]
  rg -g '*.{js,ts}' -i 'function.*export':
    desc: Search for exported functions in JavaScript/TypeScript files
    tags: [rg, ripgrep, complex]
  rg --type-add 'web:*.{html,css,js}' -t web pattern:
    desc: Define and use custom file type for web files
    tags: [rg, ripgrep, complex]
  rg -l -g 'src/*.rs' '^pub struct':
    desc: List Rust files in src containing public structs
    tags: [rg, ripgrep, complex]
  rg -U pattern:
    desc: Search with multiline support (disable line-wise searching)
    tags: [rg, ripgrep]
  rg -F 'pattern[.*]':
    desc: Search for literal string (disable regex interpretation)
    tags: [rg, ripgrep]

  # gum
  gum input --placeholder "What's your name?":
    desc: Create a simple text input prompt
    tags: [gum, interactive]
  gum input --password --placeholder "Enter password":
    desc: Create a password input that masks the characters
    tags: [gum, security]
  gum write --placeholder "Enter description":
    desc: Create a multi-line text input area
    tags: [gum, multiline]
    notes:
      - sh: |
          # With character limit
          gum write --char-limit 500

          # With specific dimensions
          gum write --width 50 --height 10
  gum choose "option1" "option2" "option3":
    desc: Create a single-choice selection menu
    tags: [gum, choose]
    notes:
      - sh: |
          # Multiple selection
          gum choose --multiple "opt1" "opt2" "opt3"

          # With selection limit
          gum choose --multiple --limit 2 "opt1" "opt2" "opt3"
  gum style --foreground 212 "Colored text":
    desc: Style text with colors and formatting
    tags: [text-formatting, color-coding]
    notes:
      - sh: |
          # Combined styles
          gum style --foreground 212 --background 198 --bold "Text"

          # With border
          gum style --border double --margin "1" "Text"
  gum style --foreground 212 --border-foreground 212 --border double --align center --width 50 --margin "1 2" --padding "2 2" --margin "1 2" --padding "2 4" 'Bubble Gum (1¢)' 'So sweet and so fresh!':
    desc: Style text with colors, formatting and borders
    tags: [gum]
    notes:
      - sh: |
          # With border
          gum style --border double --margin "1" "Text"
  gum spin --spinner dot --title "Loading...":
    desc: Display a loading spinner with custom message
    tags: [gum]
    notes:
      - sh: |
          # With timeout
          gum spin --timeout 3s -- long_command

          # Custom spinner type
          gum spin --spinner points -- sleep 5
  gum file .:
    desc: Interactive file selection from current directory
    tags: [gum]
    notes:
      - sh: |
          # Directory selection
          gum file --directory .

          # With file type filter
          gum file --glob "*.yaml"
  gum table:
    desc: Display data in table format
    tags: [gum]
    notes:
      - sh: |
          # CSV input
          echo "Name,Age\nJohn,30" | gum table

          # Custom separator
          echo "ID|Status" | gum table --separator "|"
  gum filter:
    desc: Interactive text filtering and selection
    tags: [gum, search]
    notes:
      - sh: |
          # Filter git branches
          git branch | gum filter

          # Filter with limit
          cat items.txt | gum filter --limit 3
  gum join:
    desc: Join text horizontally or vertically
    tags: [gum, layout]
    notes:
      - sh: |
          # Horizontal join
          gum join "Left" "Right"

          # Vertical join
          gum join --vertical "Top" "Bottom"
    links: [https://github.com/charmbracelet/gum]
  gum confirm "Are you sure?":
    desc: Create a yes/no confirmation prompt
    tags: [gum, interactive]
    notes:
      - sh: |
          # Custom buttons
          gum confirm "Proceed?" --affirmative "YES" --negative "NO"

          # Default selection
          gum confirm "Continue?" --default=false
  gum format -t progress:
    desc: Create a progress bar display
    tags: [gum, ui]
    notes:
      - sh: |
          # Simple progress simulation
          for i in $(seq 0 10); do
            echo $i
            sleep 0.1
          done | gum format -t progress
  gum table create interactive and formatted tables in the terminal:
    desc: Create interactive and formatted tables in the terminal
    tags: [gum]
    notes:
      - sh: |
          # Basic CSV data with headers
          echo "ID,Name,Status,LastSeen
          1,Backend API,Running,2024-03-15
          2,Frontend App,Failing,2024-03-14
          3,Database,Running,2024-03-15" | gum table
      - md: |
          ## Output examples would look like:

          | ID | Name         | Status  | LastSeen   |
          |----|--------------|---------|------------|
          | 1  | Backend API  | Running | 2024-03-15 |
          | 2  | Frontend App | Failing | 2024-03-14 |
          | 3  | Database     | Running | 2024-03-15 |
      - sh: |
          # Custom bordered table with specific separator and width
          echo "Service | Status | Memory | CPU
          API | ✅ | 256MB | 45%
          Worker | ⚠️ | 512MB | 78%
          Cache | ✅ | 128MB | 23%" | \
          gum table \
            --separator "|" \
            --width 50 \
            --border double
      - md: |
          ### Custom bordered table

          ╔═══════════╦══════════╦══════════╦═══════╗
          ║ Service   ║ Status   ║ Memory   ║ CPU   ║
          ╠═══════════╬══════════╬══════════╬═══════╣
          ║ API      ║ ✅       ║ 256MB    ║ 45%   ║
          ║ Worker   ║ ⚠️       ║ 512MB    ║ 78%   ║
          ║ Cache    ║ ✅       ║ 128MB    ║ 23%   ║
          ╚═══════════╩══════════╩══════════╩═══════╝
      - sh: |
          # Combining with other commands for system monitoring
          ps aux | \
            awk 'NR<2{print $1,$2,$3,$4,$11;next}{print $1,$2,$3,$4,$11}' | \
            tr ' ' ',' | \
            gum table --width 80 --separator ","

          # Using with JSON data via jq
          echo '{"services": [
            {"name": "auth", "status": "up", "latency": "45ms"},
            {"name": "api", "status": "up", "latency": "62ms"},
            {"name": "db", "status": "down", "latency": "---"}
          ]}' | \
          jq -r '.services[] | [.name, .status, .latency] | @csv' | \
          gum table --separator "," --width 40
      - md: |
          ### JSON data converted to table

          | name | status | latency |
          |------|--------|---------|
          | auth | up     | 45ms    |
          | api  | up     | 62ms    |
          | db   | down   | ---     |

  # curl | In a Bash Script with Variables:
  curl | In a Bash Script with Variables:
    desc: a bash script uses variables to hold the URL and data payload. This approach makes the script more dynamic and easier to modify.
    tags: [curl]
    notes:
      - sh: |
          URL="http://example.com/api/data"
          DATA='{
                  "username": "user",
                  "password": "pass"
                }'

          curl -X POST $URL \
              -H "Content-Type: application/json" \
              -d "$DATA"
  curlie <URL>:
    desc: Get content from URL
    tags: [curl]
  curlie -f POST <URL> <ARGS>:
    desc: Submit to url - like FORM
    tags: [curl]
  curlie <URL> < <FILE>:
    desc: Upload file to url - OFFLINE MODE
    tags: [curl]
  curlie <URL> > <FILE>:
    desc: Download file from url - OFFLINE MODE
    tags: [curl]
  curlie --download <URL>:
    desc: Download file from url - wget style
    tags: [curl]
  curlie -d <URL> | tar zxf -:
    desc: Download file from url and extracs with 'tar zxf'
    tags: [curl]
  curlie <URL> | pup'<FIELD> text{}' --color --plain:
    desc: Extract fields from url
    tags: [curl]

  # jwt | Encode and payload into JWT token with a secret key
  jwt encode --secret "a-256-bit-secret-key" '{"user":"example"}':
    desc: Encode and payload into JWT token with a secret key
    tags: [jwt]
    notes:
      - md: | #markdown
          ## EXAMPLE

          ```sh
          # Encode a payload into a JWT Token with a secret key
          $ jwt encode --secret "a-256-bit-secret-key" '{"user":"example"}'
          # => eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3MzQwNTI5NzAsInVzZXIiOiJleGFtcGxlIn0.s7XzVxFdOc7oP9wiPkURglxaEREg177IorST-6S6EoA
          ```

          > The output is a JWT token that can be used for authentication and authorization purposes.

          ```sh
          # To decode the JWT token, use the following command:
          $ jwt decode eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3MzQwNTI5NzAsInVzZXIiOiJleGFtcGxlIn0.s7XzVxFdOc7oP9wiPkURglxaEREg177IorST-6S6EoA
          ```

          > Token header
          > ------------
          > {
          >   "typ": "JWT",
          >   "alg": "HS256"
          > }
          >
          > Token claims
          > ------------
          > {
          >   "iat": 1719007185,
          >   "user": "example"
          > }
cheats:
  GLOW_STYLE_DOCUMENT_LIST="yellow":
    desc: Style list elements
    tags: [markdown]
    notes:
      - sh: |
          # Style lists
          GLOW_STYLE_DOCUMENT_LIST="yellow" glow README.md

          # Style lists and list markers differently
          GLOW_STYLE_DOCUMENT_LIST="yellow" \
          GLOW_STYLE_DOCUMENT_LIST_MARKER="red bold" \
          glow README.md
  GLOW_STYLE_CODE_BLOCK_BACKGROUND="#2E3440":
    desc: Style code block backgrounds and text
    tags: [markdown]
    notes:
      - sh: |
          # Style code block background
          GLOW_STYLE_CODE_BLOCK_BACKGROUND="#2E3440" \
          GLOW_STYLE_CODE_BLOCK_TEXT="#88C0D0" \
          glow README.md

          # Full code block styling
          GLOW_STYLE_CODE_BLOCK_BACKGROUND="#2E3440" \
          GLOW_STYLE_CODE_BLOCK_TEXT="#88C0D0" \
          GLOW_STYLE_CODE_BLOCK_MARGIN="2" \
          GLOW_STYLE_CODE_BLOCK_PADDING="1" \
          glow README.md
  GLOW_STYLE_TABLE_TEXT="cyan":
    desc: Style tables with colors and borders
    tags: [markdown]
    notes:
      - sh: |
          # Basic table styling
          GLOW_STYLE_TABLE_TEXT="cyan" \
          GLOW_STYLE_TABLE_BORDER="blue" \
          glow README.md

          # Advanced table styling
          GLOW_STYLE_TABLE_TEXT="cyan" \
          GLOW_STYLE_TABLE_BORDER="blue" \
          GLOW_STYLE_TABLE_HEADER="yellow bold" \
          GLOW_STYLE_TABLE_MARGIN="1" \
          glow README.md
  GLOW_STYLE_DOCUMENT_LINK="blue underline":
    desc: Style links with colors and attributes
    tags: [glow, markdown]
    notes:
      - md: |
          ## Comprehensive Example
          Here's how to combine multiple styles:
      - sh: |
          # Full document styling using environment variables
          GLOW_STYLE_DOCUMENT_TEXT="#959dcb" \
          GLOW_STYLE_DOCUMENT_H1="#c792ea bold" \
          GLOW_STYLE_DOCUMENT_H2="#c792ea" \
          GLOW_STYLE_DOCUMENT_CODE="#f0f0f0" \
          GLOW_STYLE_DOCUMENT_LIST="#89ddff" \
          GLOW_STYLE_DOCUMENT_LINK="blue underline" \
          GLOW_STYLE_CODE_BLOCK_BACKGROUND="#292d3e" \
          GLOW_STYLE_CODE_BLOCK_TEXT="#89ddff" \
          GLOW_STYLE_BLOCK_QUOTE_TEXT="#959dcb italic" \
          GLOW_STYLE_BLOCK_QUOTE_BORDER="#706c8c" \
          GLOW_STYLE_TABLE_BORDER="#706c8c" \
          GLOW_STYLE_TABLE_TEXT="#89ddff" \
          glow README.md
  GLOW_STYLE_ALL:
    desc: Set global style attributes
    tags: [markdown]
    notes:
      - md: |
          ## Available Style Attributes

          Colors can be specified as:
          - Hex codes: `#FF5F87`
          - Named colors: `red`, `blue`, `green`, etc.
          - RGB values: `rgb(255,95,135)`

          Text attributes can be:
          - `bold`
          - `italic`
          - `underline`
          - `crossed-out`
          - `blink`

          Multiple attributes can be combined:
          `"blue bold italic"`
      - sh: |
          # Test different color formats
          GLOW_STYLE_DOCUMENT_H1="#FF5F87 bold" glow README.md
          GLOW_STYLE_DOCUMENT_H1="rgb(255,95,135) bold" glow README.md
          GLOW_STYLE_DOCUMENT_H1="red bold" glow README.md
  glow | Style Best Practices:
    desc: Style Best Practices | Glow
    tags: [markdown]
    notes:
      - md: |
          ## Style Best Practices

          1. Test your styles with different types of content:
             - Headers of all levels
             - Code blocks with syntax highlighting
             - Tables
             - Lists (nested)
             - Blockquotes

          2. Consider terminal compatibility:
             - Not all terminals support all colors
             - Some attributes might not work everywhere
             - Test in both light and dark terminal themes
  "GLOW_STYLE_BLOCK_QUOTE_TEXT='italic #706c8c'":
    desc: Style blockquotes with text and borders
    tags: [markdown]
    notes:
      - sh: |
          # Style blockquotes
          GLOW_STYLE_BLOCK_QUOTE_TEXT="italic #706c8c" \
          GLOW_STYLE_BLOCK_QUOTE_BORDER="#706c8c" \
          glow README.md

          # With padding and margin
          GLOW_STYLE_BLOCK_QUOTE_TEXT="italic #706c8c" \
          GLOW_STYLE_BLOCK_QUOTE_BORDER="#706c8c" \
          GLOW_STYLE_BLOCK_QUOTE_MARGIN="1" \
          GLOW_STYLE_BLOCK_QUOTE_PADDING="1" \
          glow README.md
