    tags: [fzf]
  sk --ansi -i -c 'ag --color "{}"' --preview "preview.sh {}":
    desc: preview with preview.sh
    tags: [fzf]
    notes:
      - sh: |
          #!/usr/bin/env bash
          # https://github.com/junegunn/fzf.vim/blob/master/bin/tagpreview.sh

          REVERSE="\x1b[7m"
          RESET="\x1b[m"

          if [ -z "$1" ]; then
            echo "usage: $0 FILENAME:TAGFILE:EXCMD"
            exit 1
          fi

          IFS=':' read -r FILE TAGFILE EXCMD <<< "$*"

          # Complete file paths which are relative to the given tag file
          if [ "${FILE:0:1}" != "/" ]; then
            FILE="$(dirname "${TAGFILE}")/${FILE}"
          fi

          if [ ! -r "$FILE" ]; then
            echo "File not found ${FILE}"
            exit 1
          fi

          # If users aren't using vim, they are probably using neovim
          if command -v vim > /dev/null; then
            VIMNAME="vim"
          elif command -v nvim > /dev/null; then
            VIMNAME="nvim"
          else
            echo "Cannot preview tag: vim or nvim unavailable"
            exit 1
          fi

          CENTER="$("${VIMNAME}" -R -i NONE -u NONE -e -m -s "${FILE}" \
                        -c "set nomagic" \
                        -c "silent ${EXCMD}" \
                        -c 'let l=line(".") | new | put =l | print | qa!')" || exit

          START_LINE="$(( CENTER - FZF_PREVIEW_LINES / 2 ))"
          if (( START_LINE <= 0 )); then
              START_LINE=1
          fi
          END_LINE="$(( START_LINE + FZF_PREVIEW_LINES - 1 ))"

          # Sometimes bat is installed as batcat.
          if command -v batcat > /dev/null; then
            BATNAME="batcat"
          elif command -v bat > /dev/null; then
            BATNAME="bat"
          fi

          if [ -z "$FZF_PREVIEW_COMMAND" ] && [ "${BATNAME:+x}" ]; then
            ${BATNAME} --style="${BAT_STYLE:-numbers}" \
                      --color=always \
                      --pager=never \
                      --wrap=never \
                      --terminal-width="${FZF_PREVIEW_COLUMNS}" \
                      --line-range="${START_LINE}:${END_LINE}" \
                      --highlight-line="${CENTER}" \
                      "$FILE"
            exit $?
          fi

          DEFAULT_COMMAND="highlight -O ansi -l {} || coderay {} || rougify {} || cat {}"
          CMD=${FZF_PREVIEW_COMMAND:-$DEFAULT_COMMAND}
          CMD=${CMD//{\}/$(printf %q "$FILE")}

          eval "$CMD" 2> /dev/null | awk "{ \
              if (NR >= $START_LINE && NR <= $END_LINE) { \
                  if (NR == $CENTER) \
                      { gsub(/\x1b[[0-9;]*m/, \"&$REVERSE\"); printf(\"$REVERSE%s\n$RESET\", \$0); } \
                  else printf(\"$RESET%s\n\", \$0); \
                  } \
              }"
      - sh: |
          #!/usr/bin/env bash
          # https://github.com/junegunn/fzf.vim/blob/master/bin/preview.sh

          REVERSE="\x1b[7m"
          RESET="\x1b[m"

          if [[ $# -lt 1 ]]; then
            echo "usage: $0 [--tag] FILENAME[:LINENO][:IGNORED]"
            exit 1
          fi

          if [[ $1 = --tag ]]; then
            shift
            "$(dirname "${BASH_SOURCE[0]}")/tagpreview.sh" "$@"
            exit $?
          fi

          # Ignore if an empty path is given
          [[ -z $1 ]] && exit

          IFS=':' read -r -a INPUT <<< "$1"
          FILE=${INPUT[0]}
          CENTER=${INPUT[1]}

          if [[ "$1" =~ ^[A-Za-z]:\\ ]]; then
            FILE=$FILE:${INPUT[1]}
            CENTER=${INPUT[2]}
          fi

          if [[ -n "$CENTER" && ! "$CENTER" =~ ^[0-9] ]]; then
            exit 1
          fi
          CENTER=${CENTER/[^0-9]*/}

          # MS Win support
          if [[ "$FILE" =~ '\' ]]; then
            if [ -z "$MSWINHOME" ]; then
              MSWINHOME="$HOMEDRIVE$HOMEPATH"
            fi
            if grep -qEi "(Microsoft|WSL)" /proc/version &> /dev/null ; then
              MSWINHOME="${MSWINHOME//\\/\\\\}"
              FILE="${FILE/#\~\\/$MSWINHOME\\}"
              FILE=$(wslpath -u "$FILE")
            elif [ -n "$MSWINHOME" ]; then
              FILE="${FILE/#\~\\/$MSWINHOME\\}"
            fi
          fi

          FILE="${FILE/#\~\//$HOME/}"
          if [ ! -r "$FILE" ]; then
            if [[ "${INPUT[0]}" != '[No Name]' ]]; then
              echo "File not found ${FILE}"
            fi
            exit 1
          fi

          if [ -z "$CENTER" ]; then
            CENTER=0
          fi

          # Sometimes bat is installed as batcat.
          if [[ -z "$BATCAT" ]]; then
            if command -v batcat > /dev/null; then
              BATCAT="batcat"
            elif command -v bat > /dev/null; then
              BATCAT="bat"
            fi
          fi

          if [ -z "$FZF_PREVIEW_COMMAND" ] && [ "${BATCAT:+x}" ]; then
            ${BATCAT} --style="${BAT_STYLE:-numbers}" --color=always --pager=never \
                --highlight-line=$CENTER -- "$FILE"
            exit $?
          fi

          FILE_LENGTH=${#FILE}
          MIME=$(file --dereference --mime -- "$FILE")
          if [[ "${MIME:FILE_LENGTH}" =~ binary ]]; then
            echo "$MIME"
            exit 0
          fi

          DEFAULT_COMMAND="highlight -O ansi -l {} || coderay {} || rougify {} || cat {}"
          CMD=${FZF_PREVIEW_COMMAND:-$DEFAULT_COMMAND}
          CMD=${CMD//{\}/"$(printf %q "$FILE")"}

          eval "$CMD" 2> /dev/null | awk "{ \
              if (NR == $CENTER) \
                  { gsub(/\x1b[[0-9;]*m/, \"&$REVERSE\"); printf(\"$REVERSE%s\n$RESET\", \$0); } \
              else printf(\"$RESET%s\n\", \$0); \
              }"
