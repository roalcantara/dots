    notes: | #markdown
      ## Create an agent project¶
      Create an empty my-agent directory for your project:

      my-agent/
      Create this project structure using the command line
      Configure project and dependencies¶
      Use the npm tool to install and configure dependencies for your project, including the package file, ADK TypeScript main library, and developer tools. Run the following commands from your my-agent/ directory to create the package.json file and install the project dependencies:


      cd my-agent/
      # initialize a project as an ES module
      npm init --yes
      npm pkg set type="module"
      npm pkg set main="agent.ts"
      # install ADK libraries
      npm install @google/adk
      # install dev tools as a dev dependency
      npm install -D @google/adk-devtools
      Define the agent code¶
      Create the code for a basic agent, including a simple implementation of an ADK Function Tool, called getCurrentTime. Create an agent.ts file in your project directory and add the following code:

      my-agent/agent.ts

      import {FunctionTool, LlmAgent} from '@google/adk';
      import {z} from 'zod';

      /* Mock tool implementation */
      const getCurrentTime = new FunctionTool({
        name: 'get_current_time',
        description: 'Returns the current time in a specified city.',
        parameters: z.object({
          city: z.string().describe("The name of the city for which to retrieve the current time."),
        }),
        execute: ({city}) => {
          return {status: 'success', report: `The current time in ${city} is 10:30 AM`};
        },
      });

      export const rootAgent = new LlmAgent({
        name: 'hello_time_agent',
        model: 'gemini-flash-latest',
        description: 'Tells the current time in a specified city.',
        instruction: `You are a helpful assistant that tells the current time in a city.
                      Use the 'getCurrentTime' tool for this purpose.`,
        tools: [getCurrentTime],
      });
      Set your API key¶
      This project uses the Gemini API, which requires an API key. If you don't already have Gemini API key, create a key in Google AI Studio on the API Keys page.

      In a terminal window, write your API key into your .env file of your project to set environment variables:


      MacOS / Linux
      Windows PowerShell
      Windows Command Prompt
      Update: my-agent/.env

      echo 'GEMINI_API_KEY="YOUR_API_KEY"' > .env

      Using other AI models with ADK
      Run your agent¶
      You can run your ADK agent with the @google/adk-devtools library as an interactive command-line interface using the run command or the ADK web user interface using the web command. Both these options allow you to test and interact with your agent.

      Run with command-line interface¶
      Run your agent with the ADK TypeScript command-line interface tool using the following command:


      npx adk run agent.ts
      adk-run.png

      Run with web interface¶
      Run your agent with the ADK web interface using the following command:


      npx adk web
      This command starts a web server with a chat interface for your agent. You can access the web interface at http://localhost:8000. Select your agent at the upper right corner and type a request.
  https://adk.dev/graphs/#typescript:
    desc: Graph-based agent workflows
    tags: [ai, adk, agent]
    notes:
      - md: | #markdown
          ### Graph-based Agent Workflows

          > Graph-based agent workflows in ADK let you build agents with more precise control,
          > creating deterministic processes that combine code logic and AI reasoning capabilities.
          >
          > Graph-based workflows allow you to define your agent logic as a graph of execution nodes and edges,
          > combining AI-powered agent reasoning with deterministic tools and code.
      - ts: | #typescript
          import {
            createEvent,
            LlmAgent,
            node,
            NodeContext,
            Workflow,
          } from '@google/adk';
          import { z } from 'zod';

          const cityGeneratorAgent = new LlmAgent({
            name: 'city_generator_agent',
            model: 'gemini-flash-latest',
            instruction: `Return the name of a random city.
                Return only the name, nothing else.`,
          });

          /** The structured payload handed from the lookup node to the report agent. */
          const cityTimeSchema = z.object({
            timeInfo: z.string().describe('Time information.'),
            city: z.string().describe('City name.'),
          });
          type CityTime = z.infer<typeof cityTimeSchema>;

          /** Simulates returning the current time in the specified city. */
          function lookupTimeFunction(_ctx: NodeContext, nodeInput: string): CityTime {
            return { timeInfo: '10:10 AM', city: nodeInput.trim() };
          }

          const cityReportAgent = new LlmAgent({
            name: 'city_report_agent',
            model: 'gemini-flash-latest',
            instruction: `Output the following line:
              It is {CityTime.timeInfo} in {CityTime.city} right now.`,
          });

          function completedMessageFunction(_ctx: NodeContext, nodeInput: string) {
            return createEvent({
              content: {
                role: 'model',
                parts: [{ text: `${nodeInput}\n WORKFLOW COMPLETED.` }],
              },
            });
          }

          export const rootAgent = new Workflow({
            name: 'root_agent',
            edges: [
              [
                'START',
                cityGeneratorAgent,
                node(lookupTimeFunction, {
                  name: 'lookup_time_function',
                  outputSchema: cityTimeSchema,
                }),
                node(cityReportAgent, { inputSchema: cityTimeSchema }),
                node(completedMessageFunction, { name: 'completed_message_function' }),
              ],
            ],
          });
