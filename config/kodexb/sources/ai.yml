    desc: Skills vs MCP vs RAG vs Memory - What AI Agents Need to Know
    tags: [ai, skills, mcp, rag, memory]
    notes:
      - md: | #markdown
          # Skills vs MCP vs RAG vs Memory - What AI Agents Need to Know

          - If it's knowledge that somebody has written down: that's RAG.
          - if it's knowledge that the agents picked up from experience, that's memory.
          - if it's a procedure to follow something repeatable, that's an agent skill.
          - if an agent needs to go and actually look something up in the world without
            using proprietary code, that can be MCP.
