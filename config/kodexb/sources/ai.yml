      - md: |
          # Watch Me Vibe Code an Animated App with Claude Fable 5.1 + Seedance 2.5
          This video provides a practical guide on "vibe coding" a gamified, animated mobile application by recreating the *Finch* mental health app. The process relies on AI-driven development to build interactive user interfaces and animated mascots without needing a traditional design team.

          ### **Development Workflow**
          1.  **Planning and Contextualization:** Provide the AI with comprehensive context, including screen recordings of the target app's onboarding and core flows (5:07), as well as reference images for the desired mascot (4:54).
          2.  **App Structuring:** 
              *   **Level 1 (Core):** Build the home screen, main navigation tabs, and primary interactions (4:03).
              *   **Level 2 (Onboarding):** Implement the onboarding sequence (17–18 pages) including egg hatching animations and paywalls (10:22, 11:52).
              *   **Level 3 (Animation):** Integrate character and environmental animations (14:02).
          3.  **Deployment:** Use *React Native* with *Expo* for the app framework and *EAS Build* to handle app packaging, allowing for real-device testing (15:43, 16:18).

          ### **Tools Used**
          *   **Development:** *Claude Fable 5.1* (or *GPT-6 Astra*) is used as the primary coding engine (2:30, 2:47).
          *   **Visual Assets & Animation:** *Higgsfield* (utilizing *Seedance 2.5* and other models) generates the custom alligator character, background environments, and animations (2:52, 14:50).
          *   **Interactions:** *Lottie Files* provides ready-to-use, customizable JSON-based animations like confetti for success states, which are integrated via simple file uploads to *Claude* (21:23).

          ### **Key Techniques**
          *   **Video-Based Prompting:** Instead of manual annotation, record a *Loom* video of yourself interacting with the app to explain feature requirements and requested design adjustments to the AI (18:36).
          *   **Iterative Refinement:** Use precise, descriptive prompts to address visual glitches (e.g., character sizing) or to refine environmental loops (e.g., stopping a cloud animation while keeping the water moving) (19:48).
          *   **Design-to-Code:** Use the `/design` command directly within the IDE/chat interface to generate app mockups and preview them in local browser environments (7:34).

  https://youtu.be/Rk6t9Uq1y9M:
    desc: Watch Me Vibe Code an Animated App with Claude Opus 5.5 (It's Super Smooth)
    tags: [ai, vibe, tutorial]
    notes:
      - md: |
          # Watch Me Vibe Code an Animated App with Claude Opus 5.5 (It's Super Smooth)

          The video provides a comprehensive guide on building a highly interactive, animated mobile app using modern AI tools and development frameworks. The author reconstructs the popular habit-tracker *Waterllama* using a *Capybara* mascot, demonstrating a workflow that blends AI-generated code with professional animation techniques.

          ### **Core Workflow & Tools**
          1.  **Context Gathering:** The author uses *Mobbin* (which has an MCP connector for *Claude*) to analyze existing app UI/UX patterns, flow, and screen structures without manual downloading. He supplements this with his own screen recordings of target apps to provide the AI with specific animation references.
          2.  **Development Framework:** The app is built using *Expo* and *React Native* for cross-platform compatibility. The author uses *Claude Opus 5.5* (vibecoding) to generate the UI code, logic, and state management.
          3.  **High-Quality Animations:** 
              *   **Interface Elements:** Interactive sliders, water levels, and simple UI transitions are coded directly to maintain responsiveness and sharp vector quality.
              *   **Character Animations:** For complex character movements (leaping, sipping, swimming) that appear stiff when coded, the author utilizes *Higgsfield* (using *Seedance 2.5* and *Genjutsu* models). These are generated as videos with green screens, which *Claude* then integrates into the app. 
          4.  **Advanced Interactivity:** To achieve smooth, physics-based interactions like character follow-the-cursor or phone-tilt effects, the author relies on *SVG* assets (instead of bitmaps) and integrates the device's *gyroscope* and *gravity sensors* via code.

          ### **Summary of Techniques**
          *   **Vibe Coding:** Using natural language prompts with visual references (screen recordings) to iterate on app features.
          *   **AI-Video Integration:** Offloading complex motion graphics to specialized video AI tools like *Higgsfield* while managing the integration through *Claude*.
          *   **Vector Scaling:** Utilizing *SVG* files for characters and assets ensures high quality at any screen size without performance loss.
          *   **Iterative Polishing:** Instead of manual coding every change, the author screen-records the app, narrates needed adjustments, and feeds the video back to *Claude* to implement fixes.

  https://youtu.be/aa-Fu5Qw91M:
    desc: Making An Actually Fun Game (NO Coding experience)
    tags: [ai, vibe, tutorial]
    notes:
      - md: |
          # Making An Actually Fun Game (NO Coding experience)

          The video provides a comprehensive, hands-on guide to developing a game titled *Library Survivors* in a single weekend, leveraging AI tools to assist with coding and asset creation even without prior coding experience.

          ### **Development Workflow & Tools**
          *   **Planning:** The concept was brainstormed and fleshed out using *ChatGPT* (specifically the *o3-pro* model) to define mechanics, level design, and the difficulty curve, outputting results in a *Markdown* file.
          *   **Coding Environment:** The author used *Windsurf* as the primary IDE, installing *Claude Code* to act as an AI-powered coding collaborator. *Claude Code* was instructed to build the game using *JavaScript* based on the design brief.
          *   **Development Iteration:** The process involved iterative refinement, where the author used *Claude Code*'s planning mode and manual feedback loops to diagnose bugs (using browser console logs) and tweak game mechanics like stamina and collision systems.
          *   **Version Control:** *GitHub* was used as a safety net, allowing the author to commit the project state to a private repository to ensure they could roll back to a functional version during the development process.

          ### **Assets & Multimedia Generation**
          *   **Graphics:** The author aimed for a cozy 16-bit retro aesthetic. *Leonardo* (using the *Phoenix* and *Lucid Realism* models) generated the background and character sprites. Tiling options were enabled for the floor texture to avoid seams. *Photoshop* was used manually for post-processing to ensure consistent color palettes across character sprites.
          *   **Animation:** *Luma AI* (specifically *VO3*) was utilized to create animated background elements from static AI-generated images.
          *   **Audio:** *Suno AI* was used to generate instrumental Lo-fi music for both the menu and gameplay loops, while *ElevenLabs* provided custom sound effects for in-game actions like menu selection and book-shelving.

          ### **Reference & Methodology**
          *   **Game Design Influence:** The game is a "reverse" *Vampire Survivors* style concept where the player assumes the role of a librarian cleaning up after NPCs rather than combatting them.
          *   **AI Methodology:** The author highlights the efficacy of using AI to generate project roadmaps, maintain state management, and troubleshoot code in real-time, effectively demonstrating how non-technical users can build functional web-based games by serving as a "product manager" for AI agents.
