name: Publish

on:
  release:
    types: [published]

concurrency:
  cancel-in-progress: true
  group: 'dots-${{ github.ref }}'

env:
  CI: true
  FORCE_COLOR: true
  DOCKER_BUILDKIT: 1
  BUILDKIT_INLINE_CACHE: 1
  IMG_NAME: ${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  build-push:
    name: Build and Push Latest Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.setup.outputs.PRODUCTION_URL }}
    strategy:
      matrix:
        distro: [debian]
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: roalcantara
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set version and URL
        id: setup
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "PRODUCTION_URL=https://hub.docker.com/r/${{ env.IMG_NAME }}/tags?name=${{ matrix.distro }}-$VERSION" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMG_NAME }}
          tags: |
            type=raw,value=${{ matrix.distro }}-latest
            type=semver,pattern=${{ matrix.distro }}-{{version}}
            type=semver,pattern=${{ matrix.distro }}-{{major}}.{{minor}}
            type=semver,pattern=${{ matrix.distro }}-{{major}}
            type=sha

      - name: Build and push for ${{ matrix.distro }}
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          target: remote
          file: distros/${{ matrix.distro }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          push: true
          provenance: true
          cache-from: |
            type=gha,scope=build-${{ matrix.distro }}-${{ github.head_ref || github.ref_name }}
            type=gha,scope=build-${{ matrix.distro }}
            type=registry,ref=docker.io/${{ env.IMG_NAME }}-cache:${{ matrix.distro }}-${{ github.head_ref || github.ref_name }}
            type=registry,ref=docker.io/${{ env.IMG_NAME }}-cache:${{ matrix.distro }}
            type=registry,ref=docker.io/${{ env.IMG_NAME }}-cache:base
          cache-to: |
            type=registry,ref=docker.io/${{ env.IMG_NAME }}-cache:${{ matrix.distro }},mode=max
            type=gha,scope=build-${{ matrix.distro }},mode=max
          github-token: ${{ secrets.GH_TOKEN }}
