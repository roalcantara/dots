name: Publish

on:
  release:
    types: [published]

concurrency:
  cancel-in-progress: true
  group: 'dots-${{ github.ref }}'

env:
  CI: true
  FORCE_COLOR: true
  DOCKER_BUILDKIT: 1
  BUILDKIT_INLINE_CACHE: 1
  IMG_NAME: ${{ github.repository }}

defaults:
  run:
    shell: bash

jobs:
  build-push:
    name: Build and Push Latest Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.production_url.outputs.PRODUCTION_URL }}
    strategy:
      matrix:
        distro: [debian]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set Production URL
        id: production_url
        run: echo "PRODUCTION_URL=https://hub.docker.com/r/roalcantara/dots/tags?name=${{ matrix.distro }}-${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_OUTPUT

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            roalcantara/dots
          tags: |
            type=raw,value=${{ matrix.distro }}-latest
            type=semver,pattern=${{ matrix.distro }}-{{version}}
            type=semver,pattern=${{ matrix.distro }}-{{major}}.{{minor}}
            type=semver,pattern=${{ matrix.distro }}-{{major}}
            type=sha

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: roalcantara
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: remote
          file: distros/${{ matrix.distro }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          push: true
          provenance: true
          cache-from: |
            type=registry,ref=${{ env.IMG_NAME }}:cache-${{ matrix.distro }}
            type=registry,ref=${{ env.IMG_NAME }}:cache-${{ matrix.distro }}-${{ github.ref_name }}
            type=gha,scope=build-${{ matrix.distro }}
          cache-to: |
            type=registry,ref=${{ env.IMG_NAME }}:cache-${{ matrix.distro }},mode=max
            type=gha,scope=build-${{ matrix.distro }},mode=max
