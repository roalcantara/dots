# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/pass-job-outputs
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: 'dots-${{ github.ref }}'

defaults:
  run:
    shell: bash

env:
  CI: true
  FORCE_COLOR: true
  DOCKER_BUILDKIT: 1
  BUILDKIT_INLINE_CACHE: 1
  REGISTRY_IMAGE: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        distro: [debian]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v2.1.0
        with:
          dockerfile: distros/${{ matrix.distro }}/Dockerfile
          config: ./.hadolint.yaml
  test:
    runs-on: ${{ matrix.image }}
    needs: lint
    permissions:
      contents: read
      packages: write
      id-token: write
      checks: write
      pull-requests: write
    strategy:
      matrix:
        distro: [debian]
        include:
          - distro: debian
            image: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: roalcantara
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build test image for ${{ matrix.distro }}
        uses: docker/build-push-action@v6
        with:
          target: remote
          context: .
          build-args: BRANCH=${{ github.head_ref || github.ref_name }}
          file: distros/${{ matrix.distro }}/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-amd64
          cache-from: |
            type=gha,scope=build-${{ matrix.distro }}-amd64
            type=gha,scope=build-${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-amd64
            type=registry,ref=docker.io/${{ env.REGISTRY_IMAGE }}-cache:${{ matrix.distro }}-amd64
          cache-to: |
            type=gha,scope=build-${{ matrix.distro }}-amd64,mode=max
            type=registry,ref=docker.io/${{ env.REGISTRY_IMAGE }}-cache:${{ matrix.distro }}-amd64,mode=max
          outputs: type=docker
          github-token: ${{ secrets.GH_TOKEN }}
          secrets: GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
      - name: Run container Structure Test
        uses: amardeep2006/container-structure-test-github-action@v1.2
        with:
          dockerimage: ${{ env.REGISTRY_IMAGE }}:${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-amd64
          args: -v debug --force --output junit --test-report cst_junit_report-${{ matrix.distro }}-amd64.xml --config distros/${{ matrix.distro }}/container-structure-test.yml
      - name: Upload Test Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.distro }}-amd64
          path: cst_junit_report-${{ matrix.distro }}-amd64.xml
      - name: Upload Test Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: cst_junit_report-${{ matrix.distro }}-amd64.xml
          check_name: Container Structure Tests (${{ matrix.distro }}-amd64)
  push:
    runs-on: ${{ matrix.image }}
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    environment:
      name: preview
      url: ${{ steps.setup.outputs.REGISTRY_URL }}
    strategy:
      matrix:
        distro: [debian]
        include:
          - distro: debian
            image: ubuntu-latest
    steps:
      - name: Setup outputs
        id: setup
        run: |
          short_sha=$(echo $GITHUB_SHA | cut -c1-7)
          registry_url_tags=https://hub.docker.com/r/${{ env.REGISTRY_IMAGE }}/tags
          echo "DISTRO=${{ matrix.distro }}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$short_sha" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=${{ env.REGISTRY_IMAGE }}:${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-${short_sha}" >> $GITHUB_OUTPUT
          echo "REGISTRY_URL_TAGS=${registry_url_tags}" >> $GITHUB_OUTPUT
          echo "REGISTRY_URL=${registry_url_tags}?name=pr-${{ github.event.pull_request.number }}-${short_sha}" >> $GITHUB_OUTPUT
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: roalcantara
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}
            type=raw,value=${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-${{ steps.setup.outputs.SHORT_SHA }}
            type=sha,prefix=${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-
      - name: Multi-platform Build and Push for ${{ matrix.distro }}
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          target: remote
          build-args: BRANCH=${{ github.head_ref || github.ref_name }}
          file: distros/${{ matrix.distro }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          push: true
          # TODO: Enable provenance when we have a way to sign the images
          provenance: false
          cache-from: |
            type=gha,scope=build-${{ matrix.distro }}-amd64
            type=gha,scope=build-${{ matrix.distro }}-arm64
            type=registry,ref=docker.io/${{ env.REGISTRY_IMAGE }}-cache:${{ matrix.distro }}
          cache-to: |
            type=gha,scope=build-${{ matrix.distro }}-amd64,mode=max
            type=gha,scope=build-${{ matrix.distro }}-arm64,mode=max
            type=registry,ref=docker.io/${{ env.REGISTRY_IMAGE }}-cache:${{ matrix.distro }},mode=max
          github-token: ${{ secrets.GH_TOKEN }}
          secrets: GITHUB_TOKEN=${{ secrets.GH_TOKEN }}
      - name: Update deployment status
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| distro | Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ steps.setup.outputs.DISTRO }} | ${{ steps.setup.outputs.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "Pull with: \`docker pull ${{ steps.setup.outputs.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View all PR images on [DockerHub](https://hub.docker.com/r/${{ env.REGISTRY_IMAGE }}/tags)" >> $GITHUB_STEP_SUMMARY
      - name: Create summary
        run: |
          echo "# PR Image Deployment" >> $GITHUB_STEP_SUMMARY
          echo "## PR #${{ github.event.pull_request.number }} Preview Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All distro variant images are now available for testing." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| distro | Docker Pull Command |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ steps.setup.outputs.DISTRO }} | \`docker pull ${{ steps.setup.outputs.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View all PR images on [DockerHub](${{ steps.setup.outputs.REGISTRY_URL }})" >> $GITHUB_STEP_SUMMARY
      - name: Create review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          result-encoding: string
          script: |
            const body = `## 🐳 Preview Docker Images Available

            Preview images for this PR have been built and pushed to DockerHub:

            | distro | Image |
            | --- | --- |
            | ${{ steps.setup.outputs.DISTRO }} | \`docker pull ${{ steps.setup.outputs.IMAGE_NAME }}\` |

            [View all PR images on DockerHub](${{ steps.setup.outputs.REGISTRY_URL }})

            ### Testing instructions

            1. Pull the relevant image: \`docker pull ${{ steps.setup.outputs.IMAGE_NAME }}\`
            2. Run the container: \`docker run -it ${{ steps.setup.outputs.IMAGE_NAME }}\`

            These preview images contain all changes from this PR.`;

            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: body,
              event: 'COMMENT'
            });
