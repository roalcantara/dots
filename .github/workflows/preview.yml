name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: 'dots-${{ github.ref }}'

defaults:
  run:
    shell: bash

env:
  CI: true
  FORCE_COLOR: true
  DOCKER_BUILDKIT: 1
  BUILDKIT_INLINE_CACHE: 1
  IMG_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        distro: [debian]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v2.1.0
        with:
          dockerfile: distros/${{ matrix.distro }}/Dockerfile
          config: ./.hadolint.yaml
  test:
    runs-on: ${{ matrix.image }}
    needs: lint
    permissions:
      contents: read
      packages: write
      id-token: write
      checks: write
      pull-requests: write
    strategy:
      matrix:
        distro: [debian]
        include:
          - distro: debian
            image: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: roalcantara
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test image for ${{ matrix.distro }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: remote
          platforms: linux/amd64
          build-args: BRANCH=${{ github.head_ref || github.ref_name }}
          file: distros/${{ matrix.distro }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMG_NAME }}:${{ matrix.distro }}-amd64-pr-${{ github.event.pull_request.number }}
          cache-from: |
            type=gha,scope=build-${{ matrix.distro }}-amd64
            type=gha,scope=build-${{ matrix.distro }}-amd64-pr-${{ github.event.pull_request.number }}
            type=gha,scope=build-${{ matrix.distro }}-amd64-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
            type=registry,ref=docker.io/${{ env.IMG_NAME }}-cache:${{ matrix.distro }}-amd64-pr-${{ github.event.pull_request.number }}
            type=registry,ref=docker.io/${{ env.IMG_NAME }}-cache:${{ matrix.distro }}-amd64-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          cache-to: type=gha,scope=build-${{ matrix.distro }}-amd64,mode=max
          outputs: type=docker
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Inspect image
        run: docker inspect ${{ env.IMG_NAME }}:${{ matrix.distro }}-amd64-pr-${{ github.event.pull_request.number }}

      - name: Container Structure Test GitHub Action
        uses: amardeep2006/container-structure-test-github-action@v1.2
        with:
          dockerimage: ${{ env.IMG_NAME }}:${{ matrix.distro }}-amd64-pr-${{ github.event.pull_request.number }}
          args: -v debug --force --output junit --test-report cst_junit_report.xml --config distros/${{ matrix.distro }}/container-structure-test.yml

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: cst_junit_report.xml

      - uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: cst_junit_report.xml

  build-and-push:
    runs-on: ${{ matrix.image }}
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
    environment:
      name: preview
      url: ${{ steps.setup.outputs.PREVIEW_URL }}
    strategy:
      matrix:
        distro: [debian]
        include:
          - distro: debian
            image: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: roalcantara
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set version and URL
        id: setup
        run: |
          echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "PREVIEW_URL=https://hub.docker.com/r/${{ env.IMG_NAME }}/tags?name=pr-${{ github.event.pull_request.number }}-$SHORT_SHA" >> $GITHUB_OUTPUT
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMG_NAME }}
          tags: |
            type=raw,value=${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}
            type=raw,value=${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-${{ steps.setup.outputs.SHORT_SHA }}
            type=sha

      - name: Build and push for ${{ matrix.distro }}
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          target: remote
          build-args: BRANCH=${{ github.head_ref || github.ref_name }}
          file: distros/${{ matrix.distro }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          push: true
          provenance: true
          cache-from: |
            type=gha,scope=build-${{ matrix.distro }}-${{ github.head_ref || github.ref_name }}
            type=gha,scope=build-${{ matrix.distro }}
            type=registry,ref=docker.io/${{ env.IMG_NAME }}-cache:${{ matrix.distro }}-${{ github.head_ref || github.ref_name }}
            type=registry,ref=docker.io/${{ env.IMG_NAME }}-cache:${{ matrix.distro }}
            type=registry,ref=docker.io/${{ env.IMG_NAME }}-cache:base
          cache-to: |
            type=registry,ref=docker.io/${{ env.IMG_NAME }}-cache:${{ matrix.distro }},mode=max
            type=gha,scope=build-${{ matrix.distro }},mode=max
          github-token: ${{ secrets.GH_TOKEN }}

      - name: Update deployment status
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| distro | Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.distro }} | ${{ env.IMG_NAME }} | ${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-${{ steps.setup.outputs.SHORT_SHA }} |" >> $GITHUB_STEP_SUMMARY
          echo "Pull with: \`docker pull ${{ env.IMG_NAME }}:${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-${{ steps.setup.outputs.SHORT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View all PR images on [DockerHub](https://hub.docker.com/r/${{ env.IMG_NAME }}/tags)" >> $GITHUB_STEP_SUMMARY

      - name: Create summary
        run: |
          echo "# PR Image Deployment" >> $GITHUB_STEP_SUMMARY
          echo "## PR #${{ github.event.pull_request.number }} Preview Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All distro variant images are now available for testing." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| distro | Docker Pull Command |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.distro }} | \`docker pull ${{ env.IMG_NAME }}:${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-${{ steps.setup.outputs.SHORT_SHA }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View all PR images on [DockerHub](https://hub.docker.com/r/${{ env.IMG_NAME }}/tags?name=pr-${{ github.event.pull_request.number }})" >> $GITHUB_STEP_SUMMARY

      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const sha = '${{ steps.setup.outputs.SHORT_SHA }}';
            const prNumber = '${{ github.event.pull_request.number }}';
            const body = `## 🐳 Preview Docker Images Available

            Preview images for this PR have been built and pushed to DockerHub:

            | distro | Image |
            | --- | --- |
            | ${{ matrix.distro }} | \`docker pull ${{ env.IMG_NAME }}:${{ matrix.distro }}-pr-${prNumber}-${sha}\` |

            [View all PR images on DockerHub](https://hub.docker.com/r/${{ env.IMG_NAME }}/tags?name=pr-${{ github.event.pull_request.number }})

            ### Testing instructions

            1. Pull the relevant image: \`docker pull ${{ env.IMG_NAME }}:${{ matrix.distro }}-pr-${prNumber}-${sha}\`
            2. Run the container: \`docker run -it ${{ env.IMG_NAME }}:${{ matrix.distro }}-pr-${prNumber}-${sha}\`

            These preview images contain all changes from this PR.`;

            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: body,
              event: 'COMMENT'
            });
