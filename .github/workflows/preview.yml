---
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: 'preview-${{ github.event.pull_request.number || github.ref }}'

defaults:
  run:
    shell: bash

env:
  CI: true
  FORCE_COLOR: true

jobs:
  brewfile:
    name: Brewfile parses (container, desktop, dev)
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Homebrew
        run: |
          brew=/home/linuxbrew/.linuxbrew/bin/brew
          [ -x "$brew" ] || NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: List every profile
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          for p in container desktop desktop,dev; do
            echo "::group::$p"
            HOMEBREW_DOTS_PROFILE=$p brew bundle list --all --file config/homebrew/Brewfile
            echo "::endgroup::"
          done

  lint:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v2.1.0
        with:
          dockerfile: distros/debian/Dockerfile
          config: ./.hadolint.yaml

  changes:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    outputs:
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether bootstrap is needed
        id: filter
        # Diff first: piped, a git error or a SIGPIPE (the filter exits on the first match) would read as "skip".
        run: |
          changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
          if .github/needs-bootstrap.sh <<< "$changed"; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          fi

  bootstrap:
    runs-on: ubuntu-24.04
    needs: [changes, lint, brewfile]
    if: needs.changes.outputs.bootstrap == 'true'
    container: mcr.microsoft.com/devcontainers/base:debian
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Copy checkout for vscode
        run: |
          # As root: create each folder owned by vscode, or mise cannot make ~/.local/bin later.
          install -d -o vscode -g vscode /home/vscode/.local /home/vscode/.local/share
          cp -a "$GITHUB_WORKSPACE" /home/vscode/.local/share/dots
          chown -R vscode:vscode /home/vscode/.local/share/dots
      - name: Run strict container bootstrap
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          sudo -u vscode -H env GITHUB_TOKEN="$GITHUB_TOKEN" bash /home/vscode/.local/share/dots/distros/bootstrap.sh
      - name: Run mise doctor project
        run: |
          sudo -u vscode -H /usr/bin/zsh -lic 'mise doctor project'
