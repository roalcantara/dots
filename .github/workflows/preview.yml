# https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
# https://docs.docker.com/build/ci/github-actions/test-before-push
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: 'dots-${{ github.ref }}'

defaults:
  run:
    shell: bash

env:
  CI: true
  FORCE_COLOR: true
  DOCKER_BUILDKIT: 1
  BUILDKIT_INLINE_CACHE: 1
  REGISTRY_IMAGE: ${{ github.repository }}

jobs:
  lint:
    runs-on: ${{ matrix.runner }}
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        distro: [debian, ubuntu]
        include:
          - distro: debian
            runner: ubuntu-latest
          - distro: ubuntu
            runner: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v2.1.0
        with:
          dockerfile: distros/${{ matrix.distro }}/Dockerfile
          config: ./.hadolint.yaml
  validate:
    runs-on: ${{ matrix.runner }}
    needs: lint
    strategy:
      matrix:
        distro: [debian, ubuntu]
        include:
          - distro: debian
            runner: ubuntu-latest
          - distro: ubuntu
            runner: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      checks: write
    outputs:
      DISTRO: ${{ matrix.distro }}
      SHORT_SHA: ${{ steps.setup.outputs.SHORT_SHA }}
      IMAGE_NAME: ${{ steps.setup.outputs.IMAGE_NAME }}
      REGISTRY_URL_TAGS: ${{ steps.setup.outputs.REGISTRY_URL_TAGS }}
      REGISTRY_URL: ${{ steps.setup.outputs.REGISTRY_URL }}
      IMAGE_INFO: ${{ steps.setup.outputs.IMAGE_INFO }}
    steps:
      - name: Setup outputs
        id: setup
        run: |
          short_sha=$(echo $GITHUB_SHA | cut -c1-7)
          registry_url_tags=https://hub.do«cker.com/r/${{ env.REGISTRY_IMAGE }}/tags
          echo "DISTRO=${{ matrix.distro }}" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$short_sha" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=${{ env.REGISTRY_IMAGE }}:${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-${short_sha}" >> $GITHUB_OUTPUT
          echo "REGISTRY_URL_TAGS=${registry_url_tags}" >> $GITHUB_OUTPUT
          echo "REGISTRY_URL=${registry_url_tags}?name=pr-${{ github.event.pull_request.number }}-${short_sha}" >> $GITHUB_OUTPUT
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: roalcantara
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: remote
          build-args: BRANCH=${{ github.head_ref || github.ref_name }}
          file: distros/${{ matrix.distro }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.setup.outputs.IMAGE_NAME }}-amd64
          cache-from: |
            type=gha,scope=build-${{ matrix.distro }}-amd64
            type=registry,ref=docker.io/${{ env.REGISTRY_IMAGE }}-cache:${{ matrix.distro }}-amd64
          cache-to: |
            type=gha,scope=build-${{ matrix.distro }}-amd64,mode=max
            type=registry,ref=docker.io/${{ env.REGISTRY_IMAGE }}-cache:${{ matrix.distro }}-amd64,mode=max
          github-token: ${{ secrets.GH_TOKEN }}
          secrets: github_token=${{ secrets.GH_TOKEN }}
      - name: Run Container Structure Test (${{ matrix.distro }}/amd64)
        uses: docker://gcr.io/gcp-runtimes/container-structure-test:latest
        with:
          args: test -v debug --force --output junit --test-report cst_junit_report.xml --config distros/${{ matrix.distro }}/container-structure-test.yml --image ${{ steps.setup.outputs.IMAGE_NAME }}-amd64
      - name: Upload Test Report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: cst_junit_report.xml
          check_name: Container Structure Tests (${{ matrix.distro }}/amd64)
      - name: Extract Docker Metadata
        if: success()
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}
            type=raw,value=${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-${{ steps.setup.outputs.SHORT_SHA }}
            type=sha,prefix=${{ matrix.distro }}-pr-${{ github.event.pull_request.number }}-
      - name: Multi-platform Build and Push for ${{ matrix.distro }}
        if: success()
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          target: remote
          build-args: BRANCH=${{ github.head_ref || github.ref_name }}
          file: distros/${{ matrix.distro }}/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          push: true
          # TODO: Enable provenance when we have a way to sign the images
          provenance: false
          cache-from: |
            type=gha,scope=build-${{ matrix.distro }}-amd64
            type=gha,scope=build-${{ matrix.distro }}-arm64
            type=registry,ref=docker.io/${{ env.REGISTRY_IMAGE }}-cache:${{ matrix.distro }}
          cache-to: |
            type=gha,scope=build-${{ matrix.distro }}-amd64,mode=max
            type=gha,scope=build-${{ matrix.distro }}-arm64,mode=max
            type=registry,ref=docker.io/${{ env.REGISTRY_IMAGE }}-cache:${{ matrix.distro }},mode=max
          github-token: ${{ secrets.GH_TOKEN }}
          secrets: github_token=${{ secrets.GH_TOKEN }}
      - name: Collect outputs
        id: collect-outputs
        run: |
          # Create JSON object with this distro's info
          image_info=$(jq -n -c \
            --arg distro "${{ matrix.distro }}" \
            --arg image_name "${{ steps.setup.outputs.IMAGE_NAME }}" \
            --arg short_sha "${{ steps.setup.outputs.SHORT_SHA }}" \
            --arg registry_url "${{ steps.setup.outputs.REGISTRY_URL }}" \
            '{
              distro: $distro,
              image_name: $image_name,
              short_sha: $short_sha,
              registry_url: $registry_url
            }')
          echo "IMAGE_INFO=$image_info" >> $GITHUB_OUTPUT
  publish:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
      id-token: write
      checks: write
      pull-requests: write
    environment:
      name: preview
      url: ${{ needs.validate.outputs.REGISTRY_URL }}
    steps:
      - name: Collect all distro data
        id: collect-data
        run: |
          # The validate job outputs will be an array of JSON objects
          # We need to process them into a format we can use

          # Get all the outputs (this is a bit tricky with matrix jobs)
          # GitHub doesn't directly give us an array, so we need to work around this
          echo "Processing distro outputs..."

          # For now, let's create the data manually since we know the distros
          # In a more dynamic setup, you'd parse the actual job outputs
          short_sha=$(echo $GITHUB_SHA | cut -c1-7)

          # Create our summary data
          cat << EOF > distro_summary.md
          ## 🐳 Preview Docker Images Available

          Preview images for PR #${{ github.event.pull_request.number }} have been built and pushed to DockerHub:

          | Distro | Image | Platforms |
          | --- | --- | --- |
          | debian | \`docker pull ${{ env.REGISTRY_IMAGE }}:debian-pr-${{ github.event.pull_request.number }}-${short_sha}\` | linux/amd64, linux/arm64 |
          | ubuntu | \`docker pull ${{ env.REGISTRY_IMAGE }}:ubuntu-pr-${{ github.event.pull_request.number }}-${short_sha}\` | linux/amd64, linux/arm64 |

          [View all PR images on DockerHub](https://hub.docker.com/r/${{ env.REGISTRY_IMAGE }}/tags?name=pr-${{ github.event.pull_request.number }}-${short_sha})

          ### Testing instructions

          1. Pull the relevant image for your distro
          2. Run the container: \`docker run -it <image_name>\`

          These preview images contain all changes from this PR.
          EOF

          echo "SHORT_SHA=${short_sha}" >> $GITHUB_OUTPUT
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Create step summary
        run: |
          cat distro_summary.md >> $GITHUB_STEP_SUMMARY
      - name: Create PR comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('distro_summary.md', 'utf8');

            // Check if we already commented on this PR
            const comments = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Look for existing bot comment
            const existingComment = comments.data.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('Preview Docker Images Available')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.pulls.updateReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                review_id: existingComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body: body,
                event: 'COMMENT'
              });
            }
      - name: Update deployment status
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "| distro | Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ needs.validate.outputs.DISTRO }} | ${{ needs.validate.outputs.IMAGE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "Pull with: \`docker pull ${{ needs.validate.outputs.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View all PR images on [DockerHub](https://hub.docker.com/r/${{ env.REGISTRY_IMAGE }}/tags)" >> $GITHUB_STEP_SUMMARY
      - name: Create summary
        run: |
          echo "# PR Image Deployment" >> $GITHUB_STEP_SUMMARY
          echo "## PR #${{ github.event.pull_request.number }} Preview Images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All distro variant images are now available for testing." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| distro | Docker Pull Command |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ needs.validate.outputs.DISTRO }} | \`docker pull ${{ needs.validate.outputs.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View all PR images on [DockerHub](${{ needs.validate.outputs.REGISTRY_URL }})" >> $GITHUB_STEP_SUMMARY
      - name: Create review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          result-encoding: string
          script: |
            const body = `## 🐳 Preview Docker Images Available

            Preview images for this PR have been built and pushed to DockerHub:

            | distro | Image |
            | --- | --- |
            | ${{ needs.validate.outputs.DISTRO }} | \`docker pull ${{ needs.validate.outputs.IMAGE_NAME }}\` |

            [View all PR images on DockerHub](${{ needs.validate.outputs.REGISTRY_URL }})

            ### Testing instructions

            1. Pull the relevant image: \`docker pull ${{ needs.validate.outputs.IMAGE_NAME }}\`
            2. Run the container: \`docker run -it ${{ needs.validate.outputs.IMAGE_NAME }}\`

            These preview images contain all changes from this PR.`;

            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: body,
              event: 'COMMENT'
            });
