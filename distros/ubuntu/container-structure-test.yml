---
schemaVersion: 2.0.0

globalEnvVars:
  - key: USER
    value: vscode
  - key: HOME
    value: /home/vscode
  - key: CLICOLOR
    value: 1
  - key: COLORTERM
    value: truecolor
  - key: XDG_CONFIG_HOME
    value: /home/vscode/.config
  - key: XDG_CACHE_HOME
    value: /home/vscode/.cache
  - key: XDG_STATE_HOME
    value: /home/vscode/.local/state
  - key: XDG_DATA_HOME
    value: /home/vscode/.local/share
  - key: ZDOTDIR
    value: /home/vscode/.config/zsh
  - key: ZIM_HOME
    value: /home/vscode/.local/state/zim
  - key: MISE_DATA_HOME
    value: /home/vscode/.local/share/mise
  - key: MISE_CACHE_DIR
    value: /home/vscode/.cache/mise
  - key: MISE_GLOBAL_CONFIG_FILE
    value: /home/vscode/.config/mise/config.toml
  - key: NPM_CONFIG_USERCONFIG
    value: /home/vscode/.config/npm/.npmrc
  - key: NPM_CONFIG_PREFIX
    value: /home/vscode/.local/share/npm
  - key: NPM_CONFIG_CACHE
    value: /home/vscode/.cache/npm

commandTests:
  # SYSTEM
  - name: curl should be installed
    command: which
    args: [curl]
    exitCode: 0
  - name: jq should be installed
    command: which
    args: [jq]
    exitCode: 0
  - name: ZSH should be installed
    command: which
    args: [zsh]
    exitCode: 0
  - name: Git should be installed
    command: which
    args: [git]
    exitCode: 0

  # MISE
  - name: mise should be installed
    command: /home/vscode/.local/bin/mise
    args: [--version]
    exitCode: 0
  - name: Homebrew should be installed
    command: /home/linuxbrew/.linuxbrew/bin/brew
    args: [--version]
    expectedOutput: ['Homebrew \d']
  - name: the container group of the Brewfile should be on PATH in a login shell
    command: zsh
    args: [-lic, "for t in zoxide fzf eza bat rg fd jq nvim delta; do command -v $t >/dev/null || { echo missing $t; exit 1; }; done; echo ok"]
    expectedOutput: [ok]
  - name: a login shell should start without errors
    command: zsh
    args: [-lic, exit]
    exitCode: 0
    excludedError: ['.+']
  - name: desktop-only parts should be absent
    command: bash
    args: [-c, "for p in ~/.agents/skills ~/.local/share/gopass/password-store ~/.local/share/nvim/lazy; do [ ! -e $p ] || { echo present $p; exit 1; }; done; echo ok"]
    expectedOutput: [ok]
  - name: SOPS-filtered files should stay encrypted in the image
    command: bash
    args: [-c, "set -e; ls /home/vscode/.local/share/dots/config/ssh/keys/*.key >/dev/null; ! grep -q 'BEGIN OPENSSH PRIVATE KEY' /home/vscode/.local/share/dots/config/ssh/keys/*.key"]
    exitCode: 0

# HOME DIRECTORIES
fileExistenceTests:
  - name: ~/ (HOME dir)
    path: /home/vscode
    shouldExist: true
    permissions: drwxr-x---
  - name: ~/Projects dir (XDG_PROJECTS_DIR)
    path: /home/vscode/Projects
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/Work dir (XDG_WORKSPACE_DIR)
    path: /home/vscode/Work
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.zshenv file
    path: /home/vscode/.zshenv
    shouldExist: true
    permissions: Lrwxrwxrwx
  - name: ~/.bashrc file
    path: /home/vscode/.bashrc
    shouldExist: true
    permissions: Lrwxrwxrwx

  # XDG_CONFIG_HOME (CONFIG)
  - name: ~/.config dir (XDG_CONFIG_HOME)
    path: /home/vscode/.config
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.config/nvim dir
    path: /home/vscode/.config/nvim
    shouldExist: true
    permissions: Lrwxrwxrwx
  - name: ~/.config/nvim/init.lua (MYVIMRC)
    path: /home/vscode/.config/nvim/init.lua
    shouldExist: true
  - name: ~/.config/zsh dir (ZDOTDIR)
    path: /home/vscode/.config/zsh
    shouldExist: true
    permissions: Lrwxrwxrwx
  - name: ~/.config/npm/.npmrc (NPM_CONFIG_USERCONFIG)
    path: /home/vscode/.config/npm/.npmrc
    shouldExist: true
  - name: ~/.config/git dir
    path: /home/vscode/.config/git
    shouldExist: true
    permissions: Lrwxrwxrwx
  - name: ~/.config/snippets dir
    path: /home/vscode/.config/snippets
    shouldExist: true
    permissions: Lrwxrwxrwx
  - name: ~/.config/ghostty config
    path: /home/vscode/.config/ghostty
    shouldExist: true
    permissions: Lrwxrwxrwx
  - name: ~/.config/ripgrep/.ripgreprc (RIPGREP_CONFIG_PATH)
    path: /home/vscode/.config/ripgrep/.ripgreprc
    shouldExist: true

  # XDG_CACHE_HOME (CACHE)
  - name: ~/.cache dir (XDG_CACHE_HOME)
    path: /home/vscode/.cache
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.cache/npm dir (NPM_CONFIG_CACHE)
    path: /home/vscode/.cache/npm
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.cache/zsh dir (ZSH_CACHE_DIR)
    path: /home/vscode/.cache/zsh
    shouldExist: true
    permissions: drwx------

  # XDG_STATE_HOME (LOCAL/STATE)
  - name: ~/.local/state dir (XDG_STATE_HOME)
    path: /home/vscode/.local/state
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.local/state/nvim dir
    path: /home/vscode/.local/state/nvim
    shouldExist: true
    permissions: drwx------
  - name: ~/.local/state/zim dir (ZIM_HOME)
    path: /home/vscode/.local/state/zim
    shouldExist: true
    permissions: drwxr-xr-x

  # XDG_DATA_HOME (LOCAL/SHARE)
  - name: ~/.local/share dir (XDG_DATA_HOME)
    path: /home/vscode/.local/share
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.local/share/npm dir (NPM_CONFIG_PREFIX)
    path: /home/vscode/.local/share/npm
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.local/share/zsh dir (ZSH_DATA_DIR)
    path: /home/vscode/.local/share/zsh
    shouldExist: true
    permissions: drwxr-xr-x
