schemaVersion: 2.0.0

globalEnvVars:
  - key: USER
    value: vscode
  - key: HOME
    value: /home/vscode
  - key: CLICOLOR
    value: 1
  - key: COLORTERM
    value: truecolor
  - key: XDG_CONFIG_HOME
    value: /home/vscode/.config
  - key: XDG_CACHE_HOME
    value: /home/vscode/.cache
  - key: XDG_STATE_HOME
    value: /home/vscode/.local/state
  - key: XDG_DATA_HOME
    value: /home/vscode/.local/share
  - key: ZDOTDIR
    value: /home/vscode/.config/zsh
  - key: ZIM_HOME
    value: /home/vscode/.local/share/zim
  - key: MISE_GLOBAL_CONFIG_DIR
    value: /home/vscode/.local/share/mise
  - key: MISE_GLOBAL_CONFIG_FILE
    value: /home/vscode/.local/share/mise/config.toml
  - key: MISE_CACHE_DIR
    value: /home/vscode/.cache/mise
  - key: NPM_CONFIG_USERCONFIG
    value: /home/vscode/.config/npm/.npmrc
  - key: NPM_CONFIG_PREFIX
    value: /home/vscode/.local/share/npm
  - key: NPM_CONFIG_CACHE
    value: /home/vscode/.cache/npm
  - key: STARSHIP_CONFIG_HOME
    value: /home/vscode/.config/starship
  - key: STARSHIP_CONFIG
    value: /home/vscode/.config/starship/starship.toml
commandTests:
  # System
  - name: curl should be installed
    command: which
    args: [curl]
    expectedOutput: [/usr/bin/curl]
  - name: jq should be installed
    command: which
    args: [jq]
    expectedOutput: [/usr/bin/jq]
  - name: ZSH should be installed
    command: which
    args: [zsh]
    expectedOutput: [/usr/bin/zsh]

  # /usr/local
  - name: Ruby should be installed
    command: which
    args: [ruby]
    expectedOutput: [/usr/local/bin/ruby]
  - name: (Ruby) Bundler should be installed
    command: which
    args: [bundler]
    expectedOutput: [/usr/local/bin/bundler]
  - name: (Ruby) Gems should be installed
    command: which
    args: [gem]
    expectedOutput: [/usr/local/bin/gem]
  - name: Git should be installed
    command: which
    args: [git]
    expectedOutput: [/usr/local/bin/git]
  - name: Mise should be installed
    command: which
    args: [mise]
    expectedOutput: [/usr/local/bin/mise]

