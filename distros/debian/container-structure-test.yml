schemaVersion: 2.0.0

globalEnvVars:
  - key: USER
    value: vscode
  - key: HOME
    value: /home/vscode
  - key: CLICOLOR
    value: 1
  - key: COLORTERM
    value: truecolor
  - key: XDG_CONFIG_HOME
    value: /home/vscode/.config
  - key: XDG_CACHE_HOME
    value: /home/vscode/.cache
  - key: XDG_STATE_HOME
    value: /home/vscode/.local/state
  - key: XDG_DATA_HOME
    value: /home/vscode/.local/share
  - key: ZDOTDIR
    value: /home/vscode/.config/zsh
  - key: ZIM_HOME
    value: /home/vscode/.local/state/zim
  - key: MISE_GLOBAL_CONFIG_DIR
    value: /home/vscode/.local/share/mise
  - key: MISE_GLOBAL_CONFIG_FILE
    value: /home/vscode/.local/share/mise/config.toml
  - key: MISE_CACHE_DIR
    value: /home/vscode/.cache/mise
  - key: NPM_CONFIG_USERCONFIG
    value: /home/vscode/.config/npm/.npmrc
  - key: NPM_CONFIG_PREFIX
    value: /home/vscode/.local/share/npm
  - key: NPM_CONFIG_CACHE
    value: /home/vscode/.cache/npm
  - key: STARSHIP_CONFIG_HOME
    value: /home/vscode/.config/starship
  - key: STARSHIP_CONFIG
    value: /home/vscode/.config/starship/starship.toml

commandTests:
  # SYSTEM
  - name: curl should be installed
    command: which
    args: [curl]
    exitCode: 0
  - name: jq should be installed
    command: which
    args: [jq]
    exitCode: 0
  - name: ZSH should be installed
    command: which
    args: [zsh]
    exitCode: 0
  - name: Git should be installed
    command: which
    args: [git]
    exitCode: 0

  # FLOX
  - name: Flox should be installed
    command: which
    args: [flox]
    exitCode: 0
  - name: Flox should have a default environment
    command: flox
    args: [envs]
    expectedOutput:
      - "\\s*default.*\\/home\\/vscode.*"
  - name: Flox default environment should have all minimum tools installed
    command: flox
    args: [list, --dir=/home/vscode, --name]
    expectedOutput: ['age', 'bat', 'delta', 'eza', 'fd', 'fzf', 'gitlint', 'gum', 'neovim', 'nodejs', 'pre-commit', 'python313Full', 'ripgrep', 'ruby', 'sops', 'starship', 'tree-sitter', 'zoxide']

# HOME DIRECTORIES
fileExistenceTests:
  - name: ~/ (HOME dir)
    path: /home/vscode
    shouldExist: true
    permissions: drwx------
  - name: ~/Desktop dir (XDG_DESKTOP_DIR)
    path: /home/vscode/Desktop
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/Documents dir (XDG_DOCUMENTS_DIR)
    path: /home/vscode/Documents
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/Downloads dir (XDG_DOWNLOAD_DIR)
    path: /home/vscode/Downloads
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/Movies dir (XDG_VIDEOS_DIR)
    path: /home/vscode/Movies
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/Music dir (XDG_MUSIC_DIR)
    path: /home/vscode/Music
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/Pictures dir (XDG_PICTURES_DIR)
    path: /home/vscode/Pictures
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/Projects dir (XDG_PROJECTS_DIR)
    path: /home/vscode/Projects
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/Work dir (XDG_WORKSPACE_DIR)
    path: /home/vscode/Work
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.zshenv file
    path: /home/vscode/.zshenv
    shouldExist: true
    permissions: Lrwxrwxrwx
  - name: ~/.bashrc file
    path: /home/vscode/.bashrc
    shouldExist: false
  - name: ~/.oh-my-zsh dir
    path: /home/vscode/.oh-my-zsh
    shouldExist: false

  # XDG_CONFIG_HOME (CONFIG)
  - name: ~/.config dir (XDG_CONFIG_HOME)
    path: /home/vscode/.config
    shouldExist: true
    permissions: Lrwxrwxrwx
  - name: ~/.config/nvim dir
    path: /home/vscode/.config/nvim
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.config/nvim/init.lua (MYVIMRC)
    path: /home/vscode/.config/nvim/init.lua
    shouldExist: true
    permissions: -rw-r--r--
  - name: ~/.config/nvim/.venv dir
    path: /home/vscode/.config/nvim/.venv
    shouldExist: true
    permissions: drwxrwxr-x
  - name: ~/.config/nvim/.venv/bin dir
    path: /home/vscode/.config/nvim/.venv/bin
    shouldExist: true
    permissions: drwxrwxr-x
  - name: ~/.config/nvim/.venv/bin/activate file
    path: /home/vscode/.config/nvim/.venv/bin/activate
    shouldExist: true
    permissions: -rw-r--r--
  - name: ~/.config/nvim/.venv/bin/python3 file
    path: /home/vscode/.config/nvim/.venv/bin/python3
    shouldExist: true
    permissions: Lrwxrwxrwx
  - name: ~/.config/zsh dir (ZDOTDIR)
    path: /home/vscode/.config/zsh
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.config/npm/.npmrc (NPM_CONFIG_USERCONFIG)
    path: /home/vscode/.config/npm/.npmrc
    shouldExist: true
    permissions: -rw-r--r--
  - name: ~/.config/git dir
    path: /home/vscode/.config/git
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.config/snippets dir
    path: /home/vscode/.config/snippets
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.config/starship dir (STARSHIP_CONFIG_HOME)
    path: /home/vscode/.config/starship
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.config/starship/starship.toml (STARSHIP_CONFIG)
    path: /home/vscode/.config/starship/starship.toml
    shouldExist: true
    permissions: -rwxr-xr-x
  - name: ~/.config/ghostty config
    path: /home/vscode/.config/ghostty
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.config/ripgrep/.ripgreprc (RIPGREP_CONFIG_PATH)
    path: /home/vscode/.config/ripgrep/.ripgreprc
    shouldExist: true
    permissions: -rw-r--r--

  # XDG_CACHE_HOME (CACHE)
  - name: ~/.cache dir (XDG_CACHE_HOME)
    path: /home/vscode/.cache
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.cache/npm dir (NPM_CONFIG_CACHE)
    path: /home/vscode/.cache/npm
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.cache/zsh dir (ZSH_CACHE_DIR)
    path: /home/vscode/.cache/zsh
    shouldExist: true
    permissions: drwxr-xr-x

  # XDG_STATE_HOME (LOCAL/STATE)
  - name: ~/.local/state dir (XDG_STATE_HOME)
    path: /home/vscode/.local/state
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.local/state/nvim dir
    path: /home/vscode/.local/state/nvim
    shouldExist: true
    permissions: drwx------
  - name: ~/.local/state/zim dir (ZIM_HOME)
    path: /home/vscode/.local/state/zim
    shouldExist: true
    permissions: drwxr-xr-x

  # XDG_DATA_HOME (LOCAL/SHARE)
  - name: ~/.local/share dir (XDG_DATA_HOME)
    path: /home/vscode/.local/share
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.local/share/npm dir (NPM_CONFIG_PREFIX)
    path: /home/vscode/.local/share/npm
    shouldExist: true
    permissions: drwxr-xr-x
  - name: ~/.local/share/zsh dir (ZSH_DATA_DIR)
    path: /home/vscode/.local/share/zsh
    shouldExist: true
    permissions: drwxr-xr-x
