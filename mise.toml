# Dev tools, env, and task runner

# https://mise.jdx.dev/tasks
[tasks]
# mise run build
# mise run build --nocache
# mise run build --nocache --distro ubuntu
# mise run build --nocache --local
# mise run build --nocache --local --user vscode --tag latest

[tasks."build"]
description = "Build a Docker image for dotfiles"
usage = '''
  flag "--nocache" help="Disable build cache"
  flag "--local" help="Build local target (COPY) instead of remote"
  flag "--publish" help="Publish image to Docker Hub"
  flag "--distro <distro>" {
    help "Distribution"
    choices "debian" "ubuntu"
    default "debian"
  }
  flag "--platform <platform>" {
    help "Target platform"
    choices "amd64" "arm64" "amd64v2" "riscv64" "ppc64le" "s390x" "386"
    default "arm64"
  }
  flag "--secret <path>" help="GitHub token secret file" default="./.secrets/github_token.secret"
  flag "--tag <tag>" help="Image tag suffix"
  flag "--branch <branch>" help="Git branch for remote install"
  flag "--repo <repo>" help="GitHub repo (owner/name)"
  flag "--user <user>" help="Build arg USERNAME"
  flag "--build-arg <arg>" {
    help "Extra docker --build-arg (repeat flag)"
    var #true
  }
'''
run = '''
#!/usr/bin/env bash
set -o pipefail

case "${usage_platform?}" in
  amd64)    PLATFORM_VALUE="linux/amd64" ;;
  arm64)    PLATFORM_VALUE="linux/arm64" ;;
  amd64v2)  PLATFORM_VALUE="linux/amd64/v2" ;;
  riscv64)  PLATFORM_VALUE="linux/riscv64" ;;
  ppc64le)  PLATFORM_VALUE="linux/ppc64le" ;;
  s390x)    PLATFORM_VALUE="linux/s390x" ;;
  386)      PLATFORM_VALUE="linux/386" ;;
  *)        PLATFORM_VALUE="linux/arm64" ;;
esac

DOCKER_CMD=(
  DOCKER_BUILDKIT=1 docker build
  --build-arg=BUILDKIT_INLINE_CACHE=1
)

if [ -n "${usage_user:-}" ]; then
  DOCKER_CMD+=(--build-arg=USERNAME="$usage_user")
fi

if [ -n "${usage_branch:-}" ]; then
  DOCKER_CMD+=(--build-arg=BRANCH="$usage_branch")
fi

if [ -n "${usage_repo:-}" ]; then
  DOCKER_CMD+=(--build-arg=GITHUB_REPO="$usage_repo")
fi

if [ -n "${usage_build_arg:-}" ]; then
  eval "EXTRA_BUILD_ARGS=($usage_build_arg)"
  for arg in "${EXTRA_BUILD_ARGS[@]}"; do
    DOCKER_CMD+=(--build-arg="$arg")
  done
fi

if [[ -z ${GITHUB_TOKEN:-} && -f ${usage_secret?} ]]; then
  DOCKER_CMD+=(--secret="id=github_token,src=$usage_secret")
fi

DOCKER_CMD+=(--platform="$PLATFORM_VALUE")

TAG_VALUE="dots:${usage_distro?}"
[ -n "${usage_tag:-}" ] && TAG_VALUE="$TAG_VALUE-$usage_tag"
DOCKER_CMD+=(--tag="$TAG_VALUE")

if [ "${usage_nocache:-false}" = "true" ]; then
  DOCKER_CMD+=(--no-cache)
fi

DOCKER_CMD+=(--file="distros/${usage_distro?}/Dockerfile")

# local and publish build the committed tree: the working tree holds decrypted SOPS files (config/.env,
# config/ssh/keys/*.key). The smudge filter is disabled so git archive exports them encrypted.
if [ "${usage_publish:-false}" = "true" ] || [ "${usage_local:-false}" = "true" ]; then
  target=local
  [ "${usage_publish:-false}" = "true" ] && target=publish
  DOCKER_CMD+=(--target="$target" -)
  echo "  ==> git archive HEAD | ${DOCKER_CMD[*]}"
  git -c filter.sops.smudge=cat -c filter.sops.required=false archive --format=tar HEAD | eval "${DOCKER_CMD[*]}"
else
  DOCKER_CMD+=(--target=remote .)
  echo "  ==> ${DOCKER_CMD[*]}"
  eval "${DOCKER_CMD[*]}"
fi
'''

# mise run start
# mise run start --tag local
# mise run start --tag local --user vscode --workdir /workspaces/dots

[tasks."start"]
description = "Start a container"
usage = '''
  flag "--distro <distro>" {
    help "Distribution"
    choices "debian" "ubuntu"
    default "debian"
  }
  flag "--tag <tag>" help="Image tag suffix (dots:<distro>-<tag>)"
  flag "--user <user>" help="Container user" default="vscode"
  flag "--workdir <path>" help="Container working directory" default="/workspaces/dots"
'''
run = '''
#!/usr/bin/env bash

DOCKER_CMD=(
  docker run -it --rm
  --user="${usage_user?}"
  --workdir="${usage_workdir?}"
)

if [ -n "${usage_tag:-}" ]; then
  DOCKER_CMD+=(dots:"${usage_distro?}"-"$usage_tag")
else
  case "${usage_distro?}" in
    debian)   DISTRO_NAME="base:debian" ;;
    ubuntu)   DISTRO_NAME="base:ubuntu" ;;
    *)        DISTRO_NAME="base:debian" ;;
  esac
  DOCKER_CMD+=(--entrypoint='zsh' mcr.microsoft.com/devcontainers/"$DISTRO_NAME")
fi

echo "  ==> ${DOCKER_CMD[*]}"
eval "${DOCKER_CMD[*]}"
'''

# mise run test
# mise run test --distro ubuntu --tag latest
# mise run test --image dots:debian-amd64-latest --config distros/debian/container-structure-test.yml

[tasks."test"]
description = "Run the Container Structure Tests for the Docker image"
usage = '''
  flag "--distro <distro>" {
    help "Distribution"
    choices "debian" "ubuntu"
    default "debian"
  }
  flag "--platform <platform>" {
    help "Image platform segment when composing image name"
    choices "amd64" "arm64" "amd64v2" "riscv64" "ppc64le" "s390x" "386"
    default "arm64"
  }
  flag "--tag <tag>" help="Image tag segment when composing image name"
  flag "--image <image>" help="Full image reference (overrides distro/platform/tag)"
  flag "--config <config>" help="CST config path"
'''
run = '''
#!/usr/bin/env bash

CST_CMD=(
  container-structure-test test
)

if [ -z "${usage_image:-}" ]; then
  USAGE_IMAGE="dots:${usage_distro?}"
  if [ -n "${usage_platform:-}" ]; then
    USAGE_IMAGE="$USAGE_IMAGE-$usage_platform"
  fi
  if [ -n "${usage_tag:-}" ]; then
    USAGE_IMAGE="$USAGE_IMAGE-$usage_tag"
  fi
else
  USAGE_IMAGE="${usage_image?}"
fi
CST_CMD+=(--image "$USAGE_IMAGE")

if [ -n "${usage_config:-}" ]; then
  CST_CMD+=(--config "$usage_config")
else
  CST_CMD+=(--config "distros/${usage_distro?}/container-structure-test.yml")
fi

echo "  ==> ${CST_CMD[*]}"
eval "${CST_CMD[*]}"
'''

[tasks."setup:age"]
description = "Setup AGE keys from Bitwarden"
run = '''
#!/usr/bin/env bash
set -e
# Check if AGE keys already exist
if [ ! -f "$HOME/.config/age/keys.txt" ]; then
  IS_DARWIN=$(uname -s | grep -q "Darwin" && echo "true" || echo "false")
  if [ "$IS_DARWIN" = "true" ] && command -v bw > /dev/null; then
    echo "  ==> Retrieving Bitwarden secrets from Keychain.."
    export BW_CLIENTID=$(security find-generic-password -w -a bitwarden_client_id 2>/dev/null)
    export BW_CLIENTSECRET=$(security find-generic-password -w -a bitwarden_client_secret 2>/dev/null)
    export BW_PASSWORD=$(security find-generic-password -w -a bitwarden_master_password 2>/dev/null)
    if [ -z "$BW_CLIENTID" ] || [ -z "$BW_CLIENTSECRET" ] || [ -z "$BW_PASSWORD" ]; then
      echo "Bitwarden credentials not found in Keychain."
      echo "First time setup: store them with:"
      echo "  security add-generic-password -a bitwarden_client_id -s Bitwarden -w <YOUR_CLIENT_ID> -U"
      echo "  security add-generic-password -a bitwarden_client_secret -s Bitwarden -w <YOUR_CLIENT_SECRET> -U"
      echo "  security add-generic-password -a bitwarden_master_password -s Bitwarden -w <YOUR_MASTER_PASSWORD> -U"
      exit 1
    fi
    echo "  ==> Logging into Bitwarden"
    bw login --apikey

    echo "  ==> Unlocking Bitwarden vault and retrieving session ID"
    export BW_SESSION=$(bw unlock --passwordenv BW_PASSWORD --raw)

    echo "  ==> Retrieving AGE keys from Bitwarden"
    bw get notes gopass/age > "$HOME/.config/age/keys.txt"
    chmod 600 "$HOME/.config/age/keys.txt"
    echo "  ==> AGE keys retrieved from Bitwarden and saved to $HOME/.config/age/keys.txt"
    bw lock
  fi
fi
'''

[tasks."setup:git:filters"]
description = "Setup Git filters for automatic encryption/decryption of .env files using SOPS"
depends = ["setup:age"]
run = '''
#!/usr/bin/env bash
set -e
# Only configure filters if not already done
if [ -f "$HOME/.config/age/keys.txt" ] && ! git config filter.sops.clean > /dev/null; then
  echo "  ==> Configuring Git filters for SOPS"
  git config --local filter.sops.smudge "script/smudge.sops.sh %f"
  git config --local filter.sops.required true
  git config --local filter.sops.clean "script/clean.sops.sh %f"
  git config --local diff.sops.command "script/smudge.sops.sh %f"
  echo "✓ Git filters configured"
fi
'''

[tasks."setup:hooks"]
description = "Link the global hk/cog config and install this repo's git hooks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
DOTS="${DOTS_DIR:-$HOME/.local/share/dots}"
CFG="${XDG_CONFIG_HOME:-$HOME/.config}"

# hk reads ~/.config/hk/config.pkl and cog reads ~/.config/cog/cog.toml.
# Link the directories so edits in the repo take effect immediately.
for d in hk cog; do
  if [ ! -e "$CFG/$d" ]; then
    ln -snf "$DOTS/config/$d" "$CFG/$d"
    echo "linked $CFG/$d -> $DOTS/config/$d"
  fi
done

# --legacy: script shims run on every git version. Apple's /usr/bin/git (2.50.1)
#           silently ignores config-based hooks, so the default is unsafe here.
# --mise:   hooks resolve hk through `mise x`, so mise need not be activated.
hk install --mise --legacy --force-local

# Quiet on success; a failing step still prints its full diagnostics.
hooks_dir="$(git rev-parse --git-path hooks)"
for h in "$hooks_dir"/*; do
  case "$h" in *.sample) continue ;; esac
  [ -f "$h" ] || continue
  sd '(hk run [a-z-]+)( --from-hook)' '$1 -q$2' "$h"
done
echo "hk hooks installed for $(git rev-parse --show-toplevel)"
'''

[tasks.prepare]
description = "Pack the secrets `install --secrets` expects into an encrypted archive (--fixture for tests)"
run = "script/prepare-secrets"

[tasks."zsh:baseline"]
description = "Capture the pre-change zsh parity baseline"
run = "./script/zsh-verify.sh baseline"

[tasks."zsh:verify"]
description = "Check zsh syntax and parity against the captured baseline"
run = ["./script/zsh-verify.sh syntax", "./script/zsh-verify.sh parity"]

[tasks."zsh:bench"]
description = "Benchmark zsh startup across terminal contexts"
run = "./script/zsh-verify.sh bench"

[settings]
# Pushes tools' bin-paths to the front of PATH instead of allowing modifications of PATH after activation to take precedence.
# https://mise.jdx.dev/configuration/settings.html#activate_aggressive
activate_aggressive = true

# Automatically install missing tools when running mise x, mise run, or as part of the 'not found' handler.
# https://mise.jdx.dev/configuration/settings.html#auto_install
auto_install = true

# set to true to enable experimental features
# https://mise.jdx.dev/configuration/settings.html#experimental
experimental = true

# Config files with these prefixes will be trusted by default
# https://mise.jdx.dev/configuration/settings.html#global_config_file
# global_config_file = "~/.local/share/mise/config.toml"

# Specific tools to enable idiomatic version files for like .node-version, .ruby-version, etc.
# https://mise.jdx.dev/configuration/settings.html#idiomatic_version_file_enable_tools
# idiomatic_version_file_enable_tools=["go", "node", "python", "ruby", "yarn"]

# Read/update lockfiles for tool versions. This is useful when you'd like to have loose versions in mise.tomlLockfile to use for the project.
# https://mise.jdx.dev/configuration/settings.html#lockfile
lockfile = true

# Config files with these prefixes will be trusted by default
# https://mise.jdx.dev/configuration/settings.html#trusted_config_paths
# trusted_config_paths = ["~/.local/share/dots", "~/.local/share/mise"]

# set to true to automatically answer yes to all prompts
# https://mise.jdx.dev/configuration/settings.html#yes
# yes = true

[tools]
hk = "2.0.1"
pkl = "latest"
sd = "latest"
shellcheck = "latest"
shfmt = "latest"
"npm:markdownlint-cli" = "0.49.1"
hadolint = "latest"
"pipx:yamllint" = "1.38.0"
taplo = "latest"
"pipx:commit-check" = "2.18.0"
"container-structure-test" = "1.22.1"

# set to true to see full installation output, see `MISE_VERBOSE`
# https://mise.jdx.dev/configuration/settings.html#verbose
# verbose=true
