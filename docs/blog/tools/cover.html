<!doctype html>
<!-- The series cover (docs/blog/STYLE.md), approved 2026-11-13: Catppuccin Mocha, Charm-style layout, OmniWM window.
     Filled by `mise run blog:cover <post>` from the post's cover.json; {{…}} are replaced, already escaped. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1000px;height:420px;overflow:hidden}
.bn{width:1000px;height:420px;position:relative;overflow:hidden;background:#1e1e2e;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;color:#cdd6f4;display:flex;align-items:center;justify-content:space-between;padding:0 50px 0 60px;box-sizing:border-box}
.blob{position:absolute;border-radius:50%}
.left{position:relative;display:flex;flex-direction:column;gap:18px;width:470px}
.tag{align-self:flex-start;font:700 15px "SF Mono",ui-monospace,monospace;background:#f5c2e7;color:#1e1e2e;padding:5px 13px;border-radius:999px}
.t{font-weight:700;font-size:50px;line-height:1.12;letter-spacing:-.5px;white-space:nowrap}
.hl{background:#f5c2e7;color:#1e1e2e;padding:0 10px;border-radius:10px}
.sub{font-size:19px;color:#a6adc8;line-height:1.4}
.tags{display:flex;gap:18px;flex-wrap:wrap;margin-top:2px}
.h{font:700 19px "SF Mono",ui-monospace,monospace}
.h1{color:#cba6f7}.h2{color:#a6e3a1}.h3{color:#fab387}.h4{color:#89dceb}
.win{position:relative;width:390px;border-radius:16px;overflow:hidden;background:#232327;border:1px solid #34343a;box-shadow:0 22px 60px rgba(10,10,16,.65)}
.win.focus{border:2.5px solid #62e6f0;box-shadow:0 0 0 1px rgba(98,230,240,.25),0 0 28px rgba(98,230,240,.35),0 22px 60px rgba(10,10,16,.65)}
.bar{height:36px;display:flex;align-items:center;gap:9px;padding:0 16px;background:#2a2a2f;border-bottom:1px solid #1d1d21}
.bar i{width:12px;height:12px;border-radius:50%}
.tr{background:#ec6a5f}.ty{background:#f4bf4f}.tg{background:#61c554}
.name{margin-left:12px;font-size:14px;color:#a8a8b0}
.term{background:#111116;padding:18px 22px 20px;font:15.5px/1.8 "SF Mono",ui-monospace,monospace;color:#d6d6dc}
.app{background:#222226;padding:22px 24px 24px;font:15px/1.75 "SF Mono",ui-monospace,monospace;color:#c8c8d0}
.sk{height:11px;border-radius:6px;background:#3d3d43;margin:14px 0}
.sk.hlbar{background:#7f7150}
.pr{color:#61c554}.y{color:#f9e2af;font-family:"SF Mono",ui-monospace,monospace}.r{color:#f38ba8}.g{color:#a6e3a1}.c{color:#6c7086}.k{color:#cba6f7}
</style></head><body><div class="bn">
<div class="blob" style="right:-60px;top:-60px;width:340px;height:340px;background:#cba6f7;opacity:.18"></div>
<div class="blob" style="right:120px;bottom:-110px;width:240px;height:240px;background:#94e2d5;opacity:.16"></div>
<div class="left">
  <span class="tag">dots #{{series}}</span>
  <div class="t">{{title}}</div>
  <div class="sub">{{subtitle}}</div>
  <div class="tags">{{tags}}</div>
</div>
{{window}}
</div></body></html>
